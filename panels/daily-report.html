<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-row.full {
      grid-template-columns: 1fr;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }
    .required {
      color: #d32f2f;
      margin-left: 4px;
    }
    input[type="date"],
    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
    }
    textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
    }
    textarea:disabled {
      background-color: #f5f5f5;
      cursor: not-allowed;
      color: #666;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #1976d2;
      color: white;
    }
    .btn-primary:hover {
      background-color: #1565c0;
    }
    .btn-secondary {
      background-color: #757575;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #616161;
    }
    .btn-success {
      background-color: #388e3c;
      color: white;
    }
    .btn-success:hover {
      background-color: #2e7d32;
    }
    .error-message {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #c8e6c9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
      font-size: 14px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-empty {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-item-date {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .history-item-status {
      background-color: #4caf50;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 8px;
    }
    .history-item-content strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-row">
          <div class="form-group">
            <label for="reportDate">報告日付 <span class="required">*</span></label>
            <input type="date" id="reportDate" name="reportDate" required>
            <div class="error-message" id="dateError"></div>
          </div>
          <div class="form-group">
            <label for="department">部門 <span class="required">*</span></label>
            <select id="department" name="department" required>
              <option value="">選択してください</option>
              <option value="営業部">営業部</option>
              <option value="企画部">企画部</option>
              <option value="技術部">技術部</option>
              <option value="管理部">管理部</option>
            </select>
            <div class="error-message" id="departmentError"></div>
          </div>
        </div>
        
        <div class="form-row full">
          <div class="form-group">
            <label for="yesterday">昨日やったこと <span class="required">*</span></label>
            <textarea id="yesterday" name="yesterday" disabled></textarea>
            <div class="error-message" id="yesterdayError"></div>
          </div>
        </div>
        
        <div class="form-row full">
          <div class="form-group">
            <label for="today">今日やること <span class="required">*</span></label>
            <textarea id="today" name="today" disabled></textarea>
            <div class="error-message" id="todayError"></div>
          </div>
        </div>
        
        <div class="form-row full">
          <div class="form-group">
            <label for="issues">抱えている課題 <span class="required">*</span></label>
            <textarea id="issues" name="issues" disabled></textarea>
            <div class="error-message" id="issuesError"></div>
          </div>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-primary">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    let isEditMode = false;
    let currentUser = null;
    let departmentHead = null;
    let submissionHistory = [];
    
    async function initPage() {
      // ユーザー情報を取得
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          currentUser = await response.json();
        }
      } catch (e) {
        console.error('Failed to fetch user:', e);
      }
      
      // 送信履歴を取得
      try {
        const response = await fetch('/api/reports');
        if (response.ok) {
          submissionHistory = await response.json();
          renderHistory();
        }
      } catch (e) {
        console.error('Failed to fetch reports:', e);
      }
      
      // セッションストレージから前回選択値を復元
      const savedDate = sessionStorage.getItem('reportDate');
      const savedDept = sessionStorage.getItem('department');
      if (savedDate) {
        document.getElementById('reportDate').value = savedDate;
      }
      if (savedDept) {
        document.getElementById('department').value = savedDept;
      }
      
      // ローカルストレージから下書きを復元
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const draftData = JSON.parse(draft);
        document.getElementById('yesterday').value = draftData.yesterday || '';
        document.getElementById('today').value = draftData.today || '';
        document.getElementById('issues').value = draftData.issues || '';
      }
    }
    
    function enableEditMode() {
      isEditMode = true;
      document.getElementById('yesterday').disabled = false;
      document.getElementById('today').disabled = false;
      document.getElementById('issues').disabled = false;
      document.getElementById('editBtn').style.display = 'none';
    }
    
    function renderHistory() {
      const container = document.getElementById('historyContainer');
      if (submissionHistory.length === 0) {
        container.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      
      const historyHtml = submissionHistory.map(item => `
        <div class="history-item">
          <div class="history-item-header">
            <div class="history-item-date">${formatDateTime(item.submittedAt)}</div>
            <div class="history-item-status">送信済</div>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday)}</p>
            <p><strong>今日やること:</strong> ${escapeHtml(item.today)}</p>
            <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues)}</p>
          </div>
        </div>
      `).join('');
      
      container.innerHTML = `<div class="history-list">${historyHtml}</div>`;
    }
    
    function formatDateTime(dateString) {
      const date = new Date(dateString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }
    
    function validateForm() {
      clearErrors();
      let isValid = true;
      
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      if (!reportDate) {
        document.getElementById('dateError').textContent = '報告日付を選択してください';
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department) {
        document.getElementById('departmentError').textContent = '部門を選択してください';
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      if (!yesterday && !today && !issues) {
        document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
        document.getElementById('yesterdayError').classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    function showConfirmDialog() {
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      const userEmail = currentUser?.email || 'testuser@example.com';
      const deptHeadEmail = departmentHead?.email || 'bucho@example.com';
      const deptHeadName = departmentHead?.name || '部長';
      
      const modalContent = `
        <p><strong>昨日やったこと:</strong></p>
        <p>${escapeHtml(yesterday.substring(0, 50))}${yesterday.length > 50 ? '...' : ''}</p>
        <p><strong>今日やること:</strong></p>
        <p>${escapeHtml(today.substring(0, 50))}${today.length > 50 ? '...' : ''}</p>
        <p><strong>抱えている課題:</strong></p>
        <p>${escapeHtml(issues.substring(0, 50))}${issues.length > 50 ? '...' : ''}</p>
        <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
        <p><strong>送信者:</strong> ${escapeHtml(userEmail)}</p>
        <p><strong>部長:</strong> ${escapeHtml(deptHeadName)} &lt;${escapeHtml(deptHeadEmail)}&gt;</p>
      `;
      
      document.getElementById('modalContent').innerHTML = modalContent;
      document.getElementById('confirmModal').classList.add('show');
    }
    
    function hideConfirmDialog() {
      document.getElementById('confirmModal').classList.remove('show');
    }
    
    async function submitReport() {
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      const reportData = {
        reportDate,
        department,
        yesterday,
        today,
        issues,
        submittedAt: new Date().toISOString(),
        submittedBy: currentUser?.id || 'unknown'
      };
      
      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reportData)
        });
        
        if (response.ok) {
          // 成功メッセージを表示
          const successMsg = document.getElementById('successMessage');
          successMsg.textContent = '送信完了しました';
          successMsg.classList.add('show');
          
          // フォームをリセット
          document.getElementById('reportForm').reset();
          document.getElementById('yesterday').disabled = true;
          document.getElementById('today').disabled = true;
          document.getElementById('issues').disabled = true;
          document.getElementById('editBtn').style.display = 'inline-block';
          isEditMode = false;
          
          // 下書きを削除
          localStorage.removeItem('reportDraft');
          
          // 履歴を更新
          submissionHistory.unshift(reportData);
          renderHistory();
          
          // 3秒後にメッセージを非表示
          setTimeout(() => {
            successMsg.classList.remove('show');
          }, 3000);
        }
      } catch (e) {
        console.error('Failed to submit report:', e);
      }
    }
    
    // イベントリスナー
    document.getElementById('editBtn').addEventListener('click', (e) => {
      e.preventDefault();
      enableEditMode();
    });
    
    document.getElementById('draftBtn').addEventListener('click', (e) => {
      e.preventDefault();
      const draft = {
        yesterday: document.getElementById('yesterday').value,
        today: document.getElementById('today').value,
        issues: document.getElementById('issues').value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    });
    
    document.getElementById('reportForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      // 日付と部門をセッションストレージに保存
      sessionStorage.setItem('reportDate', document.getElementById('reportDate').value);
      sessionStorage.setItem('department', document.getElementById('department').value);
      
      if (validateForm()) {
        showConfirmDialog();
      }
    });
    
    document.getElementById('cancelBtn').addEventListener('click', () => {
      hideConfirmDialog();
    });
    
    document.getElementById('confirmBtn').addEventListener('click', () => {
      hideConfirmDialog();
      submitReport();
    });
    
    // ページ初期化
    initPage();
  </script>
</body>
</html>
