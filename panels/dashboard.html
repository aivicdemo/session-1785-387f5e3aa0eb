<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            font-size: 14px;
            color: #666;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            font-size: 16px;
            color: #856404;
            margin-bottom: 10px;
        }
        .deadline-text {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .summary-card {
            background-color: #f9f9f9;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .summary-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .summary-card .stat {
            font-size: 28px;
            color: #007bff;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .summary-card .percentage {
            font-size: 16px;
            color: #28a745;
            font-weight: 600;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-buttons button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            background-color: #007bff;
            color: white;
            transition: all 0.3s ease;
        }
        .nav-buttons button:hover {
            background-color: #0056b3;
        }
        .nav-buttons .btn-logout {
            background-color: #6c757d;
        }
        .nav-buttons .btn-logout:hover {
            background-color: #545b62;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table thead {
            background-color: #f9f9f9;
            border-bottom: 2px solid #dee2e6;
        }
        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
            color: #666;
        }
        table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-draft {
            background-color: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            <div class="user-info">
                <div>ユーザー: <span id="userName">-</span></div>
            </div>
        </div>

        <div class="nav-buttons">
            <button onclick="goToReport()">日報入力へ</button>
            <button class="btn-logout" onclick="logout()">ログアウト</button>
        </div>

        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadlineText">本日 18:00 まで</div>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <div class="summary-grid" id="summaryGrid">
                <!-- 動的に生成される -->
            </div>
        </div>

        <div class="summary-section">
            <h2>詳細提出状況</h2>
            <table id="detailTable">
                <thead>
                    <tr>
                        <th>部門</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 動的に生成される -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await initializePage();
            await loadDashboardData();
        });

        async function initializePage() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = './login.html';
                return;
            }

            try {
                const response = await fetch('/api/user', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('userName').textContent = currentUser.name || 'Unknown';
                } else {
                    window.location.href = './login.html';
                }
            } catch (error) {
                console.error('Failed to fetch user:', error);
                window.location.href = './login.html';
            }
        }

        async function loadDashboardData() {
            const token = localStorage.getItem('authToken');
            try {
                const response = await fetch('/api/dashboard', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderSummary(data.departments);
                    renderDetailTable(data.departments);
                }
            } catch (error) {
                console.error('Failed to load dashboard data:', error);
            }
        }

        function renderSummary(departments) {
            const summaryGrid = document.getElementById('summaryGrid');
            summaryGrid.innerHTML = departments.map(dept => {
                const total = dept.submitted + dept.pending;
                const percentage = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
                return `
                    <div class="summary-card">
                        <h3>${dept.name}</h3>
                        <div class="stat">${dept.submitted}/${total}</div>
                        <div class="percentage">${percentage}%</div>
                    </div>
                `;
            }).join('');
        }

        function renderDetailTable(departments) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = departments.map(dept => {
                const total = dept.submitted + dept.pending;
                const percentage = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
                return `
                    <tr>
                        <td>${dept.name}</td>
                        <td>${dept.submitted}</td>
                        <td>${dept.pending}</td>
                        <td>${percentage}%</td>
                    </tr>
                `;
            }).join('');
        }

        function goToReport() {
            window.location.href = './daily-report.html';
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
