<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: bold;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th,
    .summary-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .summary-table th {
      background-color: #f9f9f9;
      font-weight: 600;
      color: #333;
    }
    .summary-table tr:hover {
      background-color: #f5f5f5;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .btn-primary {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadline">本日 18:00 まで</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td colspan="3" style="text-align: center; color: #999;">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <a href="./daily-report.html" class="btn-primary">日報を入力・送信</a>
  </div>
  
  <script>
    async function init() {
      try {
        const response = await fetch('/api/summary');
        if (response.ok) {
          const summary = await response.json();
          const tbody = document.getElementById('summaryBody');
          
          tbody.innerHTML = summary.departments.map(dept => {
            const submitted = dept.submitted || 0;
            const total = dept.total || 1;
            const rate = Math.round((submitted / total) * 100);
            
            return `
              <tr>
                <td>${escapeHtml(dept.name)}</td>
                <td>${submitted} / ${total}</td>
                <td>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (e) {
        console.error('Failed to load summary:', e);
        document.getElementById('summaryBody').innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999;">データの読み込みに失敗しました</td></tr>';
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    init();
  </script>
</body>
</html>
