<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .required {
            color: #e74c3c;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #7f8c8d;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background-color: #229954;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-summary {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #555;
        }
        .modal-summary-item {
            margin-bottom: 8px;
        }
        .modal-summary-label {
            font-weight: 600;
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            flex: 1;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ecf0f1;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content-item {
            margin-bottom: 8px;
        }
        .history-item-content-label {
            font-weight: 600;
            color: #333;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span class="required">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span class="required">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                    <textarea id="yesterday" name="yesterday" disabled></textarea>
                    <div class="error-message" id="yesterdayError">昨日やったことを入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span class="required">*</span></label>
                    <textarea id="today" name="today" disabled></textarea>
                    <div class="error-message" id="todayError">今日やることを入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span class="required">*</span></label>
                    <textarea id="issues" name="issues" disabled></textarea>
                    <div class="error-message" id="issuesError">抱えている課題を入力してください</div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p>以下の内容で日報を送信します。よろしいですか？</p>
                <div class="modal-summary">
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">昨日やったこと:</span>
                        <span id="summaryYesterday"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">今日やること:</span>
                        <span id="summaryToday"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">抱えている課題:</span>
                        <span id="summaryIssues"></span>
                    </div>
                    <div class="modal-summary-item" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd;">
                        <span class="modal-summary-label">送信者:</span>
                        <span id="senderEmail"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">部長:</span>
                        <span id="managerEmail"></span>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ローカルストレージキー
        const DRAFT_KEY = 'report_draft';
        const HISTORY_KEY = 'report_history';
        const FORM_STATE_KEY = 'report_form_state';
        
        // DOM要素
        const form = document.getElementById('reportForm');
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyContainer = document.getElementById('historyContainer');
        const successMessage = document.getElementById('successMessage');
        
        // ユーザー情報（セッションから取得）
        let currentUser = {
            id: 'user001',
            email: 'testuser@example.com',
            name: 'テストユーザー',
            manager: '部長太郎',
            managerEmail: 'bucho@example.com'
        };
        
        // 初期化
        function init() {
            loadFormState();
            loadHistory();
            attachEventListeners();
        }
        
        // フォーム状態の読み込み
        function loadFormState() {
            const saved = localStorage.getItem(FORM_STATE_KEY);
            if (saved) {
                const state = JSON.parse(saved);
                reportDateInput.value = state.reportDate || '';
                departmentSelect.value = state.department || '';
                yesterdayTextarea.value = state.yesterday || '';
                todayTextarea.value = state.today || '';
                issuesTextarea.value = state.issues || '';
            }
        }
        
        // フォーム状態の保存
        function saveFormState() {
            const state = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem(FORM_STATE_KEY, JSON.stringify(state));
        }
        
        // 送信履歴の読み込み
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            if (history.length === 0) {
                historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            } else {
                historyContainer.innerHTML = '';
                history.reverse().forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.innerHTML = `
                        <div class="history-item-header">
                            <div class="history-item-date">${formatDateTime(item.timestamp)}</div>
                            <div class="history-item-status">送信済</div>
                        </div>
                        <div class="history-item-content">
                            <div class="history-item-content-item">
                                <span class="history-item-content-label">昨日やったこと:</span>
                                ${truncateText(item.yesterday, 50)}
                            </div>
                            <div class="history-item-content-item">
                                <span class="history-item-content-label">今日やること:</span>
                                ${truncateText(item.today, 50)}
                            </div>
                            <div class="history-item-content-item">
                                <span class="history-item-content-label">抱えている課題:</span>
                                ${truncateText(item.issues, 50)}
                            </div>
                        </div>
                    `;
                    historyContainer.appendChild(historyItem);
                });
            }
        }
        
        // イベントリスナーの設定
        function attachEventListeners() {
            // フォーム入力時に状態を保存
            reportDateInput.addEventListener('change', saveFormState);
            departmentSelect.addEventListener('change', saveFormState);
            yesterdayTextarea.addEventListener('input', saveFormState);
            todayTextarea.addEventListener('input', saveFormState);
            issuesTextarea.addEventListener('input', saveFormState);
            
            // 編集ボタン
            editBtn.addEventListener('click', () => {
                yesterdayTextarea.disabled = false;
                todayTextarea.disabled = false;
                issuesTextarea.disabled = false;
                yesterdayTextarea.focus();
            });
            
            // 下書き保存ボタン
            draftBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const draft = {
                    reportDate: reportDateInput.value,
                    department: departmentSelect.value,
                    yesterday: yesterdayTextarea.value,
                    today: todayTextarea.value,
                    issues: issuesTextarea.value,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
                showSuccessMessage('下書きを保存しました');
            });
            
            // フォーム送信
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validateForm()) {
                    showConfirmModal();
                }
            });
            
            // 確認ダイアログのキャンセル
            cancelBtn.addEventListener('click', () => {
                confirmModal.classList.remove('show');
            });
            
            // 確認ダイアログの確認
            confirmBtn.addEventListener('click', () => {
                submitReport();
            });
        }
        
        // バリデーション
        function validateForm() {
            let isValid = true;
            
            // エラーメッセージをクリア
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
            
            // 報告日付
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            // 部門
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            // 報告内容
            if (!yesterdayTextarea.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            if (!todayTextarea.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            if (!issuesTextarea.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        // 確認ダイアログの表示
        function showConfirmModal() {
            document.getElementById('summaryYesterday').textContent = truncateText(yesterdayTextarea.value, 30);
            document.getElementById('summaryToday').textContent = truncateText(todayTextarea.value, 30);
            document.getElementById('summaryIssues').textContent = truncateText(issuesTextarea.value, 30);
            document.getElementById('senderEmail').textContent = currentUser.email;
            document.getElementById('managerEmail').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
            confirmModal.classList.add('show');
        }
        
        // 日報の送信
        function submitReport() {
            const report = {
                id: generateId(),
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: currentUser.id,
                senderName: currentUser.name,
                timestamp: new Date().toISOString(),
                status: '送信済'
            };
            
            // 履歴に追加
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history.push(report);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            
            // フォームをクリア
            form.reset();
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            localStorage.removeItem(FORM_STATE_KEY);
            
            // ダイアログを閉じる
            confirmModal.classList.remove('show');
            
            // 成功メッセージを表示
            showSuccessMessage('送信完了しました');
            
            // 履歴を更新
            loadHistory();
        }
        
        // 成功メッセージの表示
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // ユーティリティ関数
        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        function truncateText(text, length) {
            return text.length > length ? text.substring(0, length) + '...' : text;
        }
        
        function generateId() {
            return 'report_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // ページロード時に初期化
        init();
    </script>
</body>
</html>
