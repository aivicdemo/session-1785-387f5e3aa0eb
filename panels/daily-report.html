<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .required {
            color: #e74c3c;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-start;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background-color: #229954;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .global-error {
            background-color: #fadbd8;
            color: #c0392b;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .global-error.show {
            display: block;
        }
        .success-message {
            background-color: #d5f4e6;
            color: #27ae60;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ecf0f1;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="global-error" id="globalError"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reportDate">報告日付 <span class="required">*</span></label>
                        <input type="date" id="reportDate" name="reportDate" required>
                        <div class="error-message" id="reportDateError"></div>
                    </div>
                    <div class="form-group">
                        <label for="department">部門 <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">選択してください</option>
                            <option value="営業部">営業部</option>
                            <option value="企画部">企画部</option>
                            <option value="技術部">技術部</option>
                            <option value="管理部">管理部</option>
                        </select>
                        <div class="error-message" id="departmentError"></div>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-row full">
                    <div class="form-group">
                        <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                        <div class="error-message" id="yesterdayError"></div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="today">今日やること <span class="required">*</span></label>
                        <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                        <div class="error-message" id="todayError"></div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="issues">抱えている課題 <span class="required">*</span></label>
                        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                        <div class="error-message" id="issuesError"></div>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="saveDraftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const saveDraftBtn = document.getElementById('saveDraftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const globalError = document.getElementById('globalError');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentInput = document.getElementById('department');
        const yesterdayInput = document.getElementById('yesterday');
        const todayInput = document.getElementById('today');
        const issuesInput = document.getElementById('issues');
        
        let isEditMode = false;
        let currentUser = null;
        let currentManager = null;
        let sendHistory = [];
        
        // Initialize
        async function init() {
            await loadCurrentUser();
            loadFormState();
            loadSendHistory();
            updateEditMode();
        }
        
        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const user = await response.json();
                    currentUser = user;
                    if (user.managerId) {
                        const managerResponse = await fetch(`/api/user/${user.managerId}`);
                        if (managerResponse.ok) {
                            currentManager = await managerResponse.json();
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to load user:', error);
            }
        }
        
        function loadFormState() {
            const saved = sessionStorage.getItem('reportFormState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.reportDate) reportDateInput.value = state.reportDate;
                if (state.department) departmentInput.value = state.department;
                if (state.yesterday) yesterdayInput.value = state.yesterday;
                if (state.today) todayInput.value = state.today;
                if (state.issues) issuesInput.value = state.issues;
            }
        }
        
        function saveFormState() {
            const state = {
                reportDate: reportDateInput.value,
                department: departmentInput.value,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }
        
        function updateEditMode() {
            if (isEditMode) {
                yesterdayInput.disabled = false;
                todayInput.disabled = false;
                issuesInput.disabled = false;
                editBtn.textContent = '編集完了';
                editBtn.classList.remove('btn-secondary');
                editBtn.classList.add('btn-success');
            } else {
                yesterdayInput.disabled = true;
                todayInput.disabled = true;
                issuesInput.disabled = true;
                editBtn.textContent = '報告内容編集';
                editBtn.classList.remove('btn-success');
                editBtn.classList.add('btn-secondary');
            }
        }
        
        editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isEditMode = !isEditMode;
            updateEditMode();
        });
        
        saveDraftBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            saveFormState();
            
            try {
                const draftData = {
                    reportDate: reportDateInput.value,
                    department: departmentInput.value,
                    yesterday: yesterdayInput.value,
                    today: todayInput.value,
                    issues: issuesInput.value,
                    status: 'draft'
                };
                
                const response = await fetch('/api/report/draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(draftData)
                });
                
                if (response.ok) {
                    showSuccess('下書きを保存しました');
                }
            } catch (error) {
                console.error('Failed to save draft:', error);
            }
        });
        
        reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            clearErrors();
            
            if (validateForm()) {
                showConfirmDialog();
            }
        });
        
        function validateForm() {
            let isValid = true;
            
            if (!reportDateInput.value) {
                showError('reportDateError', '報告日付を選択してください');
                isValid = false;
            }
            
            if (!departmentInput.value) {
                showError('departmentError', '部門を選択してください');
                isValid = false;
            }
            
            if (!yesterdayInput.value.trim()) {
                showError('yesterdayError', '昨日やったことを入力してください');
                isValid = false;
            }
            
            if (!todayInput.value.trim()) {
                showError('todayError', '今日やることを入力してください');
                isValid = false;
            }
            
            if (!issuesInput.value.trim()) {
                showError('issuesError', '抱えている課題を入力してください');
                isValid = false;
            }
            
            if (!isValid) {
                showGlobalError('報告内容を入力してください');
            }
            
            return isValid;
        }
        
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }
        
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            globalError.classList.remove('show');
            globalError.textContent = '';
        }
        
        function showGlobalError(message) {
            globalError.textContent = message;
            globalError.classList.add('show');
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        function showConfirmDialog() {
            document.getElementById('confirmYesterday').textContent = yesterdayInput.value.substring(0, 50);
            document.getElementById('confirmToday').textContent = todayInput.value.substring(0, 50);
            document.getElementById('confirmIssues').textContent = issuesInput.value.substring(0, 50);
            document.getElementById('confirmSender').textContent = currentUser?.email || 'testuser@example.com';
            document.getElementById('confirmManager').textContent = currentManager ? `${currentManager.name} <${currentManager.email}>` : 'N/A';
            confirmModal.classList.add('show');
        }
        
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            await submitReport();
        });
        
        async function submitReport() {
            try {
                const reportData = {
                    reportDate: reportDateInput.value,
                    department: departmentInput.value,
                    yesterday: yesterdayInput.value,
                    today: todayInput.value,
                    issues: issuesInput.value,
                    status: 'submitted',
                    submittedAt: new Date().toISOString(),
                    submittedBy: currentUser?.id || 'unknown'
                };
                
                const response = await fetch('/api/report/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reportData)
                });
                
                if (response.ok) {
                    showSuccess('送信完了しました');
                    reportForm.reset();
                    sessionStorage.removeItem('reportFormState');
                    isEditMode = false;
                    updateEditMode();
                    loadSendHistory();
                }
            } catch (error) {
                console.error('Failed to submit report:', error);
                showGlobalError('送信に失敗しました');
            }
        }
        
        async function loadSendHistory() {
            try {
                const response = await fetch('/api/report/history');
                if (response.ok) {
                    sendHistory = await response.json();
                    renderHistory();
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }
        
        function renderHistory() {
            if (sendHistory.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = sendHistory.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div class="history-item-date">${formatDate(item.submittedAt)}</div>
                        <div class="history-item-status">送信済</div>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </div>
            `).join('');
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        // Save form state on input change
        [reportDateInput, departmentInput, yesterdayInput, todayInput, issuesInput].forEach(input => {
            input.addEventListener('change', saveFormState);
            input.addEventListener('input', saveFormState);
        });
        
        init();
    </script>
</body>
</html>
