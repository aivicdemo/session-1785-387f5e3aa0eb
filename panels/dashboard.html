<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-nav {
            padding: 10px 16px;
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-nav:hover {
            background-color: #e0e0e0;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deadline-text {
            color: #856404;
            font-size: 14px;
            font-weight: 600;
        }
        .summary-section {
            margin-top: 30px;
        }
        .summary-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table thead {
            background-color: #f5f5f5;
        }
        .summary-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .status-pending {
            background-color: #ffe0b2;
            color: #e65100;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <a href="./daily-report.html" class="btn-nav">日報入力・送信</a>
        </div>

        <h1>日報提出状況ダッシュボード</h1>

        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadlineText">本日 18:00 までに提出してください</div>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td>営業部</td>
                        <td>8</td>
                        <td>2</td>
                        <td>80%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td>5</td>
                        <td>1</td>
                        <td>83%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 83%;">83%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td>12</td>
                        <td>3</td>
                        <td>80%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td>4</td>
                        <td>1</td>
                        <td>80%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize dashboard
        function init() {
            loadDeadline();
            loadSummary();
        }

        function loadDeadline() {
            const today = new Date();
            const deadline = new Date(today);
            deadline.setHours(18, 0, 0, 0);
            const deadlineText = deadline.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('deadlineText').textContent = `本日 ${deadlineText} までに提出してください`;
        }

        function loadSummary() {
            // Summary data is already in HTML, but can be enhanced with API call
            try {
                fetch('/api/summary')
                    .then(r => r.json())
                    .then(data => {
                        // Update with API data if available
                    })
                    .catch(() => {
                        // Use default data
                    });
            } catch (e) {
                // Use default data
            }
        }

        init();
    </script>
</body>
</html>
