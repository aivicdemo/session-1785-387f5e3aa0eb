<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-label {
            color: #856404;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .deadline-time {
            color: #333;
            font-size: 18px;
            font-weight: 700;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .summary-title {
            color: #333;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #f8f9fa;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
            color: #666;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            background-color: #e9ecef;
            border-radius: 4px;
            height: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            background-color: #28a745;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            transition: width 0.3s ease;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .logout-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="./login.html" class="logout-link">ログアウト</a>
    
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <div class="deadline-label">提出期限</div>
                <div class="deadline-time" id="deadlineTime">2025年1月31日 17:00</div>
            </div>
            
            <div class="action-buttons">
                <a href="./daily-report.html" class="btn btn-primary">日報を入力・送信</a>
            </div>
        </div>
        
        <div class="summary-section">
            <div class="summary-title">部門別提出状況サマリー</div>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <!-- JavaScript で動的に生成 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // ダッシュボード初期化
        function initDashboard() {
            setDeadline();
            loadSummary();
        }
        
        // 提出期限設定
        function setDeadline() {
            const deadlineElement = document.getElementById('deadlineTime');
            // 固定値で設定（実際にはサーバーから取得）
            deadlineElement.textContent = '2025年1月31日 17:00';
        }
        
        // 部門別サマリー読み込み
        function loadSummary() {
            // サンプルデータ
            const departments = [
                { name: '営業部', submitted: 8, total: 10 },
                { name: '企画部', submitted: 6, total: 8 },
                { name: '技術部', submitted: 9, total: 10 },
                { name: '管理部', submitted: 4, total: 5 }
            ];
            
            const tableBody = document.getElementById('summaryTableBody');
            tableBody.innerHTML = departments.map(dept => {
                const rate = Math.round((dept.submitted / dept.total) * 100);
                return `
                    <tr>
                        <td>${dept.name}</td>
                        <td>${dept.submitted}</td>
                        <td>${dept.total - dept.submitted}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 初期化実行
        initDashboard();
    </script>
</body>
</html>
