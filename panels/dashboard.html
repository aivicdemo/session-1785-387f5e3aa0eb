<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .user-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .deadline-label {
            color: #856404;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-time {
            color: #d39e00;
            font-size: 18px;
            font-weight: bold;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .nav-btn-primary {
            background-color: #007bff;
            color: white;
        }
        .nav-btn-primary:hover {
            background-color: #0056b3;
        }
        .nav-btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .nav-btn-secondary:hover {
            background-color: #545b62;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th,
        .summary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        .summary-table th {
            background-color: #f9f9f9;
            font-weight: 600;
            color: #333;
        }
        .summary-table tr:hover {
            background-color: #f5f5f5;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .stat-item {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .stat-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #333;
            font-size: 20px;
            font-weight: bold;
        }
        .stat-percentage {
            color: #28a745;
            font-size: 14px;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>日報提出状況ダッシュボード</h1>
            <div class="user-info" id="userInfo">ユーザー: テストユーザー</div>
            
            <div class="deadline-section">
                <div class="deadline-label">提出期限</div>
                <div class="deadline-time" id="deadlineTime">本日 18:00</div>
            </div>
            
            <div class="nav-buttons">
                <a href="./daily-report.html" class="nav-btn nav-btn-primary">日報を入力・送信</a>
                <button class="nav-btn nav-btn-secondary" onclick="logout()">ログアウト</button>
            </div>
        </header>
        
        <div class="content">
            <div class="card">
                <h2>部門別提出状況サマリー</h2>
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th>部門名</th>
                            <th>提出済み</th>
                            <th>提出率</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <tr>
                            <td>営業部</td>
                            <td>8 / 10</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 80%;">80%</div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>企画部</td>
                            <td>6 / 8</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 75%;">75%</div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>技術部</td>
                            <td>9 / 12</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 75%;">75%</div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>管理部</td>
                            <td>5 / 6</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 83%;">83%</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="card">
                <h2>全社提出状況</h2>
                <div class="stat-item">
                    <div class="stat-label">総提出数</div>
                    <div class="stat-value">28</div>
                    <div class="stat-percentage">全体の 77.8%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">未提出数</div>
                    <div class="stat-value">8</div>
                    <div class="stat-percentage">全体の 22.2%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">総対象者数</div>
                    <div class="stat-value">36</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ページロード時の初期化
        function initPage() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{"id":"user1","email":"testuser@example.com","name":"テストユーザー","department":"営業部"}');
            document.getElementById('userInfo').textContent = `ユーザー: ${currentUser.name} (${currentUser.department})`;
            
            // 提出期限を設定（本日18:00）
            const today = new Date();
            const deadline = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 18, 0, 0);
            const deadlineStr = deadline.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('deadlineTime').textContent = `本日 ${deadline.getHours()}:${String(deadline.getMinutes()).padStart(2, '0')}`;
        }
        
        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = './login.html';
        }
        
        initPage();
    </script>
</body>
</html>
