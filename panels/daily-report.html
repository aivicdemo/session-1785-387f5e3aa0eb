<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            background-color: #fafafa;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }
        .history-item-content {
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-item-content strong {
            color: #007bff;
        }
        .empty-history {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-success" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
                <a href="./dashboard.html" class="nav-link">ダッシュボードへ</a>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="empty-history">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        let currentUser = null;
        let currentManager = null;
        
        // Initialize
        async function init() {
            // Get current user from session/localStorage
            const userStr = sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser');
            if (userStr) {
                currentUser = JSON.parse(userStr);
            } else {
                currentUser = { id: 'testuser', email: 'testuser@example.com', name: 'テストユーザー' };
            }
            
            // Load manager info
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    const users = await response.json();
                    const manager = users.find(u => u.id === currentUser.managerId);
                    if (manager) {
                        currentManager = manager;
                    }
                }
            } catch (e) {
                console.log('Manager load failed, using default');
                currentManager = { name: '部長', email: 'bucho@example.com' };
            }
            
            // Load draft from sessionStorage
            const draft = sessionStorage.getItem('reportDraft');
            if (draft) {
                const draftData = JSON.parse(draft);
                reportDate.value = draftData.date || '';
                department.value = draftData.department || '';
                yesterday.value = draftData.yesterday || '';
                today.value = draftData.today || '';
                issues.value = draftData.issues || '';
            }
            
            // Load history
            await loadHistory();
        }
        
        // Load send history
        async function loadHistory() {
            try {
                const response = await fetch('/api/reports?userId=' + currentUser.id);
                if (response.ok) {
                    const reports = await response.json();
                    if (reports && reports.length > 0) {
                        historyList.innerHTML = '';
                        reports.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));
                        reports.forEach(report => {
                            const item = document.createElement('div');
                            item.className = 'history-item';
                            const sentDate = new Date(report.sentAt).toLocaleString('ja-JP');
                            item.innerHTML = `
                                <div class="history-item-header">
                                    <span>送信日時: ${sentDate}</span>
                                    <span>ステータス: 送信済</span>
                                </div>
                                <div class="history-item-content">
                                    <p><strong>昨日やったこと:</strong> ${escapeHtml(report.yesterday)}</p>
                                    <p><strong>今日やること:</strong> ${escapeHtml(report.today)}</p>
                                    <p><strong>抱えている課題:</strong> ${escapeHtml(report.issues)}</p>
                                </div>
                            `;
                            historyList.appendChild(item);
                        });
                    } else {
                        historyList.innerHTML = '<div class="empty-history">送信履歴はありません</div>';
                    }
                }
            } catch (e) {
                console.error('History load failed:', e);
                historyList.innerHTML = '<div class="empty-history">送信履歴はありません</div>';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Edit button - enable textareas
        editBtn.addEventListener('click', () => {
            yesterday.disabled = false;
            today.disabled = false;
            issues.disabled = false;
            yesterday.focus();
        });
        
        // Draft save
        draftBtn.addEventListener('click', async () => {
            const draftData = {
                date: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            sessionStorage.setItem('reportDraft', JSON.stringify(draftData));
            
            // Also save to backend
            try {
                await fetch('/api/reports/draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        ...draftData
                    })
                });
            } catch (e) {
                console.error('Draft save failed:', e);
            }
            
            alert('下書きを保存しました');
        });
        
        // Form submit
        reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // Validate
            let isValid = true;
            
            if (!reportDate.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!department.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterday.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            if (!today.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            
            if (!issues.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirm modal
            document.getElementById('confirmYesterday').textContent = yesterday.value;
            document.getElementById('confirmToday').textContent = today.value;
            document.getElementById('confirmIssues').textContent = issues.value;
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = currentManager ? `${currentManager.name} <${currentManager.email}>` : 'N/A';
            
            confirmModal.classList.add('show');
        });
        
        // Cancel modal
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        // Confirm send
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            
            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        userEmail: currentUser.email,
                        date: reportDate.value,
                        department: department.value,
                        yesterday: yesterday.value,
                        today: today.value,
                        issues: issues.value,
                        managerId: currentUser.managerId,
                        managerEmail: currentManager?.email
                    })
                });
                
                if (response.ok) {
                    successMessage.classList.add('show');
                    yesterday.value = '';
                    today.value = '';
                    issues.value = '';
                    yesterday.disabled = true;
                    today.disabled = true;
                    issues.disabled = true;
                    sessionStorage.removeItem('reportDraft');
                    
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 3000);
                    
                    await loadHistory();
                } else {
                    alert('送信に失敗しました');
                }
            } catch (e) {
                console.error('Send failed:', e);
                alert('送信に失敗しました');
            }
        });
        
        // Close modal on overlay click
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.classList.remove('show');
            }
        });
        
        init();
    </script>
</body>
</html>
