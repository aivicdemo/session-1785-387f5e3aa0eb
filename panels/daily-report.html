<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .required {
            color: #e74c3c;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-primary:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background-color: #229954;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 4px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 5px;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="dailyReportForm">
            <div class="form-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reportDate">報告日付 <span class="required">*</span></label>
                        <input type="date" id="reportDate" name="reportDate" required>
                        <div class="error-message" id="reportDateError">報告日付を選択してください</div>
                    </div>
                    <div class="form-group">
                        <label for="department">部門 <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">-- 選択してください --</option>
                            <option value="営業部">営業部</option>
                            <option value="企画部">企画部</option>
                            <option value="技術部">技術部</option>
                            <option value="管理部">管理部</option>
                        </select>
                        <div class="error-message" id="departmentError">部門を選択してください</div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                        <textarea id="yesterday" name="yesterday" placeholder="例：顧客A社の提案資料作成"></textarea>
                        <div class="error-message" id="yesterdayError"></div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="today">今日やること <span class="required">*</span></label>
                        <textarea id="today" name="today" placeholder="例：顧客B社との打ち合わせ"></textarea>
                        <div class="error-message" id="todayError"></div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="issues">抱えている課題 <span class="required">*</span></label>
                        <textarea id="issues" name="issues" placeholder="例：プロジェクトスケジュール調整"></textarea>
                        <div class="error-message" id="issuesError"></div>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender"></p>
                <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
                <p id="confirmManager"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        const currentUser = {
            id: 'user001',
            email: 'testuser@example.com',
            name: 'テストユーザー',
            manager: '部長太郎',
            managerEmail: 'bucho@example.com'
        };
        
        const form = document.getElementById('dailyReportForm');
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        
        // ローカルストレージキー
        const DRAFT_KEY = 'daily_report_draft';
        const HISTORY_KEY = 'daily_report_history';
        const DATE_SELECTION_KEY = 'daily_report_last_date';
        const DEPARTMENT_SELECTION_KEY = 'daily_report_last_department';
        
        // 初期化
        function init() {
            loadDraft();
            loadLastDateSelection();
            loadLastDepartmentSelection();
            loadHistory();
            setTextareasDisabled(true);
        }
        
        // ドラフト読み込み
        function loadDraft() {
            const draft = localStorage.getItem(DRAFT_KEY);
            if (draft) {
                const data = JSON.parse(draft);
                yesterdayTextarea.value = data.yesterday || '';
                todayTextarea.value = data.today || '';
                issuesTextarea.value = data.issues || '';
            }
        }
        
        // 最後に選択した日付を読み込み
        function loadLastDateSelection() {
            const lastDate = localStorage.getItem(DATE_SELECTION_KEY);
            if (lastDate) {
                reportDateInput.value = lastDate;
            }
        }
        
        // 最後に選択した部門を読み込み
        function loadLastDepartmentSelection() {
            const lastDept = localStorage.getItem(DEPARTMENT_SELECTION_KEY);
            if (lastDept) {
                departmentSelect.value = lastDept;
            }
        }
        
        // 日付選択時に保存
        reportDateInput.addEventListener('change', function() {
            localStorage.setItem(DATE_SELECTION_KEY, this.value);
        });
        
        // 部門選択時に保存
        departmentSelect.addEventListener('change', function() {
            localStorage.setItem(DEPARTMENT_SELECTION_KEY, this.value);
        });
        
        // テキストエリアの有効/無効切り替え
        function setTextareasDisabled(disabled) {
            yesterdayTextarea.disabled = disabled;
            todayTextarea.disabled = disabled;
            issuesTextarea.disabled = disabled;
        }
        
        // 編集ボタン
        editBtn.addEventListener('click', function() {
            setTextareasDisabled(false);
            yesterdayTextarea.focus();
        });
        
        // 下書き保存
        draftBtn.addEventListener('click', function() {
            const draft = {
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            showSuccessMessage('下書きを保存しました');
        });
        
        // バリデーション
        function validate() {
            let isValid = true;
            
            // エラーメッセージをクリア
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // 報告日付チェック
            if (!reportDateInput.value) {
                document.getElementById('reportDateError').classList.add('show');
                isValid = false;
            }
            
            // 部門チェック
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            // 報告内容チェック
            const hasContent = yesterdayTextarea.value.trim() || todayTextarea.value.trim() || issuesTextarea.value.trim();
            if (!hasContent) {
                document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        // 成功メッセージ表示
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // フォーム送信
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!validate()) {
                return;
            }
            
            // 確認ダイアログを表示
            showConfirmDialog();
        });
        
        // 確認ダイアログ表示
        function showConfirmDialog() {
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value || '（未入力）';
            document.getElementById('confirmToday').textContent = todayTextarea.value || '（未入力）';
            document.getElementById('confirmIssues').textContent = issuesTextarea.value || '（未入力）';
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
            
            confirmModal.classList.add('show');
        }
        
        // キャンセルボタン
        cancelBtn.addEventListener('click', function() {
            confirmModal.classList.remove('show');
        });
        
        // 確認ボタン
        confirmBtn.addEventListener('click', function() {
            confirmModal.classList.remove('show');
            submitReport();
        });
        
        // 日報送信
        function submitReport() {
            const report = {
                id: 'report_' + Date.now(),
                date: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: currentUser.id,
                senderEmail: currentUser.email,
                senderName: currentUser.name,
                status: '送信済',
                submittedAt: new Date().toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                })
            };
            
            // 履歴に追加
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history.unshift(report);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            
            // ドラフトをクリア
            localStorage.removeItem(DRAFT_KEY);
            
            // フォームをリセット
            form.reset();
            setTextareasDisabled(true);
            
            // 成功メッセージ
            showSuccessMessage('送信完了しました');
            
            // 履歴を再読み込み
            loadHistory();
        }
        
        // 履歴読み込み
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.submittedAt}</span>
                        <span class="history-item-status">${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // 初期化実行
        init();
    </script>
</body>
</html>
