<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .form-section label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    .form-section input[type="date"],
    .form-section select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-section textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      min-height: 100px;
      resize: vertical;
    }
    .form-section textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .form-section input[type="date"]:disabled,
    .form-section select:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-body p {
      margin-bottom: 10px;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
    .history-item-content {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
    
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <form id="dailyReportForm">
      <div class="form-section">
        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
        <input type="date" id="reportDate" name="reportDate" required>
        <div class="error-message" id="dateError"></div>
      </div>
      
      <div class="form-section">
        <label for="department">部門 <span style="color: red;">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- 選択してください --</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError"></div>
      </div>
      
      <div class="form-section">
        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="yesterdayError"></div>
      </div>
      
      <div class="form-section">
        <label for="today">今日やること <span style="color: red;">*</span></label>
        <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="todayError"></div>
      </div>
      
      <div class="form-section">
        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
        <div class="error-message" id="issuesError"></div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
        <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
        <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
        <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
        <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="confirmSender" style="margin-left: 10px; color: #333;"></p>
        <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
        <p id="confirmManager" style="margin-left: 10px; color: #333;"></p>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-success">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('dailyReportForm');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyList = document.getElementById('historyList');
    
    const reportDateInput = document.getElementById('reportDate');
    const departmentSelect = document.getElementById('department');
    const yesterdayTextarea = document.getElementById('yesterday');
    const todayTextarea = document.getElementById('today');
    const issuesTextarea = document.getElementById('issues');
    
    let isEditMode = false;
    let currentUser = null;
    let currentManager = null;
    
    // Initialize
    async function init() {
      await loadCurrentUser();
      loadDraft();
      loadHistory();
      restoreFormState();
    }
    
    async function loadCurrentUser() {
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          currentUser = await response.json();
        }
      } catch (e) {
        console.error('Failed to load user:', e);
        currentUser = { email: 'testuser@example.com', name: 'Test User' };
      }
    }
    
    function loadDraft() {
      const draft = localStorage.getItem('dailyReportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        if (data.reportDate) reportDateInput.value = data.reportDate;
        if (data.department) departmentSelect.value = data.department;
        if (data.yesterday) yesterdayTextarea.value = data.yesterday;
        if (data.today) todayTextarea.value = data.today;
        if (data.issues) issuesTextarea.value = data.issues;
      }
    }
    
    function restoreFormState() {
      const state = sessionStorage.getItem('dailyReportState');
      if (state) {
        const data = JSON.parse(state);
        if (data.reportDate) reportDateInput.value = data.reportDate;
        if (data.department) departmentSelect.value = data.department;
      }
    }
    
    function saveFormState() {
      const state = {
        reportDate: reportDateInput.value,
        department: departmentSelect.value
      };
      sessionStorage.setItem('dailyReportState', JSON.stringify(state));
    }
    
    async function loadHistory() {
      try {
        const response = await fetch('/api/daily-reports');
        if (response.ok) {
          const reports = await response.json();
          if (reports.length === 0) {
            historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
          } else {
            historyList.innerHTML = reports.map(report => `
              <div class="history-item">
                <div class="history-item-header">
                  <span>送信日時: ${formatDateTime(report.submittedAt)}</span>
                  <span>送信者: ${report.submittedBy}</span>
                  <span style="color: #28a745;">ステータス: 送信済</span>
                </div>
                <div class="history-item-content">
                  <p><strong>昨日やったこと:</strong> ${escapeHtml(report.yesterday)}</p>
                  <p><strong>今日やること:</strong> ${escapeHtml(report.today)}</p>
                  <p><strong>抱えている課題:</strong> ${escapeHtml(report.issues)}</p>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (e) {
        console.error('Failed to load history:', e);
      }
    }
    
    function formatDateTime(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    editBtn.addEventListener('click', () => {
      isEditMode = true;
      yesterdayTextarea.disabled = false;
      todayTextarea.disabled = false;
      issuesTextarea.disabled = false;
      editBtn.style.display = 'none';
    });
    
    draftBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const draft = {
        reportDate: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value
      };
      localStorage.setItem('dailyReportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    });
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear previous errors
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      
      // Validate
      let hasError = false;
      
      if (!reportDateInput.value) {
        document.getElementById('dateError').textContent = '報告日付を選択してください';
        document.getElementById('dateError').classList.add('show');
        hasError = true;
      }
      
      if (!departmentSelect.value) {
        document.getElementById('departmentError').textContent = '部門を選択してください';
        document.getElementById('departmentError').classList.add('show');
        hasError = true;
      }
      
      if (!yesterdayTextarea.value.trim()) {
        document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
        document.getElementById('yesterdayError').classList.add('show');
        hasError = true;
      }
      
      if (!todayTextarea.value.trim()) {
        document.getElementById('todayError').textContent = '報告内容を入力してください';
        document.getElementById('todayError').classList.add('show');
        hasError = true;
      }
      
      if (!issuesTextarea.value.trim()) {
        document.getElementById('issuesError').textContent = '報告内容を入力してください';
        document.getElementById('issuesError').classList.add('show');
        hasError = true;
      }
      
      if (hasError) return;
      
      // Show confirmation dialog
      document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value.substring(0, 100);
      document.getElementById('confirmToday').textContent = todayTextarea.value.substring(0, 100);
      document.getElementById('confirmIssues').textContent = issuesTextarea.value.substring(0, 100);
      document.getElementById('confirmSender').textContent = currentUser?.email || 'testuser@example.com';
      document.getElementById('confirmManager').textContent = currentManager || '部長 <manager@example.com>';
      
      confirmModal.classList.add('show');
    });
    
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    confirmBtn.addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      
      try {
        const response = await fetch('/api/daily-reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reportDate: reportDateInput.value,
            department: departmentSelect.value,
            yesterday: yesterdayTextarea.value,
            today: todayTextarea.value,
            issues: issuesTextarea.value
          })
        });
        
        if (response.ok) {
          successMessage.textContent = '送信完了しました';
          successMessage.classList.add('show');
          
          // Clear form
          form.reset();
          yesterdayTextarea.disabled = true;
          todayTextarea.disabled = true;
          issuesTextarea.disabled = true;
          editBtn.style.display = 'inline-block';
          isEditMode = false;
          
          // Clear draft
          localStorage.removeItem('dailyReportDraft');
          
          // Reload history
          await loadHistory();
          
          // Hide success message after 3 seconds
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 3000);
        }
      } catch (e) {
        console.error('Failed to submit report:', e);
        alert('送信に失敗しました');
      }
    });
    
    // Save form state on input
    reportDateInput.addEventListener('change', saveFormState);
    departmentSelect.addEventListener('change', saveFormState);
    
    init();
  </script>
</body>
</html>
