<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .user-info {
            font-size: 14px;
            color: #666;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        select, input[type="date"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }
        textarea:disabled {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            font-weight: 600;
            color: #007bff;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-dialog {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content-item {
            margin-bottom: 15px;
        }
        .modal-content-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .modal-content-value {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            word-break: break-word;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-footer button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .nav-buttons a {
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .nav-buttons a:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <span id="userEmail">ユーザー</span>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            送信完了しました
        </div>

        <form id="reportForm">
            <div class="form-row">
                <div class="form-section">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                <div class="form-section">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-warning" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-secondary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>

        <div class="nav-buttons">
            <a href="./dashboard.html">ダッシュボード</a>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-dialog">
            <div class="modal-header">送信確認</div>
            <div class="modal-content">
                <div class="modal-content-item">
                    <div class="modal-content-label">昨日やったこと</div>
                    <div class="modal-content-value" id="confirmYesterday"></div>
                </div>
                <div class="modal-content-item">
                    <div class="modal-content-label">今日やること</div>
                    <div class="modal-content-value" id="confirmToday"></div>
                </div>
                <div class="modal-content-item">
                    <div class="modal-content-label">抱えている課題</div>
                    <div class="modal-content-value" id="confirmIssues"></div>
                </div>
                <div class="modal-content-item">
                    <div class="modal-content-label">送信者</div>
                    <div class="modal-content-value" id="confirmSender"></div>
                </div>
                <div class="modal-content-item">
                    <div class="modal-content-label">部長</div>
                    <div class="modal-content-value" id="confirmManager"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        const userEmailSpan = document.getElementById('userEmail');

        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');

        let currentUser = null;
        let currentManager = null;
        let reports = [];

        // Initialize
        async function init() {
            await loadUser();
            loadDraft();
            loadHistory();
            restoreFormState();
        }

        async function loadUser() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    currentUser = await response.json();
                    userEmailSpan.textContent = currentUser.email || 'ユーザー';
                    if (currentUser.manager) {
                        currentManager = currentUser.manager;
                    }
                } else {
                    currentUser = { email: 'testuser@example.com', id: 'user1', manager: { name: '部長太郎', email: 'bucho@example.com' } };
                    userEmailSpan.textContent = currentUser.email;
                    currentManager = currentUser.manager;
                }
            } catch (error) {
                console.error('Failed to load user:', error);
                currentUser = { email: 'testuser@example.com', id: 'user1', manager: { name: '部長太郎', email: 'bucho@example.com' } };
                userEmailSpan.textContent = currentUser.email;
                currentManager = currentUser.manager;
            }
        }

        function loadDraft() {
            try {
                const draft = localStorage.getItem('reportDraft');
                if (draft) {
                    const data = JSON.parse(draft);
                    yesterdayTextarea.value = data.yesterday || '';
                    todayTextarea.value = data.today || '';
                    issuesTextarea.value = data.issues || '';
                }
            } catch (error) {
                console.error('Failed to load draft:', error);
            }
        }

        function restoreFormState() {
            try {
                const state = sessionStorage.getItem('reportFormState');
                if (state) {
                    const data = JSON.parse(state);
                    if (data.reportDate) reportDateInput.value = data.reportDate;
                    if (data.department) departmentSelect.value = data.department;
                }
            } catch (error) {
                console.error('Failed to restore form state:', error);
            }
        }

        function saveFormState() {
            try {
                const state = {
                    reportDate: reportDateInput.value,
                    department: departmentSelect.value
                };
                sessionStorage.setItem('reportFormState', JSON.stringify(state));
            } catch (error) {
                console.error('Failed to save form state:', error);
            }
        }

        function loadHistory() {
            try {
                const history = localStorage.getItem('reportHistory');
                if (history) {
                    reports = JSON.parse(history);
                    renderHistory();
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        function renderHistory() {
            if (reports.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }

            historyList.innerHTML = reports.map(report => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${formatDateTime(report.timestamp)}</span>
                        <span class="history-item-status">送信済</span>
                    </div>
                    <div class="history-item-content">
                        <div><strong>昨日やったこと:</strong> ${escapeHtml(report.yesterday.substring(0, 50))}${report.yesterday.length > 50 ? '...' : ''}</div>
                        <div><strong>今日やること:</strong> ${escapeHtml(report.today.substring(0, 50))}${report.today.length > 50 ? '...' : ''}</div>
                        <div><strong>抱えている課題:</strong> ${escapeHtml(report.issues.substring(0, 50))}${report.issues.length > 50 ? '...' : ''}</div>
                    </div>
                </li>
            `).join('');
        }

        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
        }

        function validateForm() {
            clearErrors();
            let isValid = true;

            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }

            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }

            const yesterday = yesterdayTextarea.value.trim();
            const today = todayTextarea.value.trim();
            const issues = issuesTextarea.value.trim();

            if (!yesterday && !today && !issues) {
                document.getElementById('yesterdayError').classList.add('show');
                document.getElementById('todayError').classList.add('show');
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }

            return isValid;
        }

        editBtn.addEventListener('click', () => {
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            yesterdayTextarea.focus();
        });

        draftBtn.addEventListener('click', () => {
            const draft = {
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            saveFormState();

            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value;
            document.getElementById('confirmToday').textContent = todayTextarea.value;
            document.getElementById('confirmIssues').textContent = issuesTextarea.value;
            document.getElementById('confirmSender').textContent = currentUser.email;
            if (currentManager) {
                document.getElementById('confirmManager').textContent = `${currentManager.name} <${currentManager.email}>`;
            } else {
                document.getElementById('confirmManager').textContent = '部長情報なし';
            }

            confirmModal.classList.add('show');
        });

        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });

        confirmBtn.addEventListener('click', async () => {
            const report = {
                timestamp: new Date().toISOString(),
                date: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: currentUser.email,
                userId: currentUser.id
            };

            reports.unshift(report);
            localStorage.setItem('reportHistory', JSON.stringify(reports));

            confirmModal.classList.remove('show');
            successMessage.classList.add('show');

            yesterdayTextarea.value = '';
            todayTextarea.value = '';
            issuesTextarea.value = '';
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            reportDateInput.value = '';
            departmentSelect.value = '';

            localStorage.removeItem('reportDraft');

            renderHistory();

            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        });

        init();
    </script>
</body>
</html>
