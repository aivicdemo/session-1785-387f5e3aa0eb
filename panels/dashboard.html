<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-badge {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 16px;
        }
        .deadline-badge.urgent {
            background-color: #d32f2f;
        }
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #f5f5f5;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #666;
        }
        .summary-table tr:hover {
            background-color: #fafafa;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-complete {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-primary {
            display: inline-block;
            background-color: #1976d2;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            <div class="deadline-badge" id="deadlineBadge">提出期限: 本日 18:00</div>
            <br>
            <a href="./daily-report.html" class="nav-link">日報入力・送信へ →</a>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td colspan="5" class="empty-state">データを読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadSummary() {
            try {
                const response = await fetch('/api/summary');
                if (response.ok) {
                    const data = await response.json();
                    displaySummary(data.departments);
                    updateDeadline(data.deadline);
                } else {
                    displayDefaultSummary();
                }
            } catch (e) {
                console.error('Failed to load summary:', e);
                displayDefaultSummary();
            }
        }
        
        function displayDefaultSummary() {
            const departments = [
                { name: '営業部', submitted: 8, total: 10 },
                { name: '企画部', submitted: 6, total: 8 },
                { name: '技術部', submitted: 12, total: 15 },
                { name: '管理部', submitted: 4, total: 5 }
            ];
            displaySummary(departments);
        }
        
        function displaySummary(departments) {
            const tbody = document.getElementById('summaryBody');
            tbody.innerHTML = '';
            
            departments.forEach(dept => {
                const pending = dept.total - dept.submitted;
                const rate = Math.round((dept.submitted / dept.total) * 100);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${dept.name}</strong></td>
                    <td>${dept.submitted}</td>
                    <td>${pending}</td>
                    <td>${rate}%</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function updateDeadline(deadline) {
            const badge = document.getElementById('deadlineBadge');
            if (deadline) {
                const date = new Date(deadline);
                const timeStr = date.toLocaleString('ja-JP', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                badge.textContent = `提出期限: ${timeStr}`;
                
                // Check if urgent (less than 2 hours)
                const now = new Date();
                const diff = date - now;
                if (diff < 2 * 60 * 60 * 1000 && diff > 0) {
                    badge.classList.add('urgent');
                }
            }
        }
        
        loadSummary();
    </script>
</body>
</html>
