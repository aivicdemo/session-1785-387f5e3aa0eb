<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .deadline-text {
            color: #856404;
            font-size: 16px;
            font-weight: 600;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #f9f9f9;
        }
        .summary-table thead {
            background-color: #007bff;
            color: white;
        }
        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .summary-table tbody tr:hover {
            background-color: #f0f0f0;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-complete {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-overdue {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="goToReport()">日報入力へ</button>
                <button class="btn btn-secondary" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadlineText">本日 18:00 までに提出してください</div>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>合計</th>
                        <th>提出率</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await initializePage();
            await loadSummary();
        });

        async function initializePage() {
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }
            currentUser = JSON.parse(userStr);
        }

        async function loadSummary() {
            try {
                const response = await fetch('/api/summary');
                const summary = await response.json();
                
                const tbody = document.getElementById('summaryTableBody');
                tbody.innerHTML = '';

                if (!summary || summary.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">データがありません</td></tr>';
                    return;
                }

                summary.forEach(dept => {
                    const submitted = dept.submitted || 0;
                    const total = dept.total || 0;
                    const pending = total - submitted;
                    const rate = total > 0 ? Math.round((submitted / total) * 100) : 0;
                    
                    let statusClass = 'status-pending';
                    let statusText = '未提出';
                    if (rate === 100) {
                        statusClass = 'status-complete';
                        statusText = '完了';
                    } else if (rate > 0) {
                        statusClass = 'status-pending';
                        statusText = '進行中';
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${dept.name}</td>
                        <td>${submitted}</td>
                        <td>${pending}</td>
                        <td>${total}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading summary:', error);
                const tbody = document.getElementById('summaryTableBody');
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">データ読み込みエラー</td></tr>';
            }
        }

        function goToReport() {
            window.location.href = './daily-report.html';
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
