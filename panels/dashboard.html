<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-section p {
            color: #856404;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-section .deadline-time {
            color: #d32f2f;
            font-size: 18px;
            font-weight: 600;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        a.btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #1976d2;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
        .btn-secondary {
            background-color: #757575;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #616161;
        }
        .content {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #1976d2;
            padding-bottom: 10px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card.submitted {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        }
        .summary-card.pending {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }
        .summary-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .summary-card .number {
            font-size: 36px;
            font-weight: 700;
        }
        .summary-card .percentage {
            font-size: 12px;
            margin-top: 10px;
            opacity: 0.8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background-color: #f5f5f5;
            color: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            font-size: 13px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #666;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .status-pending {
            background-color: #ffe0b2;
            color: #e65100;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background-color: #4caf50;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 600;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./daily-report.html" class="nav-link">← 日報入力・送信に戻る</a>
            
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <p>提出期限:</p>
                <div class="deadline-time" id="deadline">本日 18:00</div>
            </div>
            
            <div class="button-group">
                <a href="./daily-report.html" class="btn btn-primary">日報を入力・送信</a>
                <a href="./submission-status.html" class="btn btn-secondary">詳細を確認</a>
            </div>
        </div>
        
        <div class="content">
            <h2>部門別提出状況サマリー</h2>
            
            <div class="summary-grid" id="summaryGrid">
                <!-- 動的に生成 -->
            </div>
            
            <table id="departmentTable">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>合計</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 動的に生成 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // ダッシュボードデータ
        const dashboardData = {
            deadline: new Date(new Date().getTime() + 24 * 60 * 60 * 1000).toLocaleString('ja-JP', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            }),
            departments: [
                { name: '営業部', submitted: 12, total: 15 },
                { name: '企画部', submitted: 8, total: 10 },
                { name: '技術部', submitted: 18, total: 20 },
                { name: '管理部', submitted: 5, total: 5 }
            ]
        };
        
        // 提出期限を設定
        function setDeadline() {
            const today = new Date();
            const deadline = new Date(today);
            deadline.setHours(18, 0, 0, 0);
            
            const deadlineStr = deadline.toLocaleString('ja-JP', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            document.getElementById('deadline').textContent = `本日 ${deadline.getHours()}:00`;
        }
        
        // サマリーカードを生成
        function renderSummary() {
            const summaryGrid = document.getElementById('summaryGrid');
            let totalSubmitted = 0;
            let totalPending = 0;
            let totalAll = 0;
            
            dashboardData.departments.forEach(dept => {
                totalSubmitted += dept.submitted;
                totalPending += dept.total - dept.submitted;
                totalAll += dept.total;
            });
            
            const submissionRate = Math.round((totalSubmitted / totalAll) * 100);
            
            summaryGrid.innerHTML = `
                <div class="summary-card submitted">
                    <h3>提出済み</h3>
                    <div class="number">${totalSubmitted}</div>
                    <div class="percentage">全体の ${submissionRate}%</div>
                </div>
                <div class="summary-card pending">
                    <h3>未提出</h3>
                    <div class="number">${totalPending}</div>
                    <div class="percentage">全体の ${100 - submissionRate}%</div>
                </div>
                <div class="summary-card">
                    <h3>合計</h3>
                    <div class="number">${totalAll}</div>
                    <div class="percentage">人</div>
                </div>
            `;
        }
        
        // テーブルを生成
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            
            tableBody.innerHTML = dashboardData.departments.map(dept => {
                const rate = Math.round((dept.submitted / dept.total) * 100);
                const pending = dept.total - dept.submitted;
                
                return `
                    <tr>
                        <td><strong>${dept.name}</strong></td>
                        <td>
                            <span class="status-badge status-submitted">${dept.submitted}</span>
                        </td>
                        <td>
                            <span class="status-badge status-pending">${pending}</span>
                        </td>
                        <td>${dept.total}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 初期化
        function init() {
            setDeadline();
            renderSummary();
            renderTable();
        }
        
        init();
    </script>
</body>
</html>
