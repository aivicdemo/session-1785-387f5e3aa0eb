<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #0b7dda;
    }
    .btn-danger {
      background-color: #f44336;
      color: white;
    }
    .btn-danger:hover {
      background-color: #da190b;
    }
    .error-message {
      color: #f44336;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .history-list {
      list-style: none;
    }
    .history-item {
      background-color: #f9f9f9;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
      border-left: 4px solid #4CAF50;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .history-item-date {
      color: #666;
      font-weight: 600;
    }
    .history-item-status {
      background-color: #4CAF50;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }
    .history-empty {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.8;
    }
    .modal-summary {
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .modal-summary-item {
      margin-bottom: 10px;
    }
    .modal-summary-label {
      font-weight: 600;
      color: #333;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-footer button {
      padding: 10px 20px;
      font-size: 14px;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #2196F3;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
    
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate" required>
          <div class="error-message" id="dateError"></div>
        </div>
        
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" name="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError"></div>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" name="yesterday" disabled></textarea>
          <div class="error-message" id="yesterdayError"></div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" name="today" disabled></textarea>
          <div class="error-message" id="todayError"></div>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" name="issues" disabled></textarea>
          <div class="error-message" id="issuesError"></div>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <ul class="history-list" id="historyList">
        <li class="history-empty">送信履歴はありません</li>
      </ul>
    </div>
  </div>
  
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <div class="modal-summary">
          <div class="modal-summary-item">
            <span class="modal-summary-label">昨日やったこと:</span>
            <span id="summaryYesterday"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">今日やること:</span>
            <span id="summaryToday"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">抱えている課題:</span>
            <span id="summaryIssues"></span>
          </div>
        </div>
        <div>
          <p><strong>送信者:</strong> <span id="senderEmail"></span></p>
          <p><strong>部長:</strong> <span id="chiefEmail"></span></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-primary">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('reportForm');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const yesterdayField = document.getElementById('yesterday');
    const todayField = document.getElementById('today');
    const issuesField = document.getElementById('issues');
    const reportDateField = document.getElementById('reportDate');
    const departmentField = document.getElementById('department');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const historyList = document.getElementById('historyList');
    const successMessage = document.getElementById('successMessage');
    
    let isEditMode = false;
    let currentUser = null;
    let currentChief = null;
    
    // Initialize
    async function init() {
      await loadUserData();
      loadSessionData();
      loadHistory();
      setupEventListeners();
    }
    
    async function loadUserData() {
      try {
        const response = await fetch('/api/data.json');
        const data = await response.json();
        
        // Get current user from session or localStorage
        const userId = sessionStorage.getItem('userId') || 'user1';
        const user = data.users.find(u => u.id === userId);
        
        if (user) {
          currentUser = user;
          document.getElementById('senderEmail').textContent = user.email;
          
          // Find chief
          const chief = data.users.find(u => u.id === user.chiefId);
          if (chief) {
            currentChief = chief;
          }
        }
      } catch (error) {
        console.error('Error loading user data:', error);
      }
    }
    
    function loadSessionData() {
      const savedDate = sessionStorage.getItem('reportDate');
      const savedDepartment = sessionStorage.getItem('reportDepartment');
      
      if (savedDate) {
        reportDateField.value = savedDate;
      }
      if (savedDepartment) {
        departmentField.value = savedDepartment;
      }
    }
    
    function saveSessionData() {
      sessionStorage.setItem('reportDate', reportDateField.value);
      sessionStorage.setItem('reportDepartment', departmentField.value);
    }
    
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      
      if (history.length === 0) {
        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
        return;
      }
      
      historyList.innerHTML = '';
      history.reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <div class="history-item-header">
            <span class="history-item-date">${item.date}</span>
            <span class="history-item-status">送信済</span>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
            <p><strong>今日やること:</strong> ${item.today}</p>
            <p><strong>抱えている課題:</strong> ${item.issues}</p>
          </div>
        `;
        historyList.appendChild(li);
      });
    }
    
    function setupEventListeners() {
      editBtn.addEventListener('click', (e) => {
        e.preventDefault();
        enableEditMode();
      });
      
      draftBtn.addEventListener('click', (e) => {
        e.preventDefault();
        saveDraft();
      });
      
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        handleSubmit();
      });
      
      cancelBtn.addEventListener('click', () => {
        confirmModal.classList.remove('show');
      });
      
      confirmBtn.addEventListener('click', () => {
        sendReport();
      });
    }
    
    function enableEditMode() {
      isEditMode = true;
      yesterdayField.disabled = false;
      todayField.disabled = false;
      issuesField.disabled = false;
      editBtn.style.display = 'none';
    }
    
    function saveDraft() {
      const draft = {
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        date: new Date().toISOString()
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    function handleSubmit() {
      clearErrors();
      
      if (!reportDateField.value) {
        showError('dateError', '報告日付を選択してください');
        return;
      }
      
      if (!departmentField.value) {
        showError('departmentError', '部門を選択してください');
        return;
      }
      
      if (!yesterdayField.value.trim() && !todayField.value.trim() && !issuesField.value.trim()) {
        showError('yesterdayError', '報告内容を入力してください');
        return;
      }
      
      showConfirmDialog();
    }
    
    function showConfirmDialog() {
      document.getElementById('summaryYesterday').textContent = yesterdayField.value.substring(0, 50) + (yesterdayField.value.length > 50 ? '...' : '');
      document.getElementById('summaryToday').textContent = todayField.value.substring(0, 50) + (todayField.value.length > 50 ? '...' : '');
      document.getElementById('summaryIssues').textContent = issuesField.value.substring(0, 50) + (issuesField.value.length > 50 ? '...' : '');
      
      if (currentChief) {
        document.getElementById('chiefEmail').textContent = `${currentChief.name} <${currentChief.email}>`;
      }
      
      confirmModal.classList.add('show');
    }
    
    function sendReport() {
      const report = {
        date: new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        reportDate: reportDateField.value,
        department: departmentField.value,
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        sender: currentUser?.id || 'unknown',
        status: '送信済'
      };
      
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      history.push(report);
      localStorage.setItem('reportHistory', JSON.stringify(history));
      
      confirmModal.classList.remove('show');
      
      // Clear form
      yesterdayField.value = '';
      todayField.value = '';
      issuesField.value = '';
      yesterdayField.disabled = true;
      todayField.disabled = true;
      issuesField.disabled = true;
      editBtn.style.display = 'inline-block';
      isEditMode = false;
      
      // Show success message
      successMessage.textContent = '送信完了しました';
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      // Reload history
      loadHistory();
      
      // Clear draft
      localStorage.removeItem('reportDraft');
    }
    
    function showError(elementId, message) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.classList.add('show');
    }
    
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }
    
    // Load draft on page load
    window.addEventListener('load', () => {
      init();
      const draft = JSON.parse(localStorage.getItem('reportDraft') || 'null');
      if (draft) {
        yesterdayField.value = draft.yesterday;
        todayField.value = draft.today;
        issuesField.value = draft.issues;
      }
    });
  </script>
</body>
</html>
