<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-section h2 {
      font-size: 18px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background-color: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal h3 {
      margin-bottom: 20px;
      color: #333;
      font-size: 20px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
      font-size: 14px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 18px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .history-empty {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-item {
      background-color: #f9f9f9;
      border-left: 4px solid #007bff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .history-item-date {
      color: #666;
      font-size: 13px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 8px;
    }
    .history-item-content strong {
      color: #333;
    }
    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <form id="dailyReportForm">
      <div class="form-section">
        <h2>報告日付</h2>
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate">
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
      </div>

      <div class="form-section">
        <h2>部門</h2>
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" name="department">
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>

      <div class="form-section">
        <h2>報告内容</h2>
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" name="yesterday" disabled></textarea>
        </div>
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" name="today" disabled></textarea>
        </div>
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" name="issues" disabled></textarea>
        </div>
        <div class="error-message" id="contentError">報告内容を入力してください</div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-primary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-secondary" id="draftBtn">下書き保存</button>
        <button type="button" class="btn-success" id="submitBtn">送信</button>
      </div>
    </form>

    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer"></div>
    </div>

    <a href="./dashboard.html" class="nav-link">ダッシュボードへ</a>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h3>送信確認</h3>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-buttons">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-success" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('dailyReportForm');
    const reportDateInput = document.getElementById('reportDate');
    const departmentSelect = document.getElementById('department');
    const yesterdayTextarea = document.getElementById('yesterday');
    const todayTextarea = document.getElementById('today');
    const issuesTextarea = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const historyContainer = document.getElementById('historyContainer');
    const successMessage = document.getElementById('successMessage');

    const STORAGE_KEY = 'dailyReportDraft';
    const HISTORY_KEY = 'dailyReportHistory';
    const USER_EMAIL = 'testuser@example.com';
    const MANAGER_EMAIL = 'bucho@example.com';
    const MANAGER_NAME = '部長';

    // 初期化
    function init() {
      loadDraft();
      loadHistory();
      setupEventListeners();
    }

    // イベントリスナー設定
    function setupEventListeners() {
      editBtn.addEventListener('click', enableEdit);
      draftBtn.addEventListener('click', saveDraft);
      submitBtn.addEventListener('click', handleSubmit);
      cancelBtn.addEventListener('click', closeModal);
      confirmBtn.addEventListener('click', confirmSubmit);
      
      // 日付と部門の変更を保存
      reportDateInput.addEventListener('change', () => {
        sessionStorage.setItem('reportDate', reportDateInput.value);
      });
      departmentSelect.addEventListener('change', () => {
        sessionStorage.setItem('department', departmentSelect.value);
      });
    }

    // 編集モード有効化
    function enableEdit() {
      yesterdayTextarea.disabled = false;
      todayTextarea.disabled = false;
      issuesTextarea.disabled = false;
      yesterdayTextarea.focus();
    }

    // 下書き保存
    function saveDraft() {
      const draft = {
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
      showSuccessMessage('下書きを保存しました');
    }

    // 下書き読み込み
    function loadDraft() {
      const draft = localStorage.getItem(STORAGE_KEY);
      if (draft) {
        const data = JSON.parse(draft);
        yesterdayTextarea.value = data.yesterday || '';
        todayTextarea.value = data.today || '';
        issuesTextarea.value = data.issues || '';
      }

      // セッションストレージから日付と部門を復元
      const savedDate = sessionStorage.getItem('reportDate');
      const savedDept = sessionStorage.getItem('department');
      if (savedDate) reportDateInput.value = savedDate;
      if (savedDept) departmentSelect.value = savedDept;
    }

    // バリデーション
    function validate() {
      let isValid = true;
      clearErrors();

      if (!reportDateInput.value) {
        showError('dateError');
        isValid = false;
      }

      if (!departmentSelect.value) {
        showError('departmentError');
        isValid = false;
      }

      const hasContent = yesterdayTextarea.value.trim() || todayTextarea.value.trim() || issuesTextarea.value.trim();
      if (!hasContent) {
        showError('contentError');
        isValid = false;
      }

      return isValid;
    }

    // エラー表示
    function showError(elementId) {
      document.getElementById(elementId).classList.add('show');
    }

    // エラークリア
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
      });
    }

    // 成功メッセージ表示
    function showSuccessMessage(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
    }

    // 送信処理
    function handleSubmit(e) {
      e.preventDefault();
      if (!validate()) return;

      showConfirmModal();
    }

    // 確認ダイアログ表示
    function showConfirmModal() {
      const content = `
        <p><strong>送信者:</strong> ${USER_EMAIL}</p>
        <p><strong>部長:</strong> ${MANAGER_NAME} &lt;${MANAGER_EMAIL}&gt;</p>
        <p><strong>報告日付:</strong> ${reportDateInput.value}</p>
        <p><strong>部門:</strong> ${departmentSelect.value}</p>
        <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
        <p><strong>昨日やったこと:</strong></p>
        <p>${escapeHtml(yesterdayTextarea.value.substring(0, 50))}${yesterdayTextarea.value.length > 50 ? '...' : ''}</p>
        <p><strong>今日やること:</strong></p>
        <p>${escapeHtml(todayTextarea.value.substring(0, 50))}${todayTextarea.value.length > 50 ? '...' : ''}</p>
        <p><strong>抱えている課題:</strong></p>
        <p>${escapeHtml(issuesTextarea.value.substring(0, 50))}${issuesTextarea.value.length > 50 ? '...' : ''}</p>
      `;
      document.getElementById('modalContent').innerHTML = content;
      confirmModal.classList.add('show');
    }

    // ダイアログクローズ
    function closeModal() {
      confirmModal.classList.remove('show');
    }

    // 送信確認
    function confirmSubmit() {
      closeModal();
      
      const report = {
        id: Date.now().toString(),
        date: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value,
        sender: USER_EMAIL,
        timestamp: new Date().toISOString(),
        status: '送信済'
      };

      // 履歴に追加
      let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      history.unshift(report);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

      // フォームクリア
      yesterdayTextarea.value = '';
      todayTextarea.value = '';
      issuesTextarea.value = '';
      yesterdayTextarea.disabled = true;
      todayTextarea.disabled = true;
      issuesTextarea.disabled = true;
      localStorage.removeItem(STORAGE_KEY);

      showSuccessMessage('送信完了しました');
      loadHistory();
    }

    // 履歴読み込み
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      
      if (history.length === 0) {
        historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }

      historyContainer.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-item-header">
            <span class="history-item-date">${formatDateTime(item.timestamp)}</span>
            <span class="history-item-status">${item.status}</span>
          </div>
          <div class="history-item-content">
            <p><strong>報告日付:</strong> ${item.date}</p>
            <p><strong>部門:</strong> ${item.department}</p>
            <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday)}</p>
            <p><strong>今日やること:</strong> ${escapeHtml(item.today)}</p>
            <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues)}</p>
          </div>
        </div>
      `).join('');
    }

    // 日時フォーマット
    function formatDateTime(isoString) {
      const date = new Date(isoString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
    }

    // HTML エスケープ
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
