<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .logout-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #5a6268;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .form-section input[type="date"],
        .form-section select,
        .form-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-section textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-section textarea:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #555;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons .btn {
            flex: 1;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: bold;
            color: #333;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-buttons .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>

        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="goToDashboard()">ダッシュボード</button>
        </div>

        <div class="success-message" id="successMessage">送信完了しました</div>

        <form id="reportForm">
            <div class="form-row">
                <div class="form-section">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                <div class="form-section">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
            </div>

            <div class="form-section">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-warning" id="editBtn" onclick="enableEdit()">報告内容編集</button>
                <button type="button" class="btn btn-success" id="draftBtn" onclick="saveDraft()">下書き保存</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #666;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="cancelSubmit()">キャンセル</button>
                <button type="button" class="btn btn-primary" onclick="confirmSubmit()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let pendingSubmitData = null;

        async function initPage() {
            // ユーザー情報を取得
            const userStr = sessionStorage.getItem('user');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }
            currentUser = JSON.parse(userStr);

            // 前回の入力値を復元
            restoreFormData();

            // 送信履歴を読み込み
            await loadHistory();

            // フォーム送信イベント
            document.getElementById('reportForm').addEventListener('submit', handleSubmit);
        }

        function restoreFormData() {
            const saved = sessionStorage.getItem('reportFormData');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.reportDate) {
                    document.getElementById('reportDate').value = data.reportDate;
                }
                if (data.department) {
                    document.getElementById('department').value = data.department;
                }
                // テキストエリアは下書き保存データから復元
            }

            // 下書き保存データを復元
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const draftData = JSON.parse(draft);
                document.getElementById('yesterday').value = draftData.yesterday || '';
                document.getElementById('today').value = draftData.today || '';
                document.getElementById('issues').value = draftData.issues || '';
            }
        }

        function enableEdit() {
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editBtn').style.display = 'none';
        }

        function saveDraft() {
            const draftData = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draftData));
            alert('下書きを保存しました');
        }

        function handleSubmit(e) {
            e.preventDefault();

            // バリデーション
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            let hasError = false;

            // 日付チェック
            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('dateError').classList.remove('show');
            }

            // 部門チェック
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('departmentError').classList.remove('show');
            }

            // 報告内容チェック
            if (!yesterday && !today && !issues) {
                document.getElementById('contentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('contentError').classList.remove('show');
            }

            if (hasError) {
                return;
            }

            // 送信確認ダイアログを表示
            pendingSubmitData = {
                reportDate,
                department,
                yesterday,
                today,
                issues
            };

            document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 50) + (yesterday.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = today.substring(0, 50) + (today.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = issues.substring(0, 50) + (issues.length > 50 ? '...' : '');
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = currentUser.managerEmail || '未設定';

            document.getElementById('confirmModal').classList.add('show');
        }

        function cancelSubmit() {
            document.getElementById('confirmModal').classList.remove('show');
            pendingSubmitData = null;
        }

        async function confirmSubmit() {
            if (!pendingSubmitData) return;

            try {
                const response = await fetch('/api/submit-report', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        ...pendingSubmitData,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    document.getElementById('confirmModal').classList.remove('show');
                    document.getElementById('successMessage').classList.add('show');

                    // フォームをクリア
                    document.getElementById('yesterday').value = '';
                    document.getElementById('today').value = '';
                    document.getElementById('issues').value = '';
                    document.getElementById('yesterday').disabled = true;
                    document.getElementById('today').disabled = true;
                    document.getElementById('issues').disabled = true;
                    document.getElementById('editBtn').style.display = 'inline-block';

                    // 下書きをクリア
                    localStorage.removeItem('reportDraft');

                    // 履歴を再読み込み
                    await loadHistory();

                    // 成功メッセージを3秒後に非表示
                    setTimeout(() => {
                        document.getElementById('successMessage').classList.remove('show');
                    }, 3000);
                } else {
                    alert('送信に失敗しました');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('送信中にエラーが発生しました');
            }

            pendingSubmitData = null;
        }

        async function loadHistory() {
            try {
                const response = await fetch(`/api/report-history?userId=${currentUser.id}`);
                if (response.ok) {
                    const history = await response.json();
                    displayHistory(history);
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function displayHistory(history) {
            const historyList = document.getElementById('historyList');
            if (!history || history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }

            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div class="history-item-date">${formatDateTime(item.timestamp)}</div>
                        <div class="history-item-status">送信済</div>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </div>
            `).join('');
        }

        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }

        function logout() {
            sessionStorage.removeItem('user');
            window.location.href = './login.html';
        }

        function goToDashboard() {
            window.location.href = './dashboard.html';
        }

        // ページ読み込み時に初期化
        window.addEventListener('load', initPage);

        // ページを離れる前にフォームデータを保存
        window.addEventListener('beforeunload', () => {
            const formData = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value
            };
            sessionStorage.setItem('reportFormData', JSON.stringify(formData));
        });
    </script>
</body>
</html>
