<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-section h2 {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.6;
    }
    .modal-body p {
      margin-bottom: 10px;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .history-list {
      list-style: none;
    }
    .history-item {
      background-color: #f9f9f9;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      border-left: 4px solid #007bff;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .history-item-date {
      font-size: 12px;
      color: #999;
    }
    .history-item-status {
      display: inline-block;
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }
    .history-item-content {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-section">
        <h2>報告日付</h2>
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate" required>
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
      </div>

      <div class="form-section">
        <h2>部門選択</h2>
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" name="department" required>
            <option value="">-- 部門を選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>

      <div class="form-section">
        <h2>報告内容</h2>
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" name="yesterday" placeholder="昨日実施した内容を入力してください" disabled></textarea>
        </div>
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" name="today" placeholder="今日予定している内容を入力してください" disabled></textarea>
        </div>
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" name="issues" placeholder="現在抱えている課題を入力してください" disabled></textarea>
        </div>
        <div class="error-message" id="contentError">報告内容を入力してください</div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-primary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-secondary" id="draftBtn">下書き保存</button>
        <button type="button" class="btn-success" id="submitBtn">送信</button>
      </div>
    </form>

    <div class="history-section">
      <h2>送信履歴</h2>
      <ul class="history-list" id="historyList">
        <li class="history-empty">送信履歴はありません</li>
      </ul>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <p><strong>送信者:</strong> <span id="senderEmail"></span></p>
        <p><strong>部長:</strong> <span id="chiefEmail"></span></p>
        <p><strong>報告日付:</strong> <span id="confirmDate"></span></p>
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
        <p><strong>今日やること:</strong></p>
        <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
        <p><strong>抱えている課題:</strong></p>
        <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-success" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>

  <script>
    const reportForm = document.getElementById('reportForm');
    const reportDate = document.getElementById('reportDate');
    const department = document.getElementById('department');
    const yesterday = document.getElementById('yesterday');
    const today = document.getElementById('today');
    const issues = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const historyList = document.getElementById('historyList');
    const successMessage = document.getElementById('successMessage');
    const dateError = document.getElementById('dateError');
    const departmentError = document.getElementById('departmentError');
    const contentError = document.getElementById('contentError');

    let currentUser = null;
    let currentChief = null;
    let isEditing = false;

    // Initialize
    async function init() {
      await loadUserData();
      loadFromSessionStorage();
      loadDraft();
      loadHistory();
      setDefaultDate();
    }

    async function loadUserData() {
      try {
        const response = await fetch('/api/users');
        const data = await response.json();
        currentUser = data.currentUser;
        currentChief = data.currentChief;
      } catch (e) {
        console.error('Failed to load user data:', e);
        currentUser = { email: 'testuser@example.com', name: 'Test User' };
        currentChief = { email: 'bucho@example.com', name: '部長' };
      }
    }

    function setDefaultDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      reportDate.value = `${year}-${month}-${day}`;
    }

    function loadFromSessionStorage() {
      const stored = sessionStorage.getItem('reportFormData');
      if (stored) {
        const data = JSON.parse(stored);
        if (data.reportDate) reportDate.value = data.reportDate;
        if (data.department) department.value = data.department;
        if (data.yesterday) yesterday.value = data.yesterday;
        if (data.today) today.value = data.today;
        if (data.issues) issues.value = data.issues;
      }
    }

    function saveToSessionStorage() {
      const data = {
        reportDate: reportDate.value,
        department: department.value,
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value
      };
      sessionStorage.setItem('reportFormData', JSON.stringify(data));
    }

    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        yesterday.value = data.yesterday || '';
        today.value = data.today || '';
        issues.value = data.issues || '';
      }
    }

    function saveDraft() {
      const data = {
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value
      };
      localStorage.setItem('reportDraft', JSON.stringify(data));
      alert('下書きを保存しました');
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      if (history.length === 0) {
        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
      } else {
        historyList.innerHTML = history.map(item => `
          <li class="history-item">
            <div class="history-item-header">
              <span>${item.date}</span>
              <span class="history-item-status">送信済</span>
            </div>
            <div class="history-item-content">
              <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
              <p><strong>今日やること:</strong> ${item.today}</p>
              <p><strong>抱えている課題:</strong> ${item.issues}</p>
            </div>
          </li>
        `).join('');
      }
    }

    function clearForm() {
      yesterday.value = '';
      today.value = '';
      issues.value = '';
      localStorage.removeItem('reportDraft');
    }

    function validateForm() {
      let isValid = true;
      dateError.classList.remove('show');
      departmentError.classList.remove('show');
      contentError.classList.remove('show');

      if (!reportDate.value) {
        dateError.classList.add('show');
        isValid = false;
      }

      if (!department.value) {
        departmentError.classList.add('show');
        isValid = false;
      }

      if (!yesterday.value.trim() && !today.value.trim() && !issues.value.trim()) {
        contentError.classList.add('show');
        isValid = false;
      }

      return isValid;
    }

    editBtn.addEventListener('click', () => {
      isEditing = true;
      yesterday.disabled = false;
      today.disabled = false;
      issues.disabled = false;
      yesterday.focus();
    });

    draftBtn.addEventListener('click', () => {
      saveDraft();
    });

    submitBtn.addEventListener('click', () => {
      if (!validateForm()) return;
      
      saveToSessionStorage();
      
      document.getElementById('senderEmail').textContent = currentUser?.email || 'testuser@example.com';
      document.getElementById('chiefEmail').textContent = `${currentChief?.name || '部長'} <${currentChief?.email || 'bucho@example.com'}>`;
      document.getElementById('confirmDate').textContent = reportDate.value;
      document.getElementById('confirmYesterday').textContent = yesterday.value.substring(0, 50) + (yesterday.value.length > 50 ? '...' : '');
      document.getElementById('confirmToday').textContent = today.value.substring(0, 50) + (today.value.length > 50 ? '...' : '');
      document.getElementById('confirmIssues').textContent = issues.value.substring(0, 50) + (issues.value.length > 50 ? '...' : '');
      
      confirmModal.classList.add('show');
    });

    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });

    confirmBtn.addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      
      const now = new Date();
      const dateStr = now.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      history.unshift({
        date: dateStr,
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value,
        sender: currentUser?.name || 'Test User',
        status: '送信済'
      });
      localStorage.setItem('reportHistory', JSON.stringify(history));
      
      try {
        await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reportDate: reportDate.value,
            department: department.value,
            yesterday: yesterday.value,
            today: today.value,
            issues: issues.value,
            sender: currentUser?.email || 'testuser@example.com',
            chief: currentChief?.email || 'bucho@example.com'
          })
        });
      } catch (e) {
        console.error('Failed to submit report:', e);
      }
      
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      clearForm();
      yesterday.disabled = true;
      today.disabled = true;
      issues.disabled = true;
      isEditing = false;
      loadHistory();
      sessionStorage.removeItem('reportFormData');
    });

    // Save to session storage on input
    [reportDate, department, yesterday, today, issues].forEach(el => {
      el.addEventListener('change', saveToSessionStorage);
      el.addEventListener('input', saveToSessionStorage);
    });

    init();
  </script>
</body>
</html>
