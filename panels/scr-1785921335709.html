:root {
  --primary: #8b6f47;
  --primary-hover: #a0845a;
  --bg-main: #f5f1ed;
  --bg-card: #ede8e3;
  --bg-sidebar: #e8e3dd;
  --border: #d4ccc4;
  --text: #3e3b38;
  --text-muted: #8b8680;
  --top-bar-bg: #e0d9d0;
  --top-bar-border: #d0c8bf;

  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;

  --radius-card: 6px;
  --radius-control: 4px;
  --border-width: 1px;
  --control-height: 36px;
  --space-unit: 8px;

  --shadow-card: 0 2px 8px rgba(62, 59, 56, 0.08), 0 1px 3px rgba(62, 59, 56, 0.04);

  --motion-duration: 200ms;

  --surface-texture: 
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 2px,
      rgba(139, 111, 71, 0.02) 2px,
      rgba(139, 111, 71, 0.02) 4px

    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(139, 111, 71, 0.01) 1px,
      rgba(139, 111, 71, 0.01) 2px
    );
  --surface-texture-size: 100% 100%;
  --surface-texture-position: 0 0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  color: var(--text);
  background: var(--bg-main);
}

body {
  display: flex;
  flex-direction: column;
}

.shell-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.header {
  background: var(--top-bar-bg);
  border-bottom: var(--border-width) solid var(--top-bar-border);

.header-left {

  gap: 12px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.header-brand {
  color: var(--primary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;

  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-name {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}

.logout-link {
  font-size: 12px;
  color: var(--primary);
  text-decoration: none;
  border: var(--border-width) solid var(--border);
  padding: 4px 8px;
  border-radius: var(--radius-control);
  transition: background var(--motion-duration);
}

.logout-link:hover {
  background: rgba(139, 111, 71, 0.08);
}

.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 64px;
}

.nav-bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: var(--border-width) solid var(--border);
  display: flex;
  justify-content: space-around;
  height: 64px;
  z-index: 100;
  flex-shrink: 0;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  transition: color var(--motion-duration);
  border-top: 3px solid transparent;
}

.nav-item:hover {
  color: var(--text);
}

.nav-item.aivic-active {
  color: var(--primary);
  border-top-color: var(--primary);
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
}

[data-aivic-panel] {
  display: block;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.form-control {
  width: 100%;
  padding: 8px 12px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  font-family: var(--font-family);
  font-size: 13px;
  color: var(--text);
  background: white;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(139, 111, 71, 0.1);
}

textarea.form-control {
  resize: vertical;
  min-height: 80px;
}

.button-group {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.btn {
  padding: 8px 16px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  background: white;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--motion-duration);
}

.btn:hover {
  background: var(--bg-card);
}

.btn-primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.dialog {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.dialog.visible {
  display: flex;
}

.dialog-content {
  background: white;
  border-radius: var(--radius-card);
  padding: 24px;
  max-width: 500px;
  width: 90%;
  box-shadow: var(--shadow-card);
}

.dialog-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

.dialog-body {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 16px;
  line-height: 1.6;
}

.dialog-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.history-list {
  margin-top: 24px;
  border-top: var(--border-width) solid var(--border);
  padding-top: 16px;
}

.history-item {
  padding: 12px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  margin-bottom: 8px;
  background: var(--bg-card);
  font-size: 12px;
}

.history-item-title {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.history-item-content {
  color: var(--text-muted);
  line-height: 1.5;
}

T09:45:00+09:00"},{"報告ID":"rec-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-mfg-001","報告者ID":"usr-yamada-002","報告内容":"昨日の生産ラインA・Bの稼働率が平均58%に低下しました。主な原因は仕入先からの部品供給遅延で、特にモータユニットの納入が予定より3日遅れています。現在、ラインCで代替部品を活用した生産調整を進めており、本日中に稼働率を70%まで回復させる見込みです。","進捗状況":"遅延","課題":"①モータユニット供給元の納期遅延（予定：1月13日→実績：1月16日予定）②代替部品の品質検査に予想外の時間を要している③作業員の残業時間が増加傾向（先週平均12時間/人）","対応予定":"本日中に仕入先と納期確認の緊急会議を実施。並行して、代替仕入先2社への発注を進める。品質検査プロセスの簡略化について品質管理部と協議予定。作業員の負担軽減のため、臨時配置要員の手配を人事部に依頼。1月17日までに稼働率を85%以上に回復させる。","作成日時":"2025-01-15T08:35:00+09:00","更新日時":"2025-01-15T08:35:00+09:00"},{"報告ID":"rec-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-004","報告者ID":"user-0127","報告内容":"新商品開発プロジェクト『スマートウォーター』の進捗報告です。現在、基本設計フェーズを実施中ですが、予定していた試作品の初期テストで予想外の技術課題が発生しました。当初は1月中旬の試作品完成予定でしたが、現在2月上旬へのずれ込みが確実な状況です。チーム内での協議の結果、並行開発を加速させるため、追加のエンジニアリソースが必要と判断されました。","進捗状況":"遅延","課題":"1. センサー精度の想定値との乖離により、回路設計の見直しが必要。2. 現在のチーム構成（エンジニア3名）では並行開発が困難。3. 試作品テストの外注先の納期が予定より2週間遅延。","対応予定":"1. センサー仕様の再検討と代替品の評価を1月20日までに完了。2. エンジニア2名の追加配置を経営層に申請（予算影響額：月額280万円）。3. 外注先との納期交渉を本日中に実施。4. スケジュール調整案を1月17日の経営会議で報告。","作成日時":"2025-01-15T08:35:00+09:00","更新日時":"2025-01-15T08:35:00+09:00"},{"報告ID":"rec-20250115-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-qa-001","報告者ID":"user-suzuki-hanako","報告内容":"1月度の不良品率が前月比1.8%増加し、現在3.2%に達しています。主な不良内容は溶接部の気泡混入が全体の45%、寸法超過が30%、表面傷が25%となっており、特に溶接部の品質低下が顕著です。原因調査チームは製造ラインAの溶接機械の校正ズレを疑い、現在検証中です。","進捗状況":"遅延","課題":"溶接機械の定期メンテナンス周期が延長されていた可能性。また、新入社員の配置に伴う作業精度のばらつき。外注先での品質管理基準の統一が不十分。","対応予定":"本日中に溶接機械A・B・Cの全台校正実施。新入社員向けの集中研修を1月20日に実施。外注先との品質基準の再確認会議を1月17日に開催。2月末までに不良品率を2.0%以下に改善する目標。","作成日時":"2025-01-15T08:35:00+09:00","更新日時":"2025-01-15T08:35:00+09:00"},{"報告ID":"rec-20250117-001","報告日":"2025-01-17T09:30:00+09:00","部門ID":"dept-sales-001","報告者ID":"user-yamada-taro","報告内容":"既存顧客A社との年間契約更新交渉を進捗中。現在、契約金額の5%削減要求に対して、サービス範囲の最適化提案で対応中。また、解約リスク顧客として分類されているB社（昨年売上高の12%を占める）に対して、営業担当者による定期訪問を開始し、顧客満足度調査を実施した。C社からは契約継続の意向を得られた。","進捗状況":"遅延","課題":"A社との価格交渉が難航しており、契約更新期限まで2週間となっている。B社は競合他社からの提案を検討中との情報があり、早急な対応が必要。営業チーム内でのリソース不足により、新規案件との並行対応が困難な状況。","対応予定":"本日中にA社への改訂提案書を提出予定。B社に対しては、営業部長による経営層訪問を来週実施し、カスタマイズ提案を提示する。また、営業支援チームを臨時配置してリソース強化を図る。進捗状況は毎日17時に営業会議で共有する。","作成日時":"2025-01-17T09:35:00+09:00","更新日時":"2025-01-17T09:35:00+09:00"},{"報告ID":"rec-20250115-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-logistics-001","報告者ID":"user-20240601-045","報告内容":"1月度の配送実績について報告します。先月は関東地区での配送遅延が相次ぎ、顧客クレームが前月比で23件増加しました。主な原因は悪天候による道路渋滞と配車効率の低下です。現在、配車最適化システムの実装を進めており、ルート検索エンジンの導入は予定通り進行中です。","進捗状況":"遅延","課題":"配送遅延に伴う顧客クレーム件数が増加（前月比+23件）。関東エリアの配車効率が目標値の82%に留まっている。配車最適化システムの導入予定日が2月末から3月中旬にずれ込む可能性がある。ドライバーの労務管理も課題。","対応予定":"1月中にAIベースのルート最適化ツール（ベンダー：LogiTech Solutions）の試験運用を関東地区で開始する。配送遅延の原因分析レポートを1月20日までに完成させ、営業部と共有する。顧客対応チームの増員を検討し、クレーム対応時間を短縮する。2月末までに配車最適化システムの本実装を完了し、配車効率を90%以上に改善する目標。","作成日時":"2025-01-15T08:35:12+09:00","更新日時":"2025-01-15T08:35:12+09:00"},{"報告ID":"rec-20250114-001","報告日":"2025-01-14T08:30:00+09:00","部門ID":"dept-hr-001","報告者ID":"user-hr-yamada-001","報告内容":"2025年1月期新入社員研修（第12期生、配属予定者45名）の進行状況を報告いたします。現在、基礎研修フェーズ2週目に入り、ビジネスマナー研修と社内システム研修を実施中です。出席率は98%（44名）で、1名が体調不良で本日欠席しています。昨年度離職者フォローアップについては、2024年度中途退職者8名のうち、再入社希望者が2名おり、面談を進めております。","進捗状況":"予定通り","課題":"新入社員研修の宿泊施設確保が2月の後半研修で逼迫している状況です。また、昨年度離職者のうち3名からは理由ヒアリングの回答がまだ得られておらず、組織改善への反映が遅延しています。","対応予定":"宿泊施設については本週中に複数候補地を確保する予定です。離職者ヒアリングについては、1月末までに全員からの回答取得を目標に、再度連絡を取ります。また、離職理由分析結果は2月の人事戦略会議で報告予定です。","作成日時":"2025-01-14T08:45:00+09:00","更新日時":"2025-01-14T08:45:00+09:00"},{"報告ID":"rec-20250115-sys-001","報告日":"2025-01-15T09:30:00+09:00","部門ID":"dept-sys-001","報告者ID":"user-yamada-hanako-001","報告内容":"1月14日午後2時30分に発生した基幹システムの決済処理機能の障害について、復旧作業を実施いたしました。原因はデータベースの接続プール枯渇であり、午後4時15分に完全復旧いたしました。影響範囲は決済処理機能のみで、約2時間30分のダウンタイムが発生し、未処理件数は約1,200件でした。復旧後の検証を完了し、現在は正常に稼働しております。","進捗状況":"完了","課題":"今回の障害の根本原因は、接続プールの設定値が実際の負荷に対応していなかったことです。また、監視アラートの閾値設定が適切でなく、障害の早期発見ができませんでした。さらに、復旧手順書が最新化されていなかったため、初期対応に時間を要しました。","対応予定":"1月20日までに接続プール設定の最適化を実施します。1月22日までに監視アラート設定の見直しと新しい監視ルールの導入を完了します。1月29日までに障害対応マニュアルを最新化し、全システム部員への教育を実施予定です。また、2月中旬に再発防止策の有効性確認テストを実施いたします。","作成日時":"2025-01-15T09:35:00+09:00","更新日時":"2025-01-15T09:35:00+09:00"},{"報告ID":"rec-001","報告日":"2024-11-15T09:30:00+09:00","部門ID":"dept-sales-planning","報告者ID":"user-yamamoto-hanako","報告内容":"市場競争激化に対応した価格戦略の見直しについて、競合他社の価格動向調査を完了いたしました。当社の主力製品3品目について、競合比較分析の結果、平均で8～12%の価格差が生じていることが判明しました。特にエントリーモデルでの競争力低下が顕著です。今月中に価格改定案を3パターン作成し、営業部門との協議を予定しています。","進捗状況":"予定通り","課題":"競合他社の価格改定が頻繁に行われており、調査データの鮮度維持が困難。また、原材料費の上昇により利益率維持との両立が課題となっています。営業部門からは値下げによる受注増加への期待が高く、経営層との調整が必要です。","対応予定":"11月20日までに価格改定案3パターン（攻撃的値下げ、段階的値下げ、高付加価値戦略）を作成。11月22日に営業部・経営企画部との合同会議を開催し、市場シェア予測と利益シミュレーションを提示して方針決定を行う予定です。","作成日時":"2024-11-15T09:35:00+09:00","更新日時":"2024-11-15T09:35:00+09:00"}],"報告送信履歴":[{"送信履歴ID":"rec-001","朝会報告ID":"rec-042","ユーザーID":"rec-015","送信日時":"2024-11-15T09:30:45+09:00","送信ステータス":"成功","エラーメッセージ":null,"作成日時":"2024-11-15T09:30:45+09:00","更新日時":"2024-11-15T09:30:45+09:00"},{"送信履歴ID":"rec-20250115-0847","朝会報告ID":"rec-20250115-0001","ユーザーID":"rec-user-2024-0156","送信日時":"2025-01-15T09:30:45+09:00","送信ステータス":"失敗","エラーメッセージ":"ネットワーク接続タイムアウト: 送信サーバーへの接続に失敗しました。接続試行回数: 3回、最終エラーコード: ECONNREFUSED","作成日時":"2025-01-15T09:30:45+09:00","更新日時":"2025-01-15T09:35:12+09:00"},{"送信履歴ID":"rec-001","朝会報告ID":"rec-042","ユーザーID":"rec-108","送信日時":"2024-11-15 09:30:45","送信ステータス":"失敗","エラーメッセージ":"データベース接続タイムアウト: メールサーバーへの接続に失敗しました。リトライ回数が上限に達しました。","作成日時":"2024-11-15 09:30:45","更新日時":"2024-11-15 09:30:45"}]};
