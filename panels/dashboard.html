<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deadline-text {
            color: #856404;
            font-size: 14px;
            line-height: 1.6;
        }
        .deadline-badge {
            display: inline-block;
            background-color: #ffc107;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
            font-size: 13px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-buttons a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .nav-buttons a:hover {
            background-color: #2980b9;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table thead {
            background-color: #ecf0f1;
        }
        .summary-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #bdc3c7;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
            color: #666;
            font-size: 14px;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #ecf0f1;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <h2>提出期限</h2>
                <div class="deadline-text">
                    <p>毎日 18:00 までに日報を提出してください。</p>
                    <p id="nextDeadline"></p>
                </div>
                <div class="deadline-badge" id="deadlineStatus">本日の提出期限: 18:00</div>
            </div>
            
            <div class="nav-buttons">
                <a href="./daily-report.html">日報入力・送信へ</a>
            </div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // 初期化
        function initPage() {
            loadDeadlineInfo();
            loadSummary();
        }
        
        // 提出期限情報を表示
        function loadDeadlineInfo() {
            const now = new Date();
            const today = now.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const nextDeadline = document.getElementById('nextDeadline');
            nextDeadline.textContent = `本日（${today}）の提出期限は 18:00 です。`;
        }
        
        // 部門別提出状況を表示
        function loadSummary() {
            // サンプルデータ
            const departments = [
                { name: '営業部', submitted: 8, total: 10 },
                { name: '企画部', submitted: 6, total: 8 },
                { name: '技術部', submitted: 12, total: 12 },
                { name: '管理部', submitted: 4, total: 5 }
            ];
            
            const summaryBody = document.getElementById('summaryBody');
            
            if (departments.length === 0) {
                summaryBody.innerHTML = '<tr><td colspan="5" class="empty-state"><p>データがありません</p></td></tr>';
                return;
            }
            
            summaryBody.innerHTML = departments.map(dept => {
                const pending = dept.total - dept.submitted;
                const rate = Math.round((dept.submitted / dept.total) * 100);
                const status = rate === 100 ? '完了' : '進行中';
                const statusClass = rate === 100 ? 'status-submitted' : 'status-pending';
                
                return `
                    <tr>
                        <td><strong>${dept.name}</strong></td>
                        <td>${dept.submitted}</td>
                        <td>${pending}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            }).join('');
        }
        
        // ページ読み込み時に初期化
        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
