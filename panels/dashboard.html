<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-label {
            color: #856404;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-time {
            color: #333;
            font-size: 18px;
            font-weight: 700;
        }
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .nav-link:hover {
            background-color: #2980b9;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #ecf0f1;
            color: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #bdc3c7;
            font-size: 14px;
        }
        .summary-table td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 14px;
            color: #555;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <div class="deadline-label">提出期限</div>
                <div class="deadline-time" id="deadlineTime">2024年12月31日 17:00</div>
            </div>
            
            <a href="./daily-report.html" class="nav-link">日報を入力・送信する</a>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📊</div>
                            <div>データを読み込み中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // ダッシュボード初期化
        function initDashboard() {
            // 提出期限を設定
            setDeadline();
            
            // 部門別提出状況を表示
            loadDepartmentSummary();
        }
        
        // 提出期限の設定
        function setDeadline() {
            const deadlineElement = document.getElementById('deadlineTime');
            // 今日から7日後の17:00を期限とする
            const deadline = new Date();
            deadline.setDate(deadline.getDate() + 7);
            deadline.setHours(17, 0, 0, 0);
            
            const year = deadline.getFullYear();
            const month = String(deadline.getMonth() + 1).padStart(2, '0');
            const day = String(deadline.getDate()).padStart(2, '0');
            const hours = String(deadline.getHours()).padStart(2, '0');
            const minutes = String(deadline.getMinutes()).padStart(2, '0');
            
            deadlineElement.textContent = `${year}年${month}月${day}日 ${hours}:${minutes}`;
        }
        
        // 部門別提出状況の読み込み
        function loadDepartmentSummary() {
            const departments = [
                { name: '営業部', total: 15 },
                { name: '企画部', total: 10 },
                { name: '技術部', total: 20 },
                { name: '管理部', total: 8 }
            ];
            
            // 送信履歴から提出済みの部門別集計を取得
            const history = JSON.parse(localStorage.getItem('report_history') || '[]');
            const submittedByDept = {};
            
            history.forEach(report => {
                const dept = report.department;
                submittedByDept[dept] = (submittedByDept[dept] || 0) + 1;
            });
            
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            
            departments.forEach(dept => {
                const submitted = submittedByDept[dept.name] || 0;
                const pending = dept.total - submitted;
                const rate = Math.round((submitted / dept.total) * 100);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${dept.name}</strong></td>
                    <td>
                        <span class="status-badge status-submitted">${submitted}件</span>
                    </td>
                    <td>
                        <span class="status-badge status-pending">${pending}件</span>
                    </td>
                    <td><strong>${rate}%</strong></td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        // ページロード時に初期化
        window.addEventListener('load', initDashboard);
    </script>
</body>
</html>
