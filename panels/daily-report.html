<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        input[type="date"]:disabled,
        select:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-body p {
            margin-bottom: 10px;
        }
        .modal-body strong {
            color: #333;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .history-item-date {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <p><strong>送信者:</strong> <span id="senderEmail"></span></p>
                <p><strong>部長:</strong> <span id="managerEmail"></span></p>
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        
        let isEditMode = false;
        let currentUserEmail = 'testuser@example.com';
        let currentUserManager = '部長 <bucho@example.com>';
        
        // Initialize
        function init() {
            loadFormData();
            loadHistory();
            disableEditFields();
        }
        
        // Load form data from sessionStorage
        function loadFormData() {
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDepartment = sessionStorage.getItem('department');
            const savedYesterday = sessionStorage.getItem('yesterday');
            const savedToday = sessionStorage.getItem('today');
            const savedIssues = sessionStorage.getItem('issues');
            
            if (savedDate) reportDateInput.value = savedDate;
            if (savedDepartment) departmentSelect.value = savedDepartment;
            if (savedYesterday) yesterdayTextarea.value = savedYesterday;
            if (savedToday) todayTextarea.value = savedToday;
            if (savedIssues) issuesTextarea.value = savedIssues;
        }
        
        // Save form data to sessionStorage
        function saveFormData() {
            sessionStorage.setItem('reportDate', reportDateInput.value);
            sessionStorage.setItem('department', departmentSelect.value);
            sessionStorage.setItem('yesterday', yesterdayTextarea.value);
            sessionStorage.setItem('today', todayTextarea.value);
            sessionStorage.setItem('issues', issuesTextarea.value);
        }
        
        // Disable edit fields
        function disableEditFields() {
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            isEditMode = false;
            editBtn.textContent = '報告内容編集';
        }
        
        // Enable edit fields
        function enableEditFields() {
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            isEditMode = true;
            editBtn.textContent = '編集完了';
            yesterdayTextarea.focus();
        }
        
        // Edit button click
        editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (isEditMode) {
                disableEditFields();
            } else {
                enableEditFields();
            }
        });
        
        // Draft save button click
        draftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveFormData();
            alert('下書きを保存しました');
        });
        
        // Form submit
        reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // Validate
            let isValid = true;
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayTextarea.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            if (!todayTextarea.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            
            if (!issuesTextarea.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirmation modal
            document.getElementById('senderEmail').textContent = currentUserEmail;
            document.getElementById('managerEmail').textContent = currentUserManager;
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value;
            document.getElementById('confirmToday').textContent = todayTextarea.value;
            document.getElementById('confirmIssues').textContent = issuesTextarea.value;
            
            confirmModal.classList.add('show');
        });
        
        // Cancel button in modal
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        // Confirm button in modal
        confirmBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            
            // Add to history
            const historyItem = {
                date: new Date().toLocaleString('ja-JP'),
                sender: 'testuser',
                status: '送信済',
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            
            let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(historyItem);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            reportForm.reset();
            sessionStorage.clear();
            disableEditFields();
            
            // Show success message
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // Reload history
            loadHistory();
        });
        
        // Load and display history
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.date}</span>
                        <span class="history-item-status">${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // Close modal when clicking outside
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.classList.remove('show');
            }
        });
        
        // Save form data on input change
        reportDateInput.addEventListener('change', saveFormData);
        departmentSelect.addEventListener('change', saveFormData);
        yesterdayTextarea.addEventListener('input', saveFormData);
        todayTextarea.addEventListener('input', saveFormData);
        issuesTextarea.addEventListener('input', saveFormData);
        
        init();
    </script>
</body>
</html>
