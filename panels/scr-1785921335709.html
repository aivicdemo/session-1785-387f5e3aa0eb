:root {
  --primary: #8b6f47;
  --primary-hover: #a0845a;
  --bg-main: #f5f1ed;
  --bg-card: #ede8e3;
  --bg-sidebar: #e8e3dd;
  --border: #d4ccc4;
  --text: #3e3b38;
  --text-muted: #8b8680;
  --top-bar-bg: #e0d9d0;
  --top-bar-border: #d0c8bf;

  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;

  --radius-card: 6px;
  --radius-control: 4px;
  --border-width: 1px;
  --control-height: 36px;
  --space-unit: 8px;

  --shadow-card: 0 2px 8px rgba(62, 59, 56, 0.08), 0 1px 3px rgba(62, 59, 56, 0.04);

  --motion-duration: 200ms;

  --surface-texture: 
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 2px,
      rgba(139, 111, 71, 0.02) 2px,
      rgba(139, 111, 71, 0.02) 4px
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(139, 111, 71, 0.01) 1px,
      rgba(139, 111, 71, 0.01) 2px
    );
  --surface-texture-size: 100% 100%;
  --surface-texture-position: 0 0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  color: var(--text);
  background: var(--bg-main);
}

body {
  display: flex;
  flex-direction: column;
}

.shell-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.header {

}

.header-left {

  font-weight: 600;

}

.header-brand {
  color: var(--primary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;

  justify-content: center;
  font-size: 13px;
  font-weight: 600;

.user-name {

  color: var(--text);
  font-weight: 500;
}

.logout-link {

  text-decoration: none;
  border: var(--border-width) solid var(--border);
  padding: 4px 8px;
  border-radius: var(--radius-control);
  transition: background var(--motion-duration);
}

.logout-link:hover {
  background: rgba(139, 111, 71, 0.08);
}

.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 64px;
}

.nav-bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: var(--border-width) solid var(--border);
  display: flex;
  justify-content: space-around;
  height: 64px;
  z-index: 100;
  flex-shrink: 0;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  transition: color var(--motion-duration);
  border-top: 3px solid transparent;
}

.nav-item:hover {
  color: var(--text);
}

.nav-item.aivic-active {
  color: var(--primary);
  border-top-color: var(--primary);
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
}

[data-aivic-panel] {
  display: block;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.form-control {
  width: 100%;
  padding: 8px 12px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  font-family: var(--font-family);
  font-size: 13px;
  color: var(--text);
  background: white;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(139, 111, 71, 0.1);
}

textarea.form-control {
  resize: vertical;
  min-height: 80px;
}

.button-group {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.btn {
  padding: 8px 16px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  background: white;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--motion-duration);
}

.btn:hover {
  background: var(--bg-card);
}

.btn-primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.dialog {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.dialog.visible {
  display: flex;
}

.dialog-content {
  background: white;
  border-radius: var(--radius-card);
  padding: 24px;
  max-width: 500px;
  width: 90%;
  box-shadow: var(--shadow-card);
}

.dialog-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

.dialog-body {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 16px;
  line-height: 1.6;
}

.dialog-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.history-list {
  margin-top: 24px;
  border-top: var(--border-width) solid var(--border);
  padding-top: 16px;
}

.history-item {
  padding: 12px;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-control);
  margin-bottom: 8px;
  background: var(--bg-card);
  font-size: 12px;
}

.history-item-title {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.history-item-content {
  color: var(--text-muted);
  line-height: 1.5;
}

.panel-container {
  padding: 16px;
  max-width: 800px;
  margin: 0 auto;
}

derEmailValue\"></span></p><p id=\"confirm-manager-email\">部長: <span id=\"managerEmailValue\"></span></p></div><div class=\"dialog-footer\"><button type=\"button\" class=\"btn\" id=\"cancelBtn\">キャンセル</button><button type=\"button\" class=\"btn btn-primary\" id=\"confirm-submit-button\">確認</button></div></div></div><div id=\"submit-success-dialog\" class=\"dialog\"><div class=\"dialog-content\"><div class=\"dialog-title\">送信完了</div><div class=\"dialog-body\"><p>日報が送信されました。</p></div><div class=\"dialog-footer\"><button type=\"button\" class=\"btn btn-primary\" id=\"successCloseBtn\">閉じる</button></div></div></div><div id=\"error-dialog\" class=\"dialog\"><div class=\"dialog-content\"><div class=\"dialog-title\">エラー</div><div class=\"dialog-body\"><p id=\"error-message\"></p></div><div class=\"dialog-footer\"><button type=\"button\" class=\"btn btn-primary\" id=\"errorCloseBtn\">閉じる</button></div></div></div>`;\n\n  container.innerHTML = panelHtml;\n\n  const form = document.getElementById('reportForm');\n  const draftSaveBtn = document.getElementById('draftSaveBtn');\n  const submitBtn = document.getElementById('submitBtn');\n  const confirmDialog = document.getElementById('submit-confirm-dialog');\n  const successDialog = document.getElementById('submit-success-dialog');\n  const errorDialog = document.getElementById('error-dialog');\n  const confirmSubmitBtn = document.getElementById('confirm-submit-button');\n  const cancelBtn = document.getElementById('cancelBtn');\n  const successCloseBtn = document.getElementById('successCloseBtn');\n  const errorCloseBtn = document.getElementById('errorCloseBtn');\n  const senderEmailValue = document.getElementById('senderEmailValue');\n  const managerEmailValue = document.getElementById('managerEmailValue');\n  const historyContainer = document.getElementById('historyContainer');\n\n  // Initialize email display\n  senderEmailValue.textContent = currentUser.email;\n  managerEmailValue.textContent = departmentHead.email;\n\n  // Load saved form data from localStorage\n  function loadFormData() {\n    const saved = localStorage.getItem('reportFormData');\n    if (saved) {\n      const data = JSON.parse(saved);\n      Object.keys(data).forEach(key => {\n        const field = form.elements[key];\n        if (field) {\n          field.value = data[key];\n        }\n      });\n    }\n  }\n\n  // Save form data to localStorage\n  function saveFormData() {\n    const data = {};\n    const formElements = form.elements;\n    for (let i = 0; i < formElements.length; i++) {\n      const field = formElements[i];\n      if (field.name) {\n        data[field.name] = field.value;\n      }\n    }\n    localStorage.setItem('reportFormData', JSON.stringify(data));\n  }\n\n  // Load history from localStorage\n  function loadHistory() {\n    const saved = localStorage.getItem('reportHistory');\n    if (saved) {\n      const history = JSON.parse(saved);\n      historyData.push(...history);\n      renderHistory();\n    }\n  }\n\n  // Render history list\n  function renderHistory() {\n    historyContainer.innerHTML = '';\n    historyData.forEach(item => {\n      const historyItem = document.createElement('div');\n      historyItem.className = 'history-item';\n      historyItem.innerHTML = `\n        <div class=\"history-item-title\">送信日時: ${item.date}</div>\n        <div class=\"history-item-content\">\n          <p><strong>昨日の報告:</strong> ${item.yesterdayActivity}</p>\n          <p><strong>本日の予定:</strong> ${item.progressStatus}</p>\n          <p><strong>課題:</strong> ${item.issues}</p>\n        </div>\n      `;\n      historyContainer.appendChild(historyItem);\n    });\n  }\n\n  // Draft save button\n  draftSaveBtn.addEventListener('click', () => {\n    saveFormData();\n    alert('下書きが保存されました');\n  });\n\n  // Submit button\n  submitBtn.addEventListener('click', () => {\n    const yesterdayActivity = form.elements['yesterdayActivity'].value;\n    const progressStatus = form.elements['progressStatus'].value;\n    const issues = form.elements['issues'].value;\n\n    if (!yesterdayActivity || !progressStatus || !issues) {\n      alert('すべてのフィールドを入力してください');\n      return;\n    }\n\n    // Show confirm dialog\n    confirmDialog.classList.add('visible');\n  });\n\n  // Cancel button\n  cancelBtn.addEventListener('click', () => {\n    confirmDialog.classList.remove('visible');\n  });\n\n  // Confirm submit button\n  confirmSubmitBtn.addEventListener('click', () => {\n    const yesterdayActivity = form.elements['yesterdayActivity'].value;\n    const progressStatus = form.elements['progressStatus'].value;\n    const issues = form.elements['issues'].value;\n    const reportDate = form.elements['reportDate'].value || new Date().toISOString().split('T')[0];\n\n    // Add to history\n    const historyItem = {\n      date: new Date().toLocaleString('ja-JP'),\n      yesterdayActivity: yesterdayActivity,\n      progressStatus: progressStatus,\n      issues: issues,\n      reportDate: reportDate\n    };\n    historyData.push(historyItem);\n    localStorage.setItem('reportHistory', JSON.stringify(historyData));\n\n    // Close confirm dialog\n    confirmDialog.classList.remove('visible');\n\n    // Show success dialog\n    successDialog.classList.add('visible');\n\n    // Render updated history\n    renderHistory();\n\n    // Clear form\n    form.reset();\n    localStorage.removeItem('reportFormData');\n  });\n\n  // Success close button\n  successCloseBtn.addEventListener('click', () => {\n    successDialog.classList.remove('visible');\n  });\n\n  // Error close button\n  errorCloseBtn.addEventListener('click', () => {\n    errorDialog.classList.remove('visible');\n  });\n\n  // Initialize\n  loadFormData();\n  loadHistory();\n\n  // Auto-save form data on input\n  form.addEventListener('change', saveFormData);\n}";
