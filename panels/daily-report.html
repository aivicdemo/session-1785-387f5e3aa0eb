<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .required {
            color: #e74c3c;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background-color: #229954;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ecf0f1;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 14px;
        }
        .edit-button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reportDate">報告日付 <span class="required">*</span></label>
                        <input type="date" id="reportDate" name="reportDate" required>
                        <div class="error-message" id="dateError">報告日付を選択してください</div>
                    </div>
                    <div class="form-group">
                        <label for="department">部門 <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">-- 選択してください --</option>
                            <option value="営業部">営業部</option>
                            <option value="企画部">企画部</option>
                            <option value="技術部">技術部</option>
                            <option value="管理部">管理部</option>
                        </select>
                        <div class="error-message" id="departmentError">部門を選択してください</div>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="edit-button-group" id="editButtonGroup" style="display: none;">
                    <button type="button" class="btn-secondary" id="editButton">報告内容編集</button>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                        <div class="error-message" id="yesterdayError">昨日やったことを入力してください</div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="today">今日やること <span class="required">*</span></label>
                        <textarea id="today" name="today" placeholder="今日実施予定の業務内容を入力してください" disabled></textarea>
                        <div class="error-message" id="todayError">今日やることを入力してください</div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="issues">抱えている課題 <span class="required">*</span></label>
                        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                        <div class="error-message" id="issuesError">抱えている課題を入力してください</div>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="draftButton">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitButton">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #666;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelButton">キャンセル</button>
                <button type="button" class="btn-success" id="confirmButton">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        let currentUser = {
            id: 'testuser',
            email: 'testuser@example.com',
            name: 'テストユーザー',
            manager: '部長太郎',
            managerEmail: 'bucho@example.com'
        };
        
        // 初期化
        function initPage() {
            loadDraft();
            loadHistory();
            setupEventListeners();
        }
        
        // イベントリスナー設定
        function setupEventListeners() {
            const form = document.getElementById('reportForm');
            const draftButton = document.getElementById('draftButton');
            const editButton = document.getElementById('editButton');
            const submitButton = document.getElementById('submitButton');
            const confirmButton = document.getElementById('confirmButton');
            const cancelButton = document.getElementById('cancelButton');
            const reportDate = document.getElementById('reportDate');
            const department = document.getElementById('department');
            
            form.addEventListener('submit', handleSubmit);
            draftButton.addEventListener('click', handleDraft);
            editButton.addEventListener('click', handleEdit);
            confirmButton.addEventListener('click', handleConfirm);
            cancelButton.addEventListener('click', handleCancel);
            
            // 日付と部門の選択値を保持
            reportDate.addEventListener('change', () => {
                sessionStorage.setItem('reportDate', reportDate.value);
            });
            
            department.addEventListener('change', () => {
                sessionStorage.setItem('department', department.value);
            });
        }
        
        // 下書き保存
        function handleDraft(e) {
            e.preventDefault();
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;
            
            const draft = {
                yesterday,
                today,
                issues,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }
        
        // 下書き読み込み
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
            }
            
            // 日付と部門の保持値を復元
            const savedDate = sessionStorage.getItem('reportDate');
            if (savedDate) {
                document.getElementById('reportDate').value = savedDate;
            }
            
            const savedDept = sessionStorage.getItem('department');
            if (savedDept) {
                document.getElementById('department').value = savedDept;
            }
            
            // 初期状態では編集ボタンを表示
            if (draft) {
                document.getElementById('editButtonGroup').style.display = 'flex';
            }
        }
        
        // 編集ボタン
        function handleEdit(e) {
            e.preventDefault();
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editButtonGroup').style.display = 'none';
        }
        
        // フォーム送信
        function handleSubmit(e) {
            e.preventDefault();
            
            // バリデーション
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            
            let hasError = false;
            
            // エラーメッセージをクリア
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            }
            
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            }
            
            if (!yesterday) {
                document.getElementById('yesterdayError').classList.add('show');
                hasError = true;
            }
            
            if (!today) {
                document.getElementById('todayError').classList.add('show');
                hasError = true;
            }
            
            if (!issues) {
                document.getElementById('issuesError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) {
                return;
            }
            
            // 確認ダイアログを表示
            showConfirmDialog({
                yesterday,
                today,
                issues,
                reportDate,
                department
            });
        }
        
        // 確認ダイアログ表示
        function showConfirmDialog(data) {
            document.getElementById('confirmYesterday').textContent = data.yesterday.substring(0, 50) + (data.yesterday.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = data.today.substring(0, 50) + (data.today.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = data.issues.substring(0, 50) + (data.issues.length > 50 ? '...' : '');
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
            
            // データを一時保存
            sessionStorage.setItem('pendingReport', JSON.stringify(data));
            
            document.getElementById('confirmModal').classList.add('show');
        }
        
        // 確認ボタン
        function handleConfirm(e) {
            e.preventDefault();
            const data = JSON.parse(sessionStorage.getItem('pendingReport'));
            
            // 履歴に追加
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const newRecord = {
                id: Date.now(),
                timestamp: new Date().toLocaleString('ja-JP'),
                sender: currentUser.id,
                status: '送信済',
                yesterday: data.yesterday,
                today: data.today,
                issues: data.issues,
                reportDate: data.reportDate,
                department: data.department
            };
            
            history.unshift(newRecord);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // フォームをクリア
            document.getElementById('reportForm').reset();
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            document.getElementById('editButtonGroup').style.display = 'none';
            
            // 下書きを削除
            localStorage.removeItem('reportDraft');
            
            // ダイアログを閉じる
            document.getElementById('confirmModal').classList.remove('show');
            
            // 成功メッセージを表示
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
            
            // 履歴を再読み込み
            loadHistory();
            
            // セッションストレージをクリア
            sessionStorage.removeItem('pendingReport');
        }
        
        // キャンセルボタン
        function handleCancel(e) {
            e.preventDefault();
            document.getElementById('confirmModal').classList.remove('show');
            sessionStorage.removeItem('pendingReport');
        }
        
        // 履歴読み込み
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = history.map(record => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div class="history-item-date">${record.timestamp}</div>
                        <div class="history-item-status">${record.status}</div>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${record.yesterday}</p>
                        <p><strong>今日やること:</strong> ${record.today}</p>
                        <p><strong>抱えている課題:</strong> ${record.issues}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // ページ読み込み時に初期化
        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
