<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
        .user-info p {
            margin: 5px 0;
        }
        .logout-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .deadline-section p {
            color: #856404;
            font-size: 16px;
            font-weight: 600;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table th {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #ddd;
        }
        .summary-table td {
            padding: 15px;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        .summary-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .summary-table tr:hover {
            background-color: #f0f0f0;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #17a2b8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            background-color: #138496;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            <div class="user-info">
                <p>ユーザー: <span id="username">-</span></p>
                <p>部門: <span id="department">-</span></p>
                <button class="logout-btn" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="deadline-section">
            <h2>提出期限</h2>
            <p id="deadlineText">本日 18:00 までに提出してください</p>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td>営業部</td>
                        <td>8</td>
                        <td>2</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td>6</td>
                        <td>1</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 85.7%;">85.7%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td>10</td>
                        <td>0</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 100%;">100%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td>5</td>
                        <td>2</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 71.4%;">71.4%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="./daily-report.html" class="back-link">日報入力・送信へ戻る</a>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            initializePage();
        });

        function initializePage() {
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
            if (!userInfo.userId) {
                window.location.href = './login.html';
                return;
            }

            document.getElementById('username').textContent = userInfo.userId;
            document.getElementById('department').textContent = userInfo.department || '-';

            // 提出期限を設定
            const today = new Date();
            const deadline = new Date(today);
            deadline.setHours(18, 0, 0, 0);
            const formattedDeadline = deadline.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('deadlineText').textContent = `${formattedDeadline} までに提出してください`;
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
