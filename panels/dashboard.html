<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th {
      background-color: #f8f9fa;
      color: #333;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #dee2e6;
      font-size: 14px;
    }
    .summary-table td {
      padding: 12px;
      border-bottom: 1px solid #dee2e6;
      font-size: 14px;
      color: #666;
    }
    .summary-table tr:hover {
      background-color: #f9f9f9;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .nav-button:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>

    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadlineText">本日 17:00 まで</div>
    </div>

    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td colspan="5" style="text-align: center; color: #999;">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <a href="./report-input.html" class="nav-button">日報入力・送信へ</a>
  </div>

  <script>
    async function loadSummary() {
      try {
        const response = await fetch('/api/summary');
        if (response.ok) {
          const summary = await response.json();
          const tbody = document.getElementById('summaryTableBody');
          tbody.innerHTML = '';

          if (summary && summary.departments && summary.departments.length > 0) {
            summary.departments.forEach(dept => {
              const total = dept.submitted + dept.notSubmitted;
              const rate = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${dept.name}</td>
                <td>${dept.submitted}</td>
                <td>${dept.notSubmitted}</td>
                <td>${rate}%</td>
                <td>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                  </div>
                </td>
              `;
              tbody.appendChild(row);
            });
          } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">データがありません</td></tr>';
          }
        }
      } catch (error) {
        console.error('Error loading summary:', error);
        const tbody = document.getElementById('summaryTableBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">読み込みに失敗しました</td></tr>';
      }
    }

    // Set deadline
    const today = new Date();
    const deadlineText = document.getElementById('deadlineText');
    deadlineText.textContent = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 17:00 まで`;

    loadSummary();
  </script>
</body>
</html>
