<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: bold;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
      font-weight: 600;
      border-bottom: 2px solid #dee2e6;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    .nav-link:hover {
      background-color: #0056b3;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <a href="./daily-report.html" class="nav-link">日報を入力・送信する</a>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadline">2024年12月31日 17:00</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table>
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryTable">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>6</td>
            <td>1</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 85.7%;">85.7%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>10</td>
            <td>0</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 100%;">100%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>5</td>
            <td>2</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 71.4%;">71.4%</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 提出期限を動的に設定（例：7日後）
      const deadline = new Date();
      deadline.setDate(deadline.getDate() + 7);
      deadline.setHours(17, 0, 0, 0);
      
      const deadlineText = deadline.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      document.getElementById('deadline').textContent = deadlineText;
    });
  </script>
</body>
</html>
