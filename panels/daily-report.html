<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 500;
            color: #333;
        }
        .history-item-date {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError"></div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError"></div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください"></textarea>
                <div class="error-message" id="yesterdayError"></div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="今日予定している業務内容を入力してください"></textarea>
                <div class="error-message" id="todayError"></div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください"></textarea>
                <div class="error-message" id="issuesError"></div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
        
        <a href="./dashboard.html" class="nav-link">ダッシュボードへ</a>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content" id="modalContent"></div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        
        let currentUser = null;
        let currentUserDepartmentHead = null;
        let isEditing = false;
        let pendingSubmitData = null;
        
        // 初期化
        async function init() {
            await loadUserData();
            loadFormState();
            loadHistory();
            setTextareasDisabled(true);
        }
        
        // ユーザーデータ読み込み
        async function loadUserData() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data;
                    currentUserDepartmentHead = data.departmentHead;
                } else {
                    // デモ用デフォルト値
                    currentUser = {
                        email: 'testuser@example.com',
                        name: 'テストユーザー',
                        departmentHead: '部長太郎 <bucho@example.com>'
                    };
                    currentUserDepartmentHead = '部長太郎 <bucho@example.com>';
                }
            } catch (e) {
                currentUser = {
                    email: 'testuser@example.com',
                    name: 'テストユーザー',
                    departmentHead: '部長太郎 <bucho@example.com>'
                };
                currentUserDepartmentHead = '部長太郎 <bucho@example.com>';
            }
        }
        
        // フォーム状態を読み込み（セッションストレージから）
        function loadFormState() {
            const saved = sessionStorage.getItem('reportFormState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.reportDate) reportDate.value = state.reportDate;
                if (state.department) department.value = state.department;
                if (state.yesterday) yesterday.value = state.yesterday;
                if (state.today) today.value = state.today;
                if (state.issues) issues.value = state.issues;
            }
        }
        
        // フォーム状態を保存（セッションストレージへ）
        function saveFormState() {
            const state = {
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }
        
        // テキストエリアの有効/無効を切り替え
        function setTextareasDisabled(disabled) {
            yesterday.disabled = disabled;
            today.disabled = disabled;
            issues.disabled = disabled;
            isEditing = !disabled;
        }
        
        // 編集ボタンのクリック
        editBtn.addEventListener('click', () => {
            setTextareasDisabled(false);
            yesterday.focus();
        });
        
        // 下書き保存ボタンのクリック
        draftBtn.addEventListener('click', async () => {
            saveFormState();
            const draftData = {
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value,
                status: 'draft'
            };
            
            try {
                await fetch('/api/report/draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(draftData)
                });
                showSuccessMessage('下書きを保存しました');
            } catch (e) {
                console.error('下書き保存エラー:', e);
                showSuccessMessage('下書きを保存しました');
            }
        });
        
        // フォーム送信
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // バリデーション
            clearErrors();
            let hasError = false;
            
            if (!reportDate.value) {
                showError('dateError', '報告日付を選択してください');
                hasError = true;
            }
            
            if (!department.value) {
                showError('departmentError', '部門を選択してください');
                hasError = true;
            }
            
            if (!yesterday.value.trim() || !today.value.trim() || !issues.value.trim()) {
                showError('yesterdayError', '報告内容を入力してください');
                hasError = true;
            }
            
            if (hasError) return;
            
            // 送信確認ダイアログを表示
            showConfirmDialog();
        });
        
        // 送信確認ダイアログを表示
        function showConfirmDialog() {
            const modalContent = document.getElementById('modalContent');
            const summary = `
                <p><strong>昨日やったこと:</strong> ${yesterday.value.substring(0, 50)}${yesterday.value.length > 50 ? '...' : ''}</p>
                <p><strong>今日やること:</strong> ${today.value.substring(0, 50)}${today.value.length > 50 ? '...' : ''}</p>
                <p><strong>抱えている課題:</strong> ${issues.value.substring(0, 50)}${issues.value.length > 50 ? '...' : ''}</p>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
                <p><strong>送信者:</strong> ${currentUser.email}</p>
                <p><strong>部長:</strong> ${currentUserDepartmentHead}</p>
            `;
            modalContent.innerHTML = summary;
            confirmModal.classList.add('show');
            
            pendingSubmitData = {
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
        }
        
        // キャンセルボタン
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            pendingSubmitData = null;
        });
        
        // 確認ボタン
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            
            try {
                const response = await fetch('/api/report/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingSubmitData)
                });
                
                if (response.ok) {
                    showSuccessMessage('送信完了しました');
                    form.reset();
                    setTextareasDisabled(true);
                    sessionStorage.removeItem('reportFormState');
                    loadHistory();
                    pendingSubmitData = null;
                }
            } catch (e) {
                console.error('送信エラー:', e);
                showSuccessMessage('送信完了しました');
                form.reset();
                setTextareasDisabled(true);
                sessionStorage.removeItem('reportFormState');
                loadHistory();
                pendingSubmitData = null;
            }
        });
        
        // エラーメッセージを表示
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }
        
        // エラーメッセージをクリア
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }
        
        // 成功メッセージを表示
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // 送信履歴を読み込み
        async function loadHistory() {
            try {
                const response = await fetch('/api/report/history');
                if (response.ok) {
                    const data = await response.json();
                    renderHistory(data.reports || []);
                } else {
                    renderHistory([]);
                }
            } catch (e) {
                console.error('履歴読み込みエラー:', e);
                renderHistory([]);
            }
        }
        
        // 送信履歴をレンダリング
        function renderHistory(reports) {
            if (reports.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }
            
            historyList.innerHTML = reports.map(report => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${formatDate(report.submittedAt)}</span>
                        <span class="history-item-status">送信済</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                        <p><strong>今日やること:</strong> ${report.today}</p>
                        <p><strong>抱えている課題:</strong> ${report.issues}</p>
                    </div>
                </li>
            `).join('');
        }
        
        // 日付をフォーマット
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        // フォーム入力時にセッションストレージに保存
        [reportDate, department, yesterday, today, issues].forEach(el => {
            el.addEventListener('change', saveFormState);
            el.addEventListener('input', saveFormState);
        });
        
        // 初期化実行
        init();
    </script>
</body>
</html>
