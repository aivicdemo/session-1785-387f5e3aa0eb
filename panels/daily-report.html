<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #555;
            line-height: 1.6;
        }
        .modal-summary {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 13px;
        }
        .modal-summary-item {
            margin: 8px 0;
        }
        .modal-summary-label {
            font-weight: 600;
            color: #333;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .history-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください"></textarea>
                <div class="error-message" id="yesterdayError"></div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください"></textarea>
                <div class="error-message" id="todayError"></div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください"></textarea>
                <div class="error-message" id="issuesError"></div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>
    
    <!-- 送信確認ダイアログ -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <p>以下の内容で日報を送信します。よろしいですか？</p>
                <div class="modal-summary">
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">昨日やったこと:</span>
                        <span id="modalYesterday"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">今日やること:</span>
                        <span id="modalToday"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">抱えている課題:</span>
                        <span id="modalIssues"></span>
                    </div>
                </div>
                <div style="margin-top: 15px; font-size: 13px; color: #666;">
                    <p><strong>送信者:</strong> <span id="modalSender"></span></p>
                    <p><strong>送信先:</strong> <span id="modalRecipient"></span></p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || {
            id: 'user001',
            name: 'テストユーザー',
            email: 'testuser@example.com',
            departmentHead: '部長太郎',
            departmentHeadEmail: 'bucho@example.com'
        };
        
        // 初期化
        function initializeForm() {
            loadFormData();
            loadHistory();
            disableTextareas();
        }
        
        // フォームデータをセッションストレージから読み込み
        function loadFormData() {
            const savedData = JSON.parse(sessionStorage.getItem('reportFormData')) || {};
            
            if (savedData.reportDate) {
                document.getElementById('reportDate').value = savedData.reportDate;
            }
            if (savedData.department) {
                document.getElementById('department').value = savedData.department;
            }
            if (savedData.yesterday) {
                document.getElementById('yesterday').value = savedData.yesterday;
            }
            if (savedData.today) {
                document.getElementById('today').value = savedData.today;
            }
            if (savedData.issues) {
                document.getElementById('issues').value = savedData.issues;
            }
        }
        
        // テキストエリアを無効化（編集前）
        function disableTextareas() {
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
        }
        
        // テキストエリアを有効化（編集時）
        function enableTextareas() {
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
        }
        
        // 送信履歴を読み込み
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory')) || [];
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.date}</span>
                        <span class="history-item-status">送信済</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </li>
            `).join('');
        }
        
        // バリデーション
        function validateForm() {
            let isValid = true;
            
            // エラーメッセージをクリア
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            
            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterday && !today && !issues) {
                document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        // フォームデータを保存
        function saveFormData() {
            const formData = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            sessionStorage.setItem('reportFormData', JSON.stringify(formData));
        }
        
        // 下書き保存
        function saveDraft() {
            const formData = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(formData));
            alert('下書きを保存しました');
        }
        
        // 送信確認ダイアログを表示
        function showConfirmDialog() {
            if (!validateForm()) {
                return;
            }
            
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;
            
            document.getElementById('modalYesterday').textContent = yesterday.substring(0, 50) + (yesterday.length > 50 ? '...' : '');
            document.getElementById('modalToday').textContent = today.substring(0, 50) + (today.length > 50 ? '...' : '');
            document.getElementById('modalIssues').textContent = issues.substring(0, 50) + (issues.length > 50 ? '...' : '');
            document.getElementById('modalSender').textContent = currentUser.email;
            document.getElementById('modalRecipient').textContent = `${currentUser.departmentHead} <${currentUser.departmentHeadEmail}>`;
            
            document.getElementById('confirmModal').classList.add('show');
        }
        
        // 送信確認ダイアログを閉じる
        function closeConfirmDialog() {
            document.getElementById('confirmModal').classList.remove('show');
        }
        
        // 日報を送信
        function submitReport() {
            saveFormData();
            
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;
            
            const now = new Date();
            const dateStr = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            const historyItem = {
                date: dateStr,
                sender: currentUser.id,
                status: '送信済',
                yesterday: yesterday,
                today: today,
                issues: issues
            };
            
            const history = JSON.parse(localStorage.getItem('reportHistory')) || [];
            history.unshift(historyItem);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            closeConfirmDialog();
            
            // フォームをクリア
            document.getElementById('reportForm').reset();
            sessionStorage.removeItem('reportFormData');
            
            // 成功メッセージを表示
            document.getElementById('successMessage').classList.add('show');
            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('show');
            }, 3000);
            
            // 履歴を再読み込み
            loadHistory();
            disableTextareas();
        }
        
        // イベントリスナー
        document.getElementById('reportForm').addEventListener('submit', (e) => {
            e.preventDefault();
            showConfirmDialog();
        });
        
        document.getElementById('editBtn').addEventListener('click', () => {
            enableTextareas();
        });
        
        document.getElementById('draftBtn').addEventListener('click', () => {
            saveDraft();
        });
        
        document.getElementById('cancelBtn').addEventListener('click', () => {
            closeConfirmDialog();
        });
        
        document.getElementById('confirmBtn').addEventListener('click', () => {
            submitReport();
        });
        
        // フォーム入力時にセッションストレージに保存
        document.getElementById('reportDate').addEventListener('change', saveFormData);
        document.getElementById('department').addEventListener('change', saveFormData);
        document.getElementById('yesterday').addEventListener('input', saveFormData);
        document.getElementById('today').addEventListener('input', saveFormData);
        document.getElementById('issues').addEventListener('input', saveFormData);
        
        // ページ読み込み時に初期化
        window.addEventListener('load', initializeForm);
    </script>
</body>
</html>
