<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .nav-links a:hover {
            background-color: #e7f3ff;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            font-size: 16px;
            color: #856404;
            margin-bottom: 10px;
        }
        .deadline-section p {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table thead {
            background-color: #f8f9fa;
        }
        .summary-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            color: #666;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-high {
            background-color: #d4edda;
            color: #155724;
        }
        .status-medium {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-low {
            background-color: #f8d7da;
            color: #721c24;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            <div class="nav-links">
                <a href="./daily-report.html">日報入力</a>
                <a href="./login.html">ログアウト</a>
            </div>
        </div>

        <div class="deadline-section">
            <h2>提出期限</h2>
            <p id="deadlineText">2024年12月31日 17:00</p>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <!-- 動的に生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ダッシュボード初期化
        function initDashboard() {
            // 提出期限を表示
            const deadline = new Date('2024-12-31T17:00:00');
            const deadlineText = document.getElementById('deadlineText');
            deadlineText.textContent = deadline.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });

            // 部門別提出状況を表示
            const departments = [
                { name: '営業部', submitted: 8, total: 10 },
                { name: '企画部', submitted: 6, total: 8 },
                { name: '技術部', submitted: 9, total: 10 },
                { name: '管理部', submitted: 4, total: 5 }
            ];

            const tableBody = document.getElementById('summaryTableBody');
            tableBody.innerHTML = '';

            departments.forEach(dept => {
                const rate = Math.round((dept.submitted / dept.total) * 100);
                let statusClass = 'status-high';
                if (rate < 50) {
                    statusClass = 'status-low';
                } else if (rate < 80) {
                    statusClass = 'status-medium';
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${dept.name}</td>
                    <td>${dept.submitted}</td>
                    <td>${dept.total - dept.submitted}</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                        </div>
                    </td>
                    <td><span class="status-badge ${statusClass}">${rate >= 80 ? '良好' : rate >= 50 ? '注意' : '要確認'}</span></td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 初期化実行
        initDashboard();
    </script>
</body>
</html>
