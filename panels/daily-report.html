<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
    .history-item-content {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .empty-history {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    .edit-button-group {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信画面</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <div class="form-group">
      <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
      <input type="date" id="reportDate" required>
      <div class="error-message" id="dateError"></div>
    </div>
    
    <div class="form-group">
      <label for="department">部門 <span style="color: red;">*</span></label>
      <select id="department" required>
        <option value="">-- 選択してください --</option>
        <option value="営業部">営業部</option>
        <option value="企画部">企画部</option>
        <option value="技術部">技術部</option>
        <option value="管理部">管理部</option>
      </select>
      <div class="error-message" id="departmentError"></div>
    </div>
    
    <div class="form-group">
      <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
      <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
      <div class="error-message" id="yesterdayError"></div>
    </div>
    
    <div class="form-group">
      <label for="today">今日やること <span style="color: red;">*</span></label>
      <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
      <div class="error-message" id="todayError"></div>
    </div>
    
    <div class="form-group">
      <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
      <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
      <div class="error-message" id="issuesError"></div>
    </div>
    
    <div class="edit-button-group">
      <button class="btn-secondary" id="editButton" style="display: none;">報告内容編集ボタン</button>
    </div>
    
    <div class="button-group">
      <button class="btn-success" id="draftButton">下書き保存</button>
      <button class="btn-primary" id="submitButton">送信</button>
    </div>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="empty-history">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-buttons">
        <button class="btn-secondary" id="cancelButton">キャンセル</button>
        <button class="btn-primary" id="confirmButton">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    // ページロード時の初期化
    document.addEventListener('DOMContentLoaded', function() {
      loadDraft();
      loadHistory();
      setupEventListeners();
      updateEditButtonVisibility();
    });
    
    function setupEventListeners() {
      const reportDate = document.getElementById('reportDate');
      const department = document.getElementById('department');
      const yesterday = document.getElementById('yesterday');
      const today = document.getElementById('today');
      const issues = document.getElementById('issues');
      const editButton = document.getElementById('editButton');
      const draftButton = document.getElementById('draftButton');
      const submitButton = document.getElementById('submitButton');
      const confirmModal = document.getElementById('confirmModal');
      const cancelButton = document.getElementById('cancelButton');
      const confirmButton = document.getElementById('confirmButton');
      
      // 日付変更時にセッションストレージに保存
      reportDate.addEventListener('change', function() {
        sessionStorage.setItem('selectedDate', this.value);
      });
      
      // 部門変更時にセッションストレージに保存
      department.addEventListener('change', function() {
        sessionStorage.setItem('selectedDepartment', this.value);
      });
      
      // テキストエリア入力時にセッションストレージに保存
      yesterday.addEventListener('input', function() {
        sessionStorage.setItem('yesterdayText', this.value);
      });
      
      today.addEventListener('input', function() {
        sessionStorage.setItem('todayText', this.value);
      });
      
      issues.addEventListener('input', function() {
        sessionStorage.setItem('issuesText', this.value);
      });
      
      // 編集ボタン
      editButton.addEventListener('click', function() {
        yesterday.disabled = false;
        today.disabled = false;
        issues.disabled = false;
        editButton.style.display = 'none';
      });
      
      // 下書き保存ボタン
      draftButton.addEventListener('click', function() {
        saveDraft();
      });
      
      // 送信ボタン
      submitButton.addEventListener('click', function() {
        if (validateForm()) {
          showConfirmModal();
        }
      });
      
      // キャンセルボタン
      cancelButton.addEventListener('click', function() {
        confirmModal.classList.remove('show');
      });
      
      // 確認ボタン
      confirmButton.addEventListener('click', function() {
        sendReport();
        confirmModal.classList.remove('show');
      });
    }
    
    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        document.getElementById('yesterday').value = data.yesterday || '';
        document.getElementById('today').value = data.today || '';
        document.getElementById('issues').value = data.issues || '';
        document.getElementById('yesterday').disabled = false;
        document.getElementById('today').disabled = false;
        document.getElementById('issues').disabled = false;
        document.getElementById('editButton').style.display = 'none';
      } else {
        document.getElementById('editButton').style.display = 'inline-block';
      }
      
      // セッションストレージから復元
      const savedDate = sessionStorage.getItem('selectedDate');
      if (savedDate) {
        document.getElementById('reportDate').value = savedDate;
      }
      
      const savedDept = sessionStorage.getItem('selectedDepartment');
      if (savedDept) {
        document.getElementById('department').value = savedDept;
      }
      
      const savedYesterday = sessionStorage.getItem('yesterdayText');
      if (savedYesterday) {
        document.getElementById('yesterday').value = savedYesterday;
      }
      
      const savedToday = sessionStorage.getItem('todayText');
      if (savedToday) {
        document.getElementById('today').value = savedToday;
      }
      
      const savedIssues = sessionStorage.getItem('issuesText');
      if (savedIssues) {
        document.getElementById('issues').value = savedIssues;
      }
    }
    
    function saveDraft() {
      const draft = {
        yesterday: document.getElementById('yesterday').value,
        today: document.getElementById('today').value,
        issues: document.getElementById('issues').value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = '下書きを保存しました';
      successMsg.classList.add('show');
      setTimeout(() => {
        successMsg.classList.remove('show');
      }, 3000);
    }
    
    function validateForm() {
      let isValid = true;
      
      // エラーメッセージをクリア
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
      
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      if (!reportDate) {
        document.getElementById('dateError').textContent = '報告日付を選択してください';
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department) {
        document.getElementById('departmentError').textContent = '部門を選択してください';
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      if (!yesterday && !today && !issues) {
        document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
        document.getElementById('yesterdayError').classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    function showConfirmModal() {
      const yesterday = document.getElementById('yesterday').value;
      const today = document.getElementById('today').value;
      const issues = document.getElementById('issues').value;
      const userEmail = 'testuser@example.com';
      const bucho = '部長 <bucho@example.com>';
      
      const content = `
        <p><strong>昨日やったこと:</strong> ${yesterday.substring(0, 50)}${yesterday.length > 50 ? '...' : ''}</p>
        <p><strong>今日やること:</strong> ${today.substring(0, 50)}${today.length > 50 ? '...' : ''}</p>
        <p><strong>抱えている課題:</strong> ${issues.substring(0, 50)}${issues.length > 50 ? '...' : ''}</p>
        <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
        <p><strong>送信者:</strong> ${userEmail}</p>
        <p><strong>部長:</strong> ${bucho}</p>
      `;
      
      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('confirmModal').classList.add('show');
    }
    
    function sendReport() {
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value;
      const today = document.getElementById('today').value;
      const issues = document.getElementById('issues').value;
      
      // 履歴に追加
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      const now = new Date();
      const timestamp = now.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      history.unshift({
        timestamp: timestamp,
        date: reportDate,
        department: department,
        yesterday: yesterday,
        today: today,
        issues: issues,
        status: '送信済'
      });
      
      localStorage.setItem('reportHistory', JSON.stringify(history));
      
      // フォームをクリア
      document.getElementById('yesterday').value = '';
      document.getElementById('today').value = '';
      document.getElementById('issues').value = '';
      document.getElementById('reportDate').value = '';
      document.getElementById('department').value = '';
      
      // セッションストレージもクリア
      sessionStorage.removeItem('yesterdayText');
      sessionStorage.removeItem('todayText');
      sessionStorage.removeItem('issuesText');
      sessionStorage.removeItem('selectedDate');
      sessionStorage.removeItem('selectedDepartment');
      
      // ドラフトをクリア
      localStorage.removeItem('reportDraft');
      
      // 成功メッセージ表示
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = '送信完了しました';
      successMsg.classList.add('show');
      setTimeout(() => {
        successMsg.classList.remove('show');
      }, 3000);
      
      // 履歴を再読み込み
      loadHistory();
      updateEditButtonVisibility();
    }
    
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      const historyList = document.getElementById('historyList');
      
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">送信履歴はありません</div>';
        return;
      }
      
      historyList.innerHTML = history.map((item, index) => `
        <div class="history-item">
          <div class="history-item-header">
            <span><strong>送信日時:</strong> ${item.timestamp}</span>
            <span><strong>ステータス:</strong> ${item.status}</span>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
            <p><strong>今日やること:</strong> ${item.today}</p>
            <p><strong>抱えている課題:</strong> ${item.issues}</p>
          </div>
        </div>
      `).join('');
    }
    
    function updateEditButtonVisibility() {
      const draft = localStorage.getItem('reportDraft');
      const editButton = document.getElementById('editButton');
      const yesterday = document.getElementById('yesterday');
      const today = document.getElementById('today');
      const issues = document.getElementById('issues');
      
      if (draft && !yesterday.disabled) {
        editButton.style.display = 'none';
      } else if (!draft && yesterday.disabled) {
        editButton.style.display = 'inline-block';
      }
    }
  </script>
</body>
</html>
