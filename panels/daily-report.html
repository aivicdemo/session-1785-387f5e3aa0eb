<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }
        .history-item-content {
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError"></div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError"></div>
                </div>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="今日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError"></div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-success">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #555;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        
        let currentUser = null;
        let currentManager = null;
        let isEditMode = false;
        
        // Initialize
        async function init() {
            // Get current user from session/auth
            const userResponse = await fetch('/api/user');
            if (userResponse.ok) {
                const userData = await userResponse.json();
                currentUser = userData;
            } else {
                currentUser = { email: 'testuser@example.com', name: 'Test User' };
            }
            
            // Get manager info
            const managerResponse = await fetch('/api/manager');
            if (managerResponse.ok) {
                const managerData = await managerResponse.json();
                currentManager = managerData;
            } else {
                currentManager = { name: '部長', email: 'bucho@example.com' };
            }
            
            // Load saved draft
            loadDraft();
            
            // Load history
            loadHistory();
        }
        
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                reportDateInput.value = data.reportDate || '';
                departmentSelect.value = data.department || '';
                yesterdayTextarea.value = data.yesterday || '';
                todayTextarea.value = data.today || '';
                issuesTextarea.value = data.issues || '';
            }
        }
        
        function saveDraft() {
            const draft = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
        }
        
        function clearDraft() {
            localStorage.removeItem('reportDraft');
            yesterdayTextarea.value = '';
            todayTextarea.value = '';
            issuesTextarea.value = '';
        }
        
        async function loadHistory() {
            try {
                const response = await fetch('/api/report-history');
                if (response.ok) {
                    const history = await response.json();
                    displayHistory(history);
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }
        
        function displayHistory(history) {
            if (!history || history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <span>送信日時: ${formatDateTime(item.sentAt)}</span>
                        <span>ステータス: ${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday)}</p>
                        <p><strong>今日やること:</strong> ${escapeHtml(item.today)}</p>
                        <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues)}</p>
                    </div>
                </div>
            `).join('');
        }
        
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }
        
        function showError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + 'Error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
        }
        
        function validateForm() {
            clearErrors();
            let isValid = true;
            
            if (!reportDateInput.value) {
                showError('date', '報告日付を選択してください');
                isValid = false;
            }
            
            if (!departmentSelect.value) {
                showError('department', '部門を選択してください');
                isValid = false;
            }
            
            if (!yesterdayTextarea.value.trim()) {
                showError('yesterday', '昨日やったことを入力してください');
                isValid = false;
            }
            
            if (!todayTextarea.value.trim()) {
                showError('today', '今日やることを入力してください');
                isValid = false;
            }
            
            if (!issuesTextarea.value.trim()) {
                showError('issues', '抱えている課題を入力してください');
                isValid = false;
            }
            
            return isValid;
        }
        
        editBtn.addEventListener('click', () => {
            isEditMode = true;
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            editBtn.style.display = 'none';
        });
        
        draftBtn.addEventListener('click', () => {
            saveDraft();
            alert('下書きを保存しました');
        });
        
        reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            // Show confirmation modal
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value.substring(0, 100);
            document.getElementById('confirmToday').textContent = todayTextarea.value.substring(0, 100);
            document.getElementById('confirmIssues').textContent = issuesTextarea.value.substring(0, 100);
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = `${currentManager.name} <${currentManager.email}>`;
            
            confirmModal.classList.add('show');
        });
        
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            
            const reportData = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sentAt: new Date().toISOString(),
                status: '送信済'
            };
            
            try {
                const response = await fetch('/api/submit-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reportData)
                });
                
                if (response.ok) {
                    successMessage.textContent = '送信完了しました';
                    successMessage.classList.add('show');
                    
                    clearDraft();
                    clearErrors();
                    
                    // Reset form
                    reportForm.reset();
                    yesterdayTextarea.disabled = true;
                    todayTextarea.disabled = true;
                    issuesTextarea.disabled = true;
                    editBtn.style.display = 'inline-block';
                    isEditMode = false;
                    
                    // Reload history
                    await loadHistory();
                    
                    // Hide success message after 3 seconds
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 3000);
                } else {
                    alert('送信に失敗しました');
                }
            } catch (error) {
                console.error('Submit error:', error);
                alert('送信中にエラーが発生しました');
            }
        });
        
        // Initialize on page load
        init();
    </script>
</body>
</html>
