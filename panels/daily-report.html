<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-row.full {
      grid-template-columns: 1fr;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }
    .required {
      color: #e74c3c;
      margin-left: 4px;
    }
    input[type="date"],
    select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
    }
    textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #3498db;
      color: white;
    }
    .btn-primary:hover {
      background-color: #2980b9;
    }
    .btn-secondary {
      background-color: #95a5a6;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #7f8c8d;
    }
    .btn-success {
      background-color: #27ae60;
      color: white;
    }
    .btn-success:hover {
      background-color: #229954;
    }
    .error-message {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
      font-size: 14px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #ecf0f1;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      background-color: #f9f9f9;
      border: 1px solid #ecf0f1;
      border-radius: 4px;
      padding: 15px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-item-date {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .history-item-status {
      background-color: #27ae60;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-row">
          <div class="form-group">
            <label for="reportDate">報告日付 <span class="required">*</span></label>
            <input type="date" id="reportDate" name="reportDate" required>
            <div class="error-message" id="dateError">報告日付を選択してください</div>
          </div>
          <div class="form-group">
            <label for="department">部門 <span class="required">*</span></label>
            <select id="department" name="department" required>
              <option value="">選択してください</option>
              <option value="営業部">営業部</option>
              <option value="企画部">企画部</option>
              <option value="技術部">技術部</option>
              <option value="管理部">管理部</option>
            </select>
            <div class="error-message" id="departmentError">部門を選択してください</div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-row full">
          <div class="form-group">
            <label for="yesterday">昨日やったこと <span class="required">*</span></label>
            <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
            <div class="error-message" id="contentError">報告内容を入力してください</div>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label for="today">今日やること <span class="required">*</span></label>
            <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label for="issues">抱えている課題 <span class="required">*</span></label>
            <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>

    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content">
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday"></p>
        <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
        <p id="confirmToday"></p>
        <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
        <p id="confirmIssues"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="confirmSender"></p>
        <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
        <p id="confirmManager"></p>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-success">確認</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('reportForm');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyList = document.getElementById('historyList');
    
    const reportDateInput = document.getElementById('reportDate');
    const departmentSelect = document.getElementById('department');
    const yesterdayTextarea = document.getElementById('yesterday');
    const todayTextarea = document.getElementById('today');
    const issuesTextarea = document.getElementById('issues');

    let isEditMode = false;
    let history = [];
    let currentUser = null;
    let currentManager = null;

    // Initialize
    async function init() {
      await loadUserData();
      loadDraft();
      loadHistory();
      restoreFormState();
      updateEditMode();
    }

    async function loadUserData() {
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          const data = await response.json();
          currentUser = data;
          currentManager = data.manager || { name: '部長', email: 'manager@example.com' };
        }
      } catch (e) {
        currentUser = { email: 'testuser@example.com', name: 'テストユーザー' };
        currentManager = { name: '部長', email: 'bucho@example.com' };
      }
    }

    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        yesterdayTextarea.value = data.yesterday || '';
        todayTextarea.value = data.today || '';
        issuesTextarea.value = data.issues || '';
      }
    }

    function loadHistory() {
      const saved = localStorage.getItem('reportHistory');
      if (saved) {
        history = JSON.parse(saved);
      }
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-item-header">
            <div class="history-item-date">${formatDateTime(item.timestamp)}</div>
            <div class="history-item-status">送信済</div>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday)}</p>
            <p><strong>今日やること:</strong> ${escapeHtml(item.today)}</p>
            <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues)}</p>
          </div>
        </div>
      `).join('');
    }

    function formatDateTime(timestamp) {
      const date = new Date(timestamp);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function restoreFormState() {
      const state = sessionStorage.getItem('reportFormState');
      if (state) {
        const data = JSON.parse(state);
        reportDateInput.value = data.reportDate || '';
        departmentSelect.value = data.department || '';
      }
    }

    function saveFormState() {
      const state = {
        reportDate: reportDateInput.value,
        department: departmentSelect.value
      };
      sessionStorage.setItem('reportFormState', JSON.stringify(state));
    }

    function updateEditMode() {
      if (isEditMode) {
        yesterdayTextarea.disabled = false;
        todayTextarea.disabled = false;
        issuesTextarea.disabled = false;
        editBtn.textContent = '編集完了';
        editBtn.classList.remove('btn-secondary');
        editBtn.classList.add('btn-success');
      } else {
        yesterdayTextarea.disabled = true;
        todayTextarea.disabled = true;
        issuesTextarea.disabled = true;
        editBtn.textContent = '報告内容編集';
        editBtn.classList.remove('btn-success');
        editBtn.classList.add('btn-secondary');
      }
    }

    editBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isEditMode = !isEditMode;
      updateEditMode();
    });

    draftBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const draft = {
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearErrors();
      
      if (!validateForm()) {
        return;
      }

      showConfirmModal();
    });

    function validateForm() {
      let isValid = true;

      if (!reportDateInput.value) {
        showError('dateError');
        isValid = false;
      }

      if (!departmentSelect.value) {
        showError('departmentError');
        isValid = false;
      }

      const yesterday = yesterdayTextarea.value.trim();
      const today = todayTextarea.value.trim();
      const issues = issuesTextarea.value.trim();

      if (!yesterday && !today && !issues) {
        showError('contentError');
        isValid = false;
      }

      return isValid;
    }

    function showError(errorId) {
      const errorEl = document.getElementById(errorId);
      if (errorEl) {
        errorEl.classList.add('show');
      }
    }

    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
      });
    }

    function showConfirmModal() {
      document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value;
      document.getElementById('confirmToday').textContent = todayTextarea.value;
      document.getElementById('confirmIssues').textContent = issuesTextarea.value;
      document.getElementById('confirmSender').textContent = currentUser.email;
      document.getElementById('confirmManager').textContent = `${currentManager.name} <${currentManager.email}>`;
      confirmModal.classList.add('show');
    }

    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });

    confirmBtn.addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      
      const reportData = {
        reportDate: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value,
        timestamp: new Date().toISOString(),
        sender: currentUser.email
      };

      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reportData)
        });

        if (response.ok) {
          history.unshift(reportData);
          localStorage.setItem('reportHistory', JSON.stringify(history));
          localStorage.removeItem('reportDraft');
          
          yesterdayTextarea.value = '';
          todayTextarea.value = '';
          issuesTextarea.value = '';
          reportDateInput.value = '';
          departmentSelect.value = '';
          isEditMode = false;
          updateEditMode();
          
          successMessage.classList.add('show');
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 3000);
          
          renderHistory();
        }
      } catch (e) {
        history.unshift(reportData);
        localStorage.setItem('reportHistory', JSON.stringify(history));
        localStorage.removeItem('reportDraft');
        
        yesterdayTextarea.value = '';
        todayTextarea.value = '';
        issuesTextarea.value = '';
        reportDateInput.value = '';
        departmentSelect.value = '';
        isEditMode = false;
        updateEditMode();
        
        successMessage.classList.add('show');
        setTimeout(() => {
          successMessage.classList.remove('show');
        }, 3000);
        
        renderHistory();
      }
    });

    reportDateInput.addEventListener('change', saveFormState);
    departmentSelect.addEventListener('change', saveFormState);

    init();
  </script>
</body>
</html>
