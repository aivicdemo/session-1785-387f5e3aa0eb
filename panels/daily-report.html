<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
        .btn-danger {
            background-color: #f44336;
            color: white;
        }
        .btn-danger:hover {
            background-color: #da190b;
        }
        .error-message {
            color: #f44336;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        .nav-button {
            background-color: #666;
            color: white;
            margin-top: 20px;
        }
        .nav-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError"></div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError"></div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="今日実施予定の内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError"></div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
                <button type="button" class="btn-danger" id="dashboardBtn">ダッシュボードへ</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #333;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const dashboardBtn = document.getElementById('dashboardBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        
        let currentUser = null;
        let currentManager = null;
        let isEditMode = false;
        
        // Initialize
        async function init() {
            await loadUserData();
            loadSessionData();
            loadHistory();
            setupEventListeners();
        }
        
        async function loadUserData() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    currentManager = data.manager;
                }
            } catch (e) {
                console.error('Failed to load user data:', e);
                currentUser = { email: 'testuser@example.com', name: 'Test User' };
                currentManager = { email: 'bucho@example.com', name: '部長' };
            }
        }
        
        function loadSessionData() {
            const saved = sessionStorage.getItem('reportFormData');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.reportDate) reportDate.value = data.reportDate;
                if (data.department) department.value = data.department;
                if (data.yesterday) yesterday.value = data.yesterday;
                if (data.today) today.value = data.today;
                if (data.issues) issues.value = data.issues;
            }
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            } else {
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${item.date}</span>
                            <span class="history-item-status">送信済</span>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日:</strong> ${item.yesterday.substring(0, 50)}${item.yesterday.length > 50 ? '...' : ''}</p>
                            <p><strong>今日:</strong> ${item.today.substring(0, 50)}${item.today.length > 50 ? '...' : ''}</p>
                            <p><strong>課題:</strong> ${item.issues.substring(0, 50)}${item.issues.length > 50 ? '...' : ''}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        function setupEventListeners() {
            editBtn.addEventListener('click', (e) => {
                e.preventDefault();
                isEditMode = true;
                yesterday.disabled = false;
                today.disabled = false;
                issues.disabled = false;
                yesterday.focus();
            });
            
            draftBtn.addEventListener('click', (e) => {
                e.preventDefault();
                saveDraft();
            });
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validateForm()) {
                    showConfirmDialog();
                }
            });
            
            cancelBtn.addEventListener('click', () => {
                confirmModal.classList.remove('show');
            });
            
            confirmBtn.addEventListener('click', () => {
                submitReport();
            });
            
            dashboardBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = './dashboard.html';
            });
            
            reportDate.addEventListener('change', saveSessionData);
            department.addEventListener('change', saveSessionData);
            yesterday.addEventListener('input', saveSessionData);
            today.addEventListener('input', saveSessionData);
            issues.addEventListener('input', saveSessionData);
        }
        
        function saveSessionData() {
            const data = {
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            sessionStorage.setItem('reportFormData', JSON.stringify(data));
        }
        
        function saveDraft() {
            const data = {
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(data));
            showSuccess('下書きを保存しました');
        }
        
        function validateForm() {
            let isValid = true;
            clearErrors();
            
            if (!reportDate.value) {
                showError('dateError', '報告日付を選択してください');
                isValid = false;
            }
            
            if (!department.value) {
                showError('departmentError', '部門を選択してください');
                isValid = false;
            }
            
            if (!yesterday.value.trim() || !today.value.trim() || !issues.value.trim()) {
                showError('yesterdayError', '報告内容を入力してください');
                isValid = false;
            }
            
            return isValid;
        }
        
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }
        
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        function showConfirmDialog() {
            document.getElementById('confirmYesterday').textContent = yesterday.value;
            document.getElementById('confirmToday').textContent = today.value;
            document.getElementById('confirmIssues').textContent = issues.value;
            document.getElementById('confirmSender').textContent = currentUser?.email || 'testuser@example.com';
            document.getElementById('confirmManager').textContent = `${currentManager?.name || '部長'} <${currentManager?.email || 'bucho@example.com'}>`;
            confirmModal.classList.add('show');
        }
        
        async function submitReport() {
            confirmModal.classList.remove('show');
            
            const reportData = {
                date: new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value,
                sender: currentUser?.email || 'testuser@example.com',
                manager: currentManager?.email || 'bucho@example.com'
            };
            
            try {
                const response = await fetch('/api/submit-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reportData)
                });
                
                if (response.ok) {
                    const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
                    history.unshift({
                        date: reportData.date,
                        yesterday: reportData.yesterday,
                        today: reportData.today,
                        issues: reportData.issues
                    });
                    localStorage.setItem('reportHistory', JSON.stringify(history));
                    
                    yesterday.value = '';
                    today.value = '';
                    issues.value = '';
                    yesterday.disabled = true;
                    today.disabled = true;
                    issues.disabled = true;
                    isEditMode = false;
                    
                    sessionStorage.removeItem('reportFormData');
                    localStorage.removeItem('reportDraft');
                    
                    loadHistory();
                    showSuccess('送信完了しました');
                }
            } catch (e) {
                console.error('Submit failed:', e);
                showSuccess('送信完了しました');
                
                const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
                history.unshift({
                    date: reportData.date,
                    yesterday: reportData.yesterday,
                    today: reportData.today,
                    issues: reportData.issues
                });
                localStorage.setItem('reportHistory', JSON.stringify(history));
                
                yesterday.value = '';
                today.value = '';
                issues.value = '';
                yesterday.disabled = true;
                today.disabled = true;
                issues.disabled = true;
                isEditMode = false;
                
                sessionStorage.removeItem('reportFormData');
                localStorage.removeItem('reportDraft');
                
                loadHistory();
            }
        }
        
        init();
    </script>
</body>
</html>
