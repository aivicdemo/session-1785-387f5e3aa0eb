<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-label {
            font-weight: 600;
            color: #856404;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-time {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .nav-link:hover {
            background-color: #2980b9;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .summary-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 25px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table thead {
            background-color: #f9f9f9;
        }
        .summary-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
            color: #666;
            font-size: 14px;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .submission-rate {
            font-weight: 600;
            color: #27ae60;
        }
        .submission-rate.low {
            color: #e74c3c;
        }
        .submission-rate.medium {
            color: #f39c12;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .progress-fill.medium {
            background-color: #f39c12;
        }
        .progress-fill.low {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <div class="deadline-label">提出期限</div>
                <div class="deadline-time" id="deadlineTime">本日 17:00</div>
            </div>
            
            <a href="./daily-report.html" class="nav-link">日報を入力・送信する</a>
        </header>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>合計</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <!-- JavaScript で動的に生成 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // ダッシュボード初期化
        function initDashboard() {
            // 提出期限を設定
            const today = new Date();
            const deadline = new Date(today);
            deadline.setHours(17, 0, 0, 0);
            
            const deadlineTimeEl = document.getElementById('deadlineTime');
            deadlineTimeEl.textContent = `本日 ${deadline.getHours()}:${String(deadline.getMinutes()).padStart(2, '0')}`;
            
            // 部門別提出状況を生成
            generateSummary();
        }
        
        // 部門別提出状況を生成
        function generateSummary() {
            const departments = [
                { name: '営業部', total: 15, submitted: 12 },
                { name: '企画部', total: 10, submitted: 8 },
                { name: '技術部', total: 20, submitted: 18 },
                { name: '管理部', total: 8, submitted: 6 }
            ];
            
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = departments.map(dept => {
                const unsubmitted = dept.total - dept.submitted;
                const rate = Math.round((dept.submitted / dept.total) * 100);
                
                let rateClass = 'submission-rate';
                let progressClass = 'progress-fill';
                
                if (rate < 50) {
                    rateClass += ' low';
                    progressClass += ' low';
                } else if (rate < 80) {
                    rateClass += ' medium';
                    progressClass += ' medium';
                }
                
                return `
                    <tr>
                        <td><strong>${dept.name}</strong></td>
                        <td>${dept.submitted}</td>
                        <td>${unsubmitted}</td>
                        <td>${dept.total}</td>
                        <td><span class="${rateClass}">${rate}%</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="${progressClass}" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 初期化実行
        initDashboard();
    </script>
</body>
</html>
