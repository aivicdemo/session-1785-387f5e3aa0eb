<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 500;
            color: #333;
        }
        .history-item-date {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday"></p>
                <p><strong>今日やること:</strong></p>
                <p id="confirmToday"></p>
                <p><strong>抱えている課題:</strong></p>
                <p id="confirmIssues"></p>
                <p style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
                    <strong>送信者:</strong> <span id="confirmSender"></span>
                </p>
                <p>
                    <strong>部長:</strong> <span id="confirmDirector"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        
        let isEditMode = false;
        let currentUser = null;
        let currentDirector = null;
        
        // Initialize
        async function init() {
            // Get current user from session/localStorage
            const userStr = localStorage.getItem('currentUser');
            if (userStr) {
                currentUser = JSON.parse(userStr);
            }
            
            // Load draft data
            loadDraftData();
            
            // Load history
            loadHistory();
            
            // Set up event listeners
            editBtn.addEventListener('click', enableEditMode);
            draftBtn.addEventListener('click', saveDraft);
            reportForm.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', closeConfirmModal);
            confirmBtn.addEventListener('click', confirmSubmit);
            
            // Enable edit mode on input
            [yesterday, today, issues].forEach(field => {
                field.addEventListener('input', () => {
                    if (!isEditMode) {
                        enableEditMode();
                    }
                });
            });
        }
        
        function enableEditMode() {
            isEditMode = true;
            yesterday.disabled = false;
            today.disabled = false;
            issues.disabled = false;
            editBtn.style.display = 'none';
        }
        
        function loadDraftData() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                reportDate.value = data.date || '';
                department.value = data.department || '';
                yesterday.value = data.yesterday || '';
                today.value = data.today || '';
                issues.value = data.issues || '';
            }
        }
        
        function saveDraft() {
            const draft = {
                date: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }
        
        function validateForm() {
            let isValid = true;
            
            // Clear all error messages
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            if (!reportDate.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!department.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterday.value.trim() || !today.value.trim() || !issues.value.trim()) {
                if (!yesterday.value.trim()) {
                    document.getElementById('yesterdayError').classList.add('show');
                }
                if (!today.value.trim()) {
                    document.getElementById('todayError').classList.add('show');
                }
                if (!issues.value.trim()) {
                    document.getElementById('issuesError').classList.add('show');
                }
                isValid = false;
            }
            
            return isValid;
        }
        
        function handleSubmit(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            // Show confirm modal
            showConfirmModal();
        }
        
        function showConfirmModal() {
            document.getElementById('confirmYesterday').textContent = yesterday.value.substring(0, 50);
            document.getElementById('confirmToday').textContent = today.value.substring(0, 50);
            document.getElementById('confirmIssues').textContent = issues.value.substring(0, 50);
            
            if (currentUser) {
                document.getElementById('confirmSender').textContent = currentUser.email || 'testuser@example.com';
            }
            
            // Get director info (mock for now)
            document.getElementById('confirmDirector').textContent = '部長 <bucho@example.com>';
            
            confirmModal.classList.add('show');
        }
        
        function closeConfirmModal() {
            confirmModal.classList.remove('show');
        }
        
        function confirmSubmit() {
            // Save to history
            const historyItem = {
                date: new Date().toLocaleString('ja-JP'),
                sender: currentUser ? currentUser.id : 'user',
                status: '送信済',
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            
            let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(historyItem);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            yesterday.value = '';
            today.value = '';
            issues.value = '';
            yesterday.disabled = true;
            today.disabled = true;
            issues.disabled = true;
            editBtn.style.display = 'inline-block';
            isEditMode = false;
            
            // Clear draft
            localStorage.removeItem('reportDraft');
            
            // Close modal
            closeConfirmModal();
            
            // Show success message
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // Reload history
            loadHistory();
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            
            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.date}</span>
                        <span class="history-item-status">${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日:</strong> ${item.yesterday.substring(0, 50)}${item.yesterday.length > 50 ? '...' : ''}</p>
                        <p><strong>今日:</strong> ${item.today.substring(0, 50)}${item.today.length > 50 ? '...' : ''}</p>
                        <p><strong>課題:</strong> ${item.issues.substring(0, 50)}${item.issues.length > 50 ? '...' : ''}</p>
                    </div>
                </li>
            `).join('');
        }
        
        // Initialize on page load
        init();
    </script>
</body>
</html>
