<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-label {
            color: #856404;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-time {
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .summary-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <div class="deadline-label">提出期限</div>
                <div class="deadline-time" id="deadline">2024年1月31日 17:00</div>
            </div>
            
            <a href="./daily-report.html" class="nav-link">日報を入力・送信する →</a>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門</th>
                        <th>提出状況</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td>営業部</td>
                        <td><span class="status-badge status-submitted">提出済: 8/10</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td><span class="status-badge status-submitted">提出済: 5/6</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 83.33%;">83%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td><span class="status-badge status-pending">提出済: 6/8</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 75%;">75%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td><span class="status-badge status-submitted">提出済: 4/4</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 100%;">100%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        function initDashboard() {
            // Set deadline to tomorrow at 17:00
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(17, 0, 0, 0);
            
            const deadlineText = tomorrow.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            }).replace(/\//g, '年').replace(/(\d{2})年/, '$1月').replace(/(\d{2})月/, '$1日 ') + ':00';
            
            document.getElementById('deadline').textContent = deadlineText;
        }
        
        initDashboard();
    </script>
</body>
</html>
