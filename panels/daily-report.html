<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .history-item-date {
      color: #666;
      font-weight: 500;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .empty-message {
      color: #999;
      text-align: center;
      padding: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate">
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" name="department">
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" name="yesterday" placeholder="昨日の活動内容を入力してください"></textarea>
          <div class="error-message" id="contentError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" name="today" placeholder="今日の予定を入力してください"></textarea>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" name="issues" placeholder="現在の課題を入力してください"></textarea>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-success" id="draftBtn">下書き保存</button>
        <button type="submit" class="btn-primary" id="submitBtn">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="empty-message">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent">
        <!-- 動的に生成 -->
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-primary" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('reportForm');
    const reportDate = document.getElementById('reportDate');
    const department = document.getElementById('department');
    const yesterday = document.getElementById('yesterday');
    const today = document.getElementById('today');
    const issues = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyList = document.getElementById('historyList');
    
    let isEditing = false;
    let history = [];
    let currentUser = { email: 'testuser@example.com', name: 'Test User', bucho: 'bucho@example.com', buchoName: '部長' };
    
    // 初期化
    function init() {
      loadDraft();
      loadHistory();
      restoreFormState();
      disableTextareas();
    }
    
    // フォーム状態を復元
    function restoreFormState() {
      const saved = sessionStorage.getItem('reportFormState');
      if (saved) {
        const state = JSON.parse(saved);
        if (state.reportDate) reportDate.value = state.reportDate;
        if (state.department) department.value = state.department;
      }
    }
    
    // フォーム状態を保存
    function saveFormState() {
      const state = {
        reportDate: reportDate.value,
        department: department.value
      };
      sessionStorage.setItem('reportFormState', JSON.stringify(state));
    }
    
    // テキストエリアを無効化
    function disableTextareas() {
      yesterday.disabled = true;
      today.disabled = true;
      issues.disabled = true;
      isEditing = false;
      editBtn.textContent = '報告内容編集';
    }
    
    // テキストエリアを有効化
    function enableTextareas() {
      yesterday.disabled = false;
      today.disabled = false;
      issues.disabled = false;
      isEditing = true;
      editBtn.textContent = '編集完了';
    }
    
    // 下書きを保存
    function saveDraft() {
      const draft = {
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    // 下書きを読み込み
    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        yesterday.value = data.yesterday || '';
        today.value = data.today || '';
        issues.value = data.issues || '';
      }
    }
    
    // 履歴を読み込み
    function loadHistory() {
      const saved = localStorage.getItem('reportHistory');
      history = saved ? JSON.parse(saved) : [];
      renderHistory();
    }
    
    // 履歴を表示
    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-message">送信履歴はありません</div>';
        return;
      }
      
      historyList.innerHTML = history.map((item, idx) => `
        <div class="history-item">
          <div class="history-item-header">
            <span class="history-item-date">${item.timestamp}</span>
            <span class="history-item-status">送信済</span>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
            <p><strong>今日やること:</strong> ${item.today}</p>
            <p><strong>抱えている課題:</strong> ${item.issues}</p>
          </div>
        </div>
      `).join('');
    }
    
    // バリデーション
    function validate() {
      let isValid = true;
      
      // エラーメッセージをクリア
      document.getElementById('dateError').classList.remove('show');
      document.getElementById('departmentError').classList.remove('show');
      document.getElementById('contentError').classList.remove('show');
      
      if (!reportDate.value) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department.value) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      if (!yesterday.value.trim() && !today.value.trim() && !issues.value.trim()) {
        document.getElementById('contentError').classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    // 編集ボタン
    editBtn.addEventListener('click', () => {
      if (isEditing) {
        disableTextareas();
      } else {
        enableTextareas();
      }
    });
    
    // 下書き保存ボタン
    draftBtn.addEventListener('click', (e) => {
      e.preventDefault();
      saveDraft();
    });
    
    // フォーム送信
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!validate()) {
        return;
      }
      
      saveFormState();
      showConfirmModal();
    });
    
    // 確認ダイアログを表示
    function showConfirmModal() {
      const content = `
        <p><strong>昨日やったこと:</strong></p>
        <p>${yesterday.value.substring(0, 50)}${yesterday.value.length > 50 ? '...' : ''}</p>
        <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
        <p>${today.value.substring(0, 50)}${today.value.length > 50 ? '...' : ''}</p>
        <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
        <p>${issues.value.substring(0, 50)}${issues.value.length > 50 ? '...' : ''}</p>
        <p style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
          <strong>送信者:</strong> ${currentUser.email}
        </p>
        <p>
          <strong>部長:</strong> ${currentUser.buchoName} &lt;${currentUser.bucho}&gt;
        </p>
      `;
      document.getElementById('modalContent').innerHTML = content;
      confirmModal.classList.add('show');
    }
    
    // キャンセルボタン
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    // 確認ボタン
    confirmBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
      
      // 履歴に追加
      const now = new Date();
      const timestamp = now.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      history.unshift({
        timestamp: timestamp,
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value,
        sender: currentUser.name
      });
      
      localStorage.setItem('reportHistory', JSON.stringify(history));
      renderHistory();
      
      // フォームをクリア
      yesterday.value = '';
      today.value = '';
      issues.value = '';
      disableTextareas();
      
      // 成功メッセージを表示
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      // 下書きをクリア
      localStorage.removeItem('reportDraft');
    });
    
    // 初期化
    init();
  </script>
</body>
</html>
