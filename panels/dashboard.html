<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th {
      background-color: #007bff;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #ddd;
    }
    .summary-table td {
      padding: 15px;
      border: 1px solid #ddd;
      color: #333;
    }
    .summary-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .summary-table tr:hover {
      background-color: #f0f0f0;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-complete {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #f8d7da;
      color: #721c24;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadline">本日 18:00 まで</div>
    </div>

    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>80%</td>
            <td><span class="status-badge status-complete">提出済</span></td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>5</td>
            <td>1</td>
            <td>83%</td>
            <td><span class="status-badge status-complete">提出済</span></td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>6</td>
            <td>3</td>
            <td>67%</td>
            <td><span class="status-badge status-pending">未提出</span></td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>4</td>
            <td>0</td>
            <td>100%</td>
            <td><span class="status-badge status-complete">提出済</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <a href="./daily-report.html" class="nav-button">日報入力・送信へ</a>
  </div>

  <script>
    // ダッシュボード初期化
    function initDashboard() {
      // 提出期限を動的に設定
      const deadline = document.getElementById('deadline');
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 18, 0, 0);
      
      if (now < today) {
        const timeLeft = Math.floor((today - now) / 1000 / 60);
        deadline.textContent = `本日 18:00 まで（残り ${timeLeft} 分）`;
      } else {
        deadline.textContent = '本日 18:00 を過ぎています';
      }
    }

    // ページ読み込み時に初期化
    initDashboard();
  </script>
</body>
</html>
