<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .user-info {
            font-size: 14px;
            color: #666;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .required {
            color: #dc3545;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .edit-button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <span id="userEmail">testuser@example.com</span>
            </div>
        </div>

        <div class="success-message" id="successMessage">送信完了しました</div>

        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span class="required">*</span></label>
                    <input type="date" id="reportDate" />
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                <div class="form-group">
                    <label for="department">部門 <span class="required">*</span></label>
                    <select id="department">
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                    <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください"></textarea>
                    <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label for="today">今日やること <span class="required">*</span></label>
                    <textarea id="today" placeholder="本日予定している業務内容を入力してください"></textarea>
                    <div class="error-message" id="todayError">報告内容を入力してください</div>
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label for="issues">抱えている課題 <span class="required">*</span></label>
                    <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください"></textarea>
                    <div class="error-message" id="issuesError">報告内容を入力してください</div>
                </div>
            </div>
        </div>

        <div class="edit-button-group">
            <button class="btn-secondary" id="editButton" style="display:none;">報告内容編集</button>
            <button class="btn-success" id="draftButton">下書き保存</button>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="submitButton">送信</button>
        </div>

        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager"></p>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" id="cancelButton">キャンセル</button>
                <button class="btn-primary" id="confirmButton">確認</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        const submitButton = document.getElementById('submitButton');
        const draftButton = document.getElementById('draftButton');
        const editButton = document.getElementById('editButton');
        const confirmModal = document.getElementById('confirmModal');
        const cancelButton = document.getElementById('cancelButton');
        const confirmButton = document.getElementById('confirmButton');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        const userEmail = document.getElementById('userEmail');

        // Load saved data from sessionStorage
        function loadSessionData() {
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDepartment = sessionStorage.getItem('department');
            if (savedDate) reportDateInput.value = savedDate;
            if (savedDepartment) departmentSelect.value = savedDepartment;
        }

        // Load draft data from localStorage
        function loadDraftData() {
            const draft = localStorage.getItem('dailyReportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                yesterdayTextarea.value = data.yesterday || '';
                todayTextarea.value = data.today || '';
                issuesTextarea.value = data.issues || '';
                yesterdayTextarea.disabled = true;
                todayTextarea.disabled = true;
                issuesTextarea.disabled = true;
                editButton.style.display = 'inline-block';
            }
        }

        // Load history from localStorage
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('dailyReportHistory') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            } else {
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${item.date}</span>
                            <span class="history-item-status">送信済</span>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日:</strong> ${item.yesterday.substring(0, 50)}${item.yesterday.length > 50 ? '...' : ''}</p>
                            <p><strong>今日:</strong> ${item.today.substring(0, 50)}${item.today.length > 50 ? '...' : ''}</p>
                            <p><strong>課題:</strong> ${item.issues.substring(0, 50)}${item.issues.length > 50 ? '...' : ''}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Save to sessionStorage on input
        reportDateInput.addEventListener('change', () => {
            sessionStorage.setItem('reportDate', reportDateInput.value);
        });

        departmentSelect.addEventListener('change', () => {
            sessionStorage.setItem('department', departmentSelect.value);
        });

        // Edit button
        editButton.addEventListener('click', () => {
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            editButton.style.display = 'none';
        });

        // Draft save
        draftButton.addEventListener('click', () => {
            const draft = {
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem('dailyReportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            editButton.style.display = 'inline-block';
        });

        // Validation
        function validateForm() {
            let isValid = true;
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));

            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            if (!yesterdayTextarea.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            if (!todayTextarea.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            if (!issuesTextarea.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            return isValid;
        }

        // Submit button
        submitButton.addEventListener('click', () => {
            if (!validateForm()) return;

            // Show confirmation modal
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value;
            document.getElementById('confirmToday').textContent = todayTextarea.value;
            document.getElementById('confirmIssues').textContent = issuesTextarea.value;
            document.getElementById('confirmSender').textContent = userEmail.textContent;
            document.getElementById('confirmManager').textContent = 'Manager <manager@example.com>';
            confirmModal.classList.add('show');
        });

        // Cancel button
        cancelButton.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });

        // Confirm button
        confirmButton.addEventListener('click', () => {
            confirmModal.classList.remove('show');

            // Add to history
            const now = new Date();
            const dateStr = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const history = JSON.parse(localStorage.getItem('dailyReportHistory') || '[]');
            history.unshift({
                date: dateStr,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: userEmail.textContent
            });
            localStorage.setItem('dailyReportHistory', JSON.stringify(history));

            // Clear form
            yesterdayTextarea.value = '';
            todayTextarea.value = '';
            issuesTextarea.value = '';
            localStorage.removeItem('dailyReportDraft');
            editButton.style.display = 'none';
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;

            // Show success message
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);

            // Reload history
            loadHistory();
        });

        // Initialize on page load
        loadSessionData();
        loadDraftData();
        loadHistory();
    </script>
</body>
</html>
