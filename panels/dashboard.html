<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deadline-text {
            color: #856404;
            font-size: 18px;
            font-weight: bold;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .summary-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadlineText">本日 17:00</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="nav-link">日報入力・送信へ</a>
    </div>
    
    <script>
        async function init() {
            await loadDashboardData();
        }
        
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                if (response.ok) {
                    const data = await response.json();
                    renderDashboard(data);
                } else {
                    renderDashboard(getDefaultDashboardData());
                }
            } catch (e) {
                console.error('ダッシュボード読み込みエラー:', e);
                renderDashboard(getDefaultDashboardData());
            }
        }
        
        function getDefaultDashboardData() {
            return {
                deadline: '本日 17:00',
                departments: [
                    { name: '営業部', submitted: 8, total: 10 },
                    { name: '企画部', submitted: 6, total: 8 },
                    { name: '技術部', submitted: 12, total: 15 },
                    { name: '管理部', submitted: 4, total: 5 }
                ]
            };
        }
        
        function renderDashboard(data) {
            // 提出期限を表示
            document.getElementById('deadlineText').textContent = data.deadline || '本日 17:00';
            
            // 部門別サマリーを表示
            const tbody = document.getElementById('summaryTableBody');
            if (data.departments && data.departments.length > 0) {
                tbody.innerHTML = data.departments.map(dept => {
                    const rate = dept.total > 0 ? Math.round((dept.submitted / dept.total) * 100) : 0;
                    return `
                        <tr>
                            <td>${dept.name}</td>
                            <td>${dept.submitted}/${dept.total}</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999;">データがありません</td></tr>';
            }
        }
        
        init();
    </script>
</body>
</html>
