<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deadline-text {
            color: #856404;
            font-size: 18px;
            font-weight: 600;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table th {
            background-color: #f0f0f0;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            color: #666;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #2196F3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadline">本日 18:00</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="nav-link">日報入力・送信へ</a>
    </div>
    
    <script>
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                if (response.ok) {
                    const data = await response.json();
                    renderSummary(data.departments);
                }
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                renderSummary([
                    { name: '営業部', submitted: 8, total: 10 },
                    { name: '企画部', submitted: 6, total: 8 },
                    { name: '技術部', submitted: 9, total: 10 },
                    { name: '管理部', submitted: 4, total: 5 }
                ]);
            }
        }
        
        function renderSummary(departments) {
            const tbody = document.getElementById('summaryBody');
            tbody.innerHTML = departments.map(dept => {
                const rate = Math.round((dept.submitted / dept.total) * 100);
                return `
                    <tr>
                        <td>${dept.name}</td>
                        <td>${dept.submitted}/${dept.total}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // Set deadline
        function setDeadline() {
            const today = new Date();
            const deadline = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 18, 0, 0);
            const year = deadline.getFullYear();
            const month = String(deadline.getMonth() + 1).padStart(2, '0');
            const day = String(deadline.getDate()).padStart(2, '0');
            document.getElementById('deadline').textContent = `${year}年${month}月${day}日 18:00`;
        }
        
        // Initialize
        setDeadline();
        loadDashboardData();
    </script>
</body>
</html>
