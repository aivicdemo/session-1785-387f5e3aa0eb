<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .deadline-text {
      color: #856404;
      font-size: 16px;
      font-weight: 600;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th,
    .summary-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .summary-table th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #333;
    }
    .summary-table tr:hover {
      background-color: #f9f9f9;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./daily-report.html" class="nav-link">📝 日報入力・送信へ</a>
    
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text">毎日 17:00 までに提出してください</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td><span id="sales-count">0</span> / 10</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="sales-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>企画部</td>
            <td><span id="planning-count">0</span> / 8</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="planning-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>技術部</td>
            <td><span id="tech-count">0</span> / 12</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="tech-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>管理部</td>
            <td><span id="admin-count">0</span> / 5</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="admin-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <script>
    // ダッシュボード初期化
    function initDashboard() {
      // 部門別の提出状況を計算
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      
      const departments = {
        '営業部': { submitted: 0, total: 10 },
        '企画部': { submitted: 0, total: 8 },
        '技術部': { submitted: 0, total: 12 },
        '管理部': { submitted: 0, total: 5 }
      };
      
      // 履歴から提出済みをカウント
      history.forEach(item => {
        if (departments[item.department]) {
          departments[item.department].submitted++;
        }
      });
      
      // UI を更新
      updateDepartmentStatus('営業部', departments['営業部'].submitted, departments['営業部'].total, 'sales');
      updateDepartmentStatus('企画部', departments['企画部'].submitted, departments['企画部'].total, 'planning');
      updateDepartmentStatus('技術部', departments['技術部'].submitted, departments['技術部'].total, 'tech');
      updateDepartmentStatus('管理部', departments['管理部'].submitted, departments['管理部'].total, 'admin');
    }
    
    function updateDepartmentStatus(dept, submitted, total, prefix) {
      const percentage = Math.round((submitted / total) * 100);
      document.getElementById(prefix + '-count').textContent = submitted;
      const progressFill = document.getElementById(prefix + '-progress');
      progressFill.style.width = percentage + '%';
      progressFill.textContent = percentage + '%';
    }
    
    initDashboard();
  </script>
</body>
</html>
