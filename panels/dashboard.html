<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-label {
            font-weight: 600;
            color: #856404;
            font-size: 14px;
        }
        .deadline-value {
            font-size: 18px;
            color: #333;
            margin-top: 5px;
        }
        .nav-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .nav-link:hover {
            background-color: #1565c0;
        }
        .summary-section {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #f5f5f5;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .department-name {
            font-weight: 600;
            color: #333;
        }
        .submission-rate {
            font-weight: 600;
            color: #1976d2;
        }
        .submission-rate.high {
            color: #388e3c;
        }
        .submission-rate.low {
            color: #d32f2f;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background-color: #1976d2;
            transition: width 0.3s ease;
        }
        .progress-fill.high {
            background-color: #388e3c;
        }
        .progress-fill.low {
            background-color: #d32f2f;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <div class="deadline-label">提出期限</div>
                <div class="deadline-value" id="deadline">2024年12月31日 17:00</div>
            </div>
            
            <a href="./daily-report.html" class="nav-link">日報を入力・送信する</a>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td colspan="5" class="empty-state">データを読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/dashboard');
                if (response.ok) {
                    const data = await response.json();
                    renderDashboard(data);
                }
            } catch (e) {
                console.error('Failed to load dashboard data:', e);
                renderDashboard(getDefaultDashboardData());
            }
        }
        
        function getDefaultDashboardData() {
            return {
                deadline: '2024年12月31日 17:00',
                departments: [
                    { name: '営業部', submitted: 8, total: 10 },
                    { name: '企画部', submitted: 6, total: 8 },
                    { name: '技術部', submitted: 9, total: 10 },
                    { name: '管理部', submitted: 4, total: 5 }
                ]
            };
        }
        
        function renderDashboard(data) {
            // Set deadline
            document.getElementById('deadline').textContent = data.deadline || '2024年12月31日 17:00';
            
            // Render summary table
            const tbody = document.getElementById('summaryBody');
            if (!data.departments || data.departments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">データがありません</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.departments.map(dept => {
                const rate = Math.round((dept.submitted / dept.total) * 100);
                const rateClass = rate >= 80 ? 'high' : rate >= 50 ? '' : 'low';
                const fillClass = rate >= 80 ? 'high' : rate >= 50 ? '' : 'low';
                
                return `
                    <tr>
                        <td><span class="department-name">${escapeHtml(dept.name)}</span></td>
                        <td>${dept.submitted}</td>
                        <td>${dept.total - dept.submitted}</td>
                        <td><span class="submission-rate ${rateClass}">${rate}%</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill ${fillClass}" style="width: ${rate}%"></div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadDashboardData();
    </script>
</body>
</html>
