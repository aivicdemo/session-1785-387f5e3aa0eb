<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 15px;
    }
    .header h1 {
      font-size: 24px;
      color: #333;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
    }
    .nav-buttons a {
      padding: 8px 16px;
      background-color: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .nav-buttons a:hover {
      background-color: #5a6268;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .form-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }
    .form-section input[type="date"],
    .form-section select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-section input[type="date"]:focus,
    .form-section select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    .form-section textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    .form-section textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    .form-section textarea:disabled {
      background-color: #f0f0f0;
      cursor: not-allowed;
    }
    .form-section input[type="date"]:disabled,
    .form-section select:disabled {
      background-color: #f0f0f0;
      cursor: not-allowed;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      color: #28a745;
      font-size: 14px;
      margin-top: 5px;
      display: none;
      padding: 10px;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
    }
    .success-message.show {
      display: block;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      justify-content: center;
    }
    .button-group button {
      padding: 12px 24px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-weight: 600;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .btn-warning {
      background-color: #ffc107;
      color: #333;
    }
    .btn-warning:hover {
      background-color: #e0a800;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .modal-buttons .btn-confirm {
      background-color: #28a745;
      color: white;
    }
    .modal-buttons .btn-confirm:hover {
      background-color: #218838;
    }
    .modal-buttons .btn-cancel {
      background-color: #6c757d;
      color: white;
    }
    .modal-buttons .btn-cancel:hover {
      background-color: #5a6268;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #ddd;
    }
    .history-section h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #f9f9f9;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-item-date {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .history-item-status {
      display: inline-block;
      padding: 4px 12px;
      background-color: #28a745;
      color: white;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 8px;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .button-group {
        flex-direction: column;
      }
      .button-group button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>日報入力・送信</h1>
      <div class="nav-buttons">
        <a href="./dashboard.html">ダッシュボード</a>
        <a href="./login.html">ログアウト</a>
      </div>
    </div>

    <form id="reportForm">
      <div class="form-row">
        <div class="form-section">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate" required>
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
        <div class="form-section">
          <label for="department">部門</label>
          <select id="department" name="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>

      <div class="form-section">
        <label for="yesterday">昨日やったこと</label>
        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="yesterdayError">昨日やったことを入力してください</div>
      </div>

      <div class="form-section">
        <label for="today">今日やること</label>
        <textarea id="today" name="today" placeholder="今日予定している業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="todayError">今日やることを入力してください</div>
      </div>

      <div class="form-section">
        <label for="issues">抱えている課題</label>
        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
        <div class="error-message" id="issuesError">抱えている課題を入力してください</div>
      </div>

      <div class="success-message" id="successMessage">送信完了しました</div>

      <div class="button-group">
        <button type="button" id="editBtn" class="btn-warning">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>

    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content">
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday"></p>
        <p><strong>今日やること:</strong></p>
        <p id="confirmToday"></p>
        <p><strong>抱えている課題:</strong></p>
        <p id="confirmIssues"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="confirmSender"></p>
        <p><strong>部長:</strong></p>
        <p id="confirmDirector"></p>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-confirm" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>

  <script>
    let isEditMode = false;
    let currentUser = null;
    let directorInfo = null;

    async function initPage() {
      try {
        // ユーザー情報取得
        const userRes = await fetch('/api/user', { method: 'GET' });
        if (!userRes.ok) {
          window.location.href = './login.html';
          return;
        }
        currentUser = await userRes.json();

        // 部長情報取得
        const directorRes = await fetch(`/api/director?userId=${currentUser.id}`, { method: 'GET' });
        if (directorRes.ok) {
          directorInfo = await directorRes.json();
        }

        // 下書き読み込み
        loadDraft();

        // 送信履歴読み込み
        loadHistory();

        // イベントリスナー設定
        document.getElementById('editBtn').addEventListener('click', enableEdit);
        document.getElementById('draftBtn').addEventListener('click', saveDraft);
        document.getElementById('reportForm').addEventListener('submit', handleSubmit);
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('confirmBtn').addEventListener('click', confirmSubmit);
      } catch (error) {
        console.error('初期化エラー:', error);
      }
    }

    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        if (data.reportDate) {
          document.getElementById('reportDate').value = data.reportDate;
        }
        if (data.department) {
          document.getElementById('department').value = data.department;
        }
      }
    }

    function enableEdit() {
      isEditMode = true;
      document.getElementById('yesterday').disabled = false;
      document.getElementById('today').disabled = false;
      document.getElementById('issues').disabled = false;
      document.getElementById('editBtn').style.display = 'none';
    }

    async function saveDraft() {
      const draft = {
        reportDate: document.getElementById('reportDate').value,
        department: document.getElementById('department').value,
        yesterday: document.getElementById('yesterday').value,
        today: document.getElementById('today').value,
        issues: document.getElementById('issues').value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }

    function validateForm() {
      let isValid = true;
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();

      // エラーメッセージをリセット
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));

      if (!reportDate) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }

      if (!department) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }

      if (!yesterday && !today && !issues) {
        document.getElementById('yesterdayError').classList.add('show');
        document.getElementById('todayError').classList.add('show');
        document.getElementById('issuesError').classList.add('show');
        isValid = false;
      }

      return isValid;
    }

    function handleSubmit(e) {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      // 確認ダイアログを表示
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();

      document.getElementById('confirmYesterday').textContent = yesterday || '(未入力)';
      document.getElementById('confirmToday').textContent = today || '(未入力)';
      document.getElementById('confirmIssues').textContent = issues || '(未入力)';
      document.getElementById('confirmSender').textContent = currentUser.email || 'testuser@example.com';
      document.getElementById('confirmDirector').textContent = directorInfo ? `${directorInfo.name} <${directorInfo.email}>` : '(未設定)';

      document.getElementById('confirmModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('show');
    }

    async function confirmSubmit() {
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();

      const payload = {
        userId: currentUser.id,
        reportDate,
        department,
        yesterday,
        today,
        issues,
        status: 'sent'
      };

      try {
        const res = await fetch('/api/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          closeModal();
          document.getElementById('successMessage').classList.add('show');
          document.getElementById('yesterday').value = '';
          document.getElementById('today').value = '';
          document.getElementById('issues').value = '';
          document.getElementById('yesterday').disabled = true;
          document.getElementById('today').disabled = true;
          document.getElementById('issues').disabled = true;
          document.getElementById('editBtn').style.display = 'inline-block';
          isEditMode = false;
          localStorage.removeItem('reportDraft');
          setTimeout(() => {
            document.getElementById('successMessage').classList.remove('show');
            loadHistory();
          }, 2000);
        } else {
          alert('送信に失敗しました');
        }
      } catch (error) {
        console.error('送信エラー:', error);
        alert('送信中にエラーが発生しました');
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch(`/api/reports?userId=${currentUser.id}`, { method: 'GET' });
        if (res.ok) {
          const reports = await res.json();
          const historyList = document.getElementById('historyList');

          if (reports.length === 0) {
            historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
          } else {
            historyList.innerHTML = reports.map(report => `
              <div class="history-item">
                <div class="history-item-header">
                  <div class="history-item-date">${new Date(report.createdAt).toLocaleString('ja-JP')}</div>
                  <div class="history-item-status">送信済</div>
                </div>
                <div class="history-item-content">
                  <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                  <p><strong>今日やること:</strong> ${report.today}</p>
                  <p><strong>抱えている課題:</strong> ${report.issues}</p>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (error) {
        console.error('履歴読み込みエラー:', error);
      }
    }

    initPage();
  </script>
</body>
</html>
