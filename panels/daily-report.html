<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .nav-links a:hover {
            background-color: #e7f3ff;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input[type="date"],
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group input[type="date"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        .form-group textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .history-empty {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-item {
            background-color: #f9f9f9;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-item-sender {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="nav-links">
                <a href="./dashboard.html">ダッシュボード</a>
                <a href="./login.html">ログアウト</a>
            </div>
        </div>

        <div class="success-message" id="successMessage">送信完了しました</div>

        <form id="reportForm">
            <div class="form-section">
                <h2>報告日付</h2>
                <div class="form-group">
                    <label for="reportDate">報告日付を選択してください</label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <h2>部門</h2>
                <div class="form-group">
                    <label for="department">部門を選択してください</label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <h2>報告内容</h2>
                <div class="form-group">
                    <label for="yesterday">昨日やったこと</label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                </div>
                <div class="form-group">
                    <label for="today">今日やること</label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                </div>
                <div class="form-group">
                    <label for="issues">抱えている課題</label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                </div>
                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-primary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-success" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>送信確認</h3>
            <div class="modal-content" id="modalContent">
                <!-- 動的に生成 -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>

    <script>
        // ローカルストレージキー
        const STORAGE_KEY_DRAFT = 'dailyReportDraft';
        const STORAGE_KEY_DATE = 'dailyReportDate';
        const STORAGE_KEY_DEPT = 'dailyReportDept';
        const STORAGE_KEY_HISTORY = 'dailyReportHistory';

        // DOM要素
        const reportForm = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyContainer = document.getElementById('historyContainer');

        // 初期化
        function init() {
            loadDraft();
            loadDateSelection();
            loadDepartmentSelection();
            loadHistory();
            setupEventListeners();
        }

        // ドラフト読み込み
        function loadDraft() {
            const draft = localStorage.getItem(STORAGE_KEY_DRAFT);
            if (draft) {
                const data = JSON.parse(draft);
                yesterday.value = data.yesterday || '';
                today.value = data.today || '';
                issues.value = data.issues || '';
                enableEditMode();
            }
        }

        // 日付選択読み込み
        function loadDateSelection() {
            const savedDate = localStorage.getItem(STORAGE_KEY_DATE);
            if (savedDate) {
                reportDate.value = savedDate;
            }
        }

        // 部門選択読み込み
        function loadDepartmentSelection() {
            const savedDept = localStorage.getItem(STORAGE_KEY_DEPT);
            if (savedDept) {
                department.value = savedDept;
            }
        }

        // 履歴読み込み
        function loadHistory() {
            const history = localStorage.getItem(STORAGE_KEY_HISTORY);
            if (history) {
                const items = JSON.parse(history);
                if (items.length > 0) {
                    historyContainer.innerHTML = '';
                    items.forEach(item => {
                        const historyItem = createHistoryItem(item);
                        historyContainer.appendChild(historyItem);
                    });
                }
            }
        }

        // 履歴アイテム作成
        function createHistoryItem(item) {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-item-header">
                    <span class="history-item-date">${item.date}</span>
                    <span class="history-item-status">送信済</span>
                </div>
                <div class="history-item-content">
                    <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday)}</p>
                    <p><strong>今日やること:</strong> ${escapeHtml(item.today)}</p>
                    <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues)}</p>
                </div>
                <div class="history-item-sender">送信者: ${item.sender}</div>
            `;
            return div;
        }

        // HTML エスケープ
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // イベントリスナー設定
        function setupEventListeners() {
            editBtn.addEventListener('click', enableEditMode);
            draftBtn.addEventListener('click', saveDraft);
            reportForm.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', closeModal);
            confirmBtn.addEventListener('click', confirmSubmit);
            reportDate.addEventListener('change', () => {
                localStorage.setItem(STORAGE_KEY_DATE, reportDate.value);
            });
            department.addEventListener('change', () => {
                localStorage.setItem(STORAGE_KEY_DEPT, department.value);
            });
        }

        // 編集モード有効化
        function enableEditMode() {
            yesterday.disabled = false;
            today.disabled = false;
            issues.disabled = false;
            yesterday.focus();
        }

        // ドラフト保存
        function saveDraft(e) {
            e.preventDefault();
            const draft = {
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            localStorage.setItem(STORAGE_KEY_DRAFT, JSON.stringify(draft));
            alert('下書きを保存しました');
        }

        // バリデーション
        function validate() {
            let isValid = true;
            const dateError = document.getElementById('dateError');
            const departmentError = document.getElementById('departmentError');
            const contentError = document.getElementById('contentError');

            dateError.classList.remove('show');
            departmentError.classList.remove('show');
            contentError.classList.remove('show');

            if (!reportDate.value) {
                dateError.classList.add('show');
                isValid = false;
            }

            if (!department.value) {
                departmentError.classList.add('show');
                isValid = false;
            }

            const hasContent = yesterday.value.trim() || today.value.trim() || issues.value.trim();
            if (!hasContent) {
                contentError.classList.add('show');
                isValid = false;
            }

            return isValid;
        }

        // 送信処理
        function handleSubmit(e) {
            e.preventDefault();

            if (!validate()) {
                return;
            }

            showConfirmModal();
        }

        // 確認モーダル表示
        function showConfirmModal() {
            const modalContent = document.getElementById('modalContent');
            const userEmail = 'testuser@example.com';
            const bucho = '部長 <bucho@example.com>';

            modalContent.innerHTML = `
                <p><strong>昨日やったこと:</strong></p>
                <p>${escapeHtml(yesterday.value.substring(0, 50))}${yesterday.value.length > 50 ? '...' : ''}</p>
                <p><strong>今日やること:</strong></p>
                <p>${escapeHtml(today.value.substring(0, 50))}${today.value.length > 50 ? '...' : ''}</p>
                <p><strong>抱えている課題:</strong></p>
                <p>${escapeHtml(issues.value.substring(0, 50))}${issues.value.length > 50 ? '...' : ''}</p>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
                <p><strong>送信者:</strong> ${userEmail}</p>
                <p><strong>部長:</strong> ${bucho}</p>
            `;
            confirmModal.classList.add('show');
        }

        // モーダル閉じる
        function closeModal() {
            confirmModal.classList.remove('show');
        }

        // 送信確認
        function confirmSubmit() {
            closeModal();

            // 履歴に追加
            const now = new Date();
            const dateStr = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const historyItem = {
                date: dateStr,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value,
                sender: 'testuser'
            };

            let history = [];
            const existingHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
            if (existingHistory) {
                history = JSON.parse(existingHistory);
            }
            history.unshift(historyItem);
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));

            // フォームクリア
            yesterday.value = '';
            today.value = '';
            issues.value = '';
            yesterday.disabled = true;
            today.disabled = true;
            issues.disabled = true;

            // ドラフト削除
            localStorage.removeItem(STORAGE_KEY_DRAFT);

            // 成功メッセージ表示
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);

            // 履歴更新
            loadHistory();
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
