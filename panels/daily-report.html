<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #0b7dda;
    }
    .btn-danger {
      background-color: #f44336;
      color: white;
    }
    .btn-danger:hover {
      background-color: #da190b;
    }
    .error-message {
      color: #f44336;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
      font-size: 14px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .history-item-date {
      color: #666;
      font-size: 13px;
    }
    .history-item-status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      background-color: #4CAF50;
      color: white;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-empty {
      color: #999;
      text-align: center;
      padding: 20px;
      font-style: italic;
    }
    .nav-buttons {
      margin-top: 30px;
      display: flex;
      gap: 10px;
    }
    .nav-buttons a {
      display: inline-block;
      padding: 12px 24px;
      background-color: #666;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .nav-buttons a:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" required>
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" disabled></textarea>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" disabled></textarea>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" disabled></textarea>
        </div>
        <div class="error-message" id="contentError">報告内容を入力してください</div>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
        <button type="submit" class="btn-primary" id="submitBtn">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
    
    <div class="nav-buttons">
      <a href="./dashboard.html">ダッシュボード</a>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent">
        <p><strong>昨日やったこと:</strong> <span id="modalYesterday"></span></p>
        <p><strong>今日やること:</strong> <span id="modalToday"></span></p>
        <p><strong>抱えている課題:</strong> <span id="modalIssues"></span></p>
        <p style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
          <strong>送信者:</strong> <span id="modalSender"></span>
        </p>
        <p>
          <strong>部長:</strong> <span id="modalChief"></span>
        </p>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-primary" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    // ユーザー情報（セッションから取得）
    const currentUser = {
      id: 'testuser',
      email: 'testuser@example.com',
      name: 'テストユーザー',
      chief: '部長太郎',
      chiefEmail: 'bucho@example.com'
    };
    
    const form = document.getElementById('reportForm');
    const yesterdayField = document.getElementById('yesterday');
    const todayField = document.getElementById('today');
    const issuesField = document.getElementById('issues');
    const reportDateField = document.getElementById('reportDate');
    const departmentField = document.getElementById('department');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const historyList = document.getElementById('historyList');
    const successMessage = document.getElementById('successMessage');
    
    // ローカルストレージキー
    const STORAGE_KEY = 'dailyReportDraft';
    const HISTORY_KEY = 'dailyReportHistory';
    const DATE_KEY = 'lastReportDate';
    const DEPT_KEY = 'lastDepartment';
    
    // 初期化
    function init() {
      loadDraft();
      loadHistory();
      loadLastDate();
      loadLastDepartment();
      
      // 編集ボタンのクリックイベント
      editBtn.addEventListener('click', enableEdit);
      
      // 下書き保存ボタンのクリックイベント
      draftBtn.addEventListener('click', saveDraft);
      
      // フォーム送信イベント
      form.addEventListener('submit', handleSubmit);
      
      // 確認ダイアログのボタン
      cancelBtn.addEventListener('click', closeConfirmModal);
      confirmBtn.addEventListener('click', sendReport);
    }
    
    // 編集モード有効化
    function enableEdit() {
      yesterdayField.disabled = false;
      todayField.disabled = false;
      issuesField.disabled = false;
      yesterdayField.focus();
    }
    
    // 下書き保存
    function saveDraft() {
      const draft = {
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        date: reportDateField.value,
        department: departmentField.value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    // 下書き読み込み
    function loadDraft() {
      const draft = localStorage.getItem(STORAGE_KEY);
      if (draft) {
        const data = JSON.parse(draft);
        yesterdayField.value = data.yesterday || '';
        todayField.value = data.today || '';
        issuesField.value = data.issues || '';
        reportDateField.value = data.date || '';
        departmentField.value = data.department || '';
      }
    }
    
    // 最後に選択した日付を保存
    function loadLastDate() {
      const lastDate = sessionStorage.getItem(DATE_KEY);
      if (lastDate) {
        reportDateField.value = lastDate;
      }
    }
    
    // 最後に選択した部門を保存
    function loadLastDepartment() {
      const lastDept = sessionStorage.getItem(DEPT_KEY);
      if (lastDept) {
        departmentField.value = lastDept;
      }
    }
    
    // 日付変更時にセッションストレージに保存
    reportDateField.addEventListener('change', function() {
      sessionStorage.setItem(DATE_KEY, this.value);
    });
    
    // 部門変更時にセッションストレージに保存
    departmentField.addEventListener('change', function() {
      sessionStorage.setItem(DEPT_KEY, this.value);
    });
    
    // バリデーション
    function validate() {
      let isValid = true;
      
      // エラーメッセージをクリア
      document.getElementById('dateError').classList.remove('show');
      document.getElementById('departmentError').classList.remove('show');
      document.getElementById('contentError').classList.remove('show');
      
      // 日付チェック
      if (!reportDateField.value) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      // 部門チェック
      if (!departmentField.value) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      // 報告内容チェック
      if (!yesterdayField.value.trim() && !todayField.value.trim() && !issuesField.value.trim()) {
        document.getElementById('contentError').classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    // フォーム送信ハンドラ
    function handleSubmit(e) {
      e.preventDefault();
      
      if (!validate()) {
        return;
      }
      
      // 確認ダイアログを表示
      showConfirmModal();
    }
    
    // 確認ダイアログ表示
    function showConfirmModal() {
      document.getElementById('modalYesterday').textContent = yesterdayField.value.substring(0, 50) || '(未入力)';
      document.getElementById('modalToday').textContent = todayField.value.substring(0, 50) || '(未入力)';
      document.getElementById('modalIssues').textContent = issuesField.value.substring(0, 50) || '(未入力)';
      document.getElementById('modalSender').textContent = currentUser.email;
      document.getElementById('modalChief').textContent = `${currentUser.chief} <${currentUser.chiefEmail}>`;
      
      confirmModal.classList.add('show');
    }
    
    // 確認ダイアログ閉じる
    function closeConfirmModal() {
      confirmModal.classList.remove('show');
    }
    
    // 日報送信
    function sendReport() {
      closeConfirmModal();
      
      const report = {
        id: Date.now().toString(),
        date: reportDateField.value,
        department: departmentField.value,
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        sender: currentUser.id,
        senderEmail: currentUser.email,
        senderName: currentUser.name,
        sentAt: new Date().toISOString(),
        status: '送信済'
      };
      
      // 履歴に追加
      let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      history.unshift(report);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      
      // 下書きをクリア
      localStorage.removeItem(STORAGE_KEY);
      
      // フォームをリセット
      yesterdayField.value = '';
      todayField.value = '';
      issuesField.value = '';
      yesterdayField.disabled = true;
      todayField.disabled = true;
      issuesField.disabled = true;
      
      // 成功メッセージ表示
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      // 履歴を再読み込み
      loadHistory();
    }
    
    // 履歴読み込み
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      
      historyList.innerHTML = history.map(item => {
        const date = new Date(item.sentAt);
        const dateStr = date.toLocaleString('ja-JP', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        
        return `
          <div class="history-item">
            <div class="history-item-header">
              <span class="history-item-date">${dateStr}</span>
              <span class="history-item-status">${item.status}</span>
            </div>
            <div class="history-item-content">
              <p><strong>昨日やったこと:</strong> ${item.yesterday.substring(0, 100)}</p>
              <p><strong>今日やること:</strong> ${item.today.substring(0, 100)}</p>
              <p><strong>抱えている課題:</strong> ${item.issues.substring(0, 100)}</p>
              <p><strong>部門:</strong> ${item.department}</p>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // 初期化実行
    init();
  </script>
</body>
</html>
