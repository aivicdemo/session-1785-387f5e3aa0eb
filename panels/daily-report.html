<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled,
        input[type="date"]:disabled,
        select:disabled {
            background-color: #f9f9f9;
            color: #666;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 5px;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError">報告内容を入力してください</div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #666;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayInput = document.getElementById('yesterday');
        const todayInput = document.getElementById('today');
        const issuesInput = document.getElementById('issues');
        
        let isEditMode = false;
        let pendingSubmitData = null;
        
        // Initialize
        function init() {
            loadFormState();
            loadHistory();
            updateEditMode();
        }
        
        // Load form state from sessionStorage
        function loadFormState() {
            const saved = sessionStorage.getItem('reportFormState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.reportDate) reportDateInput.value = state.reportDate;
                if (state.department) departmentSelect.value = state.department;
                if (state.yesterday) yesterdayInput.value = state.yesterday;
                if (state.today) todayInput.value = state.today;
                if (state.issues) issuesInput.value = state.issues;
            }
        }
        
        // Save form state to sessionStorage
        function saveFormState() {
            const state = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }
        
        // Update form state on input
        reportDateInput.addEventListener('change', saveFormState);
        departmentSelect.addEventListener('change', saveFormState);
        yesterdayInput.addEventListener('input', saveFormState);
        todayInput.addEventListener('input', saveFormState);
        issuesInput.addEventListener('input', saveFormState);
        
        // Edit button
        editBtn.addEventListener('click', () => {
            isEditMode = true;
            updateEditMode();
        });
        
        function updateEditMode() {
            if (isEditMode) {
                yesterdayInput.disabled = false;
                todayInput.disabled = false;
                issuesInput.disabled = false;
                editBtn.style.display = 'none';
            } else {
                yesterdayInput.disabled = true;
                todayInput.disabled = true;
                issuesInput.disabled = true;
                editBtn.style.display = 'inline-block';
            }
        }
        
        // Draft save
        draftBtn.addEventListener('click', async () => {
            saveFormState();
            const state = JSON.parse(sessionStorage.getItem('reportFormState'));
            
            try {
                const response = await fetch('/api/draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                
                if (response.ok) {
                    showSuccessMessage('下書きを保存しました');
                }
            } catch (error) {
                console.error('Draft save error:', error);
            }
        });
        
        // Form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // Validate
            let isValid = true;
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayInput.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            if (!todayInput.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            
            if (!issuesInput.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirmation modal
            pendingSubmitData = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value
            };
            
            showConfirmModal();
        });
        
        function showConfirmModal() {
            document.getElementById('confirmYesterday').textContent = pendingSubmitData.yesterday.substring(0, 50) + (pendingSubmitData.yesterday.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = pendingSubmitData.today.substring(0, 50) + (pendingSubmitData.today.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = pendingSubmitData.issues.substring(0, 50) + (pendingSubmitData.issues.length > 50 ? '...' : '');
            document.getElementById('confirmSender').textContent = 'testuser@example.com';
            document.getElementById('confirmManager').textContent = '部長 <bucho@example.com>';
            confirmModal.classList.add('show');
        }
        
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            pendingSubmitData = null;
        });
        
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            
            try {
                const response = await fetch('/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingSubmitData)
                });
                
                if (response.ok) {
                    // Clear form
                    form.reset();
                    sessionStorage.removeItem('reportFormState');
                    isEditMode = false;
                    updateEditMode();
                    
                    showSuccessMessage('送信完了しました');
                    loadHistory();
                    pendingSubmitData = null;
                }
            } catch (error) {
                console.error('Submit error:', error);
                alert('送信に失敗しました');
            }
        });
        
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                if (response.ok) {
                    const data = await response.json();
                    const reports = data.reports || [];
                    
                    if (reports.length === 0) {
                        historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                    } else {
                        historyList.innerHTML = reports.map(report => `
                            <div class="history-item">
                                <div class="history-item-header">
                                    <span class="history-item-date">${formatDateTime(report.timestamp)}</span>
                                    <span class="history-item-status">送信済</span>
                                </div>
                                <div class="history-item-content">
                                    <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                                    <p><strong>今日やること:</strong> ${report.today}</p>
                                    <p><strong>抱えている課題:</strong> ${report.issues}</p>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Load history error:', error);
            }
        }
        
        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        init();
    </script>
</body>
</html>
