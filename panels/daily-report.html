<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-section h2 {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
    }
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.6;
    }
    .modal-body p {
      margin-bottom: 10px;
    }
    .modal-body strong {
      color: #333;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .history-list {
      list-style: none;
    }
    .history-item {
      background-color: #f9f9f9;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #007bff;
      border-radius: 4px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .history-item-date {
      color: #666;
      font-size: 13px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-empty {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="dailyReportForm">
      <div class="form-section">
        <h2>報告日付</h2>
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate">
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>部門選択</h2>
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" name="department">
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="開発部">開発部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>報告内容</h2>
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" name="yesterday" disabled></textarea>
          <div class="error-message" id="contentError">報告内容を入力してください</div>
        </div>
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" name="today" disabled></textarea>
        </div>
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" name="issues" disabled></textarea>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-success" id="saveDraftBtn">下書き保存</button>
        <button type="submit" class="btn-primary" id="submitBtn">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <ul class="history-list" id="historyList">
        <li class="history-empty">送信履歴はありません</li>
      </ul>
    </div>
  </div>
  
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
        <p><strong>今日やること:</strong></p>
        <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
        <p><strong>抱えている課題:</strong></p>
        <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
        <p style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
          <strong>送信者:</strong> <span id="confirmSender"></span>
        </p>
        <p>
          <strong>部長:</strong> <span id="confirmManager"></span>
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-primary" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    // ページロード時の初期化
    document.addEventListener('DOMContentLoaded', function() {
      loadDraft();
      loadHistory();
      setupEventListeners();
    });
    
    function setupEventListeners() {
      const form = document.getElementById('dailyReportForm');
      const editBtn = document.getElementById('editBtn');
      const saveDraftBtn = document.getElementById('saveDraftBtn');
      const submitBtn = document.getElementById('submitBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const confirmBtn = document.getElementById('confirmBtn');
      const modal = document.getElementById('confirmModal');
      
      editBtn.addEventListener('click', function(e) {
        e.preventDefault();
        enableEditing();
      });
      
      saveDraftBtn.addEventListener('click', function(e) {
        e.preventDefault();
        saveDraft();
      });
      
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (validateForm()) {
          showConfirmDialog();
        }
      });
      
      cancelBtn.addEventListener('click', function() {
        modal.classList.remove('show');
      });
      
      confirmBtn.addEventListener('click', function() {
        submitReport();
      });
      
      // 日付フィールドの変更を保存
      document.getElementById('reportDate').addEventListener('change', function() {
        sessionStorage.setItem('reportDate', this.value);
      });
      
      // 部門フィールドの変更を保存
      document.getElementById('department').addEventListener('change', function() {
        sessionStorage.setItem('department', this.value);
      });
    }
    
    function enableEditing() {
      document.getElementById('yesterday').disabled = false;
      document.getElementById('today').disabled = false;
      document.getElementById('issues').disabled = false;
      document.getElementById('yesterday').focus();
    }
    
    function validateForm() {
      const dateError = document.getElementById('dateError');
      const departmentError = document.getElementById('departmentError');
      const contentError = document.getElementById('contentError');
      
      dateError.classList.remove('show');
      departmentError.classList.remove('show');
      contentError.classList.remove('show');
      
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      let isValid = true;
      
      if (!reportDate) {
        dateError.classList.add('show');
        isValid = false;
      }
      
      if (!department) {
        departmentError.classList.add('show');
        isValid = false;
      }
      
      if (!yesterday && !today && !issues) {
        contentError.classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    function showConfirmDialog() {
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      document.getElementById('confirmYesterday').textContent = yesterday || '(入力なし)';
      document.getElementById('confirmToday').textContent = today || '(入力なし)';
      document.getElementById('confirmIssues').textContent = issues || '(入力なし)';
      
      // ユーザー情報を取得（セッションストレージから）
      const userEmail = sessionStorage.getItem('userEmail') || 'testuser@example.com';
      const managerEmail = sessionStorage.getItem('managerEmail') || '部長 <bucho@example.com>';
      
      document.getElementById('confirmSender').textContent = userEmail;
      document.getElementById('confirmManager').textContent = managerEmail;
      
      document.getElementById('confirmModal').classList.add('show');
    }
    
    function submitReport() {
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      const report = {
        id: Date.now().toString(),
        date: reportDate,
        department: department,
        yesterday: yesterday,
        today: today,
        issues: issues,
        submittedAt: new Date().toISOString(),
        submittedBy: sessionStorage.getItem('userId') || 'user001',
        status: '送信済'
      };
      
      // 履歴に追加
      let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      history.unshift(report);
      localStorage.setItem('reportHistory', JSON.stringify(history));
      
      // 下書きをクリア
      localStorage.removeItem('reportDraft');
      
      // モーダルを閉じる
      document.getElementById('confirmModal').classList.remove('show');
      
      // 成功メッセージを表示
      const successMessage = document.getElementById('successMessage');
      successMessage.classList.add('show');
      
      // フォームをリセット
      setTimeout(() => {
        document.getElementById('yesterday').value = '';
        document.getElementById('today').value = '';
        document.getElementById('issues').value = '';
        document.getElementById('yesterday').disabled = true;
        document.getElementById('today').disabled = true;
        document.getElementById('issues').disabled = true;
        
        successMessage.classList.remove('show');
        loadHistory();
      }, 1500);
    }
    
    function saveDraft() {
      const yesterday = document.getElementById('yesterday').value;
      const today = document.getElementById('today').value;
      const issues = document.getElementById('issues').value;
      
      const draft = {
        yesterday: yesterday,
        today: today,
        issues: issues
      };
      
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    function loadDraft() {
      const draft = JSON.parse(localStorage.getItem('reportDraft') || 'null');
      if (draft) {
        document.getElementById('yesterday').value = draft.yesterday || '';
        document.getElementById('today').value = draft.today || '';
        document.getElementById('issues').value = draft.issues || '';
      }
      
      // セッションストレージから日付と部門を復元
      const savedDate = sessionStorage.getItem('reportDate');
      const savedDepartment = sessionStorage.getItem('department');
      
      if (savedDate) {
        document.getElementById('reportDate').value = savedDate;
      }
      if (savedDepartment) {
        document.getElementById('department').value = savedDepartment;
      }
    }
    
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      const historyList = document.getElementById('historyList');
      
      if (history.length === 0) {
        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
        return;
      }
      
      historyList.innerHTML = history.map(item => {
        const date = new Date(item.submittedAt);
        const formattedDate = date.toLocaleString('ja-JP', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        
        return `
          <li class="history-item">
            <div class="history-item-header">
              <span class="history-item-date">${formattedDate}</span>
              <span class="history-item-status">${item.status}</span>
            </div>
            <div class="history-item-content">
              <p><strong>昨日やったこと:</strong> ${item.yesterday || '(入力なし)'}</p>
              <p><strong>今日やること:</strong> ${item.today || '(入力なし)'}</p>
              <p><strong>抱えている課題:</strong> ${item.issues || '(入力なし)'}</p>
            </div>
          </li>
        `;
      }).join('');
    }
  </script>
</body>
</html>
