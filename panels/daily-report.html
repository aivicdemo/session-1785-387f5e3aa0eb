<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }
        .modal-content {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            flex: 1;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        .history-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-nav {
            padding: 8px 16px;
            font-size: 13px;
            background-color: #e9ecef;
            color: #333;
        }
        .btn-nav:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button class="btn-nav" onclick="navigateToDashboard()">📊 ダッシュボード</button>
        </div>
        
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <div id="userEmail">ユーザー: testuser@example.com</div>
            </div>
        </div>

        <div class="success-message" id="successMessage">送信完了しました</div>

        <form id="reportForm">
            <div class="form-row">
                <div class="form-section">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                <div class="form-section">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-primary" id="editBtn" onclick="enableEdit()">報告内容編集</button>
                <button type="button" class="btn-secondary" onclick="saveDraft()">下書き保存</button>
                <button type="submit" class="btn-success">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #333;">testuser@example.com</p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #333;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" onclick="cancelSubmit()">キャンセル</button>
                <button type="button" class="btn-success" onclick="confirmSubmit()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let isEditing = false;
        let pendingSubmit = false;

        // ページロード時の初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadDraft();
            loadHistory();
            loadUserInfo();
            
            // フォーム送信イベント
            document.getElementById('reportForm').addEventListener('submit', function(e) {
                e.preventDefault();
                handleSubmit();
            });
        });

        function loadUserInfo() {
            // ユーザー情報をセッションストレージから取得
            const userEmail = sessionStorage.getItem('userEmail') || 'testuser@example.com';
            document.getElementById('userEmail').textContent = 'ユーザー: ' + userEmail;
            
            // 部長情報を取得
            const managerInfo = sessionStorage.getItem('managerInfo') || '部長 <bucho@example.com>';
            document.getElementById('confirmManager').textContent = managerInfo;
        }

        function enableEdit() {
            isEditing = true;
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editBtn').style.display = 'none';
        }

        function saveDraft() {
            const draft = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value,
                date: document.getElementById('reportDate').value,
                department: document.getElementById('department').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }

        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
                document.getElementById('department').value = data.department || '';
            }
            
            // 日付はセッションストレージから復元（ページリロード後も保持）
            const savedDate = sessionStorage.getItem('reportDate');
            if (savedDate) {
                document.getElementById('reportDate').value = savedDate;
            }
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
        }

        function validateForm() {
            clearErrors();
            let isValid = true;

            const date = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            if (!date) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }

            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }

            if (!yesterday && !today && !issues) {
                document.getElementById('yesterdayError').classList.add('show');
                document.getElementById('todayError').classList.add('show');
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }

            return isValid;
        }

        function handleSubmit() {
            if (!validateForm()) {
                return;
            }

            // 日付をセッションストレージに保存
            sessionStorage.setItem('reportDate', document.getElementById('reportDate').value);

            // 確認ダイアログを表示
            showConfirmDialog();
        }

        function showConfirmDialog() {
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;

            document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 50) + (yesterday.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = today.substring(0, 50) + (today.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = issues.substring(0, 50) + (issues.length > 50 ? '...' : '');

            document.getElementById('confirmModal').classList.add('show');
        }

        function cancelSubmit() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        function confirmSubmit() {
            document.getElementById('confirmModal').classList.remove('show');

            const report = {
                date: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value,
                sender: sessionStorage.getItem('userEmail') || 'testuser@example.com',
                timestamp: new Date().toISOString()
            };

            // 履歴に追加
            let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(report);
            localStorage.setItem('reportHistory', JSON.stringify(history));

            // フォームをクリア
            document.getElementById('yesterday').value = '';
            document.getElementById('today').value = '';
            document.getElementById('issues').value = '';
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            document.getElementById('editBtn').style.display = 'inline-block';
            isEditing = false;

            // 下書きをクリア
            localStorage.removeItem('reportDraft');

            // 成功メッセージを表示
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);

            // 履歴を更新
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => {
                const date = new Date(item.timestamp);
                const dateStr = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                return `
                    <li class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${dateStr}</span>
                            <span class="history-item-status">送信済</span>
                        </div>
                        <div class="history-item-content">
                            <div><strong>昨日:</strong> ${item.yesterday.substring(0, 40)}${item.yesterday.length > 40 ? '...' : ''}</div>
                            <div><strong>今日:</strong> ${item.today.substring(0, 40)}${item.today.length > 40 ? '...' : ''}</div>
                            <div><strong>課題:</strong> ${item.issues.substring(0, 40)}${item.issues.length > 40 ? '...' : ''}</div>
                        </div>
                    </li>
                `;
            }).join('');
        }

        function navigateToDashboard() {
            window.location.href = './dashboard.html';
        }
    </script>
</body>
</html>
