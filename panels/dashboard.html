<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      font-size: 16px;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    .deadline-section .deadline-time {
      font-size: 24px;
      font-weight: bold;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table thead {
      background-color: #f5f5f5;
    }
    .summary-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #ddd;
      font-size: 14px;
    }
    .summary-table td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      color: #666;
      font-size: 14px;
    }
    .summary-table tbody tr:hover {
      background-color: #f9f9f9;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50 0%, #45a049 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
      transition: width 0.3s ease;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-submitted {
      background-color: #c8e6c9;
      color: #2e7d32;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #1976d2;
      color: white;
    }
    .btn-primary:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-time" id="deadlineTime">2024年12月31日 17:00</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>80%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>6</td>
            <td>1</td>
            <td>86%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 86%;">86%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>10</td>
            <td>0</td>
            <td>100%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 100%;">100%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>5</td>
            <td>2</td>
            <td>71%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 71%;">71%</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div class="nav-buttons">
      <button class="btn-primary" onclick="window.location.href='./daily-report.html'">日報入力・送信へ</button>
    </div>
  </div>
  
  <script>
    function initPage() {
      // 提出期限を設定（現在から7日後の17:00）
      const deadline = new Date();
      deadline.setDate(deadline.getDate() + 7);
      deadline.setHours(17, 0, 0, 0);
      
      const year = deadline.getFullYear();
      const month = String(deadline.getMonth() + 1).padStart(2, '0');
      const day = String(deadline.getDate()).padStart(2, '0');
      const hours = String(deadline.getHours()).padStart(2, '0');
      const minutes = String(deadline.getMinutes()).padStart(2, '0');
      
      document.getElementById('deadlineTime').textContent = `${year}年${month}月${day}日 ${hours}:${minutes}`;
    }
    
    initPage();
  </script>
</body>
</html>
