<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-summary {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 13px;
        }
        .modal-summary-item {
            margin-bottom: 10px;
        }
        .modal-summary-label {
            font-weight: bold;
            color: #333;
        }
        .modal-summary-text {
            color: #666;
            word-break: break-word;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .history-empty {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            color: #666;
            font-weight: 500;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }
        .history-item-content-item {
            margin-bottom: 8px;
        }
        .history-item-content-label {
            font-weight: bold;
            color: #333;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #e9ecef;
            color: #007bff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .nav-link:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError"></div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError"></div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError"></div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError"></div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError"></div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer"></div>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <div>以下の内容で日報を送信します。</div>
                <div class="modal-summary">
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">昨日やったこと:</div>
                        <div class="modal-summary-text" id="summaryYesterday"></div>
                    </div>
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">今日やること:</div>
                        <div class="modal-summary-text" id="summaryToday"></div>
                    </div>
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">抱えている課題:</div>
                        <div class="modal-summary-text" id="summaryIssues"></div>
                    </div>
                </div>
                <div style="margin-top: 15px; font-size: 13px; color: #666;">
                    <div><strong>送信者:</strong> <span id="senderEmail"></span></div>
                    <div style="margin-top: 8px;"><strong>送信先:</strong> <span id="recipientEmail"></span></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyContainer = document.getElementById('historyContainer');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        
        // 初期化
        function initializeForm() {
            // セッションストレージから値を復元
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDepartment = sessionStorage.getItem('reportDepartment');
            const savedYesterday = sessionStorage.getItem('reportYesterday');
            const savedToday = sessionStorage.getItem('reportToday');
            const savedIssues = sessionStorage.getItem('reportIssues');
            
            if (savedDate) reportDateInput.value = savedDate;
            if (savedDepartment) departmentSelect.value = savedDepartment;
            if (savedYesterday) yesterdayTextarea.value = savedYesterday;
            if (savedToday) todayTextarea.value = savedToday;
            if (savedIssues) issuesTextarea.value = savedIssues;
            
            loadHistory();
        }
        
        // 入力値をセッションストレージに保存
        function saveToSessionStorage() {
            sessionStorage.setItem('reportDate', reportDateInput.value);
            sessionStorage.setItem('reportDepartment', departmentSelect.value);
            sessionStorage.setItem('reportYesterday', yesterdayTextarea.value);
            sessionStorage.setItem('reportToday', todayTextarea.value);
            sessionStorage.setItem('reportIssues', issuesTextarea.value);
        }
        
        // 入力値の変更を監視
        reportDateInput.addEventListener('change', saveToSessionStorage);
        departmentSelect.addEventListener('change', saveToSessionStorage);
        yesterdayTextarea.addEventListener('input', saveToSessionStorage);
        todayTextarea.addEventListener('input', saveToSessionStorage);
        issuesTextarea.addEventListener('input', saveToSessionStorage);
        
        // 報告内容編集ボタン
        editBtn.addEventListener('click', function() {
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            yesterdayTextarea.focus();
        });
        
        // 下書き保存ボタン
        draftBtn.addEventListener('click', function() {
            const draft = {
                date: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                savedAt: new Date().toISOString()
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            showSuccessMessage('下書きを保存しました');
        });
        
        // 下書きを復元
        function restoreDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                reportDateInput.value = data.date || '';
                departmentSelect.value = data.department || '';
                yesterdayTextarea.value = data.yesterday || '';
                todayTextarea.value = data.today || '';
                issuesTextarea.value = data.issues || '';
            }
        }
        
        // バリデーション
        function validateForm() {
            let isValid = true;
            
            // エラーメッセージをクリア
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').textContent = '報告日付を選択してください';
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentSelect.value) {
                document.getElementById('departmentError').textContent = '部門を選択してください';
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayTextarea.value.trim()) {
                document.getElementById('yesterdayError').textContent = '昨日やったことを入力してください';
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            if (!todayTextarea.value.trim()) {
                document.getElementById('todayError').textContent = '今日やることを入力してください';
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            
            if (!issuesTextarea.value.trim()) {
                document.getElementById('issuesError').textContent = '抱えている課題を入力してください';
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        // フォーム送信
        reportForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            // 確認ダイアログを表示
            showConfirmDialog();
        });
        
        // 確認ダイアログを表示
        function showConfirmDialog() {
            document.getElementById('summaryYesterday').textContent = yesterdayTextarea.value.substring(0, 50) + (yesterdayTextarea.value.length > 50 ? '...' : '');
            document.getElementById('summaryToday').textContent = todayTextarea.value.substring(0, 50) + (todayTextarea.value.length > 50 ? '...' : '');
            document.getElementById('summaryIssues').textContent = issuesTextarea.value.substring(0, 50) + (issuesTextarea.value.length > 50 ? '...' : '');
            
            // ユーザー情報を取得（ローカルストレージから）
            const userEmail = localStorage.getItem('userEmail') || 'testuser@example.com';
            const departmentHead = localStorage.getItem('departmentHead') || '部長 <bucho@example.com>';
            
            document.getElementById('senderEmail').textContent = userEmail;
            document.getElementById('recipientEmail').textContent = departmentHead;
            
            confirmModal.classList.add('show');
        }
        
        // キャンセルボタン
        cancelBtn.addEventListener('click', function() {
            confirmModal.classList.remove('show');
        });
        
        // 確認ボタン
        confirmBtn.addEventListener('click', function() {
            submitReport();
        });
        
        // 日報を送信
        function submitReport() {
            const report = {
                id: Date.now().toString(),
                date: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                submittedAt: new Date().toISOString(),
                status: '送信済',
                sender: localStorage.getItem('userEmail') || 'testuser@example.com'
            };
            
            // 履歴に追加
            let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(report);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // フォームをクリア
            reportForm.reset();
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            
            // セッションストレージをクリア（日付以外）
            sessionStorage.removeItem('reportYesterday');
            sessionStorage.removeItem('reportToday');
            sessionStorage.removeItem('reportIssues');
            
            // 下書きをクリア
            localStorage.removeItem('reportDraft');
            
            // ダイアログを閉じる
            confirmModal.classList.remove('show');
            
            // 成功メッセージを表示
            showSuccessMessage('送信完了しました');
            
            // 履歴を再読み込み
            loadHistory();
        }
        
        // 成功メッセージを表示
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // 履歴を読み込み
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            
            if (history.length === 0) {
                historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyContainer.innerHTML = history.map(item => {
                const date = new Date(item.submittedAt);
                const formattedDate = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                return `
                    <div class="history-item">
                        <div class="history-item-header">
                            <div class="history-item-date">${formattedDate}</div>
                            <div class="history-item-status">${item.status}</div>
                        </div>
                        <div class="history-item-content">
                            <div class="history-item-content-item">
                                <div class="history-item-content-label">昨日やったこと:</div>
                                <div>${item.yesterday}</div>
                            </div>
                            <div class="history-item-content-item">
                                <div class="history-item-content-label">今日やること:</div>
                                <div>${item.today}</div>
                            </div>
                            <div class="history-item-content-item">
                                <div class="history-item-content-label">抱えている課題:</div>
                                <div>${item.issues}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ページ読み込み時
        window.addEventListener('load', function() {
            // ユーザー情報をセット（テスト用）
            if (!localStorage.getItem('userEmail')) {
                localStorage.setItem('userEmail', 'testuser@example.com');
                localStorage.setItem('departmentHead', '部長 <bucho@example.com>');
            }
            
            restoreDraft();
            initializeForm();
        });
    </script>
</body>
</html>
