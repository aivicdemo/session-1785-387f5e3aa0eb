<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .logout-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #5a6268;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deadline-section p {
            color: #856404;
            font-size: 14px;
        }
        .deadline-badge {
            display: inline-block;
            background-color: #ffc107;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #f9f9f9;
        }
        .summary-table th {
            background-color: #007bff;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border: 1px solid #ddd;
        }
        .summary-table td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        .summary-table tr:nth-child(even) {
            background-color: #f0f0f0;
        }
        .summary-table tr:hover {
            background-color: #e8f4f8;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            flex: 1;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>

        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="goToReport()">日報入力に戻る</button>
        </div>

        <div class="deadline-section">
            <h2>提出期限</h2>
            <p id="deadlineText">毎日 18:00 までに日報を提出してください</p>
            <div class="deadline-badge" id="deadlineBadge">本日の提出期限: 18:00</div>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function initPage() {
            // ユーザー情報を確認
            const userStr = sessionStorage.getItem('user');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }
            currentUser = JSON.parse(userStr);

            // 提出期限を表示
            updateDeadline();

            // 部門別提出状況を読み込み
            await loadSummary();
        }

        function updateDeadline() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('deadlineBadge').textContent = `本日の提出期限: 18:00 (現在時刻: ${hours}:${minutes})`;
        }

        async function loadSummary() {
            try {
                const response = await fetch('/api/department-summary');
                if (response.ok) {
                    const summary = await response.json();
                    displaySummary(summary);
                } else {
                    // デモデータを表示
                    displaySummary(getDemoSummary());
                }
            } catch (error) {
                console.error('Error loading summary:', error);
                // デモデータを表示
                displaySummary(getDemoSummary());
            }
        }

        function getDemoSummary() {
            return [
                { department: '営業部', submitted: 8, total: 10, rate: 80 },
                { department: '企画部', submitted: 6, total: 8, rate: 75 },
                { department: '技術部', submitted: 12, total: 12, rate: 100 },
                { department: '管理部', submitted: 4, total: 5, rate: 80 }
            ];
        }

        function displaySummary(summary) {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = summary.map(item => `
                <tr>
                    <td>${item.department}</td>
                    <td>${item.submitted}</td>
                    <td>${item.total - item.submitted}</td>
                    <td>${item.rate}%</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${item.rate}%">${item.rate}%</div>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function logout() {
            sessionStorage.removeItem('user');
            window.location.href = './login.html';
        }

        function goToReport() {
            window.location.href = './daily-report.html';
        }

        // ページ読み込み時に初期化
        window.addEventListener('load', initPage);
    </script>
</body>
</html>
