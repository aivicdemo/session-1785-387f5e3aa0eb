<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .summary-table th,
    .summary-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .summary-table th {
      background-color: #f9f9f9;
      font-weight: 600;
      color: #333;
    }
    .summary-table tr:hover {
      background-color: #f5f5f5;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #4CAF50;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-submitted {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .nav-buttons {
      margin-top: 30px;
      display: flex;
      gap: 10px;
    }
    .nav-buttons a,
    .nav-buttons button {
      padding: 12px 24px;
      background-color: #2196F3;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .nav-buttons a:hover,
    .nav-buttons button:hover {
      background-color: #0b7dda;
    }
    .nav-buttons .logout {
      background-color: #666;
    }
    .nav-buttons .logout:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadlineText">本日 18:00 まで</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td><span id="sales-count">8 / 10</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
            <td><span class="status-badge status-pending">進行中</span></td>
          </tr>
          <tr>
            <td>企画部</td>
            <td><span id="planning-count">5 / 6</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 83.33%;">83%</div>
              </div>
            </td>
            <td><span class="status-badge status-pending">進行中</span></td>
          </tr>
          <tr>
            <td>技術部</td>
            <td><span id="tech-count">12 / 12</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 100%;">100%</div>
              </div>
            </td>
            <td><span class="status-badge status-submitted">完了</span></td>
          </tr>
          <tr>
            <td>管理部</td>
            <td><span id="admin-count">3 / 4</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 75%;">75%</div>
              </div>
            </td>
            <td><span class="status-badge status-pending">進行中</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div class="nav-buttons">
      <a href="./daily-report.html">日報入力に戻る</a>
      <a href="./login.html" class="logout">ログアウト</a>
    </div>
  </div>
  
  <script>
    // Initialize dashboard
    function init() {
      // Set deadline
      const today = new Date();
      const deadline = new Date(today);
      deadline.setHours(18, 0, 0, 0);
      
      const deadlineText = document.getElementById('deadlineText');
      deadlineText.textContent = `本日 ${deadline.getHours()}:${String(deadline.getMinutes()).padStart(2, '0')} まで`;
    }
    
    window.addEventListener('load', init);
  </script>
</body>
</html>
