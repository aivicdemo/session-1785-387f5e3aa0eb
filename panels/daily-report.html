<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            color: #666;
            font-weight: 500;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 5px;
        }
        .empty-history {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        .nav-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .nav-buttons a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .nav-buttons a:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="開発部">開発部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="例：顧客A社の提案資料作成" disabled></textarea>
                    <div class="error-message" id="contentError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="例：顧客B社との打ち合わせ" disabled></textarea>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="例：プロジェクトスケジュール調整" disabled></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="empty-history">送信履歴はありません</li>
            </ul>
        </div>
        
        <div class="nav-buttons">
            <a href="./dashboard.html">ダッシュボードへ</a>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 10px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 10px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 10px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #555;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        
        let isEditMode = false;
        let currentUser = null;
        let currentManager = null;
        
        // Initialize
        async function init() {
            // Load user info from session
            const userInfo = sessionStorage.getItem('userInfo');
            if (userInfo) {
                currentUser = JSON.parse(userInfo);
            }
            
            // Load draft from localStorage
            loadDraft();
            
            // Load history
            loadHistory();
            
            // Restore form state from sessionStorage
            restoreFormState();
        }
        
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                yesterdayTextarea.value = data.yesterday || '';
                todayTextarea.value = data.today || '';
                issuesTextarea.value = data.issues || '';
            }
        }
        
        function saveDraft() {
            const draft = {
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
        }
        
        function restoreFormState() {
            const state = sessionStorage.getItem('reportFormState');
            if (state) {
                const data = JSON.parse(state);
                reportDateInput.value = data.reportDate || '';
                departmentSelect.value = data.department || '';
            }
        }
        
        function saveFormState() {
            const state = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<li class="empty-history">送信履歴はありません</li>';
            } else {
                historyList.innerHTML = history.map(item => `
                    <li class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${item.date}</span>
                            <span class="history-item-status">送信済</span>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                            <p><strong>今日やること:</strong> ${item.today}</p>
                            <p><strong>抱えている課題:</strong> ${item.issues}</p>
                        </div>
                    </li>
                `).join('');
            }
        }
        
        editBtn.addEventListener('click', function() {
            isEditMode = true;
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            yesterdayTextarea.focus();
        });
        
        draftBtn.addEventListener('click', function(e) {
            e.preventDefault();
            saveDraft();
            saveFormState();
            alert('下書きを保存しました');
        });
        
        reportForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');
            
            // Validate
            let hasError = false;
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            }
            
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            }
            
            if (!yesterdayTextarea.value.trim() || !todayTextarea.value.trim() || !issuesTextarea.value.trim()) {
                document.getElementById('contentError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) {
                return;
            }
            
            // Show confirmation modal
            showConfirmModal();
        });
        
        function showConfirmModal() {
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value;
            document.getElementById('confirmToday').textContent = todayTextarea.value;
            document.getElementById('confirmIssues').textContent = issuesTextarea.value;
            document.getElementById('confirmSender').textContent = currentUser ? currentUser.email : 'testuser@example.com';
            document.getElementById('confirmManager').textContent = currentUser ? (currentUser.managerName + ' <' + currentUser.managerEmail + '>') : '部長 <bucho@example.com>';
            confirmModal.classList.add('show');
        }
        
        cancelBtn.addEventListener('click', function() {
            confirmModal.classList.remove('show');
        });
        
        confirmBtn.addEventListener('click', function() {
            // Save to history
            const now = new Date();
            const dateStr = now.getFullYear() + '年' + 
                           String(now.getMonth() + 1).padStart(2, '0') + '月' + 
                           String(now.getDate()).padStart(2, '0') + '日 ' +
                           String(now.getHours()).padStart(2, '0') + ':' +
                           String(now.getMinutes()).padStart(2, '0') + ':' +
                           String(now.getSeconds()).padStart(2, '0');
            
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift({
                date: dateStr,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: currentUser ? currentUser.id : 'user1'
            });
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            yesterdayTextarea.value = '';
            todayTextarea.value = '';
            issuesTextarea.value = '';
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            isEditMode = false;
            
            // Clear draft
            localStorage.removeItem('reportDraft');
            
            // Close modal
            confirmModal.classList.remove('show');
            
            // Show success message
            successMessage.textContent = '送信完了しました';
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // Reload history
            loadHistory();
        });
        
        // Initialize on page load
        init();
    </script>
</body>
</html>
