<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .logout-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #5a6268;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-group textarea:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .form-group input[type="date"]:disabled,
        .form-group select:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h3 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons .btn {
            flex: 1;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #c3e6cb;
        }
        .success-message.show {
            display: block;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .history-item-date {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .edit-mode-indicator {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .edit-mode-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>

        <div class="success-message" id="successMessage"></div>

        <form id="reportForm">
            <div class="form-section">
                <h2>報告情報</h2>
                
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>

                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <h2>報告内容</h2>
                <div class="edit-mode-indicator" id="editModeIndicator">
                    編集モード：入力フィールドが有効になっています
                </div>

                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" disabled></textarea>
                </div>

                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" disabled></textarea>
                </div>

                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" disabled></textarea>
                </div>

                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-warning" id="editBtn" onclick="enableEditMode()">報告内容編集</button>
                <button type="button" class="btn btn-secondary" id="draftBtn" onclick="saveDraft()">下書き保存</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>送信確認</h3>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
                    <strong>送信者:</strong> <span id="confirmSender"></span>
                </p>
                <p style="margin-top: 10px;">
                    <strong>部長:</strong> <span id="confirmManager"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="cancelSubmit()">キャンセル</button>
                <button type="button" class="btn btn-primary" onclick="confirmSubmit()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isEditMode = false;
        let pendingSubmitData = null;

        // ページロード時の初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await initializePage();
            loadDraft();
            loadHistory();
            restoreFormState();
        });

        async function initializePage() {
            // ユーザー情報を取得（セッションストレージから）
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }
            currentUser = JSON.parse(userStr);
        }

        function enableEditMode() {
            isEditMode = true;
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editModeIndicator').classList.add('show');
            document.getElementById('editBtn').style.display = 'none';
        }

        function saveDraft() {
            const draft = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value,
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }

        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
                document.getElementById('reportDate').value = data.reportDate || '';
                document.getElementById('department').value = data.department || '';
            }
        }

        function restoreFormState() {
            const state = sessionStorage.getItem('reportFormState');
            if (state) {
                const data = JSON.parse(state);
                document.getElementById('reportDate').value = data.reportDate || '';
                document.getElementById('department').value = data.department || '';
            }
        }

        function saveFormState() {
            const state = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // バリデーション
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;

            let hasError = false;

            // エラーメッセージをクリア
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');

            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            }

            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            }

            if (!yesterday || !today || !issues) {
                document.getElementById('contentError').classList.add('show');
                hasError = true;
            }

            if (hasError) {
                return;
            }

            // フォーム状態を保存
            saveFormState();

            // 送信確認ダイアログを表示
            pendingSubmitData = {
                yesterday,
                today,
                issues,
                reportDate,
                department
            };

            document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 50) + (yesterday.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = today.substring(0, 50) + (today.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = issues.substring(0, 50) + (issues.length > 50 ? '...' : '');
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = currentUser.managerName + ' <' + currentUser.managerEmail + '>';

            document.getElementById('confirmModal').classList.add('show');
        });

        function cancelSubmit() {
            document.getElementById('confirmModal').classList.remove('show');
            pendingSubmitData = null;
        }

        async function confirmSubmit() {
            if (!pendingSubmitData) return;

            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        userName: currentUser.name,
                        email: currentUser.email,
                        ...pendingSubmitData,
                        submittedAt: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    document.getElementById('confirmModal').classList.remove('show');
                    
                    // 成功メッセージを表示
                    const successMsg = document.getElementById('successMessage');
                    successMsg.textContent = '送信完了しました';
                    successMsg.classList.add('show');
                    
                    // フォームをクリア
                    document.getElementById('reportForm').reset();
                    document.getElementById('yesterday').disabled = true;
                    document.getElementById('today').disabled = true;
                    document.getElementById('issues').disabled = true;
                    isEditMode = false;
                    document.getElementById('editModeIndicator').classList.remove('show');
                    document.getElementById('editBtn').style.display = 'block';
                    
                    // 下書きをクリア
                    localStorage.removeItem('reportDraft');
                    
                    // 履歴を再読み込み
                    setTimeout(() => {
                        loadHistory();
                        successMsg.classList.remove('show');
                    }, 2000);
                    
                    pendingSubmitData = null;
                } else {
                    alert('送信に失敗しました');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('送信中にエラーが発生しました');
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/reports?userId=' + currentUser.id);
                const reports = await response.json();
                
                const historyList = document.getElementById('historyList');
                
                if (!reports || reports.length === 0) {
                    historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                    return;
                }

                historyList.innerHTML = '';
                reports.forEach(report => {
                    const date = new Date(report.submittedAt);
                    const dateStr = date.toLocaleString('ja-JP', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });

                    const item = document.createElement('li');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <div class="history-item-header">
                            <span class="history-item-date">${dateStr}</span>
                            <span class="history-item-status">送信済</span>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                            <p><strong>今日やること:</strong> ${report.today}</p>
                            <p><strong>抱えている課題:</strong> ${report.issues}</p>
                        </div>
                    `;
                    historyList.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
