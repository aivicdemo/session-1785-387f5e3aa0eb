<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-summary {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .modal-summary-item {
      margin-bottom: 8px;
    }
    .modal-summary-label {
      font-weight: bold;
      color: #333;
    }
    .modal-summary-value {
      color: #666;
      word-break: break-word;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }
    .history-empty {
      color: #999;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-item {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }
    .history-item-datetime {
      color: #666;
      font-size: 13px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .history-item-content-item {
      margin-bottom: 8px;
    }
    .history-item-content-label {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-group">
        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
        <input type="date" id="reportDate" name="reportDate">
        <div class="error-message" id="dateError">報告日付を選択してください</div>
      </div>
      
      <div class="form-group">
        <label for="department">部門 <span style="color: red;">*</span></label>
        <select id="department" name="department">
          <option value="">-- 選択してください --</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError">部門を選択してください</div>
      </div>
      
      <div class="form-group">
        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
        <textarea id="yesterday" name="yesterday" disabled></textarea>
        <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
      </div>
      
      <div class="form-group">
        <label for="today">今日やること <span style="color: red;">*</span></label>
        <textarea id="today" name="today" disabled></textarea>
        <div class="error-message" id="todayError">報告内容を入力してください</div>
      </div>
      
      <div class="form-group">
        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
        <textarea id="issues" name="issues" disabled></textarea>
        <div class="error-message" id="issuesError">報告内容を入力してください</div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <div class="modal-summary">
          <div class="modal-summary-item">
            <span class="modal-summary-label">昨日やったこと:</span>
            <span class="modal-summary-value" id="summaryYesterday"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">今日やること:</span>
            <span class="modal-summary-value" id="summaryToday"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">抱えている課題:</span>
            <span class="modal-summary-value" id="summaryIssues"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">送信者:</span>
            <span class="modal-summary-value" id="summaryFrom"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">部長:</span>
            <span class="modal-summary-value" id="summaryTo"></span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-success">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    // ローカルストレージキー
    const DRAFT_KEY = 'report_draft';
    const HISTORY_KEY = 'report_history';
    const FORM_STATE_KEY = 'report_form_state';
    
    // DOM要素
    const form = document.getElementById('reportForm');
    const reportDate = document.getElementById('reportDate');
    const department = document.getElementById('department');
    const yesterday = document.getElementById('yesterday');
    const today = document.getElementById('today');
    const issues = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyContainer = document.getElementById('historyContainer');
    
    // ユーザー情報（テスト用）
    const currentUser = {
      email: 'testuser@example.com',
      name: 'テストユーザー',
      department: '営業部',
      manager: '部長太郎',
      managerEmail: 'bucho@example.com'
    };
    
    // 初期化
    function init() {
      loadDraft();
      loadFormState();
      loadHistory();
      attachEventListeners();
    }
    
    // ドラフト読み込み
    function loadDraft() {
      const draft = localStorage.getItem(DRAFT_KEY);
      if (draft) {
        const data = JSON.parse(draft);
        yesterday.value = data.yesterday || '';
        today.value = data.today || '';
        issues.value = data.issues || '';
      }
    }
    
    // フォーム状態読み込み（日付と部門のみ保持）
    function loadFormState() {
      const state = localStorage.getItem(FORM_STATE_KEY);
      if (state) {
        const data = JSON.parse(state);
        reportDate.value = data.reportDate || '';
        department.value = data.department || '';
      }
    }
    
    // フォーム状態保存（日付と部門のみ）
    function saveFormState() {
      const state = {
        reportDate: reportDate.value,
        department: department.value
      };
      localStorage.setItem(FORM_STATE_KEY, JSON.stringify(state));
    }
    
    // 履歴読み込み
    function loadHistory() {
      const history = localStorage.getItem(HISTORY_KEY);
      if (history) {
        const items = JSON.parse(history);
        renderHistory(items);
      }
    }
    
    // 履歴レンダリング
    function renderHistory(items) {
      if (items.length === 0) {
        historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      
      historyContainer.innerHTML = items.map(item => `
        <div class="history-item">
          <div class="history-item-header">
            <span class="history-item-datetime">${item.datetime}</span>
            <span class="history-item-status">送信済</span>
          </div>
          <div class="history-item-content">
            <div class="history-item-content-item">
              <span class="history-item-content-label">昨日やったこと:</span> ${escapeHtml(item.yesterday)}
            </div>
            <div class="history-item-content-item">
              <span class="history-item-content-label">今日やること:</span> ${escapeHtml(item.today)}
            </div>
            <div class="history-item-content-item">
              <span class="history-item-content-label">抱えている課題:</span> ${escapeHtml(item.issues)}
            </div>
            <div class="history-item-content-item">
              <span class="history-item-content-label">送信者:</span> ${item.sender}
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // HTML エスケープ
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // イベントリスナー設定
    function attachEventListeners() {
      editBtn.addEventListener('click', handleEdit);
      draftBtn.addEventListener('click', handleDraft);
      form.addEventListener('submit', handleSubmit);
      cancelBtn.addEventListener('click', handleCancel);
      confirmBtn.addEventListener('click', handleConfirm);
      
      // フォーム状態変更時に保存
      reportDate.addEventListener('change', saveFormState);
      department.addEventListener('change', saveFormState);
    }
    
    // 編集ボタン
    function handleEdit() {
      yesterday.disabled = false;
      today.disabled = false;
      issues.disabled = false;
      yesterday.focus();
    }
    
    // 下書き保存
    function handleDraft() {
      const draft = {
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value
      };
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    // バリデーション
    function validate() {
      let isValid = true;
      
      // エラーメッセージをクリア
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      
      if (!reportDate.value) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department.value) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      const hasContent = yesterday.value.trim() || today.value.trim() || issues.value.trim();
      if (!hasContent) {
        document.getElementById('yesterdayError').classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    // 送信ボタン
    function handleSubmit(e) {
      e.preventDefault();
      
      if (!validate()) {
        return;
      }
      
      // 確認ダイアログを表示
      showConfirmDialog();
    }
    
    // 確認ダイアログ表示
    function showConfirmDialog() {
      document.getElementById('summaryYesterday').textContent = yesterday.value.substring(0, 50) || '（未入力）';
      document.getElementById('summaryToday').textContent = today.value.substring(0, 50) || '（未入力）';
      document.getElementById('summaryIssues').textContent = issues.value.substring(0, 50) || '（未入力）';
      document.getElementById('summaryFrom').textContent = currentUser.email;
      document.getElementById('summaryTo').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
      
      confirmModal.classList.add('show');
    }
    
    // キャンセルボタン
    function handleCancel() {
      confirmModal.classList.remove('show');
    }
    
    // 確認ボタン
    function handleConfirm() {
      confirmModal.classList.remove('show');
      
      // 履歴に追加
      const now = new Date();
      const datetime = now.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      const historyItem = {
        datetime: datetime,
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value,
        sender: currentUser.name,
        status: '送信済'
      };
      
      let history = [];
      const existing = localStorage.getItem(HISTORY_KEY);
      if (existing) {
        history = JSON.parse(existing);
      }
      history.unshift(historyItem);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      
      // フォームをクリア
      yesterday.value = '';
      today.value = '';
      issues.value = '';
      yesterday.disabled = true;
      today.disabled = true;
      issues.disabled = true;
      
      // ドラフトをクリア
      localStorage.removeItem(DRAFT_KEY);
      
      // 成功メッセージ表示
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      // 履歴を再レンダリング
      loadHistory();
    }
    
    // 初期化実行
    init();
  </script>
</body>
</html>
