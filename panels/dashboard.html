<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: bold;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th,
    .summary-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .summary-table th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #333;
    }
    .summary-table tr:hover {
      background-color: #f9f9f9;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-complete {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadlineText">2024年12月31日 17:00</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <!-- 動的に生成 -->
        </tbody>
      </table>
    </div>
    
    <button class="nav-button" onclick="window.location.href='./daily-report.html'">日報入力・送信へ</button>
  </div>
  
  <script>
    function init() {
      renderDeadline();
      renderSummary();
    }
    
    function renderDeadline() {
      const deadline = new Date('2024-12-31T17:00:00');
      const formatted = deadline.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('deadlineText').textContent = formatted;
    }
    
    function renderSummary() {
      const summaryData = [
        { department: '営業部', submitted: 8, total: 10 },
        { department: '企画部', submitted: 6, total: 8 },
        { department: '技術部', submitted: 9, total: 10 },
        { department: '管理部', submitted: 5, total: 5 }
      ];
      
      const tbody = document.getElementById('summaryBody');
      tbody.innerHTML = summaryData.map(item => {
        const rate = Math.round((item.submitted / item.total) * 100);
        const isComplete = item.submitted === item.total;
        const statusClass = isComplete ? 'status-complete' : 'status-pending';
        const statusText = isComplete ? '完了' : '進行中';
        
        return `
          <tr>
            <td>${item.department}</td>
            <td>${item.submitted} / ${item.total}</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
              </div>
            </td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          </tr>
        `;
      }).join('');
    }
    
    init();
  </script>
</body>
</html>
