<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
        .btn-tertiary {
            background-color: #f44336;
            color: white;
        }
        .btn-tertiary:hover {
            background-color: #da190b;
        }
        .error-message {
            color: #f44336;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-body p {
            margin-bottom: 10px;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #4CAF50;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .history-item-date {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #4CAF50;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                </div>
                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>
    
    <!-- 送信確認ダイアログ -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #333;"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-tertiary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        let currentUser = {
            id: 'user001',
            email: 'testuser@example.com',
            name: 'テストユーザー',
            department: '営業部',
            manager: '山田太郎',
            managerEmail: 'yamada@example.com'
        };
        
        // ローカルストレージキー
        const DRAFT_KEY = 'report_draft';
        const HISTORY_KEY = 'report_history';
        const FORM_STATE_KEY = 'report_form_state';
        
        // DOM要素
        const form = document.getElementById('reportForm');
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        
        // 初期化
        function init() {
            loadFormState();
            loadHistory();
            setupEventListeners();
        }
        
        // フォーム状態を保存
        function saveFormState() {
            const state = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value
            };
            sessionStorage.setItem(FORM_STATE_KEY, JSON.stringify(state));
        }
        
        // フォーム状態を復元
        function loadFormState() {
            const state = sessionStorage.getItem(FORM_STATE_KEY);
            if (state) {
                const parsed = JSON.parse(state);
                reportDateInput.value = parsed.reportDate || '';
                departmentSelect.value = parsed.department || '';
            }
            
            // 下書きを復元
            const draft = localStorage.getItem(DRAFT_KEY);
            if (draft) {
                const draftData = JSON.parse(draft);
                yesterdayTextarea.value = draftData.yesterday || '';
                todayTextarea.value = draftData.today || '';
                issuesTextarea.value = draftData.issues || '';
            }
        }
        
        // イベントリスナー設定
        function setupEventListeners() {
            reportDateInput.addEventListener('change', saveFormState);
            departmentSelect.addEventListener('change', saveFormState);
            
            editBtn.addEventListener('click', enableEdit);
            draftBtn.addEventListener('click', saveDraft);
            form.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', closeConfirmModal);
            confirmBtn.addEventListener('click', confirmSubmit);
        }
        
        // 編集モード有効化
        function enableEdit() {
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            yesterdayTextarea.focus();
        }
        
        // 下書き保存
        function saveDraft() {
            const draft = {
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            alert('下書きを保存しました');
        }
        
        // バリデーション
        function validate() {
            let isValid = true;
            
            // エラーメッセージをクリア
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');
            
            // 日付チェック
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            // 部門チェック
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            // 報告内容チェック
            if (!yesterdayTextarea.value.trim() && !todayTextarea.value.trim() && !issuesTextarea.value.trim()) {
                document.getElementById('contentError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        // 送信処理
        function handleSubmit(e) {
            e.preventDefault();
            
            if (!validate()) {
                return;
            }
            
            // 確認ダイアログを表示
            showConfirmModal();
        }
        
        // 確認ダイアログ表示
        function showConfirmModal() {
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value || '（未入力）';
            document.getElementById('confirmToday').textContent = todayTextarea.value || '（未入力）';
            document.getElementById('confirmIssues').textContent = issuesTextarea.value || '（未入力）';
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
            
            confirmModal.classList.add('show');
        }
        
        // 確認ダイアログ閉じる
        function closeConfirmModal() {
            confirmModal.classList.remove('show');
        }
        
        // 送信確認
        function confirmSubmit() {
            closeConfirmModal();
            
            // 履歴に追加
            const historyItem = {
                id: Date.now(),
                date: new Date().toLocaleString('ja-JP'),
                sender: currentUser.id,
                status: '送信済',
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                reportDate: reportDateInput.value,
                department: departmentSelect.value
            };
            
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history.unshift(historyItem);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            
            // フォームをクリア
            yesterdayTextarea.value = '';
            todayTextarea.value = '';
            issuesTextarea.value = '';
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            
            // 下書きをクリア
            localStorage.removeItem(DRAFT_KEY);
            
            // 成功メッセージ表示
            successMessage.textContent = '送信完了しました';
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // 履歴を再読み込み
            loadHistory();
        }
        
        // 履歴を読み込み
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            
            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.date}</span>
                        <span class="history-item-status">${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </li>
            `).join('');
        }
        
        // 初期化実行
        init();
    </script>
</body>
</html>
