<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #0b7dda;
    }
    .btn-tertiary {
      background-color: #f44336;
      color: white;
    }
    .btn-tertiary:hover {
      background-color: #da190b;
    }
    .error-message {
      color: #f44336;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background-color: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .modal h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
      font-size: 14px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
    .history-item-content {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .empty-message {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .nav-buttons a {
      padding: 10px 20px;
      background-color: #666;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .nav-buttons a:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-buttons">
      <a href="./dashboard.html">ダッシュボード</a>
    </div>
    
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <form id="reportForm">
      <div class="form-group">
        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
        <input type="date" id="reportDate" name="reportDate" required>
        <div class="error-message" id="dateError"></div>
      </div>
      
      <div class="form-group">
        <label for="department">部門 <span style="color: red;">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- 選択してください --</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError"></div>
      </div>
      
      <div class="form-group">
        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
        <textarea id="yesterday" name="yesterday" disabled></textarea>
        <div class="error-message" id="yesterdayError"></div>
      </div>
      
      <div class="form-group">
        <label for="today">今日やること <span style="color: red;">*</span></label>
        <textarea id="today" name="today" disabled></textarea>
        <div class="error-message" id="todayError"></div>
      </div>
      
      <div class="form-group">
        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
        <textarea id="issues" name="issues" disabled></textarea>
        <div class="error-message" id="issuesError"></div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyList" class="history-list">
        <div class="empty-message">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content">
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
        <p style="margin-top: 10px;"><strong>今日やること:</strong></p>
        <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
        <p style="margin-top: 10px;"><strong>抱えている課題:</strong></p>
        <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="confirmSender" style="margin-left: 10px; color: #666;"></p>
        <p style="margin-top: 10px;"><strong>部長:</strong></p>
        <p id="confirmManager" style="margin-left: 10px; color: #666;"></p>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-tertiary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-primary">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const reportForm = document.getElementById('reportForm');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const confirmModal = document.getElementById('confirmModal');
    const successMessage = document.getElementById('successMessage');
    const historyList = document.getElementById('historyList');
    
    const yesterdayField = document.getElementById('yesterday');
    const todayField = document.getElementById('today');
    const issuesField = document.getElementById('issues');
    const reportDateField = document.getElementById('reportDate');
    const departmentField = document.getElementById('department');
    
    let isEditMode = false;
    let currentUser = null;
    let currentManager = null;
    
    // Initialize
    async function init() {
      await loadUserData();
      loadSessionData();
      loadHistory();
      attachEventListeners();
    }
    
    async function loadUserData() {
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          const data = await response.json();
          currentUser = data;
          document.getElementById('confirmSender').textContent = data.email || 'testuser@example.com';
          
          // Load manager info
          const managerResponse = await fetch(`/api/manager?userId=${data.id}`);
          if (managerResponse.ok) {
            const managerData = await managerResponse.json();
            currentManager = managerData;
            document.getElementById('confirmManager').textContent = `${managerData.name} <${managerData.email}>`;
          }
        }
      } catch (error) {
        console.error('Error loading user data:', error);
        // Set default values for testing
        currentUser = { id: 'user1', email: 'testuser@example.com', name: 'Test User' };
        currentManager = { name: '部長', email: 'bucho@example.com' };
        document.getElementById('confirmSender').textContent = 'testuser@example.com';
        document.getElementById('confirmManager').textContent = '部長 <bucho@example.com>';
      }
    }
    
    function loadSessionData() {
      const saved = sessionStorage.getItem('reportFormData');
      if (saved) {
        const data = JSON.parse(saved);
        reportDateField.value = data.reportDate || '';
        departmentField.value = data.department || '';
        yesterdayField.value = data.yesterday || '';
        todayField.value = data.today || '';
        issuesField.value = data.issues || '';
      }
    }
    
    function saveSessionData() {
      const data = {
        reportDate: reportDateField.value,
        department: departmentField.value,
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value
      };
      sessionStorage.setItem('reportFormData', JSON.stringify(data));
    }
    
    function attachEventListeners() {
      editBtn.addEventListener('click', enableEditMode);
      draftBtn.addEventListener('click', saveDraft);
      reportForm.addEventListener('submit', handleSubmit);
      cancelBtn.addEventListener('click', closeConfirmModal);
      confirmBtn.addEventListener('click', confirmSubmit);
      
      // Save session data on input
      [reportDateField, departmentField, yesterdayField, todayField, issuesField].forEach(field => {
        field.addEventListener('change', saveSessionData);
        field.addEventListener('input', saveSessionData);
      });
    }
    
    function enableEditMode() {
      isEditMode = true;
      yesterdayField.disabled = false;
      todayField.disabled = false;
      issuesField.disabled = false;
      editBtn.style.display = 'none';
    }
    
    async function saveDraft() {
      const data = {
        reportDate: reportDateField.value,
        department: departmentField.value,
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        status: 'draft',
        userId: currentUser?.id || 'user1',
        timestamp: new Date().toISOString()
      };
      
      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          showSuccessMessage('下書きが保存されました');
          loadHistory();
        }
      } catch (error) {
        console.error('Error saving draft:', error);
      }
    }
    
    function handleSubmit(e) {
      e.preventDefault();
      clearErrors();
      
      // Validation
      let hasError = false;
      
      if (!reportDateField.value) {
        showError('dateError', '報告日付を選択してください');
        hasError = true;
      }
      
      if (!departmentField.value) {
        showError('departmentError', '部門を選択してください');
        hasError = true;
      }
      
      if (!yesterdayField.value && !todayField.value && !issuesField.value) {
        showError('yesterdayError', '報告内容を入力してください');
        hasError = true;
      }
      
      if (hasError) return;
      
      // Show confirmation modal
      document.getElementById('confirmYesterday').textContent = yesterdayField.value || '(未入力)';
      document.getElementById('confirmToday').textContent = todayField.value || '(未入力)';
      document.getElementById('confirmIssues').textContent = issuesField.value || '(未入力)';
      
      confirmModal.classList.add('show');
    }
    
    function closeConfirmModal() {
      confirmModal.classList.remove('show');
    }
    
    async function confirmSubmit() {
      const data = {
        reportDate: reportDateField.value,
        department: departmentField.value,
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        status: 'sent',
        userId: currentUser?.id || 'user1',
        senderEmail: currentUser?.email || 'testuser@example.com',
        managerEmail: currentManager?.email || 'bucho@example.com',
        timestamp: new Date().toISOString()
      };
      
      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          closeConfirmModal();
          showSuccessMessage('送信完了しました');
          
          // Clear form
          yesterdayField.value = '';
          todayField.value = '';
          issuesField.value = '';
          yesterdayField.disabled = true;
          todayField.disabled = true;
          issuesField.disabled = true;
          editBtn.style.display = 'inline-block';
          isEditMode = false;
          
          // Clear session
          sessionStorage.removeItem('reportFormData');
          
          // Reload history
          loadHistory();
        }
      } catch (error) {
        console.error('Error submitting report:', error);
      }
    }
    
    async function loadHistory() {
      try {
        const response = await fetch('/api/reports');
        if (response.ok) {
          const reports = await response.json();
          const sentReports = reports.filter(r => r.status === 'sent').sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          
          if (sentReports.length === 0) {
            historyList.innerHTML = '<div class="empty-message">送信履歴はありません</div>';
          } else {
            historyList.innerHTML = sentReports.map(report => `
              <div class="history-item">
                <div class="history-item-header">
                  <span>送信日時: ${formatDateTime(report.timestamp)}</span>
                  <span>ステータス: 送信済</span>
                </div>
                <div class="history-item-content">
                  <p><strong>昨日やったこと:</strong> ${report.yesterday || '(未入力)'}</p>
                  <p><strong>今日やること:</strong> ${report.today || '(未入力)'}</p>
                  <p><strong>抱えている課題:</strong> ${report.issues || '(未入力)'}</p>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (error) {
        console.error('Error loading history:', error);
      }
    }
    
    function formatDateTime(isoString) {
      const date = new Date(isoString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
    }
    
    function showError(elementId, message) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.classList.add('show');
    }
    
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }
    
    function showSuccessMessage(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
    }
    
    init();
  </script>
</body>
</html>
