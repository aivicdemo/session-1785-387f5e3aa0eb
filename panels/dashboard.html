<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .deadline-section p {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #f9f9f9;
    }
    .summary-table thead {
      background-color: #007bff;
      color: white;
    }
    .summary-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #ddd;
    }
    .summary-table td {
      padding: 15px;
      border: 1px solid #ddd;
    }
    .summary-table tbody tr:hover {
      background-color: #f0f0f0;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
      transition: width 0.3s ease;
    }
    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <p id="deadline">毎日 18:00 まで</p>
    </div>

    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
        </tbody>
      </table>
    </div>

    <a href="./daily-report.html" class="nav-link">日報入力・送信へ</a>
  </div>

  <script>
    // ダッシュボード初期化
    function initDashboard() {
      loadSummary();
    }

    // 部門別提出状況を読み込み
    function loadSummary() {
      const departments = [
        { name: '営業部', submitted: 8, total: 10 },
        { name: '企画部', submitted: 7, total: 10 },
        { name: '技術部', submitted: 9, total: 10 },
        { name: '管理部', submitted: 6, total: 10 }
      ];

      const summaryBody = document.getElementById('summaryBody');
      summaryBody.innerHTML = departments.map(dept => {
        const unsubmitted = dept.total - dept.submitted;
        const rate = Math.round((dept.submitted / dept.total) * 100);
        return `
          <tr>
            <td>${dept.name}</td>
            <td>${dept.submitted}</td>
            <td>${unsubmitted}</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    initDashboard();
  </script>
</body>
</html>
