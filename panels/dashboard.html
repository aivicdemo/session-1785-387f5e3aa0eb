<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: bold;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .btn-report {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 20px;
      transition: background-color 0.3s;
    }
    .btn-report:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadline">本日 18:00</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table id="summaryTable">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td colspan="4" style="text-align: center; color: #999;">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <a href="./daily-report.html" class="btn-report">日報を入力・送信する</a>
  </div>
  
  <script>
    // ダッシュボード情報を読み込む
    async function loadDashboard() {
      try {
        const response = await fetch('/api/dashboard');
        const data = await response.json();
        
        // 提出期限を表示
        const deadline = new Date();
        deadline.setHours(18, 0, 0, 0);
        document.getElementById('deadline').textContent = deadline.toLocaleString('ja-JP', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
        
        // 部門別提出状況を表示
        const summaryBody = document.getElementById('summaryBody');
        summaryBody.innerHTML = '';
        
        if (data.departments && data.departments.length > 0) {
          data.departments.forEach(dept => {
            const total = dept.submitted + dept.notSubmitted;
            const rate = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${dept.name}</td>
              <td>${dept.submitted}</td>
              <td>${dept.notSubmitted}</td>
              <td>${rate}%</td>
            `;
            summaryBody.appendChild(row);
          });
        } else {
          summaryBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">データがありません</td></tr>';
        }
      } catch (error) {
        console.error('Failed to load dashboard:', error);
        document.getElementById('summaryBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">読み込みに失敗しました</td></tr>';
      }
    }
    
    loadDashboard();
  </script>
</body>
</html>
