<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .deadline-text {
            color: #856404;
            font-size: 18px;
            font-weight: 600;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .summary-table thead {
            background-color: #f9f9f9;
            border-bottom: 2px solid #ddd;
        }
        .summary-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
            color: #666;
            font-size: 14px;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .submission-rate {
            font-weight: 600;
            color: #27ae60;
        }
        .submission-rate.low {
            color: #e74c3c;
        }
        .nav-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        .nav-buttons button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: all 0.3s ease;
        }
        .nav-buttons button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadlineText">本日 18:00</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td>営業部</td>
                        <td>8</td>
                        <td>2</td>
                        <td class="submission-rate">80%</td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td>6</td>
                        <td>1</td>
                        <td class="submission-rate">86%</td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td>9</td>
                        <td>3</td>
                        <td class="submission-rate">75%</td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td>5</td>
                        <td>0</td>
                        <td class="submission-rate">100%</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="nav-buttons">
            <button onclick="window.location.href='./daily-report.html'">日報入力に戻る</button>
        </div>
    </div>
    
    <script>
        // Initialize deadline
        function initDeadline() {
            const today = new Date();
            const deadlineHour = 18;
            const deadlineMinute = 0;
            const deadlineText = `本日 ${String(deadlineHour).padStart(2, '0')}:${String(deadlineMinute).padStart(2, '0')}`;
            document.getElementById('deadlineText').textContent = deadlineText;
        }
        
        // Initialize on load
        initDeadline();
    </script>
</body>
</html>
