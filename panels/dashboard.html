<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-section p {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #f9f9f9;
    }
    .summary-table thead {
      background-color: #007bff;
      color: white;
    }
    .summary-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #ddd;
    }
    .summary-table td {
      padding: 15px;
      border: 1px solid #ddd;
    }
    .summary-table tbody tr:hover {
      background-color: #f0f0f0;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <p id="deadlineText">本日 18:00 まで</p>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td>営業部</td>
            <td><span id="sales-count">0</span> / <span id="sales-total">10</span></td>
            <td><span id="sales-rate">0</span>%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="sales-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>企画部</td>
            <td><span id="planning-count">0</span> / <span id="planning-total">8</span></td>
            <td><span id="planning-rate">0</span>%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="planning-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>開発部</td>
            <td><span id="dev-count">0</span> / <span id="dev-total">12</span></td>
            <td><span id="dev-rate">0</span>%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="dev-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>管理部</td>
            <td><span id="admin-count">0</span> / <span id="admin-total">5</span></td>
            <td><span id="admin-rate">0</span>%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" id="admin-progress" style="width: 0%">0%</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <a href="./daily-report.html" class="nav-button">日報入力・送信画面へ</a>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      updateDashboard();
    });
    
    function updateDashboard() {
      // 部門ごとの提出状況を計算
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      
      const departments = {
        '営業部': { total: 10, submitted: new Set() },
        '企画部': { total: 8, submitted: new Set() },
        '開発部': { total: 12, submitted: new Set() },
        '管理部': { total: 5, submitted: new Set() }
      };
      
      // 提出履歴から部門ごとの提出者を集計
      history.forEach(report => {
        if (departments[report.department]) {
          departments[report.department].submitted.add(report.submittedBy);
        }
      });
      
      // UI を更新
      const deptMap = {
        '営業部': 'sales',
        '企画部': 'planning',
        '開発部': 'dev',
        '管理部': 'admin'
      };
      
      Object.entries(departments).forEach(([deptName, data]) => {
        const key = deptMap[deptName];
        const submitted = data.submitted.size;
        const total = data.total;
        const rate = Math.round((submitted / total) * 100);
        
        document.getElementById(`${key}-count`).textContent = submitted;
        document.getElementById(`${key}-total`).textContent = total;
        document.getElementById(`${key}-rate`).textContent = rate;
        document.getElementById(`${key}-progress`).style.width = rate + '%';
        document.getElementById(`${key}-progress`).textContent = rate + '%';
      });
    }
  </script>
</body>
</html>
