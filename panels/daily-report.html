<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .required {
            color: #e74c3c;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: flex-start;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background-color: #229954;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ecf0f1;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .nav-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        .nav-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reportDate">報告日付 <span class="required">*</span></label>
                        <input type="date" id="reportDate" name="reportDate" required>
                        <div class="error-message" id="dateError">報告日付を選択してください</div>
                    </div>
                    <div class="form-group">
                        <label for="department">部門 <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">-- 選択してください --</option>
                            <option value="営業部">営業部</option>
                            <option value="企画部">企画部</option>
                            <option value="技術部">技術部</option>
                            <option value="管理部">管理部</option>
                        </select>
                        <div class="error-message" id="departmentError">部門を選択してください</div>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group form-row full">
                    <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="contentError">報告内容を入力してください</div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group form-row full">
                    <label for="today">今日やること <span class="required">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group form-row full">
                    <label for="issues">抱えている課題 <span class="required">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
                <button type="button" id="dashboardBtn" class="btn-secondary">ダッシュボード</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #666;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const dashboardBtn = document.getElementById('dashboardBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentInput = document.getElementById('department');
        const yesterdayInput = document.getElementById('yesterday');
        const todayInput = document.getElementById('today');
        const issuesInput = document.getElementById('issues');
        const historyList = document.getElementById('historyList');
        
        let isEditMode = false;
        let pendingSubmit = null;
        
        // Initialize
        function init() {
            loadDraft();
            loadHistory();
            restoreFormState();
        }
        
        // Load draft from localStorage
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                yesterdayInput.value = data.yesterday || '';
                todayInput.value = data.today || '';
                issuesInput.value = data.issues || '';
            }
        }
        
        // Restore form state (date and department)
        function restoreFormState() {
            const state = sessionStorage.getItem('reportFormState');
            if (state) {
                const data = JSON.parse(state);
                reportDateInput.value = data.reportDate || '';
                departmentInput.value = data.department || '';
            }
        }
        
        // Save form state
        function saveFormState() {
            const state = {
                reportDate: reportDateInput.value,
                department: departmentInput.value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }
        
        // Load history from localStorage
        function loadHistory() {
            const history = localStorage.getItem('reportHistory');
            if (history) {
                const items = JSON.parse(history);
                if (items.length > 0) {
                    historyList.innerHTML = '';
                    items.forEach(item => {
                        const historyItem = document.createElement('div');
                        historyItem.className = 'history-item';
                        historyItem.innerHTML = `
                            <div class="history-item-header">
                                <span class="history-item-date">${item.date}</span>
                                <span class="history-item-status">送信済</span>
                            </div>
                            <div class="history-item-content">
                                <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                                <p><strong>今日やること:</strong> ${item.today}</p>
                                <p><strong>抱えている課題:</strong> ${item.issues}</p>
                            </div>
                        `;
                        historyList.appendChild(historyItem);
                    });
                }
            }
        }
        
        // Edit button
        editBtn.addEventListener('click', () => {
            isEditMode = true;
            yesterdayInput.disabled = false;
            todayInput.disabled = false;
            issuesInput.disabled = false;
            editBtn.style.display = 'none';
        });
        
        // Draft save button
        draftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const draft = {
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            showSuccess('下書きを保存しました');
        });
        
        // Dashboard button
        dashboardBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = './dashboard.html';
        });
        
        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');
            
            // Validate
            let isValid = true;
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentInput.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayInput.value.trim() || !todayInput.value.trim() || !issuesInput.value.trim()) {
                document.getElementById('contentError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Save form state
            saveFormState();
            
            // Show confirmation modal
            showConfirmModal();
        });
        
        // Show confirmation modal
        function showConfirmModal() {
            document.getElementById('confirmYesterday').textContent = yesterdayInput.value.substring(0, 100);
            document.getElementById('confirmToday').textContent = todayInput.value.substring(0, 100);
            document.getElementById('confirmIssues').textContent = issuesInput.value.substring(0, 100);
            document.getElementById('confirmSender').textContent = 'testuser@example.com';
            document.getElementById('confirmManager').textContent = '部長 <bucho@example.com>';
            confirmModal.classList.add('show');
        }
        
        // Cancel button
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        // Confirm button
        confirmBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            submitReport();
        });
        
        // Submit report
        function submitReport() {
            const now = new Date();
            const dateStr = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            const historyItem = {
                date: dateStr,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value,
                sender: 'testuser@example.com'
            };
            
            let history = [];
            const existingHistory = localStorage.getItem('reportHistory');
            if (existingHistory) {
                history = JSON.parse(existingHistory);
            }
            history.unshift(historyItem);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear draft
            localStorage.removeItem('reportDraft');
            
            // Clear form
            yesterdayInput.value = '';
            todayInput.value = '';
            issuesInput.value = '';
            yesterdayInput.disabled = true;
            todayInput.disabled = true;
            issuesInput.disabled = true;
            isEditMode = false;
            editBtn.style.display = 'inline-block';
            
            // Show success message
            showSuccess('送信完了しました');
            
            // Reload history
            loadHistory();
        }
        
        // Show success message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // Track form changes
        reportDateInput.addEventListener('change', saveFormState);
        departmentInput.addEventListener('change', saveFormState);
        
        // Initialize on load
        init();
    </script>
</body>
</html>
