:root {

  --radius-card: 6px;
  --radius-control: 4px;
  --border-width: 1px;
  --control-height: 36px;
  --space-unit: 8px;

  --shadow-card: 0 2px 8px rgba(62, 59, 56, 0.08), 0 1px 3px rgba(62, 59, 56, 0.04);

  --motion-duration: 200ms;

  --surface-texture: 
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 2px,
      rgba(139, 111, 71, 0.02) 2px,
      rgba(139, 111, 71, 0.02) 4px

    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(139, 111, 71, 0.01) 1px,
      rgba(139, 111, 71, 0.01) 2px
    );
  --surface-texture-size: 100% 100%;
  --surface-texture-position: 0 0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-family);
  color: var(--text);
  background: var(--bg-main);
}

body {
  display: flex;
  flex-direction: column;
}

.shell-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.header {
  background: var(--top-bar-bg);
  border-bottom: var(--border-width) solid var(--top-bar-border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  height: 56px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.header-brand {
  color: var(--primary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-name {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}

.logout-link {
  font-size: 12px;
  color: var(--primary);
  text-decoration: none;
  border: var(--border-width) solid var(--border);
  padding: 4px 8px;
  border-radius: var(--radius-control);
  transition: background var(--motion-duration);
}

.logout-link:hover {
  background: rgba(139, 111, 71, 0.08);
}

.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 64px;
}

.nav-bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border-top: var(--border-width) solid var(--border);
  display: flex;
  justify-content: space-around;
  height: 64px;
  z-index: 100;
  flex-shrink: 0;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  transition: color var(--motion-duration);
  border-top: 3px solid transparent;
}

.nav-item:hover {
  color: var(--text);
}

.nav-item.aivic-active {
  color: var(--primary);
  border-top-color: var(--primary);
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
}

[data-aivic-panel] {
  display: block;
}

T09:45:00+09:00"},{"報告ID":"rec-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-mfg-001","報告者ID":"usr-yamada-002","報告内容":"昨日の生産ラインA・Bの稼働率が平均58%に低下しました。主な原因は仕入先からの部品供給遅延で、特にモータユニットの納入が予定より3日遅れています。現在、ラインCで代替部品を活用した生産調整を進めており、本日中に稼働率を70%まで回復させる見込みです。","進捗状況":"遅延","課題":"①モータユニット供給元の納期遅延（予定：1月13日→実績：1月16日予定）②代替部品の品質検査に予想外の時間を要している③作業員の残業時間が増加傾向（先週平均12時間/人）","対応予定":"本日中に仕入先と納期確認の緊急会議を実施。並行して、代替仕入先2社への発注を進める。品質検査プロセスの簡略化について品質管理部と協議予定。作業員の負担軽減のため、臨時配置要員の手配を人事部に依頼。1月17日までに稼働率を85%以上に回復させる。","作成日時":"2025-01-15T08:35:00+09:00","更新日時":"2025-01-15T08:35:00+09:00"},{"報告ID":"rec-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-004","報告者ID":"user-0127","報告内容":"新商品開発プロジェクト『スマートウォーター』の進捗報告です。現在、基本設計フェーズを実施中ですが、予定していた試作品の初期テストで予想外の技術課題が発生しました。当初は1月中旬の試作品完成予定でしたが、現在2月上旬へのずれ込みが確実な状況です。チーム内での協議の結果、並行開発を加速させるため、追加のエンジニアリソースが必要と判断されました。","進捗状況":"遅延","課題":"1. センサー精度の想定値との乖離により、回路設計の見直しが必要。2. 現在のチーム構成（エンジニア3名）では並行開発が困難。3. 試作品テストの外注先の納期が予定より2週間遅延。","対応予定":"1. センサー仕様の再検討と代替品の評価を1月20日までに完了。2. エンジニア2名の追加配置を経営層に申請（予算影響額：月額280万円）。3. 外注先との納期交渉を本日中に実施。4. スケジュール調整案を1月17日の経営会議で報告。","作成日時":"2025-01-15T08:35:00+09:00","更新日時":"2025-01-15T08:35:00+09:00"},{"報告ID":"rec-20250115-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-qa-001","報告者ID":"user-suzuki-hanako","報告内容":"1月度の不良品率が前月比1.8%増加し、現在3.2%に達しています。主な不良内容は溶接部の気泡混入が全体の45%、寸法超過が30%、表面傷が25%となっており、特に溶接部の品質低下が顕著です。原因調査チームは製造ラインAの溶接機械の校正ズレを疑い、現在検証中です。","進捗状況":"遅延","課題":"溶接機械の定期メンテナンス周期が延長されていた可能性。また、新入社員の配置に伴う作業精度のばらつき。外注先での品質管理基準の統一が不十分。","対応予定":"本日中に溶接機械A・B・Cの全台校正実施。新入社員向けの集中研修を1月20日に実施。外注先との品質基準の再確認会議を1月17日に開催。2月末までに不良品率を2.0%以下に改善する目標。","作成日時":"2025-01-15T08:35:00+09:00","更新日時":"2025-01-15T08:35:00+09:00"},{"報告ID":"rec-20250117-001","報告日":"2025-01-17T09:30:00+09:00","部門ID":"dept-sales-001","報告者ID":"user-yamada-taro","報告内容":"既存顧客A社との年間契約更新交渉を進捗中。現在、契約金額の5%削減要求に対して、サービス範囲の最適化提案で対応中。また、解約リスク顧客として分類されているB社（昨年売上高の12%を占める）に対して、営業担当者による定期訪問を開始し、顧客満足度調査を実施した。C社からは契約継続の意向を得られた。","進捗状況":"遅延","課題":"A社との価格交渉が難航しており、契約更新期限まで2週間となっている。B社は競合他社からの提案を検討中との情報があり、早急な対応が必要。営業チーム内でのリソース不足により、新規案件との並行対応が困難な状況。","対応予定":"本日中にA社への改訂提案書を提出予定。B社に対しては、営業部長による経営層訪問を来週実施し、カスタマイズ提案を提示する。また、営業支援チームを臨時配置してリソース強化を図る。進捗状況は毎日17時に営業会議で共有する。","作成日時":"2025-01-17T09:35:00+09:00","更新日時":"2025-01-17T09:35:00+09:00"},{"報告ID":"rec-20250115-001","報告日":"2025-01-15T08:30:00+09:00","部門ID":"dept-logistics-001","報告者ID":"user-20240601-045","報告内容":"1月度の配送実績について報告します。先月は関東地区での配送遅延が相次ぎ、顧客クレームが前月比で23件増加しました。主な原因は悪天候による道路渋滞と配車効率の低下です。現在、配車最適化システムの実装を進めており、ルート検索エンジンの導入は予定通り進行中です。","進捗状況":"遅延","課題":"配送遅延に伴う顧客クレーム件数が増加（前月比+23件）。関東エリアの配車効率が目標値の82%に留まっている。配車最適化システムの導入予定日が2月末から3月中旬にずれ込む可能性がある。ドライバーの労務管理も課題。","対応予定":"1月中にAIベースのルート最適化ツール（ベンダー：LogiTech Solutions）の試験運用を関東地区で開始する。配送遅延の原因分析レポートを1月20日までに完成させ、営業部と共有する。顧客対応チームの増員を検討し、クレーム対応時間を短縮する。2月末までに配車最適化システムの本実装を完了し、配車効率を90%以上に改善する目標。","作成日時":"2025-01-15T08:35:12+09:00","更新日時":"2025-01-15T08:35:12+09:00"},{"報告ID":"rec-20250114-001","報告日":"2025-01-14T08:30:00+09:00","部門ID":"dept-hr-001","報告者ID":"user-hr-yamada-001","報告内容":"2025年1月期新入社員研修（第12期生、配属予定者45名）の進行状況を報告いたします。現在、基礎研修フェーズ2週目に入り、ビジネスマナー研修と社内システム研修を実施中です。出席率は98%（44名）で、1名が体調不良で本日欠席しています。昨年度離職者フォローアップについては、2024年度中途退職者8名のうち、再入社希望者が2名おり、面談を進めております。","進捗状況":"予定通り","課題":"新入社員研修の宿泊施設確保が2月の後半研修で逼迫している状況です。また、昨年度離職者のうち3名からは理由ヒアリングの回答がまだ得られておらず、組織改善への反映が遅延しています。","対応予定":"宿泊施設については本週中に複数候補地を確保する予定です。離職者ヒアリングについては、1月末までに全員からの回答取得を目標に、再度連絡を取ります。また、離職理由分析結果は2月の人事戦略会議で報告予定です。","作成日時":"2025-01-14T08:45:00+09:00","更新日時":"2025-01-14T08:45:00+09:00"},{"報告ID":"rec-20250115-sys-001","報告日":"2025-01-15T09:30:00+09:00","部門ID":"dept-sys-001","報告者ID":"user-yamada-hanako-001","報告内容":"1月14日午後2時30分に発生した基幹システムの決済処理機能の障害について、復旧作業を実施いたしました。原因はデータベースの接続プール枯渇であり、午後4時15分に完全復旧いたしました。影響範囲は決済処理機能のみで、約2時間30分のダウンタイムが発生し、未処理件数は約1,200件でした。復旧後の検証を完了し、現在は正常に稼働しております。","進捗状況":"完了","課題":"今回の障害の根本原因は、接続プールの設定値が実際の負荷に対応していなかったことです。また、監視アラートの閾値設定が適切でなく、障害の早期発見ができませんでした。さらに、復旧手順書が最新化されていなかったため、初期対応に時間を要しました。","対応予定":"1月20日までに接続プール設定の最適化を実施します。1月22日までに監視アラート設定の見直しと新しい監視ルールの導入を完了します。1月29日までに障害対応マニュアルを最新化し、全システム部員への教育を実施予定です。また、2月中旬に再発防止策の有効性確認テストを実施いたします。","作成日時":"2025-01-15T09:35:00+09:00","更新日時":"2025-01-15T09:35:00+09:00"},{"報告ID":"rec-001","報告日":"2024-11-15T09:30:00+09:00","部門ID":"dept-sales-planning","報告者ID":"user-yamamoto-hanako","報告内容":"市場競争激化に対応した価格戦略の見直しについて、競合他社の価格動向調査を完了いたしました。当社の主力製品3品目について、競合比較分析の結果、平均で8～12%の価格差が生じていることが判明しました。特にエントリーモデルでの競争力低下が顕著です。今月中に価格改定案を3パターン作成し、営業部門との協議を予定しています。","進捗状況":"予定通り","課題":"競合他社の価格改定が頻繁に行われており、調査データの鮮度維持が困難。また、原材料費の上昇により利益率維持との両立が課題となっています。営業部門からは値下げによる受注増加への期待が高く、経営層との調整が必要です。","対応予定":"11月20日までに価格改定案3パターン（攻撃的値下げ、段階的値下げ、高付加価値戦略）を作成。11月22日に営業部・経営企画部との合同会議を開催し、市場シェア予測と利益シミュレーションを提示して方針決定を行う予定です。","作成日時":"2024-11-15T09:35:00+09:00","更新日時":"2024-11-15T09:35:00+09:00"}],"報告送信履歴":[{"送信履歴ID":"rec-001","朝会報告ID":"rec-042","ユーザーID":"rec-015","送信日時":"2024-11-15T09:30:45+09:00","送信ステータス":"成功","エラーメッセージ":null,"作成日時":"2024-11-15T09:30:45+09:00","更新日時":"2024-11-15T09:30:45+09:00"},{"送信履歴ID":"rec-20250115-0847","朝会報告ID":"rec-20250115-0001","ユーザーID":"rec-user-2024-0156","送信日時":"2025-01-15T09:30:45+09:00","送信ステータス":"失敗","エラーメッセージ":"ネットワーク接続タイムアウト: 送信サーバーへの接続に失敗しました。接続試行回数: 3回、最終エラーコード: ECONNREFUSED","作成日時":"2025-01-15T09:30:45+09:00","更新日時":"2025-01-15T09:35:12+09:00"},{"送信履歴ID":"rec-001","朝会報告ID":"rec-042","ユーザーID":"rec-108","送信日時":"2024-11-15 09:30:45","送信ステータス":"失敗","エラーメッセージ":"データベース接続タイムアウト: メールサーバーへの接続に失敗しました。リトライ回数が上限に達しました。","作成日時":"2024-11-15 09:30:45","更新日時":"2024-11-15 09:31:12"},{"送信履歴ID":"rec-20250115-7842","朝会報告ID":"rec-20250115-5291","ユーザーID":"rec-user-3847","送信日時":"2025-01-15 09:45:32","送信ステータス":"失敗","エラーメッセージ":"送信タイムアウト: 報告サーバーへの接続が300秒以内に完了しませんでした。ネットワークの遅延またはサーバーの応答不可が考えられます。","作成日時":"2025-01-15 09:15:00","更新日時":"2025-01-15 09:50:15"},{"送信履歴ID":"rec-001","朝会報告ID":"rec-042","ユーザーID":"rec-015","送信日時":"2024-11-15 09:23:45","送信ステータス":"保留中","エラーメッセージ":"ユーザーにより送信が一時中断されました。再度の送信操作をお待ちしています。","作成日時":"2024-11-15 09:15:30","更新日時":"2024-11-15 09:23:45"},[{"送信履歴ID":"rec-001","朝会報告ID":"rep-2024-0847","ユーザーID":"usr-tanaka-001","送信日時":"2024-11-15 window.AIVIC_PAGE_INIT_JS = "js\nfunction(container, apiUrl, tables) {\n  const departmentFilter = container.querySelector('[data-testid=\"department-filter\"]');\n  const submissionChart = container.querySelector('#submission-chart');\n  const pendingTbody = container.querySelector('#pending-tbody');\n  const pendingCount = container.querySelector('[data-testid=\"pending-count\"]');\n  const notifyButton = container.querySelector('[data-testid=\"notify-button\"]');\n  const notifyDialog = container.querySelector('#notify-dialog');\n  const notifyConfirmBtn = container.querySelector('[data-testid=\"notify-confirm-button\"]');\n  const notifyCancelBtn = container.querySelector('[data-testid=\"notify-cancel-button\"]');\n  const notifyCountText = container.querySelector('[data-testid=\"notify-count-text\"]');\n  const inputReportBtn = container.querySelector('[data-testid=\"input-report-button\"]');\n  const viewHistoryBtn = container.querySelector('[data-testid=\"view-history-button\"]');\n\n  let allReports = [];\n  let allUsers = [];\n  let allDepartments = [];\n  let selectedPendingUsers = [];\n\n  async function loadData() {\n    try {\n      allUsers = await window.aivicApi.list(0) || [];\n      allDepartments = await window.aivicApi.list(1) || [];\n      allReports = await window.aivicApi.list(2) || [];\n      renderDashboard();\n    } catch (e) {\n      console.error('Data load error:', e);\n      window.aivicNotify.error('データの読み込みに失敗しました');\n    }\n  }\n\n  function renderDashboard() {\n    const selectedDept = departmentFilter ? departmentFilter.value : '';\n    const filteredUsers = selectedDept \n      ? allUsers.filter(u => u.部門 === selectedDept)\n      : allUsers;\n\n    renderSubmissionChart(filteredUsers);\n    renderPendingList(filteredUsers);\n    updatePendingCount(filteredUsers);\n  }\n\n  function renderSubmissionChart(users) {\n    if (!submissionChart) return;\n    submissionChart.innerHTML = '';\n    \n    const deptMap = {};\n    users.forEach(u => {\n      const dept = u.部門 || '未分類';\n      if (!deptMap[dept]) deptMap[dept] = { total: 0, submitted: 0 };\n      deptMap[dept].total++;\n      const hasReport = allReports.some(r => r.報告者ID === u.ユーザーID);\n      if (hasReport) deptMap[dept].submitted++;\n    });\n\n    Object.entries(deptMap).forEach(([dept, data]) => {\n      const rate = data.total > 0 ? Math.round((data.submitted / data.total) * 100) : 0;\n      const row = document.createElement('div');\n      row.style.cssText = 'display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px;';\n      row.innerHTML = `\n        <div style=\"width: 60px; color: var(--text-muted);\">${dept}</div>\n        <div style=\"flex: 1; height: 20px; background: var(--bg-main); border-radius: 2px; overflow: hidden; position: relative;\">\n          <div style=\"height: 100%; width: ${rate}%; background: var(--primary); transition: width 0.3s;\"></div>\n        </div>\n        <div style=\"width: 50px; text-align: right; color: var(--text); font-weight: 600;\">${data.submitted}/${data.total}</div>\n        <div style=\"width: 40px; text-align: right; color: var(--text-muted);\">${rate}%</div>\n      `;\n      submissionChart.appendChild(row);\n    });\n  }\n\n  function renderPendingList(users) {\n    if (!pendingTbody) return;\n    pendingTbody.innerHTML = '';\n\n    const unsubmittedUsers = users.filter(u => !allReports.some(r => r.報告者ID === u.ユーザーID));\n    selectedPendingUsers = unsubmittedUsers;\n\n    unsubmittedUsers.forEach(user => {\n      const row = document.createElement('tr');\n      row.style.cssText = 'border-bottom: 1px solid var(--border);';\n      row.innerHTML = `\n        <td style=\"padding: 8px 12px; font-size: 12px;\">\n          <input type=\"checkbox\" class=\"pending-checkbox\" data-user-id=\"${user.ユーザーID}\" style=\"margin-right: 8px;\">\n          ${user.ユーザー名 || user.ユーザーID}\n        </td>\n        <td style=\"padding: 8px 12px; font-size: 12px; color: var(--text-muted);\">${user.部門 || '未分類'}</td>\n        <td style=\"padding: 8px 12px; font-size: 12px; text-align: right;\">\n          <button class=\"detail-btn\" data-user-id=\"${user.ユーザーID}\" style=\"background: none; border: none; color: var(--primary); cursor: pointer; text-decoration: underline;\">詳細表示</button>\n        </td>\n      `;\n      pendingTbody.appendChild(row);\n    });\n\n    attachCheckboxListeners();\n    attachDetailButtonListeners();\n  }\n\n  function updatePendingCount(users) {\n    if (!pendingCount) return;\n    const unsubmittedCount = users.filter(u => !allReports.some(r => r.報告者ID === u.ユーザーID)).length;\n    pendingCount.textContent = unsubmittedCount;\n  }\n\n  function attachCheckboxListeners() {\n    const checkboxes = container.querySelectorAll('.pending-checkbox');\n    checkboxes.forEach(checkbox => {\n      checkbox.addEventListener('change', () => {\n        const checkedBoxes = container.querySelectorAll('.pending-checkbox:checked');\n        if (notifyCountText) {\n          notifyCountText.textContent = `${checkedBoxes.length}名に通知を送信します`;\n        }\n      });\n    });\n  }\n\n  function attachDetailButtonListeners() {\n    const detailBtns = container.querySelectorAll('.detail-btn');\n    detailBtns.forEach(btn => {\n      btn.addEventListener('click', async (e) => {\n        e.preventDefault();\n        const userId = btn.getAttribute('data-user-id');\n        try {\n          window.showScreen('scr-1785921357094', { userId: userId });\n        } catch (err) {\n          console.error('Navigation error:', err);\n          window.aivicNotify.error('詳細画面への遷移に失敗しました');\n        }\n      });\n    });\n  }\n\n  if (departmentFilter) {\n    departmentFilter.addEventListener('change', () => {\n      renderDashboard();\n    });\n  }\n\n  if (notifyButton) {\n    notifyButton.addEventListener('click', () => {\n      const checkedBoxes = container.querySelectorAll('.pending-checkbox:checked');\n      if (checkedBoxes.length === 0) {\n        window.aivicNotify.error('通知対象を選択してください');\n        return;\n      }\n      if (notifyDialog) {\n        notifyDialog.style.display = 'block';\n      }\n    });\n  }\n\n  if (notifyConfirmBtn) {\n    notifyConfirmBtn.addEventListener('click', async () => {\n      try {\n        const checkedBoxes = container.querySelectorAll('.pending-checkbox:checked');\n        const selectedUserIds = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-user-id'));\n        \n        const selectedUsers = allUsers.filter(u => selectedUserIds.includes(u.ユーザーID));\n        \n        for (const user of selectedUsers) {\n          await window.aivicApi.save(3, {\n            受信者ID: user.ユーザーID,\n            受信者名: user.ユーザー名,\n            通知内容: '日報の提出をお願いします',\n            通知日時: new Date().toISOString(),\n            ステータス: '送信済み'\n          });\n        }\n\n        if (notifyDialog) {\n          notifyDialog.style.display = 'none';\n        }\n        \n        window.aivicNotify.success('通知を送信しました');\n        \n        const checkboxes = container.querySelectorAll('.pending-checkbox:checked');\n        checkboxes.forEach(cb => cb.checked = false);\n        \n        renderDashboard();\n      } catch (e) {\n        console.error('Notification send error:', e);\n        window.aivicNotify.error('通知の送信に失敗しました');\n      }\n    });\n  }\n\n  if (notifyCancelBtn) {\n    notifyCancelBtn.addEventListener('click', () => {\n      if (notifyDialog) {\n        notifyDialog.style.display = 'none';\n      }\n    });\n  }\n\n  if (inputReportBtn) {\n    inputReportBtn.addEventListener('click', () => {\n      try {\n        window.showScreen('scr-1785921335709');\n      } catch (err) {\n        console.error('Navigation error:', err);\n        window.aivicNotify.error('日報入力画面への遷移に失敗しました');\n      }\n    });\n  }\n\n  if (viewHistoryBtn) {\n    viewHistoryBtn.addEventListener('click', () => {\n      try {\n        window.showScreen('scr-1785921357094');\n      } catch (err) {\n        console.error('Navigation error:', err);\n        window.aivicNotify.error('日報照会画面への遷移に失敗しました');\n      }\n    });\n  }\n\n  loadData();\n\n  const refreshInterval = setInterval(() => {\n    loadData();\n  }, 30000);\n\n  return {\n    destroy: () => {\n      clearInterval(refreshInterval);\n    }\n  };\n}";
</script>

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // AI シェルが SPA 用の初期表示処理を持っていても、マルチページでは
    // このファイルに割り当てられた画面だけを表示する。
    document.querySelectorAll('[data-aivic-panel]').forEach(function(panel) {
      var isCurrent = panel.getAttribute('data-aivic-panel') === pageScreenId;
      panel.style.display = isCurrent ? 'block' : 'none';
    });

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
