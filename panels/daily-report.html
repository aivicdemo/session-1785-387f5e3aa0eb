<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
        .user-info p {
            margin: 5px 0;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            border-top: 2px solid #e0e0e0;
            padding-top: 30px;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-item-content p {
            margin: 5px 0;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 14px;
        }
        .edit-button {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <p>ユーザー: <span id="userName">-</span></p>
                <p>メール: <span id="userEmail">-</span></p>
            </div>
        </div>

        <div class="success-message" id="successMessage">送信完了しました</div>

        <form id="reportForm">
            <div class="form-section">
                <h2>基本情報</h2>
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <h2>報告内容</h2>
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                </div>
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                </div>
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                </div>
                <div class="error-message" id="contentError">報告内容を入力してください</div>
                <button type="button" class="btn-warning edit-button" id="editButton">報告内容編集</button>
            </div>

            <div class="button-group">
                <button type="button" class="btn-secondary" id="draftButton">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitButton">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 10px;"><strong>部長:</strong></p>
                <p id="confirmChief" style="margin-left: 10px; color: #333;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelButton">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmButton">確認</button>
            </div>
        </div>
    </div>

    <script>
        // ページロード時の初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await initializePage();
            loadDraft();
            loadHistory();
            setupEventListeners();
        });

        async function initializePage() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('userName').textContent = user.name || '-';
                    document.getElementById('userEmail').textContent = user.email || '-';
                    window.currentUser = user;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Failed to fetch user:', error);
                window.location.href = '/login.html';
            }
        }

        function setupEventListeners() {
            const form = document.getElementById('reportForm');
            const editButton = document.getElementById('editButton');
            const draftButton = document.getElementById('draftButton');
            const submitButton = document.getElementById('submitButton');
            const cancelButton = document.getElementById('cancelButton');
            const confirmButton = document.getElementById('confirmButton');
            const reportDate = document.getElementById('reportDate');
            const department = document.getElementById('department');

            // 日付と部門の変更を保存
            reportDate.addEventListener('change', () => {
                sessionStorage.setItem('reportDate', reportDate.value);
            });

            department.addEventListener('change', () => {
                sessionStorage.setItem('department', department.value);
            });

            // 編集ボタン
            editButton.addEventListener('click', (e) => {
                e.preventDefault();
                enableEditing();
            });

            // 下書き保存
            draftButton.addEventListener('click', (e) => {
                e.preventDefault();
                saveDraft();
            });

            // フォーム送信
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (validateForm()) {
                    showConfirmDialog();
                }
            });

            // 確認ダイアログのボタン
            cancelButton.addEventListener('click', () => {
                document.getElementById('confirmModal').classList.remove('show');
            });

            confirmButton.addEventListener('click', async () => {
                await submitReport();
            });
        }

        function enableEditing() {
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editButton').style.display = 'none';
        }

        function saveDraft() {
            const draft = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value,
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }

        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
                document.getElementById('reportDate').value = data.reportDate || '';
                document.getElementById('department').value = data.department || '';
                sessionStorage.setItem('reportDate', data.reportDate || '');
                sessionStorage.setItem('department', data.department || '');
            }

            // セッションストレージから日付と部門を復元
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDept = sessionStorage.getItem('department');
            if (savedDate) document.getElementById('reportDate').value = savedDate;
            if (savedDept) document.getElementById('department').value = savedDept;
        }

        function validateForm() {
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;

            let isValid = true;

            // エラーメッセージをクリア
            document.getElementById('contentError').classList.remove('show');
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');

            if (!yesterday && !today && !issues) {
                document.getElementById('contentError').classList.add('show');
                isValid = false;
            }

            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }

            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }

            return isValid;
        }

        function showConfirmDialog() {
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            document.getElementById('confirmYesterday').textContent = yesterday || '(未入力)';
            document.getElementById('confirmToday').textContent = today || '(未入力)';
            document.getElementById('confirmIssues').textContent = issues || '(未入力)';
            document.getElementById('confirmSender').textContent = window.currentUser.email || '-';
            document.getElementById('confirmChief').textContent = window.currentUser.chiefName + ' <' + window.currentUser.chiefEmail + '>';

            document.getElementById('confirmModal').classList.add('show');
        }

        async function submitReport() {
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;

            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        reportDate,
                        department,
                        yesterday,
                        today,
                        issues,
                        userId: window.currentUser.id,
                        userEmail: window.currentUser.email
                    })
                });

                if (response.ok) {
                    document.getElementById('confirmModal').classList.remove('show');
                    document.getElementById('successMessage').classList.add('show');
                    
                    // フォームをクリア
                    document.getElementById('reportForm').reset();
                    document.getElementById('yesterday').disabled = true;
                    document.getElementById('today').disabled = true;
                    document.getElementById('issues').disabled = true;
                    document.getElementById('editButton').style.display = 'block';
                    
                    // 下書きを削除
                    localStorage.removeItem('reportDraft');
                    
                    // 履歴を再読み込み
                    setTimeout(() => {
                        loadHistory();
                        document.getElementById('successMessage').classList.remove('show');
                    }, 2000);
                } else {
                    alert('送信に失敗しました');
                }
            } catch (error) {
                console.error('Failed to submit report:', error);
                alert('送信に失敗しました');
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/reports');
                if (response.ok) {
                    const reports = await response.json();
                    const historyList = document.getElementById('historyList');
                    
                    if (reports.length === 0) {
                        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                    } else {
                        historyList.innerHTML = reports.map(report => `
                            <li class="history-item">
                                <div class="history-item-header">
                                    <span class="history-item-date">${formatDateTime(report.submittedAt)}</span>
                                    <span class="history-item-status">送信済</span>
                                </div>
                                <div class="history-item-content">
                                    <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                                    <p><strong>今日やること:</strong> ${report.today}</p>
                                    <p><strong>抱えている課題:</strong> ${report.issues}</p>
                                </div>
                            </li>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
    </script>
</body>
</html>
