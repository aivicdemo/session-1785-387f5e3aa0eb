<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #0b7dda;
    }
    .btn-secondary:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .error-message {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .modal h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 20px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn-confirm {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
    }
    .btn-confirm:hover {
      background-color: #45a049;
    }
    .btn-cancel {
      background-color: #f44336;
      color: white;
      padding: 10px 20px;
    }
    .btn-cancel:hover {
      background-color: #da190b;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .history-empty {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-item {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .history-item-date {
      color: #666;
      font-size: 13px;
    }
    .history-item-status {
      background-color: #4CAF50;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 8px;
    }
    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #2196F3;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="dailyReportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付</label>
          <input type="date" id="reportDate" name="reportDate">
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" name="department">
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-group">
          <label for="yesterday">昨日やったこと</label>
          <textarea id="yesterday" name="yesterday" disabled></textarea>
          <div class="error-message" id="yesterdayError">昨日やったことを入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること</label>
          <textarea id="today" name="today" disabled></textarea>
          <div class="error-message" id="todayError">今日やることを入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題</label>
          <textarea id="issues" name="issues" disabled></textarea>
          <div class="error-message" id="issuesError">抱えている課題を入力してください</div>
        </div>
        
        <div class="error-message" id="contentError">報告内容を入力してください</div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="saveDraftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
        <a href="./dashboard.html" class="nav-link">ダッシュボードへ</a>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent">
        <p><strong>昨日やったこと:</strong> <span id="modalYesterday"></span></p>
        <p><strong>今日やること:</strong> <span id="modalToday"></span></p>
        <p><strong>抱えている課題:</strong> <span id="modalIssues"></span></p>
        <p><strong>送信者:</strong> <span id="modalSender"></span></p>
        <p><strong>部長:</strong> <span id="modalDirector"></span></p>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-confirm" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('dailyReportForm');
    const reportDateInput = document.getElementById('reportDate');
    const departmentSelect = document.getElementById('department');
    const yesterdayTextarea = document.getElementById('yesterday');
    const todayTextarea = document.getElementById('today');
    const issuesTextarea = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const saveDraftBtn = document.getElementById('saveDraftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyContainer = document.getElementById('historyContainer');
    
    let isEditMode = false;
    let currentUser = null;
    let sendHistory = [];
    
    // Initialize
    async function init() {
      // Load current user
      const userStr = localStorage.getItem('currentUser');
      if (userStr) {
        currentUser = JSON.parse(userStr);
      }
      
      // Load draft
      loadDraft();
      
      // Load history
      loadHistory();
      
      // Set date input to today by default
      const today = new Date().toISOString().split('T')[0];
      reportDateInput.value = today;
    }
    
    function loadDraft() {
      const draft = localStorage.getItem('dailyReportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        if (data.reportDate) reportDateInput.value = data.reportDate;
        if (data.department) departmentSelect.value = data.department;
        if (data.yesterday) yesterdayTextarea.value = data.yesterday;
        if (data.today) todayTextarea.value = data.today;
        if (data.issues) issuesTextarea.value = data.issues;
      }
    }
    
    function saveDraft() {
      const draft = {
        reportDate: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value
      };
      localStorage.setItem('dailyReportDraft', JSON.stringify(draft));
    }
    
    function loadHistory() {
      const historyStr = localStorage.getItem('dailyReportHistory');
      if (historyStr) {
        sendHistory = JSON.parse(historyStr);
      }
      renderHistory();
    }
    
    function renderHistory() {
      if (sendHistory.length === 0) {
        historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      
      historyContainer.innerHTML = sendHistory
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
        .map(item => {
          const date = new Date(item.timestamp);
          const dateStr = date.toLocaleString('ja-JP', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
          return `
            <div class="history-item">
              <div class="history-item-header">
                <span class="history-item-date">${dateStr}</span>
                <span class="history-item-status">送信済</span>
              </div>
              <div class="history-item-content">
                <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                <p><strong>今日やること:</strong> ${item.today}</p>
                <p><strong>抱えている課題:</strong> ${item.issues}</p>
              </div>
            </div>
          `;
        })
        .join('');
    }
    
    editBtn.addEventListener('click', () => {
      isEditMode = true;
      yesterdayTextarea.disabled = false;
      todayTextarea.disabled = false;
      issuesTextarea.disabled = false;
      editBtn.disabled = true;
    });
    
    saveDraftBtn.addEventListener('click', (e) => {
      e.preventDefault();
      saveDraft();
      alert('下書きを保存しました');
    });
    
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      // Clear previous errors
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      
      // Validate
      let isValid = true;
      
      if (!reportDateInput.value) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!departmentSelect.value) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      const yesterday = yesterdayTextarea.value.trim();
      const today = todayTextarea.value.trim();
      const issues = issuesTextarea.value.trim();
      
      if (!yesterday && !today && !issues) {
        document.getElementById('contentError').classList.add('show');
        isValid = false;
      }
      
      if (!isValid) return;
      
      // Show confirmation modal
      document.getElementById('modalYesterday').textContent = yesterday || '(未入力)';
      document.getElementById('modalToday').textContent = today || '(未入力)';
      document.getElementById('modalIssues').textContent = issues || '(未入力)';
      document.getElementById('modalSender').textContent = currentUser?.email || 'testuser@example.com';
      document.getElementById('modalDirector').textContent = currentUser?.directorName || '部長' + ' <' + (currentUser?.directorEmail || 'bucho@example.com') + '>';
      
      confirmModal.classList.add('show');
    });
    
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    confirmBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
      
      // Save to history
      const historyItem = {
        timestamp: new Date().toISOString(),
        yesterday: yesterdayTextarea.value.trim(),
        today: todayTextarea.value.trim(),
        issues: issuesTextarea.value.trim(),
        sender: currentUser?.userId || 'user',
        status: '送信済'
      };
      
      sendHistory.push(historyItem);
      localStorage.setItem('dailyReportHistory', JSON.stringify(sendHistory));
      
      // Clear form
      yesterdayTextarea.value = '';
      todayTextarea.value = '';
      issuesTextarea.value = '';
      yesterdayTextarea.disabled = true;
      todayTextarea.disabled = true;
      issuesTextarea.disabled = true;
      editBtn.disabled = false;
      isEditMode = false;
      
      // Clear draft
      localStorage.removeItem('dailyReportDraft');
      
      // Show success message
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      // Reload history
      loadHistory();
    });
    
    // Initialize on page load
    init();
  </script>
</body>
</html>
