<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        .deadline-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .deadline-time {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
        .summary-section {
            margin-top: 30px;
        }
        .summary-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table thead {
            background-color: #f9f9f9;
        }
        .summary-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <div class="deadline-label">本日の提出期限</div>
            <div class="deadline-time" id="deadlineTime">17:00</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td>営業部</td>
                        <td><span id="sales-submitted">0</span> / <span id="sales-total">0</span></td>
                        <td><span id="sales-rate">0</span>%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="sales-progress" style="width: 0%;"></div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td><span id="planning-submitted">0</span> / <span id="planning-total">0</span></td>
                        <td><span id="planning-rate">0</span>%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="planning-progress" style="width: 0%;"></div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td><span id="tech-submitted">0</span> / <span id="tech-total">0</span></td>
                        <td><span id="tech-rate">0</span>%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="tech-progress" style="width: 0%;"></div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td><span id="admin-submitted">0</span> / <span id="admin-total">0</span></td>
                        <td><span id="admin-rate">0</span>%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="admin-progress" style="width: 0%;"></div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="btn">日報を入力する</a>
    </div>
    
    <script>
        // ダッシュボード初期化
        function initializeDashboard() {
            // 提出期限を設定
            const now = new Date();
            const deadline = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 0, 0);
            const deadlineStr = deadline.toLocaleTimeString('ja-JP', {
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('deadlineTime').textContent = deadlineStr;
            
            // 部門別提出状況を計算
            updateSummary();
        }
        
        function updateSummary() {
            // サンプルデータ（実際にはAPIから取得）
            const departments = [
                { id: 'sales', name: '営業部', total: 15, submitted: 12 },
                { id: 'planning', name: '企画部', total: 10, submitted: 8 },
                { id: 'tech', name: '技術部', total: 20, submitted: 18 },
                { id: 'admin', name: '管理部', total: 8, submitted: 7 }
            ];
            
            departments.forEach(dept => {
                const rate = dept.total > 0 ? Math.round((dept.submitted / dept.total) * 100) : 0;
                
                document.getElementById(`${dept.id}-submitted`).textContent = dept.submitted;
                document.getElementById(`${dept.id}-total`).textContent = dept.total;
                document.getElementById(`${dept.id}-rate`).textContent = rate;
                
                const progressEl = document.getElementById(`${dept.id}-progress`);
                progressEl.style.width = rate + '%';
                progressEl.textContent = rate > 0 ? rate + '%' : '';
            });
        }
        
        // ページ読み込み時に初期化
        window.addEventListener('load', initializeDashboard);
    </script>
</body>
</html>
