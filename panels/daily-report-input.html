<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
        .btn-tertiary {
            background-color: #f44336;
            color: white;
        }
        .btn-tertiary:hover {
            background-color: #da190b;
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-body p {
            margin-bottom: 10px;
        }
        .modal-body strong {
            color: #333;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #4CAF50;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .history-item-time {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #4CAF50;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2196F3;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError">報告内容を入力してください</div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-tertiary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>
    
    <!-- 送信確認ダイアログ -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                <p><strong>送信者:</strong> <span id="senderEmail"></span></p>
                <p><strong>部長:</strong> <span id="chiefEmail"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn-tertiary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-primary">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const historyList = document.getElementById('historyList');
        const successMessage = document.getElementById('successMessage');
        
        let isEditMode = false;
        let currentUser = null;
        let currentUserChief = null;
        
        // ページ読み込み時の初期化
        async function initPage() {
            // ユーザー情報取得
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('senderEmail').textContent = currentUser.email || 'testuser@example.com';
                    
                    // 部長情報取得
                    if (currentUser.chiefId) {
                        const chiefResponse = await fetch(`/api/user/${currentUser.chiefId}`);
                        if (chiefResponse.ok) {
                            currentUserChief = await chiefResponse.json();
                            document.getElementById('chiefEmail').textContent = `${currentUserChief.name} <${currentUserChief.email}>`;
                        }
                    }
                }
            } catch (e) {
                console.error('ユーザー情報取得エラー:', e);
                document.getElementById('senderEmail').textContent = 'testuser@example.com';
            }
            
            // セッションストレージから日付と部門を復元
            const savedDate = sessionStorage.getItem('reportDate');
            if (savedDate) {
                reportDate.value = savedDate;
            }
            
            const savedDept = sessionStorage.getItem('reportDepartment');
            if (savedDept) {
                department.value = savedDept;
            }
            
            // ローカルストレージから下書きを復元
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const draftData = JSON.parse(draft);
                yesterday.value = draftData.yesterday || '';
                today.value = draftData.today || '';
                issues.value = draftData.issues || '';
            }
            
            // 送信履歴を読み込み
            loadHistory();
        }
        
        // 編集ボタンクリック
        editBtn.addEventListener('click', () => {
            isEditMode = true;
            yesterday.disabled = false;
            today.disabled = false;
            issues.disabled = false;
            yesterday.focus();
        });
        
        // 下書き保存ボタンクリック
        draftBtn.addEventListener('click', () => {
            const draftData = {
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draftData));
            alert('下書きを保存しました');
        });
        
        // フォーム送信
        reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // バリデーション
            let hasError = false;
            
            // エラーメッセージをクリア
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            if (!reportDate.value) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            }
            
            if (!department.value) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            }
            
            if (!yesterday.value.trim() || !today.value.trim() || !issues.value.trim()) {
                if (!yesterday.value.trim()) document.getElementById('yesterdayError').classList.add('show');
                if (!today.value.trim()) document.getElementById('todayError').classList.add('show');
                if (!issues.value.trim()) document.getElementById('issuesError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) {
                return;
            }
            
            // セッションストレージに保存
            sessionStorage.setItem('reportDate', reportDate.value);
            sessionStorage.setItem('reportDepartment', department.value);
            
            // 確認ダイアログを表示
            document.getElementById('confirmYesterday').textContent = yesterday.value.substring(0, 100);
            document.getElementById('confirmToday').textContent = today.value.substring(0, 100);
            document.getElementById('confirmIssues').textContent = issues.value.substring(0, 100);
            confirmModal.classList.add('show');
        });
        
        // キャンセルボタン
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        // 確認ボタン
        confirmBtn.addEventListener('click', async () => {
            const reportData = {
                date: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value,
                userId: currentUser?.id || 'user1',
                status: 'sent',
                sentAt: new Date().toISOString()
            };
            
            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reportData)
                });
                
                if (response.ok) {
                    confirmModal.classList.remove('show');
                    successMessage.classList.add('show');
                    
                    // フォームをクリア
                    yesterday.value = '';
                    today.value = '';
                    issues.value = '';
                    yesterday.disabled = true;
                    today.disabled = true;
                    issues.disabled = true;
                    isEditMode = false;
                    
                    // 下書きを削除
                    localStorage.removeItem('reportDraft');
                    
                    // 送信履歴を更新
                    loadHistory();
                    
                    // メッセージを3秒後に非表示
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 3000);
                }
            } catch (e) {
                console.error('送信エラー:', e);
                alert('送信に失敗しました');
            }
        });
        
        // 送信履歴を読み込み
        async function loadHistory() {
            try {
                const response = await fetch('/api/reports');
                if (response.ok) {
                    const reports = await response.json();
                    
                    if (reports.length === 0) {
                        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                    } else {
                        historyList.innerHTML = reports
                            .sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt))
                            .map(report => {
                                const date = new Date(report.sentAt);
                                const formattedDate = date.toLocaleString('ja-JP', {
                                    year: 'numeric',
                                    month: '2-digit',
                                    day: '2-digit',
                                    hour: '2-digit',
                                    minute: '2-digit',
                                    second: '2-digit'
                                });
                                
                                return `
                                    <li class="history-item">
                                        <div class="history-item-header">
                                            <span class="history-item-time">${formattedDate}</span>
                                            <span class="history-item-status">送信済</span>
                                        </div>
                                        <div class="history-item-content">
                                            <p><strong>昨日:</strong> ${report.yesterday.substring(0, 50)}...</p>
                                            <p><strong>今日:</strong> ${report.today.substring(0, 50)}...</p>
                                            <p><strong>課題:</strong> ${report.issues.substring(0, 50)}...</p>
                                        </div>
                                    </li>
                                `;
                            })
                            .join('');
                    }
                }
            } catch (e) {
                console.error('履歴読み込みエラー:', e);
            }
        }
        
        // ページ初期化
        initPage();
    </script>
</body>
</html>
