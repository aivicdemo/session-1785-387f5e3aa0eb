<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }
        input[type="date"]:disabled,
        select:disabled {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .history-empty {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-item-content strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content" id="confirmContent">
                <!-- 動的に生成 -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        const currentUser = {
            id: 'user001',
            email: 'testuser@example.com',
            name: 'テストユーザー',
            department: '営業部',
            manager: '部長太郎',
            managerEmail: 'bucho@example.com'
        };
        
        const form = document.getElementById('reportForm');
        const reportDate = document.getElementById('reportDate');
        const department = document.getElementById('department');
        const yesterday = document.getElementById('yesterday');
        const today = document.getElementById('today');
        const issues = document.getElementById('issues');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyContainer = document.getElementById('historyContainer');
        
        let isEditMode = false;
        let sendHistory = [];
        
        // 初期化
        function init() {
            loadDraft();
            loadHistory();
            renderHistory();
            updateEditMode();
        }
        
        // ドラフト読み込み
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                reportDate.value = data.reportDate || '';
                department.value = data.department || '';
                yesterday.value = data.yesterday || '';
                today.value = data.today || '';
                issues.value = data.issues || '';
            }
        }
        
        // 送信履歴読み込み
        function loadHistory() {
            const history = localStorage.getItem('reportHistory');
            if (history) {
                sendHistory = JSON.parse(history);
            }
        }
        
        // 送信履歴表示
        function renderHistory() {
            if (sendHistory.length === 0) {
                historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyContainer.innerHTML = sendHistory
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .map(item => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <div class="history-item-date">${formatDateTime(item.timestamp)}</div>
                            <div class="history-item-status">送信済</div>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday.substring(0, 50))}${item.yesterday.length > 50 ? '...' : ''}</p>
                            <p><strong>今日やること:</strong> ${escapeHtml(item.today.substring(0, 50))}${item.today.length > 50 ? '...' : ''}</p>
                            <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues.substring(0, 50))}${item.issues.length > 50 ? '...' : ''}</p>
                        </div>
                    </div>
                `).join('');
        }
        
        // 編集モード更新
        function updateEditMode() {
            if (isEditMode) {
                yesterday.disabled = false;
                today.disabled = false;
                issues.disabled = false;
                editBtn.textContent = '編集完了';
                editBtn.classList.remove('btn-secondary');
                editBtn.classList.add('btn-primary');
            } else {
                yesterday.disabled = true;
                today.disabled = true;
                issues.disabled = true;
                editBtn.textContent = '報告内容編集';
                editBtn.classList.remove('btn-primary');
                editBtn.classList.add('btn-secondary');
            }
        }
        
        // 編集ボタン
        editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isEditMode = !isEditMode;
            updateEditMode();
        });
        
        // 下書き保存
        draftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const draft = {
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        });
        
        // バリデーション
        function validate() {
            let isValid = true;
            
            // 日付チェック
            if (!reportDate.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            } else {
                document.getElementById('dateError').classList.remove('show');
            }
            
            // 部門チェック
            if (!department.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            } else {
                document.getElementById('departmentError').classList.remove('show');
            }
            
            // 報告内容チェック
            const hasContent = yesterday.value.trim() || today.value.trim() || issues.value.trim();
            if (!hasContent) {
                document.getElementById('yesterdayError').classList.add('show');
                document.getElementById('todayError').classList.add('show');
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            } else {
                document.getElementById('yesterdayError').classList.remove('show');
                document.getElementById('todayError').classList.remove('show');
                document.getElementById('issuesError').classList.remove('show');
            }
            
            return isValid;
        }
        
        // フォーム送信
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!validate()) {
                return;
            }
            
            // 確認ダイアログ表示
            showConfirmDialog();
        });
        
        // 確認ダイアログ表示
        function showConfirmDialog() {
            const content = `
                <p><strong>送信者:</strong> ${currentUser.email}</p>
                <p><strong>部長:</strong> ${currentUser.manager} &lt;${currentUser.managerEmail}&gt;</p>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
                <p><strong>昨日やったこと:</strong></p>
                <p style="margin-left: 10px; color: #555;">${escapeHtml(yesterday.value.substring(0, 100))}${yesterday.value.length > 100 ? '...' : ''}</p>
                <p><strong>今日やること:</strong></p>
                <p style="margin-left: 10px; color: #555;">${escapeHtml(today.value.substring(0, 100))}${today.value.length > 100 ? '...' : ''}</p>
                <p><strong>抱えている課題:</strong></p>
                <p style="margin-left: 10px; color: #555;">${escapeHtml(issues.value.substring(0, 100))}${issues.value.length > 100 ? '...' : ''}</p>
            `;
            document.getElementById('confirmContent').innerHTML = content;
            confirmModal.classList.add('show');
        }
        
        // キャンセルボタン
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        // 確認ボタン
        confirmBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            
            // 送信履歴に追加
            const record = {
                timestamp: new Date().toISOString(),
                userId: currentUser.id,
                reportDate: reportDate.value,
                department: department.value,
                yesterday: yesterday.value,
                today: today.value,
                issues: issues.value,
                status: '送信済'
            };
            
            sendHistory.push(record);
            localStorage.setItem('reportHistory', JSON.stringify(sendHistory));
            
            // フォームクリア
            yesterday.value = '';
            today.value = '';
            issues.value = '';
            isEditMode = false;
            updateEditMode();
            
            // 成功メッセージ表示
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // 履歴再表示
            renderHistory();
        });
        
        // ユーティリティ関数
        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 初期化実行
        init();
    </script>
</body>
</html>
