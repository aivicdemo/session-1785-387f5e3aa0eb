<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .deadline-text {
            color: #856404;
            font-size: 18px;
            font-weight: bold;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .summary-table th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .btn-report {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .btn-report:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadline">本日 18:00 まで</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み / 総人数</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td>営業部</td>
                        <td><span id="sales-submitted">8</span> / <span id="sales-total">10</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="sales-progress" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td><span id="planning-submitted">5</span> / <span id="planning-total">6</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="planning-progress" style="width: 83.33%;">83%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td><span id="tech-submitted">12</span> / <span id="tech-total">15</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="tech-progress" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td><span id="admin-submitted">4</span> / <span id="admin-total">5</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="admin-progress" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="btn-report">日報を入力・送信する</a>
    </div>
    
    <script>
        function init() {
            // Set deadline
            const today = new Date();
            const deadline = new Date(today);
            deadline.setHours(18, 0, 0, 0);
            
            const deadlineText = deadline.toLocaleString('ja-JP', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            document.getElementById('deadline').textContent = `${deadlineText} まで`;
            
            // Load summary data from localStorage or use defaults
            loadSummaryData();
        }
        
        function loadSummaryData() {
            // For now, using hardcoded data
            // In a real app, this would come from an API
            const summaryData = [
                { dept: '営業部', submitted: 8, total: 10 },
                { dept: '企画部', submitted: 5, total: 6 },
                { dept: '技術部', submitted: 12, total: 15 },
                { dept: '管理部', submitted: 4, total: 5 }
            ];
            
            summaryData.forEach(item => {
                const percentage = Math.round((item.submitted / item.total) * 100);
                const deptKey = item.dept.replace(/部/g, '').toLowerCase();
                
                // Update counts
                const submittedEl = document.getElementById(`${deptKey}-submitted`);
                const totalEl = document.getElementById(`${deptKey}-total`);
                const progressEl = document.getElementById(`${deptKey}-progress`);
                
                if (submittedEl) submittedEl.textContent = item.submitted;
                if (totalEl) totalEl.textContent = item.total;
                if (progressEl) {
                    progressEl.style.width = `${percentage}%`;
                    progressEl.textContent = `${percentage}%`;
                }
            });
        }
        
        init();
    </script>
</body>
</html>
