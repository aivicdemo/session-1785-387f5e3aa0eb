<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-section h2 {
      font-size: 18px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal-header {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.6;
    }
    .modal-body p {
      margin-bottom: 10px;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 18px;
      color: #555;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .history-list {
      list-style: none;
    }
    .history-item {
      background-color: #f9f9f9;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #007bff;
      border-radius: 4px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .history-item-date {
      color: #666;
      font-size: 13px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-style: italic;
    }
    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="dailyReportForm">
      <div class="form-section">
        <h2>報告情報</h2>
        
        <div class="form-group">
          <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
          <input type="date" id="reportDate" name="reportDate" required>
          <div class="error-message" id="reportDateError">報告日付を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="department">部門 <span style="color: red;">*</span></label>
          <select id="department" name="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>
      
      <div class="form-section">
        <h2>報告内容</h2>
        
        <div class="form-group">
          <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
          <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること <span style="color: red;">*</span></label>
          <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="todayError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
          <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
          <div class="error-message" id="issuesError">報告内容を入力してください</div>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
        <button type="submit" class="btn-success" id="submitBtn">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <ul class="history-list" id="historyList">
        <li class="history-empty">送信履歴はありません</li>
      </ul>
    </div>
    
    <a href="./dashboard.html" class="nav-link">ダッシュボードへ</a>
  </div>
  
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <p><strong>送信者:</strong> <span id="senderEmail"></span></p>
        <p><strong>部長:</strong> <span id="managerEmail"></span></p>
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
        <p><strong>今日やること:</strong></p>
        <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
        <p><strong>抱えている課題:</strong></p>
        <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-success" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    // ユーザー情報（セッションから取得）
    const currentUser = {
      id: 'testuser',
      email: 'testuser@example.com',
      name: 'テストユーザー',
      manager: '部長太郎',
      managerEmail: 'bucho@example.com'
    };
    
    const form = document.getElementById('dailyReportForm');
    const reportDateInput = document.getElementById('reportDate');
    const departmentSelect = document.getElementById('department');
    const yesterdayTextarea = document.getElementById('yesterday');
    const todayTextarea = document.getElementById('today');
    const issuesTextarea = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const historyList = document.getElementById('historyList');
    const successMessage = document.getElementById('successMessage');
    
    let isEditMode = false;
    let history = [];
    
    // 初期化
    function init() {
      loadFromSessionStorage();
      loadHistory();
      renderHistory();
      updateSenderInfo();
    }
    
    // セッションストレージから復元
    function loadFromSessionStorage() {
      const saved = sessionStorage.getItem('dailyReportDraft');
      if (saved) {
        const data = JSON.parse(saved);
        reportDateInput.value = data.reportDate || '';
        departmentSelect.value = data.department || '';
        yesterdayTextarea.value = data.yesterday || '';
        todayTextarea.value = data.today || '';
        issuesTextarea.value = data.issues || '';
      }
    }
    
    // ローカルストレージから履歴を読み込み
    function loadHistory() {
      const saved = localStorage.getItem('dailyReportHistory');
      if (saved) {
        history = JSON.parse(saved);
      }
    }
    
    // 履歴を保存
    function saveHistory() {
      localStorage.setItem('dailyReportHistory', JSON.stringify(history));
    }
    
    // 履歴を表示
    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
        return;
      }
      
      historyList.innerHTML = history
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
        .map(item => `
          <li class="history-item">
            <div class="history-item-header">
              <span class="history-item-date">${formatDateTime(item.timestamp)}</span>
              <span class="history-item-status">送信済</span>
            </div>
            <div class="history-item-content">
              <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday)}</p>
              <p><strong>今日やること:</strong> ${escapeHtml(item.today)}</p>
              <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues)}</p>
            </div>
          </li>
        `)
        .join('');
    }
    
    // 送信者情報を更新
    function updateSenderInfo() {
      document.getElementById('senderEmail').textContent = currentUser.email;
      document.getElementById('managerEmail').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
    }
    
    // 編集ボタン
    editBtn.addEventListener('click', () => {
      isEditMode = true;
      yesterdayTextarea.disabled = false;
      todayTextarea.disabled = false;
      issuesTextarea.disabled = false;
      editBtn.style.display = 'none';
    });
    
    // 下書き保存ボタン
    draftBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const data = {
        reportDate: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value
      };
      sessionStorage.setItem('dailyReportDraft', JSON.stringify(data));
      alert('下書きを保存しました');
    });
    
    // フォーム送信
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      // バリデーション
      clearErrors();
      let isValid = true;
      
      if (!reportDateInput.value) {
        showError('reportDateError');
        isValid = false;
      }
      
      if (!departmentSelect.value) {
        showError('departmentError');
        isValid = false;
      }
      
      if (!yesterdayTextarea.value.trim() || !todayTextarea.value.trim() || !issuesTextarea.value.trim()) {
        if (!yesterdayTextarea.value.trim()) showError('yesterdayError');
        if (!todayTextarea.value.trim()) showError('todayError');
        if (!issuesTextarea.value.trim()) showError('issuesError');
        isValid = false;
      }
      
      if (!isValid) return;
      
      // 確認ダイアログを表示
      document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value;
      document.getElementById('confirmToday').textContent = todayTextarea.value;
      document.getElementById('confirmIssues').textContent = issuesTextarea.value;
      confirmModal.classList.add('show');
    });
    
    // キャンセルボタン
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    // 確認ボタン
    confirmBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
      
      // 履歴に追加
      const newEntry = {
        timestamp: new Date().toISOString(),
        sender: currentUser.id,
        reportDate: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value,
        status: '送信済'
      };
      
      history.push(newEntry);
      saveHistory();
      
      // フォームをリセット
      form.reset();
      yesterdayTextarea.disabled = true;
      todayTextarea.disabled = true;
      issuesTextarea.disabled = true;
      editBtn.style.display = 'inline-block';
      isEditMode = false;
      
      // セッションストレージをクリア
      sessionStorage.removeItem('dailyReportDraft');
      
      // 成功メッセージを表示
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      
      // 履歴を再表示
      renderHistory();
    });
    
    // ヘルパー関数
    function showError(elementId) {
      document.getElementById(elementId).classList.add('show');
    }
    
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
      });
    }
    
    function formatDateTime(isoString) {
      const date = new Date(isoString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // 初期化実行
    init();
  </script>
</body>
</html>
