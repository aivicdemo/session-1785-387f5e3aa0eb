<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      margin-bottom: 30px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-summary {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .modal-summary-item {
      margin-bottom: 10px;
    }
    .modal-summary-label {
      font-weight: bold;
      color: #333;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
    }
    .history-list {
      list-style: none;
    }
    .history-item {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      border-left: 4px solid #007bff;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
    .history-item-content {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-group">
        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
        <input type="date" id="reportDate" name="reportDate" required>
        <div class="error-message" id="dateError">報告日付を選択してください</div>
      </div>

      <div class="form-group">
        <label for="department">部門 <span style="color: red;">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- 選択してください --</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError">部門を選択してください</div>
      </div>

      <div class="form-group">
        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
      </div>

      <div class="form-group">
        <label for="today">今日やること <span style="color: red;">*</span></label>
        <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="todayError">報告内容を入力してください</div>
      </div>

      <div class="form-group">
        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
        <div class="error-message" id="issuesError">報告内容を入力してください</div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
        <button type="button" class="btn-success" id="draftBtn">下書き保存</button>
        <button type="submit" class="btn-primary" id="submitBtn">送信</button>
      </div>
    </form>

    <div class="history-section">
      <h2>送信履歴</h2>
      <ul class="history-list" id="historyList">
        <li class="history-empty">送信履歴はありません</li>
      </ul>
    </div>
  </div>

  <!-- 送信確認ダイアログ -->
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <div class="modal-summary">
          <div class="modal-summary-item">
            <span class="modal-summary-label">昨日やったこと:</span>
            <span id="confirmYesterday"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">今日やること:</span>
            <span id="confirmToday"></span>
          </div>
          <div class="modal-summary-item">
            <span class="modal-summary-label">抱えている課題:</span>
            <span id="confirmIssues"></span>
          </div>
        </div>
        <div style="margin-top: 15px; font-size: 13px; color: #666;">
          <div style="margin-bottom: 8px;">
            <strong>送信者:</strong> <span id="confirmSender"></span>
          </div>
          <div>
            <strong>部長:</strong> <span id="confirmManager"></span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="button" class="btn-primary" id="confirmBtn">確認</button>
      </div>
    </div>
  </div>

  <script>
    // ページロード時の初期化
    document.addEventListener('DOMContentLoaded', function() {
      loadDraft();
      loadHistory();
      setupEventListeners();
    });

    function setupEventListeners() {
      const editBtn = document.getElementById('editBtn');
      const draftBtn = document.getElementById('draftBtn');
      const submitBtn = document.getElementById('submitBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const confirmBtn = document.getElementById('confirmBtn');
      const reportForm = document.getElementById('reportForm');
      const reportDate = document.getElementById('reportDate');
      const department = document.getElementById('department');

      editBtn.addEventListener('click', enableEdit);
      draftBtn.addEventListener('click', saveDraft);
      reportForm.addEventListener('submit', handleSubmit);
      cancelBtn.addEventListener('click', closeConfirmModal);
      confirmBtn.addEventListener('click', confirmSubmit);

      // 日付と部門の選択値を保持
      reportDate.addEventListener('change', function() {
        sessionStorage.setItem('reportDate', this.value);
      });
      department.addEventListener('change', function() {
        sessionStorage.setItem('department', this.value);
      });
    }

    function enableEdit() {
      document.getElementById('yesterday').disabled = false;
      document.getElementById('today').disabled = false;
      document.getElementById('issues').disabled = false;
      document.getElementById('yesterday').focus();
    }

    function saveDraft() {
      const draft = {
        yesterday: document.getElementById('yesterday').value,
        today: document.getElementById('today').value,
        issues: document.getElementById('issues').value,
        reportDate: document.getElementById('reportDate').value,
        department: document.getElementById('department').value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }

    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        document.getElementById('yesterday').value = data.yesterday || '';
        document.getElementById('today').value = data.today || '';
        document.getElementById('issues').value = data.issues || '';
        document.getElementById('reportDate').value = data.reportDate || '';
        document.getElementById('department').value = data.department || '';
      }

      // セッションストレージから日付と部門を復元
      const savedDate = sessionStorage.getItem('reportDate');
      const savedDept = sessionStorage.getItem('department');
      if (savedDate) document.getElementById('reportDate').value = savedDate;
      if (savedDept) document.getElementById('department').value = savedDept;
    }

    function handleSubmit(e) {
      e.preventDefault();
      clearErrors();

      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();

      let isValid = true;

      if (!reportDate) {
        showError('dateError');
        isValid = false;
      }
      if (!department) {
        showError('departmentError');
        isValid = false;
      }
      if (!yesterday && !today && !issues) {
        showError('yesterdayError');
        showError('todayError');
        showError('issuesError');
        isValid = false;
      }

      if (!isValid) return;

      showConfirmModal(yesterday, today, issues);
    }

    function showError(elementId) {
      document.getElementById(elementId).classList.add('show');
    }

    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
      });
    }

    function showConfirmModal(yesterday, today, issues) {
      document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 50);
      document.getElementById('confirmToday').textContent = today.substring(0, 50);
      document.getElementById('confirmIssues').textContent = issues.substring(0, 50);
      document.getElementById('confirmSender').textContent = 'testuser@example.com';
      document.getElementById('confirmManager').textContent = '部長 <bucho@example.com>';
      document.getElementById('confirmModal').classList.add('show');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.remove('show');
    }

    function confirmSubmit() {
      const reportDate = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();

      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      const newRecord = {
        id: Date.now(),
        timestamp: new Date().toLocaleString('ja-JP'),
        sender: 'testuser',
        status: '送信済',
        yesterday: yesterday,
        today: today,
        issues: issues,
        reportDate: reportDate,
        department: department
      };
      history.unshift(newRecord);
      localStorage.setItem('reportHistory', JSON.stringify(history));

      closeConfirmModal();
      document.getElementById('successMessage').classList.add('show');
      document.getElementById('yesterday').value = '';
      document.getElementById('today').value = '';
      document.getElementById('issues').value = '';
      document.getElementById('yesterday').disabled = true;
      document.getElementById('today').disabled = true;
      document.getElementById('issues').disabled = true;
      localStorage.removeItem('reportDraft');
      loadHistory();

      setTimeout(() => {
        document.getElementById('successMessage').classList.remove('show');
      }, 3000);
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
      const historyList = document.getElementById('historyList');

      if (history.length === 0) {
        historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
        return;
      }

      historyList.innerHTML = history.map(record => `
        <li class="history-item">
          <div class="history-item-header">
            <span><strong>${record.timestamp}</strong></span>
            <span>${record.status}</span>
          </div>
          <div class="history-item-content">
            <div><strong>昨日やったこと:</strong> ${record.yesterday}</div>
            <div><strong>今日やること:</strong> ${record.today}</div>
            <div><strong>抱えている課題:</strong> ${record.issues}</div>
          </div>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
