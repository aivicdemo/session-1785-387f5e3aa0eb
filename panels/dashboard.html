<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-label {
      font-size: 14px;
      color: #856404;
      margin-bottom: 8px;
    }
    .deadline-value {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th {
      background-color: #f8f9fa;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #dee2e6;
    }
    .summary-table td {
      padding: 15px;
      border-bottom: 1px solid #dee2e6;
      color: #666;
    }
    .summary-table tr:hover {
      background-color: #f9f9f9;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-submitted {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <div class="deadline-label">提出期限</div>
      <div class="deadline-value" id="deadline">2024年12月31日 17:00</div>
    </div>

    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
            <td><span class="status-badge status-submitted">提出済</span></td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>5</td>
            <td>3</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 62.5%;">62.5%</div>
              </div>
            </td>
            <td><span class="status-badge status-pending">未提出</span></td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>10</td>
            <td>0</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 100%;">100%</div>
              </div>
            </td>
            <td><span class="status-badge status-submitted">提出済</span></td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>6</td>
            <td>1</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 85.7%;">85.7%</div>
              </div>
            </td>
            <td><span class="status-badge status-submitted">提出済</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <button class="nav-button" onclick="window.location.href='./daily-report.html'">日報入力・送信へ</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 提出期限を動的に設定
      const deadline = new Date();
      deadline.setDate(deadline.getDate() + 7);
      deadline.setHours(17, 0, 0, 0);
      document.getElementById('deadline').textContent = deadline.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    });
  </script>
</body>
</html>
