<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #0b7dda;
        }
        .btn-tertiary {
            background-color: #f44336;
            color: white;
        }
        .btn-tertiary:hover {
            background-color: #da190b;
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }
        .modal-content {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #555;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #4CAF50;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2196F3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-row">
                    <div>
                        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                        <input type="date" id="reportDate" name="reportDate" required>
                        <div class="error-message" id="dateError">報告日付を選択してください</div>
                    </div>
                    <div>
                        <label for="department">部門 <span style="color: red;">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">-- 選択してください --</option>
                            <option value="営業部">営業部</option>
                            <option value="企画部">企画部</option>
                            <option value="技術部">技術部</option>
                            <option value="管理部">管理部</option>
                        </select>
                        <div class="error-message" id="departmentError">部門を選択してください</div>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-row full">
                    <div>
                        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                        <div class="error-message" id="contentError">報告内容を入力してください</div>
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label for="today">今日やること <span style="color: red;">*</span></label>
                        <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-tertiary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #666;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-primary">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentInput = document.getElementById('department');
        const yesterdayInput = document.getElementById('yesterday');
        const todayInput = document.getElementById('today');
        const issuesInput = document.getElementById('issues');
        
        let isEditMode = false;
        let currentUser = null;
        let currentManager = null;
        
        // Initialize
        async function init() {
            // Load user info from session/auth
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const user = await response.json();
                    currentUser = user;
                    currentManager = user.manager;
                }
            } catch (e) {
                // Fallback for testing
                currentUser = { email: 'testuser@example.com', name: 'Test User' };
                currentManager = { email: 'bucho@example.com', name: '部長' };
            }
            
            // Load draft from sessionStorage
            loadDraft();
            
            // Load history
            loadHistory();
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            if (!reportDateInput.value) {
                reportDateInput.value = today;
            }
        }
        
        function loadDraft() {
            const draft = sessionStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                reportDateInput.value = data.reportDate || '';
                departmentInput.value = data.department || '';
                yesterdayInput.value = data.yesterday || '';
                todayInput.value = data.today || '';
                issuesInput.value = data.issues || '';
            }
        }
        
        function saveDraft() {
            const draft = {
                reportDate: reportDateInput.value,
                department: departmentInput.value,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value
            };
            sessionStorage.setItem('reportDraft', JSON.stringify(draft));
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            } else {
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <div class="history-item-date">${formatDateTime(item.timestamp)}</div>
                            <div class="history-item-status">送信済</div>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday.substring(0, 50))}${item.yesterday.length > 50 ? '...' : ''}</p>
                            <p><strong>今日やること:</strong> ${escapeHtml(item.today.substring(0, 50))}${item.today.length > 50 ? '...' : ''}</p>
                            <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues.substring(0, 50))}${item.issues.length > 50 ? '...' : ''}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        editBtn.addEventListener('click', () => {
            isEditMode = true;
            yesterdayInput.disabled = false;
            todayInput.disabled = false;
            issuesInput.disabled = false;
            editBtn.style.display = 'none';
        });
        
        draftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveDraft();
            showSuccess('下書きを保存しました');
        });
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');
            
            // Validate
            let isValid = true;
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentInput.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayInput.value.trim() || !todayInput.value.trim() || !issuesInput.value.trim()) {
                document.getElementById('contentError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirmation modal
            showConfirmModal();
        });
        
        function showConfirmModal() {
            document.getElementById('confirmYesterday').textContent = yesterdayInput.value;
            document.getElementById('confirmToday').textContent = todayInput.value;
            document.getElementById('confirmIssues').textContent = issuesInput.value;
            document.getElementById('confirmSender').textContent = currentUser?.email || 'testuser@example.com';
            document.getElementById('confirmManager').textContent = currentManager?.name + ' <' + (currentManager?.email || 'bucho@example.com') + '>';
            confirmModal.classList.add('show');
        }
        
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            
            // Save to history
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift({
                timestamp: new Date().toISOString(),
                reportDate: reportDateInput.value,
                department: departmentInput.value,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value,
                sender: currentUser?.email || 'testuser@example.com'
            });
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            form.reset();
            yesterdayInput.disabled = true;
            todayInput.disabled = true;
            issuesInput.disabled = true;
            editBtn.style.display = 'inline-block';
            isEditMode = false;
            
            // Clear draft
            sessionStorage.removeItem('reportDraft');
            
            // Show success message
            showSuccess('送信完了しました');
            
            // Reload history
            loadHistory();
        });
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // Save draft on input change
        [reportDateInput, departmentInput, yesterdayInput, todayInput, issuesInput].forEach(input => {
            input.addEventListener('change', saveDraft);
            input.addEventListener('input', saveDraft);
        });
        
        init();
    </script>
</body>
</html>
