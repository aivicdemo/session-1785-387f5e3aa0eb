<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table thead {
      background-color: #f8f9fa;
    }
    .summary-table th {
      padding: 15px;
      text-align: left;
      color: #333;
      font-weight: 600;
      border-bottom: 2px solid #dee2e6;
      font-size: 14px;
    }
    .summary-table td {
      padding: 15px;
      border-bottom: 1px solid #dee2e6;
      color: #666;
      font-size: 14px;
    }
    .summary-table tbody tr:hover {
      background-color: #f9f9f9;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-buttons {
      margin-top: 30px;
      display: flex;
      gap: 10px;
    }
    .nav-buttons a {
      padding: 12px 24px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-block;
    }
    .nav-buttons a:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadline">本日 18:00 まで</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td>営業部</td>
            <td><span id="sales-count">8 / 10</span></td>
            <td><span id="sales-rate">80%</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>企画部</td>
            <td><span id="planning-count">5 / 6</span></td>
            <td><span id="planning-rate">83%</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 83%;">83%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>技術部</td>
            <td><span id="tech-count">12 / 15</span></td>
            <td><span id="tech-rate">80%</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>管理部</td>
            <td><span id="admin-count">4 / 5</span></td>
            <td><span id="admin-rate">80%</span></td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div class="nav-buttons">
      <a href="./daily-report.html">日報入力・送信</a>
    </div>
  </div>
  
  <script>
    // ダッシュボード初期化
    function initDashboard() {
      // 提出期限を設定
      const today = new Date();
      const deadline = new Date(today);
      deadline.setHours(18, 0, 0, 0);
      
      const year = deadline.getFullYear();
      const month = String(deadline.getMonth() + 1).padStart(2, '0');
      const day = String(deadline.getDate()).padStart(2, '0');
      const hours = String(deadline.getHours()).padStart(2, '0');
      const minutes = String(deadline.getMinutes()).padStart(2, '0');
      
      document.getElementById('deadline').textContent = `${year}年${month}月${day}日 ${hours}:${minutes} まで`;
    }
    
    // 初期化実行
    initDashboard();
  </script>
</body>
</html>
