<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #0066cc;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0052a3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn-confirm {
      background-color: #28a745;
      color: white;
    }
    .btn-confirm:hover {
      background-color: #218838;
    }
    .btn-cancel {
      background-color: #6c757d;
      color: white;
    }
    .btn-cancel:hover {
      background-color: #5a6268;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .history-empty {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-item-date {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .history-item-sender {
      color: #999;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-group">
        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
        <input type="date" id="reportDate" name="reportDate" required>
        <div class="error-message" id="dateError">報告日付を選択してください</div>
      </div>

      <div class="form-group">
        <label for="department">部門 <span style="color: red;">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- 選択してください --</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError">部門を選択してください</div>
      </div>

      <div class="form-group">
        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
        <textarea id="yesterday" name="yesterday" disabled></textarea>
        <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
      </div>

      <div class="form-group">
        <label for="today">今日やること <span style="color: red;">*</span></label>
        <textarea id="today" name="today" disabled></textarea>
        <div class="error-message" id="todayError">報告内容を入力してください</div>
      </div>

      <div class="form-group">
        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
        <textarea id="issues" name="issues" disabled></textarea>
        <div class="error-message" id="issuesError">報告内容を入力してください</div>
      </div>

      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>

    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent">
        <p><strong>昨日やったこと:</strong> <span id="modalYesterday"></span></p>
        <p><strong>今日やること:</strong> <span id="modalToday"></span></p>
        <p><strong>抱えている課題:</strong> <span id="modalIssues"></span></p>
        <p style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
          <strong>送信者:</strong> <span id="modalSender"></span>
        </p>
        <p>
          <strong>部長:</strong> <span id="modalDirector"></span>
        </p>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-cancel">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-confirm">確認</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('reportForm');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyContainer = document.getElementById('historyContainer');

    const reportDateInput = document.getElementById('reportDate');
    const departmentSelect = document.getElementById('department');
    const yesterdayTextarea = document.getElementById('yesterday');
    const todayTextarea = document.getElementById('today');
    const issuesTextarea = document.getElementById('issues');

    let isEditMode = false;
    let currentUser = null;
    let directorInfo = null;

    // Initialize
    async function init() {
      // Get current user from session
      const userStr = sessionStorage.getItem('currentUser');
      if (userStr) {
        currentUser = JSON.parse(userStr);
      }

      // Load draft from localStorage
      loadDraft();

      // Load history
      await loadHistory();

      // Set up event listeners
      editBtn.addEventListener('click', enableEditMode);
      draftBtn.addEventListener('click', saveDraft);
      form.addEventListener('submit', handleSubmit);
      cancelBtn.addEventListener('click', closeModal);
      confirmBtn.addEventListener('click', confirmSubmit);

      // Restore date and department from sessionStorage
      const savedDate = sessionStorage.getItem('reportDate');
      if (savedDate) {
        reportDateInput.value = savedDate;
      }

      const savedDept = sessionStorage.getItem('department');
      if (savedDept) {
        departmentSelect.value = savedDept;
      }
    }

    function enableEditMode() {
      isEditMode = true;
      yesterdayTextarea.disabled = false;
      todayTextarea.disabled = false;
      issuesTextarea.disabled = false;
      editBtn.style.display = 'none';
    }

    function saveDraft() {
      const draft = {
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value,
        date: reportDateInput.value,
        department: departmentSelect.value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }

    function loadDraft() {
      const draftStr = localStorage.getItem('reportDraft');
      if (draftStr) {
        const draft = JSON.parse(draftStr);
        yesterdayTextarea.value = draft.yesterday || '';
        todayTextarea.value = draft.today || '';
        issuesTextarea.value = draft.issues || '';
        reportDateInput.value = draft.date || '';
        departmentSelect.value = draft.department || '';
      }
    }

    function validateForm() {
      let isValid = true;
      const dateError = document.getElementById('dateError');
      const departmentError = document.getElementById('departmentError');
      const yesterdayError = document.getElementById('yesterdayError');
      const todayError = document.getElementById('todayError');
      const issuesError = document.getElementById('issuesError');

      // Clear all errors
      dateError.classList.remove('show');
      departmentError.classList.remove('show');
      yesterdayError.classList.remove('show');
      todayError.classList.remove('show');
      issuesError.classList.remove('show');

      if (!reportDateInput.value) {
        dateError.classList.add('show');
        isValid = false;
      }

      if (!departmentSelect.value) {
        departmentError.classList.add('show');
        isValid = false;
      }

      if (!yesterdayTextarea.value.trim() || !todayTextarea.value.trim() || !issuesTextarea.value.trim()) {
        if (!yesterdayTextarea.value.trim()) yesterdayError.classList.add('show');
        if (!todayTextarea.value.trim()) todayError.classList.add('show');
        if (!issuesTextarea.value.trim()) issuesError.classList.add('show');
        isValid = false;
      }

      return isValid;
    }

    function handleSubmit(e) {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      // Save to sessionStorage for modal
      sessionStorage.setItem('reportDate', reportDateInput.value);
      sessionStorage.setItem('department', departmentSelect.value);

      // Show confirmation modal
      document.getElementById('modalYesterday').textContent = yesterdayTextarea.value.substring(0, 50);
      document.getElementById('modalToday').textContent = todayTextarea.value.substring(0, 50);
      document.getElementById('modalIssues').textContent = issuesTextarea.value.substring(0, 50);
      document.getElementById('modalSender').textContent = currentUser ? currentUser.email : 'testuser@example.com';
      document.getElementById('modalDirector').textContent = directorInfo || '部長 <bucho@example.com>';

      confirmModal.classList.add('show');
    }

    function closeModal() {
      confirmModal.classList.remove('show');
    }

    async function confirmSubmit() {
      closeModal();

      // Send report to backend
      const reportData = {
        date: reportDateInput.value,
        department: departmentSelect.value,
        yesterday: yesterdayTextarea.value,
        today: todayTextarea.value,
        issues: issuesTextarea.value,
        sender: currentUser ? currentUser.id : 'testuser',
        senderEmail: currentUser ? currentUser.email : 'testuser@example.com',
        timestamp: new Date().toISOString(),
        status: 'sent'
      };

      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(reportData)
        });

        if (response.ok) {
          // Clear form
          yesterdayTextarea.value = '';
          todayTextarea.value = '';
          issuesTextarea.value = '';
          isEditMode = false;
          yesterdayTextarea.disabled = true;
          todayTextarea.disabled = true;
          issuesTextarea.disabled = true;
          editBtn.style.display = 'inline-block';

          // Clear draft
          localStorage.removeItem('reportDraft');

          // Show success message
          successMessage.classList.add('show');
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 3000);

          // Reload history
          await loadHistory();
        }
      } catch (error) {
        console.error('Error submitting report:', error);
        alert('送信に失敗しました');
      }
    }

    async function loadHistory() {
      try {
        const response = await fetch('/api/reports');
        if (response.ok) {
          const reports = await response.json();
          if (reports && reports.length > 0) {
            historyContainer.innerHTML = '';
            reports.forEach(report => {
              const item = document.createElement('div');
              item.className = 'history-item';
              const date = new Date(report.timestamp);
              const formattedDate = date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              });
              item.innerHTML = `
                <div class="history-item-header">
                  <div class="history-item-date">${formattedDate}</div>
                  <div class="history-item-status">送信済</div>
                </div>
                <div class="history-item-content">
                  <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                  <p><strong>今日やること:</strong> ${report.today}</p>
                  <p><strong>抱えている課題:</strong> ${report.issues}</p>
                </div>
                <div class="history-item-sender">送信者: ${report.sender}</div>
              `;
              historyContainer.appendChild(item);
            });
          } else {
            historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
          }
        }
      } catch (error) {
        console.error('Error loading history:', error);
        historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
      }
    }

    // Set director info (mock)
    directorInfo = '部長 <bucho@example.com>';

    init();
  </script>
</body>
</html>
