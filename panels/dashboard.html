<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-section p {
      color: #856404;
      font-size: 14px;
      line-height: 1.6;
    }
    .deadline-badge {
      display: inline-block;
      background-color: #ffc107;
      color: #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      margin-top: 10px;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .summary-table th {
      background-color: #007bff;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #0056b3;
    }
    .summary-table td {
      padding: 12px;
      border: 1px solid #ddd;
      color: #555;
    }
    .summary-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .summary-table tr:hover {
      background-color: #f0f0f0;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #e9ecef;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <p>日報の提出期限は毎日 <strong>18:00</strong> です。</p>
      <p>本日の提出期限: <span id="todayDeadline"></span></p>
      <div class="deadline-badge" id="deadlineBadge">期限まで残り時間を表示中</div>
    </div>

    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>80%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 80%;">80%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>6</td>
            <td>1</td>
            <td>86%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 86%;">86%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>9</td>
            <td>1</td>
            <td>90%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 90%;">90%</div>
              </div>
            </td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>5</td>
            <td>0</td>
            <td>100%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 100%;">100%</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <a href="./daily-report.html" class="nav-button">日報入力・送信へ</a>
  </div>

  <script>
    function updateDeadline() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 18, 0, 0);
      
      if (now > today) {
        today.setDate(today.getDate() + 1);
      }
      
      const todayDeadlineEl = document.getElementById('todayDeadline');
      todayDeadlineEl.textContent = today.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      const deadlineBadge = document.getElementById('deadlineBadge');
      const diff = today - now;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      deadlineBadge.textContent = `期限まで残り ${hours}時間${minutes}分`;
    }

    updateDeadline();
    setInterval(updateDeadline, 60000);
  </script>
</body>
</html>
