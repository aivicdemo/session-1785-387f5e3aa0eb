<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .logout-btn {
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .form-section input[type="date"],
        .form-section select,
        .form-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-section textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-section textarea:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .form-section input[type="date"]:disabled,
        .form-section select:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .history-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: bold;
            color: #007bff;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .empty-history {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.8;
        }
        .modal-body p {
            margin-bottom: 10px;
        }
        .modal-body strong {
            color: #333;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-footer .btn {
            padding: 10px 20px;
            font-size: 14px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
            .button-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>

        <div class="success-message" id="successMessage">送信完了しました</div>

        <form id="reportForm">
            <div class="form-row">
                <div class="form-section">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                <div class="form-section">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
            </div>

            <div class="form-section">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" id="editBtn" onclick="enableEdit()">報告内容編集</button>
                <button type="button" class="btn btn-success" id="draftBtn" onclick="saveDraft()">下書き保存</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">送信</button>
                <a href="./dashboard.html" class="btn btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center;">ダッシュボード</a>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="empty-history">送信履歴はありません</li>
            </ul>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; margin-bottom: 15px;"></p>
                <p><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; margin-bottom: 15px;"></p>
                <p><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; margin-bottom: 15px;"></p>
                <p><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; margin-bottom: 15px;"></p>
                <p><strong>部長:</strong></p>
                <p id="confirmDirector" style="margin-left: 10px;"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="cancelSubmit()">キャンセル</button>
                <button type="button" class="btn btn-primary" onclick="confirmSubmit()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isEditMode = false;

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', function() {
            // ユーザー情報を取得
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }
            currentUser = JSON.parse(userStr);

            // 保存されたフォーム値を復元
            restoreFormValues();

            // 送信履歴を読み込み
            loadHistory();

            // フォーム送信イベント
            document.getElementById('reportForm').addEventListener('submit', function(e) {
                e.preventDefault();
                handleSubmit();
            });
        });

        function restoreFormValues() {
            const saved = JSON.parse(sessionStorage.getItem('reportFormData') || '{}');
            if (saved.reportDate) {
                document.getElementById('reportDate').value = saved.reportDate;
            }
            if (saved.department) {
                document.getElementById('department').value = saved.department;
            }
            if (saved.yesterday) {
                document.getElementById('yesterday').value = saved.yesterday;
            }
            if (saved.today) {
                document.getElementById('today').value = saved.today;
            }
            if (saved.issues) {
                document.getElementById('issues').value = saved.issues;
            }
        }

        function saveFormValues() {
            const formData = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            sessionStorage.setItem('reportFormData', JSON.stringify(formData));
        }

        function enableEdit() {
            isEditMode = true;
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editBtn').style.display = 'none';
        }

        function saveDraft() {
            saveFormValues();
            alert('下書きを保存しました');
        }

        function handleSubmit() {
            // バリデーション
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            let hasError = false;

            // 日付チェック
            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('dateError').classList.remove('show');
            }

            // 部門チェック
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('departmentError').classList.remove('show');
            }

            // 報告内容チェック
            if (!yesterday && !today && !issues) {
                document.getElementById('contentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('contentError').classList.remove('show');
            }

            if (hasError) {
                return;
            }

            // 確認ダイアログを表示
            showConfirmDialog(reportDate, department, yesterday, today, issues);
        }

        function showConfirmDialog(reportDate, department, yesterday, today, issues) {
            document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 50) + (yesterday.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = today.substring(0, 50) + (today.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = issues.substring(0, 50) + (issues.length > 50 ? '...' : '');
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmDirector').textContent = currentUser.directorName + ' <' + currentUser.directorEmail + '>';

            document.getElementById('confirmModal').classList.add('show');
        }

        function cancelSubmit() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        function confirmSubmit() {
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            // API呼び出しで日報を送信
            const reportData = {
                userId: currentUser.userId,
                reportDate: reportDate,
                department: department,
                yesterday: yesterday,
                today: today,
                issues: issues,
                submittedAt: new Date().toISOString(),
                status: 'submitted'
            };

            // ローカルストレージに保存（バックエンド連携の代わり）
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(reportData);
            localStorage.setItem('reportHistory', JSON.stringify(history));

            // ダイアログを閉じる
            document.getElementById('confirmModal').classList.remove('show');

            // フォームをクリア
            document.getElementById('yesterday').value = '';
            document.getElementById('today').value = '';
            document.getElementById('issues').value = '';
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            document.getElementById('editBtn').style.display = 'inline-block';
            isEditMode = false;

            // セッションストレージから報告内容をクリア（日付は保持）
            const saved = JSON.parse(sessionStorage.getItem('reportFormData') || '{}');
            saved.yesterday = '';
            saved.today = '';
            saved.issues = '';
            sessionStorage.setItem('reportFormData', JSON.stringify(saved));

            // 成功メッセージを表示
            document.getElementById('successMessage').classList.add('show');
            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('show');
            }, 3000);

            // 履歴を再読み込み
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<li class="empty-history">送信履歴はありません</li>';
                return;
            }

            historyList.innerHTML = '';
            history.forEach(item => {
                const date = new Date(item.submittedAt);
                const dateStr = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="history-item-header">
                        <span class="history-item-date">${dateStr}</span>
                        <span class="history-item-status">${item.status === 'submitted' ? '送信済' : 'ドラフト'}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                `;
                historyList.appendChild(li);
            });
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = './login.html';
        }

        // フォーム値が変更されたときに保存
        document.getElementById('reportDate').addEventListener('change', saveFormValues);
        document.getElementById('department').addEventListener('change', saveFormValues);
        document.getElementById('yesterday').addEventListener('input', saveFormValues);
        document.getElementById('today').addEventListener('input', saveFormValues);
        document.getElementById('issues').addEventListener('input', saveFormValues);
    </script>
</body>
</html>
