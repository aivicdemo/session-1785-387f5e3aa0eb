<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
        .user-info p {
            margin: 5px 0;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .modal-content {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            border-top: 2px solid #ddd;
            padding-top: 30px;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 14px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-item-content p {
            margin: 5px 0;
        }
        .history-item-content strong {
            color: #333;
        }
        .nav-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <p>ユーザー: <span id="userName">-</span></p>
                <p>メール: <span id="userEmail">-</span></p>
            </div>
        </div>

        <div class="success-message" id="successMessage"></div>

        <form id="reportForm">
            <div class="form-section">
                <h2>基本情報</h2>
                
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>

                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <h2>報告内容</h2>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
                </div>

                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError">報告内容を入力してください</div>
                </div>

                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError">報告内容を入力してください</div>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-warning" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-secondary" id="saveDraftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>

        <div class="nav-buttons">
            <button type="button" class="btn-secondary" onclick="window.location.href='./dashboard.html'">ダッシュボードへ</button>
            <button type="button" class="btn-secondary" onclick="logout()">ログアウト</button>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
                    <strong>送信者:</strong> <span id="confirmSender"></span>
                </p>
                <p style="margin-top: 10px;">
                    <strong>送信先:</strong> <span id="confirmRecipient"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isEditMode = false;
        let pendingSubmit = false;

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await initializePage();
            loadDraft();
            loadHistory();
            setupEventListeners();
        });

        async function initializePage() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('userName').textContent = currentUser.name || 'Unknown';
                    document.getElementById('userEmail').textContent = currentUser.email || 'unknown@example.com';
                } else {
                    window.location.href = './login.html';
                }
            } catch (error) {
                console.error('Failed to fetch user:', error);
                window.location.href = './login.html';
            }
        }

        function setupEventListeners() {
            const form = document.getElementById('reportForm');
            const editBtn = document.getElementById('editBtn');
            const saveDraftBtn = document.getElementById('saveDraftBtn');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            const reportDate = document.getElementById('reportDate');
            const department = document.getElementById('department');

            editBtn.addEventListener('click', toggleEditMode);
            saveDraftBtn.addEventListener('click', saveDraft);
            form.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', closeConfirmModal);
            confirmBtn.addEventListener('click', confirmSubmit);

            // 日付と部門の選択を sessionStorage に保存
            reportDate.addEventListener('change', () => {
                sessionStorage.setItem('reportDate', reportDate.value);
            });
            department.addEventListener('change', () => {
                sessionStorage.setItem('department', department.value);
            });
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const textareas = document.querySelectorAll('textarea');
            const editBtn = document.getElementById('editBtn');

            textareas.forEach(ta => {
                ta.disabled = !isEditMode;
            });

            editBtn.textContent = isEditMode ? '編集完了' : '報告内容編集';
            editBtn.className = isEditMode ? 'btn-success' : 'btn-warning';
        }

        function saveDraft() {
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;

            const draft = {
                yesterday,
                today,
                issues,
                timestamp: new Date().toISOString()
            };

            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }

        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
            }

            // sessionStorage から日付と部門を復元
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDept = sessionStorage.getItem('department');
            if (savedDate) document.getElementById('reportDate').value = savedDate;
            if (savedDept) document.getElementById('department').value = savedDept;
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
        }

        function showError(fieldId) {
            const errorEl = document.getElementById(fieldId + 'Error');
            if (errorEl) {
                errorEl.classList.add('show');
            }
        }

        function validateForm() {
            clearErrors();
            let isValid = true;

            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            if (!reportDate) {
                showError('date');
                isValid = false;
            }
            if (!department) {
                showError('department');
                isValid = false;
            }
            if (!yesterday || !today || !issues) {
                if (!yesterday) showError('yesterday');
                if (!today) showError('today');
                if (!issues) showError('issues');
                isValid = false;
            }

            return isValid;
        }

        function handleSubmit(e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            pendingSubmit = true;
            showConfirmModal();
        }

        function showConfirmModal() {
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;

            document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 100);
            document.getElementById('confirmToday').textContent = today.substring(0, 100);
            document.getElementById('confirmIssues').textContent = issues.substring(0, 100);
            document.getElementById('confirmSender').textContent = currentUser.email;

            // 部長情報を取得（ダミー）
            const department = document.getElementById('department').value;
            document.getElementById('confirmRecipient').textContent = `部長 <bucho@example.com>`;

            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            pendingSubmit = false;
        }

        async function confirmSubmit() {
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value;
            const today = document.getElementById('today').value;
            const issues = document.getElementById('issues').value;

            const payload = {
                reportDate,
                department,
                yesterday,
                today,
                issues,
                userId: currentUser.id,
                userEmail: currentUser.email,
                submittedAt: new Date().toISOString()
            };

            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeConfirmModal();
                    clearForm();
                    showSuccessMessage('送信完了しました');
                    localStorage.removeItem('reportDraft');
                    loadHistory();
                } else {
                    alert('送信に失敗しました');
                }
            } catch (error) {
                console.error('Submit error:', error);
                alert('送信中にエラーが発生しました');
            }
        }

        function clearForm() {
            document.getElementById('yesterday').value = '';
            document.getElementById('today').value = '';
            document.getElementById('issues').value = '';
            isEditMode = false;
            document.getElementById('editBtn').textContent = '報告内容編集';
            document.getElementById('editBtn').className = 'btn-warning';
            document.querySelectorAll('textarea').forEach(ta => ta.disabled = true);
        }

        function showSuccessMessage(message) {
            const msgEl = document.getElementById('successMessage');
            msgEl.textContent = message;
            msgEl.classList.add('show');
            setTimeout(() => msgEl.classList.remove('show'), 5000);
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/reports');
                if (response.ok) {
                    const reports = await response.json();
                    renderHistory(reports);
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        function renderHistory(reports) {
            const container = document.getElementById('historyContainer');
            if (!reports || reports.length === 0) {
                container.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }

            const sorted = reports.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
            const html = sorted.map(report => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div class="history-item-date">${formatDateTime(report.submittedAt)}</div>
                        <div class="history-item-status">送信済</div>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${escapeHtml(report.yesterday)}</p>
                        <p><strong>今日やること:</strong> ${escapeHtml(report.today)}</p>
                        <p><strong>抱えている課題:</strong> ${escapeHtml(report.issues)}</p>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            fetch('/api/logout', { method: 'POST' }).then(() => {
                window.location.href = './login.html';
            });
        }
    </script>
</body>
</html>
