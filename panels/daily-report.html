<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
    .history-item-content {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
    
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-group">
        <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
        <input type="date" id="reportDate" name="reportDate">
        <div class="error-message" id="dateError">報告日付を選択してください</div>
      </div>
      
      <div class="form-group">
        <label for="department">部門 <span style="color: red;">*</span></label>
        <select id="department" name="department">
          <option value="">-- 選択してください --</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError">部門を選択してください</div>
      </div>
      
      <div class="form-group">
        <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
        <textarea id="yesterday" name="yesterday" disabled></textarea>
        <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
      </div>
      
      <div class="form-group">
        <label for="today">今日やること <span style="color: red;">*</span></label>
        <textarea id="today" name="today" disabled></textarea>
        <div class="error-message" id="todayError">報告内容を入力してください</div>
      </div>
      
      <div class="form-group">
        <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
        <textarea id="issues" name="issues" disabled></textarea>
        <div class="error-message" id="issuesError">報告内容を入力してください</div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="saveDraftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent">
        <p><strong>昨日やったこと:</strong></p>
        <p id="modalYesterday"></p>
        <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
        <p id="modalToday"></p>
        <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
        <p id="modalIssues"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="modalSender"></p>
        <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
        <p id="modalManager"></p>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-success">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    let currentUser = null;
    let isEditMode = false;
    let history = [];
    
    async function initPage() {
      // ユーザー情報取得
      try {
        const response = await fetch('/api/user', {
          method: 'GET',
          credentials: 'include'
        });
        if (response.ok) {
          currentUser = await response.json();
        } else {
          window.location.href = './login.html';
          return;
        }
      } catch (e) {
        console.error('Failed to fetch user:', e);
        window.location.href = './login.html';
        return;
      }
      
      // 送信履歴取得
      await loadHistory();
      
      // セッションストレージから日付と部門を復元
      const savedDate = sessionStorage.getItem('reportDate');
      const savedDept = sessionStorage.getItem('reportDept');
      if (savedDate) {
        document.getElementById('reportDate').value = savedDate;
      }
      if (savedDept) {
        document.getElementById('department').value = savedDept;
      }
      
      // ローカルストレージから下書きを復元
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const draftData = JSON.parse(draft);
        document.getElementById('yesterday').value = draftData.yesterday || '';
        document.getElementById('today').value = draftData.today || '';
        document.getElementById('issues').value = draftData.issues || '';
      }
      
      // イベントリスナー設定
      document.getElementById('reportForm').addEventListener('submit', handleSubmit);
      document.getElementById('editBtn').addEventListener('click', handleEdit);
      document.getElementById('saveDraftBtn').addEventListener('click', handleSaveDraft);
      document.getElementById('confirmBtn').addEventListener('click', handleConfirm);
      document.getElementById('cancelBtn').addEventListener('click', handleCancel);
      
      // 日付と部門の変更を監視
      document.getElementById('reportDate').addEventListener('change', (e) => {
        sessionStorage.setItem('reportDate', e.target.value);
      });
      document.getElementById('department').addEventListener('change', (e) => {
        sessionStorage.setItem('reportDept', e.target.value);
      });
    }
    
    async function loadHistory() {
      try {
        const response = await fetch('/api/reports', {
          method: 'GET',
          credentials: 'include'
        });
        if (response.ok) {
          history = await response.json();
          renderHistory();
        }
      } catch (e) {
        console.error('Failed to load history:', e);
      }
    }
    
    function renderHistory() {
      const historyList = document.getElementById('historyList');
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-item-header">
            <span><strong>${item.sender}</strong></span>
            <span>${item.timestamp}</span>
            <span style="color: #28a745;">送信済</span>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
            <p><strong>今日やること:</strong> ${item.today}</p>
            <p><strong>抱えている課題:</strong> ${item.issues}</p>
          </div>
        </div>
      `).join('');
    }
    
    function handleEdit() {
      isEditMode = true;
      document.getElementById('yesterday').disabled = false;
      document.getElementById('today').disabled = false;
      document.getElementById('issues').disabled = false;
      document.getElementById('editBtn').style.display = 'none';
    }
    
    function handleSaveDraft() {
      const draft = {
        yesterday: document.getElementById('yesterday').value,
        today: document.getElementById('today').value,
        issues: document.getElementById('issues').value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    function handleSubmit(e) {
      e.preventDefault();
      
      // バリデーション
      const date = document.getElementById('reportDate').value;
      const dept = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      let hasError = false;
      
      if (!date) {
        document.getElementById('dateError').classList.add('show');
        hasError = true;
      } else {
        document.getElementById('dateError').classList.remove('show');
      }
      
      if (!dept) {
        document.getElementById('departmentError').classList.add('show');
        hasError = true;
      } else {
        document.getElementById('departmentError').classList.remove('show');
      }
      
      if (!yesterday && !today && !issues) {
        document.getElementById('yesterdayError').classList.add('show');
        document.getElementById('todayError').classList.add('show');
        document.getElementById('issuesError').classList.add('show');
        hasError = true;
      } else {
        document.getElementById('yesterdayError').classList.remove('show');
        document.getElementById('todayError').classList.remove('show');
        document.getElementById('issuesError').classList.remove('show');
      }
      
      if (hasError) return;
      
      // 確認ダイアログ表示
      document.getElementById('modalYesterday').textContent = yesterday || '(未入力)';
      document.getElementById('modalToday').textContent = today || '(未入力)';
      document.getElementById('modalIssues').textContent = issues || '(未入力)';
      document.getElementById('modalSender').textContent = currentUser.email || 'testuser@example.com';
      document.getElementById('modalManager').textContent = currentUser.manager || '部長 <manager@example.com>';
      
      document.getElementById('confirmModal').classList.add('show');
    }
    
    function handleCancel() {
      document.getElementById('confirmModal').classList.remove('show');
    }
    
    async function handleConfirm() {
      const date = document.getElementById('reportDate').value;
      const dept = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            date,
            department: dept,
            yesterday,
            today,
            issues
          })
        });
        
        if (response.ok) {
          document.getElementById('confirmModal').classList.remove('show');
          document.getElementById('successMessage').classList.add('show');
          
          // フォームクリア
          document.getElementById('yesterday').value = '';
          document.getElementById('today').value = '';
          document.getElementById('issues').value = '';
          document.getElementById('yesterday').disabled = true;
          document.getElementById('today').disabled = true;
          document.getElementById('issues').disabled = true;
          document.getElementById('editBtn').style.display = 'inline-block';
          isEditMode = false;
          
          // ドラフト削除
          localStorage.removeItem('reportDraft');
          
          // 履歴更新
          await loadHistory();
          
          // メッセージ非表示
          setTimeout(() => {
            document.getElementById('successMessage').classList.remove('show');
          }, 3000);
        } else {
          alert('送信に失敗しました');
        }
      } catch (e) {
        console.error('Failed to submit report:', e);
        alert('送信に失敗しました');
      }
    }
    
    // ページ初期化
    initPage();
  </script>
</body>
</html>
