<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-section p {
            color: #856404;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-section .deadline-time {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .nav-button {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-button:hover {
            background-color: #2980b9;
        }
        .summary-section {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .summary-table thead {
            background-color: #ecf0f1;
        }
        .summary-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #bdc3c7;
            font-size: 14px;
        }
        .summary-table td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
            color: #666;
            font-size: 14px;
        }
        .summary-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            transition: width 0.3s ease;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d5f4e6;
            color: #27ae60;
        }
        .status-pending {
            background-color: #fdeaa8;
            color: #d68910;
        }
        .logout-button {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }
        .logout-button:hover {
            background-color: #c0392b;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <p>提出期限:</p>
                <div class="deadline-time" id="deadlineTime">本日 18:00</div>
            </div>
            
            <div class="button-group">
                <a href="./daily-report.html" class="nav-button">日報を入力・送信</a>
                <button class="logout-button" id="logoutBtn">ログアウト</button>
            </div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard/summary');
                if (response.ok) {
                    const data = await response.json();
                    renderSummary(data);
                }
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }
        
        function renderSummary(data) {
            const tbody = document.getElementById('summaryTableBody');
            
            if (!data.departments || data.departments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">データがありません</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.departments.map(dept => {
                const total = dept.submitted + dept.pending;
                const rate = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
                const status = rate === 100 ? '完了' : '進行中';
                const statusClass = rate === 100 ? 'status-submitted' : 'status-pending';
                
                return `
                    <tr>
                        <td>${dept.name}</td>
                        <td>${dept.submitted}</td>
                        <td>${dept.pending}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            }).join('');
        }
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = './login.html';
        });
        
        // Set deadline
        const now = new Date();
        const deadline = new Date(now);
        deadline.setHours(18, 0, 0, 0);
        
        const deadlineStr = deadline.toLocaleString('ja-JP', {
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        document.getElementById('deadlineTime').textContent = `本日 ${deadlineStr.split(' ')[1]}`;
        
        loadDashboard();
    </script>
</body>
</html>
