<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        .user-info {
            font-size: 14px;
            color: #666;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .form-section input[type="date"],
        .form-section select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .form-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            min-height: 100px;
            font-family: inherit;
            resize: vertical;
        }
        .form-section textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #666;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .history-item-date {
            color: #007bff;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .edit-button {
            background-color: #17a2b8;
            color: white;
            padding: 8px 16px;
            font-size: 12px;
        }
        .edit-button:hover {
            background-color: #138496;
        }
        .nav-button {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            margin-top: 20px;
        }
        .nav-button:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <span id="userEmail">ユーザー: -</span>
            </div>
        </div>

        <div id="successMessage" class="success-message">
            送信完了しました
        </div>

        <form id="reportForm">
            <div class="form-section">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div id="reportDateError" class="error-message">報告日付を選択してください</div>
            </div>

            <div class="form-section">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="開発部">開発部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div id="departmentError" class="error-message">部門を選択してください</div>
            </div>

            <div class="form-section">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div id="yesterdayError" class="error-message">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div id="todayError" class="error-message">報告内容を入力してください</div>
            </div>

            <div class="form-section">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div id="issuesError" class="error-message">報告内容を入力してください</div>
            </div>

            <div class="button-group">
                <button type="button" id="editButton" class="btn-secondary edit-button">報告内容編集</button>
                <button type="button" id="draftButton" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitButton" class="btn-primary">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul id="historyList" class="history-list">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>

        <button class="nav-button" onclick="window.location.href='./dashboard.html'">ダッシュボードへ</button>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>送信者:</strong> <span id="modalSender">-</span></p>
                <p><strong>部長:</strong> <span id="modalChief">-</span></p>
                <p><strong>報告日付:</strong> <span id="modalDate">-</span></p>
                <p><strong>昨日やったこと:</strong></p>
                <p id="modalYesterday" style="margin-left: 10px; color: #333;">-</p>
                <p><strong>今日やること:</strong></p>
                <p id="modalToday" style="margin-left: 10px; color: #333;">-</p>
                <p><strong>抱えている課題:</strong></p>
                <p id="modalIssues" style="margin-left: 10px; color: #333;">-</p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelButton" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmButton" class="btn-success">確認</button>
            </div>
        </div>
    </div>

    <script>
        // ユーザー情報（セッションから取得）
        let currentUser = {
            email: 'testuser@example.com',
            name: 'テストユーザー',
            department: '営業部',
            chief: '部長太郎 <bucho@example.com>'
        };

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadDraftData();
            loadHistory();
            setupEventListeners();
        });

        function loadUserInfo() {
            document.getElementById('userEmail').textContent = `ユーザー: ${currentUser.email}`;
        }

        function setupEventListeners() {
            const form = document.getElementById('reportForm');
            const editButton = document.getElementById('editButton');
            const draftButton = document.getElementById('draftButton');
            const submitButton = document.getElementById('submitButton');
            const cancelButton = document.getElementById('cancelButton');
            const confirmButton = document.getElementById('confirmButton');
            const reportDate = document.getElementById('reportDate');
            const department = document.getElementById('department');

            editButton.addEventListener('click', enableEdit);
            draftButton.addEventListener('click', saveDraft);
            form.addEventListener('submit', handleSubmit);
            cancelButton.addEventListener('click', closeConfirmModal);
            confirmButton.addEventListener('click', confirmSubmit);

            // 日付と部門の変更を保存
            reportDate.addEventListener('change', function() {
                sessionStorage.setItem('reportDate', this.value);
            });
            department.addEventListener('change', function() {
                sessionStorage.setItem('department', this.value);
            });
        }

        function enableEdit() {
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('yesterday').focus();
        }

        function saveDraft() {
            const data = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value,
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('draftReport', JSON.stringify(data));
            alert('下書きを保存しました');
        }

        function loadDraftData() {
            const draft = localStorage.getItem('draftReport');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
            }

            // セッションストレージから日付と部門を復元
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDept = sessionStorage.getItem('department');
            if (savedDate) {
                document.getElementById('reportDate').value = savedDate;
            }
            if (savedDept) {
                document.getElementById('department').value = savedDept;
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            clearErrors();

            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            let isValid = true;

            if (!reportDate) {
                document.getElementById('reportDateError').classList.add('show');
                isValid = false;
            }

            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }

            if (!yesterday && !today && !issues) {
                document.getElementById('yesterdayError').classList.add('show');
                document.getElementById('todayError').classList.add('show');
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            showConfirmModal(reportDate, yesterday, today, issues);
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
        }

        function showConfirmModal(reportDate, yesterday, today, issues) {
            document.getElementById('modalSender').textContent = currentUser.email;
            document.getElementById('modalChief').textContent = currentUser.chief;
            document.getElementById('modalDate').textContent = reportDate;
            document.getElementById('modalYesterday').textContent = yesterday || '(未入力)';
            document.getElementById('modalToday').textContent = today || '(未入力)';
            document.getElementById('modalIssues').textContent = issues || '(未入力)';
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        function confirmSubmit() {
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            // 履歴に追加
            addToHistory(reportDate, yesterday, today, issues);

            // フォームをクリア
            document.getElementById('yesterday').value = '';
            document.getElementById('today').value = '';
            document.getElementById('issues').value = '';
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;

            // ドラフトをクリア
            localStorage.removeItem('draftReport');

            // モーダルを閉じる
            closeConfirmModal();

            // 成功メッセージを表示
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);

            // 履歴を再読み込み
            loadHistory();
        }

        function addToHistory(reportDate, yesterday, today, issues) {
            let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const now = new Date();
            const entry = {
                id: Date.now(),
                date: now.toISOString(),
                reportDate: reportDate,
                yesterday: yesterday,
                today: today,
                issues: issues,
                sender: currentUser.email,
                status: '送信済'
            };
            history.unshift(entry);
            localStorage.setItem('reportHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }

            historyList.innerHTML = history.map(entry => {
                const date = new Date(entry.date);
                const formattedDate = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                return `
                    <li class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${formattedDate}</span>
                            <span class="history-item-status">${entry.status}</span>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${entry.yesterday || '(未入力)'}</p>
                            <p><strong>今日やること:</strong> ${entry.today || '(未入力)'}</p>
                            <p><strong>抱えている課題:</strong> ${entry.issues || '(未入力)'}</p>
                        </div>
                    </li>
                `;
            }).join('');
        }
    </script>
</body>
</html>
