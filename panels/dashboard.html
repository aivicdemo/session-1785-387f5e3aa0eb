<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-label {
            color: #856404;
            font-weight: 600;
            font-size: 14px;
        }
        .deadline-time {
            color: #d39e00;
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
        }
        .nav-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-button:hover {
            background-color: #45a049;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .summary-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #f5f5f5;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card.submitted {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }
        .stat-card.pending {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }
        .stat-card.total {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <div class="deadline-label">本日の提出期限</div>
                <div class="deadline-time" id="deadlineTime">17:00</div>
            </div>
            
            <a href="./daily-report-input.html" class="nav-button">日報を入力・送信する</a>
        </div>
        
        <div class="summary-section">
            <div class="summary-title">部門別提出状況サマリー</div>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card total">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">総人数</div>
                </div>
                <div class="stat-card submitted">
                    <div class="stat-value" id="submittedCount">0</div>
                    <div class="stat-label">提出済み</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-value" id="pendingCount">0</div>
                    <div class="stat-label">未提出</div>
                </div>
            </div>
            
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み / 総人数</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="3" class="empty-state">データを読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadDashboard() {
            try {
                // ユーザー情報取得
                const userResponse = await fetch('/api/user');
                let currentUserDept = null;
                if (userResponse.ok) {
                    const user = await userResponse.json();
                    currentUserDept = user.department;
                }
                
                // 部門別統計を取得
                const statsResponse = await fetch('/api/department-stats');
                if (statsResponse.ok) {
                    const stats = await statsResponse.json();
                    
                    // 統計情報を表示
                    let totalUsers = 0;
                    let submittedUsers = 0;
                    
                    const tableBody = document.getElementById('summaryTableBody');
                    tableBody.innerHTML = '';
                    
                    stats.forEach(dept => {
                        totalUsers += dept.total;
                        submittedUsers += dept.submitted;
                        
                        const percentage = dept.total > 0 ? Math.round((dept.submitted / dept.total) * 100) : 0;
                        
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${dept.name}</td>
                            <td>${dept.submitted} / ${dept.total}</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${percentage}%">${percentage}%</div>
                                </div>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                    
                    // 統計カードを更新
                    document.getElementById('totalCount').textContent = totalUsers;
                    document.getElementById('submittedCount').textContent = submittedUsers;
                    document.getElementById('pendingCount').textContent = totalUsers - submittedUsers;
                    
                    if (stats.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="3" class="empty-state">部門データがありません</td></tr>';
                    }
                }
            } catch (e) {
                console.error('ダッシュボード読み込みエラー:', e);
                document.getElementById('summaryTableBody').innerHTML = '<tr><td colspan="3" class="empty-state">データの読み込みに失敗しました</td></tr>';
            }
            
            // 提出期限を設定
            const now = new Date();
            const deadline = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 0, 0);
            document.getElementById('deadlineTime').textContent = deadline.toLocaleTimeString('ja-JP', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // ページ読み込み時に実行
        loadDashboard();
    </script>
</body>
</html>
