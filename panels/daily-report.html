<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            background-color: #1976d2;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
        .btn-secondary {
            background-color: #757575;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #616161;
        }
        .btn-success {
            background-color: #4caf50;
            color: white;
        }
        .btn-success:hover {
            background-color: #45a049;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-summary {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .modal-summary-item {
            margin-bottom: 10px;
        }
        .modal-summary-label {
            font-weight: bold;
            color: #333;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-footer button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 30px;
        }
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        .history-empty {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            font-weight: bold;
            color: #333;
        }
        .history-item-status {
            background-color: #4caf50;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-item-content-item {
            margin-bottom: 8px;
        }
        .history-item-content-label {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-success" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <div class="modal-summary">
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">昨日やったこと:</span> <span id="summaryYesterday"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">今日やること:</span> <span id="summaryToday"></span>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">抱えている課題:</span> <span id="summaryIssues"></span>
                    </div>
                </div>
                <div style="margin-top: 15px; font-size: 13px;">
                    <div style="margin-bottom: 10px;">
                        <span style="font-weight: bold;">送信者:</span> <span id="senderEmail"></span>
                    </div>
                    <div>
                        <span style="font-weight: bold;">部長:</span> <span id="managerEmail"></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ページロード時の初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadFormData();
            loadHistory();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            const editBtn = document.getElementById('editBtn');
            const draftBtn = document.getElementById('draftBtn');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            const form = document.getElementById('reportForm');
            
            editBtn.addEventListener('click', enableEdit);
            draftBtn.addEventListener('click', saveDraft);
            form.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', closeConfirmModal);
            confirmBtn.addEventListener('click', confirmSubmit);
        }
        
        function enableEdit() {
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
        }
        
        function saveDraft() {
            const formData = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(formData));
            alert('下書きを保存しました');
        }
        
        function loadFormData() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('reportDate').value = data.reportDate || '';
                document.getElementById('department').value = data.department || '';
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
            }
            
            // 日付フィールドのみセッションストレージから復元
            const sessionDate = sessionStorage.getItem('lastReportDate');
            if (sessionDate) {
                document.getElementById('reportDate').value = sessionDate;
            }
        }
        
        function handleSubmit(e) {
            e.preventDefault();
            
            // バリデーション
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            
            let hasError = false;
            
            // 日付チェック
            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('dateError').classList.remove('show');
                sessionStorage.setItem('lastReportDate', reportDate);
            }
            
            // 部門チェック
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('departmentError').classList.remove('show');
            }
            
            // 報告内容チェック
            if (!yesterday && !today && !issues) {
                document.getElementById('yesterdayError').classList.add('show');
                document.getElementById('todayError').classList.add('show');
                document.getElementById('issuesError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('yesterdayError').classList.remove('show');
                document.getElementById('todayError').classList.remove('show');
                document.getElementById('issuesError').classList.remove('show');
            }
            
            if (hasError) {
                return;
            }
            
            // 確認ダイアログを表示
            showConfirmModal({
                yesterday: yesterday,
                today: today,
                issues: issues,
                reportDate: reportDate,
                department: department
            });
        }
        
        function showConfirmModal(data) {
            document.getElementById('summaryYesterday').textContent = data.yesterday.substring(0, 50) + (data.yesterday.length > 50 ? '...' : '');
            document.getElementById('summaryToday').textContent = data.today.substring(0, 50) + (data.today.length > 50 ? '...' : '');
            document.getElementById('summaryIssues').textContent = data.issues.substring(0, 50) + (data.issues.length > 50 ? '...' : '');
            
            // ユーザー情報を取得（ここではダミーデータを使用）
            document.getElementById('senderEmail').textContent = 'testuser@example.com';
            document.getElementById('managerEmail').textContent = '部長 <bucho@example.com>';
            
            // データをグローバルに保存
            window.pendingSubmitData = data;
            
            document.getElementById('confirmModal').classList.add('show');
        }
        
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }
        
        function confirmSubmit() {
            const data = window.pendingSubmitData;
            
            // 送信履歴に追加
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const now = new Date();
            const timestamp = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            history.unshift({
                id: Date.now(),
                timestamp: timestamp,
                sender: 'testuser',
                status: '送信済',
                yesterday: data.yesterday,
                today: data.today,
                issues: data.issues,
                reportDate: data.reportDate,
                department: data.department
            });
            
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // フォームをクリア
            document.getElementById('reportForm').reset();
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            localStorage.removeItem('reportDraft');
            
            // 成功メッセージを表示
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
            
            // ダイアログを閉じる
            closeConfirmModal();
            
            // 履歴を更新
            loadHistory();
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const container = document.getElementById('historyContainer');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.timestamp}</span>
                        <span class="history-item-status">${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <div class="history-item-content-item">
                            <span class="history-item-content-label">昨日やったこと:</span> ${item.yesterday}
                        </div>
                        <div class="history-item-content-item">
                            <span class="history-item-content-label">今日やること:</span> ${item.today}
                        </div>
                        <div class="history-item-content-item">
                            <span class="history-item-content-label">抱えている課題:</span> ${item.issues}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
