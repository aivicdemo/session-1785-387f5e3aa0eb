<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .required {
            color: #d32f2f;
            margin-left: 4px;
        }
        input[type="date"],
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }
        textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }
        textarea:disabled {
            background-color: #f5f5f5;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #1976d2;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
        .btn-secondary {
            background-color: #757575;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #616161;
        }
        .btn-success {
            background-color: #388e3c;
            color: white;
        }
        .btn-success:hover {
            background-color: #2e7d32;
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #c8e6c9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-summary {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .modal-summary-item {
            margin-bottom: 10px;
        }
        .modal-summary-label {
            font-weight: 600;
            color: #333;
        }
        .modal-summary-value {
            color: #666;
            word-break: break-word;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            flex: 1;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #1976d2;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #c8e6c9;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content-item {
            margin-bottom: 8px;
        }
        .history-item-content-label {
            font-weight: 600;
            color: #333;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reportDate">報告日付 <span class="required">*</span></label>
                        <input type="date" id="reportDate" name="reportDate" required>
                        <div class="error-message" id="dateError">報告日付を選択してください</div>
                    </div>
                    <div class="form-group">
                        <label for="department">部門 <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="">選択してください</option>
                            <option value="営業部">営業部</option>
                            <option value="企画部">企画部</option>
                            <option value="技術部">技術部</option>
                            <option value="管理部">管理部</option>
                        </select>
                        <div class="error-message" id="departmentError">部門を選択してください</div>
                    </div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-row full">
                    <div class="form-group">
                        <label for="yesterday">昨日やったこと <span class="required">*</span></label>
                        <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                        <div class="error-message" id="contentError">報告内容を入力してください</div>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="today">今日やること <span class="required">*</span></label>
                        <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    </div>
                </div>
                
                <div class="form-row full">
                    <div class="form-group">
                        <label for="issues">抱えている課題 <span class="required">*</span></label>
                        <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p>以下の内容で日報を送信します。よろしいですか？</p>
                <div class="modal-summary">
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">昨日やったこと:</div>
                        <div class="modal-summary-value" id="summaryYesterday"></div>
                    </div>
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">今日やること:</div>
                        <div class="modal-summary-value" id="summaryToday"></div>
                    </div>
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">抱えている課題:</div>
                        <div class="modal-summary-value" id="summaryIssues"></div>
                    </div>
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">送信者:</div>
                        <div class="modal-summary-value" id="senderEmail"></div>
                    </div>
                    <div class="modal-summary-item">
                        <div class="modal-summary-label">部長:</div>
                        <div class="modal-summary-value" id="managerEmail"></div>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const yesterdayField = document.getElementById('yesterday');
        const todayField = document.getElementById('today');
        const issuesField = document.getElementById('issues');
        const reportDateField = document.getElementById('reportDate');
        const departmentField = document.getElementById('department');
        
        let isEditing = false;
        let currentUser = null;
        let currentManager = null;
        
        // Initialize
        async function init() {
            await loadUserData();
            loadFormData();
            loadHistory();
            setupEventListeners();
        }
        
        async function loadUserData() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data;
                    currentManager = data.manager || {};
                }
            } catch (e) {
                console.error('Failed to load user data:', e);
                currentUser = { email: 'testuser@example.com', name: 'Test User' };
                currentManager = { email: 'bucho@example.com', name: '部長' };
            }
        }
        
        function loadFormData() {
            const saved = localStorage.getItem('reportFormData');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.reportDate) reportDateField.value = data.reportDate;
                if (data.department) departmentField.value = data.department;
                if (data.yesterday) yesterdayField.value = data.yesterday;
                if (data.today) todayField.value = data.today;
                if (data.issues) issuesField.value = data.issues;
            }
        }
        
        function saveFormData() {
            const data = {
                reportDate: reportDateField.value,
                department: departmentField.value,
                yesterday: yesterdayField.value,
                today: todayField.value,
                issues: issuesField.value
            };
            localStorage.setItem('reportFormData', JSON.stringify(data));
        }
        
        function clearFormData() {
            yesterdayField.value = '';
            todayField.value = '';
            issuesField.value = '';
            localStorage.removeItem('reportFormData');
        }
        
        async function loadHistory() {
            try {
                const response = await fetch('/api/reports');
                if (response.ok) {
                    const reports = await response.json();
                    renderHistory(reports);
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }
        
        function renderHistory(reports) {
            if (!reports || reports.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = reports.map(report => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div class="history-item-date">${formatDateTime(report.createdAt)}</div>
                        <div class="history-item-status">送信済</div>
                    </div>
                    <div class="history-item-content">
                        <div class="history-item-content-item">
                            <span class="history-item-content-label">昨日やったこと:</span> ${escapeHtml(report.yesterday)}
                        </div>
                        <div class="history-item-content-item">
                            <span class="history-item-content-label">今日やること:</span> ${escapeHtml(report.today)}
                        </div>
                        <div class="history-item-content-item">
                            <span class="history-item-content-label">抱えている課題:</span> ${escapeHtml(report.issues)}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function setupEventListeners() {
            editBtn.addEventListener('click', (e) => {
                e.preventDefault();
                isEditing = true;
                yesterdayField.disabled = false;
                todayField.disabled = false;
                issuesField.disabled = false;
                editBtn.style.display = 'none';
            });
            
            draftBtn.addEventListener('click', (e) => {
                e.preventDefault();
                saveFormData();
                alert('下書きを保存しました');
            });
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                validateAndShowConfirm();
            });
            
            cancelBtn.addEventListener('click', () => {
                confirmModal.classList.remove('show');
            });
            
            confirmBtn.addEventListener('click', async () => {
                await submitReport();
            });
        }
        
        function validateAndShowConfirm() {
            clearErrors();
            let isValid = true;
            
            if (!reportDateField.value) {
                showError('dateError');
                isValid = false;
            }
            
            if (!departmentField.value) {
                showError('departmentError');
                isValid = false;
            }
            
            const yesterday = yesterdayField.value.trim();
            const today = todayField.value.trim();
            const issues = issuesField.value.trim();
            
            if (!yesterday && !today && !issues) {
                showError('contentError');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirmation modal
            document.getElementById('summaryYesterday').textContent = yesterday || '(未入力)';
            document.getElementById('summaryToday').textContent = today || '(未入力)';
            document.getElementById('summaryIssues').textContent = issues || '(未入力)';
            document.getElementById('senderEmail').textContent = currentUser?.email || 'testuser@example.com';
            document.getElementById('managerEmail').textContent = `${currentManager?.name || '部長'} <${currentManager?.email || 'bucho@example.com'}>`;
            
            confirmModal.classList.add('show');
        }
        
        async function submitReport() {
            const reportData = {
                reportDate: reportDateField.value,
                department: departmentField.value,
                yesterday: yesterdayField.value.trim(),
                today: todayField.value.trim(),
                issues: issuesField.value.trim(),
                sender: currentUser?.email || 'testuser@example.com',
                manager: currentManager?.email || 'bucho@example.com'
            };
            
            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reportData)
                });
                
                if (response.ok) {
                    confirmModal.classList.remove('show');
                    clearFormData();
                    clearForm();
                    successMessage.classList.add('show');
                    setTimeout(() => successMessage.classList.remove('show'), 3000);
                    await loadHistory();
                }
            } catch (e) {
                console.error('Failed to submit report:', e);
                alert('送信に失敗しました');
            }
        }
        
        function clearForm() {
            yesterdayField.value = '';
            todayField.value = '';
            issuesField.value = '';
            yesterdayField.disabled = true;
            todayField.disabled = true;
            issuesField.disabled = true;
            editBtn.style.display = 'block';
            isEditing = false;
        }
        
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
        }
        
        function showError(elementId) {
            document.getElementById(elementId).classList.add('show');
        }
        
        init();
    </script>
</body>
</html>
