<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
        .user-info div {
            margin: 5px 0;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }
        .history-item-content {
            font-size: 13px;
            line-height: 1.5;
            color: #333;
        }
        .history-item-content p {
            margin-bottom: 5px;
        }
        .history-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .status-badge {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }
        .edit-mode-indicator {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }
        .edit-mode-indicator.show {
            display: block;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-buttons button {
            padding: 10px 16px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <div>ユーザー: <span id="userName">-</span></div>
                <div>メール: <span id="userEmail">-</span></div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="btn-secondary" onclick="goToDashboard()">ダッシュボード</button>
            <button class="btn-secondary" onclick="logout()">ログアウト</button>
        </div>

        <div class="success-message" id="successMessage"></div>

        <form id="reportForm">
            <div class="form-section">
                <h2>報告情報</h2>
                
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>

                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>

            <div class="form-section">
                <h2>報告内容</h2>
                <div class="edit-mode-indicator" id="editModeIndicator">
                    編集モード: 報告内容を編集できます
                </div>

                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="例：顧客A社の提案資料作成" disabled></textarea>
                </div>

                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="例：顧客B社との打ち合わせ" disabled></textarea>
                </div>

                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="例：プロジェクトスケジュール調整" disabled></textarea>
                </div>

                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-primary" id="editBtn" onclick="enableEditMode()">報告内容編集</button>
                <button type="button" class="btn-success" id="draftBtn" onclick="saveDraft()">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 10px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 10px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px;">
                    <strong>送信者:</strong> <span id="confirmSender"></span>
                </p>
                <p style="margin-top: 10px;">
                    <strong>部長:</strong> <span id="confirmManager"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" onclick="cancelSubmit()">キャンセル</button>
                <button type="button" class="btn-primary" onclick="confirmSubmit()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isEditMode = false;
        let pendingSubmitData = null;

        // ページロード時の初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await initializePage();
            loadDraft();
            loadHistory();
            restoreFormState();
        });

        async function initializePage() {
            const userStr = sessionStorage.getItem('currentUser');
            if (!userStr) {
                window.location.href = './login.html';
                return;
            }
            currentUser = JSON.parse(userStr);
            document.getElementById('userName').textContent = currentUser.name || currentUser.userId;
            document.getElementById('userEmail').textContent = currentUser.email || '-';
        }

        function restoreFormState() {
            const saved = sessionStorage.getItem('reportFormState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.reportDate) {
                    document.getElementById('reportDate').value = state.reportDate;
                }
                if (state.department) {
                    document.getElementById('department').value = state.department;
                }
            }
        }

        function saveFormState() {
            const state = {
                reportDate: document.getElementById('reportDate').value,
                department: document.getElementById('department').value
            };
            sessionStorage.setItem('reportFormState', JSON.stringify(state));
        }

        function enableEditMode() {
            isEditMode = true;
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editModeIndicator').classList.add('show');
            document.getElementById('editBtn').style.display = 'none';
        }

        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
            }
        }

        function saveDraft() {
            const draft = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }

            historyList.innerHTML = history.map(item => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span><strong>${item.timestamp}</strong></span>
                        <span class="status-badge">${item.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日:</strong> ${item.yesterday.substring(0, 50)}${item.yesterday.length > 50 ? '...' : ''}</p>
                        <p><strong>今日:</strong> ${item.today.substring(0, 50)}${item.today.length > 50 ? '...' : ''}</p>
                        <p><strong>課題:</strong> ${item.issues.substring(0, 50)}${item.issues.length > 50 ? '...' : ''}</p>
                        <p><strong>送信者:</strong> ${item.sender}</p>
                    </div>
                </li>
            `).join('');
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // バリデーション
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            let hasError = false;

            // 日付チェック
            if (!reportDate) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('dateError').classList.remove('show');
            }

            // 部門チェック
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('departmentError').classList.remove('show');
            }

            // 内容チェック
            if (!yesterday && !today && !issues) {
                document.getElementById('contentError').classList.add('show');
                hasError = true;
            } else {
                document.getElementById('contentError').classList.remove('show');
            }

            if (hasError) {
                return;
            }

            // 送信確認ダイアログを表示
            pendingSubmitData = {
                reportDate,
                department,
                yesterday,
                today,
                issues
            };

            document.getElementById('confirmYesterday').textContent = yesterday || '(未入力)';
            document.getElementById('confirmToday').textContent = today || '(未入力)';
            document.getElementById('confirmIssues').textContent = issues || '(未入力)';
            document.getElementById('confirmSender').textContent = `${currentUser.name} <${currentUser.email}>`;
            
            // 部長情報を取得（ダミー）
            const managerEmail = currentUser.managerEmail || 'bucho@example.com';
            const managerName = currentUser.managerName || '部長';
            document.getElementById('confirmManager').textContent = `${managerName} <${managerEmail}>`;

            document.getElementById('confirmModal').classList.add('show');
        });

        function cancelSubmit() {
            document.getElementById('confirmModal').classList.remove('show');
            pendingSubmitData = null;
        }

        async function confirmSubmit() {
            if (!pendingSubmitData) return;

            // 送信処理
            const timestamp = new Date().toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const historyItem = {
                timestamp,
                status: '送信済',
                yesterday: pendingSubmitData.yesterday,
                today: pendingSubmitData.today,
                issues: pendingSubmitData.issues,
                sender: currentUser.name || currentUser.userId,
                department: pendingSubmitData.department
            };

            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(historyItem);
            localStorage.setItem('reportHistory', JSON.stringify(history));

            // フォームをクリア
            document.getElementById('reportForm').reset();
            document.getElementById('yesterday').value = '';
            document.getElementById('today').value = '';
            document.getElementById('issues').value = '';
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            document.getElementById('editModeIndicator').classList.remove('show');
            document.getElementById('editBtn').style.display = 'block';
            isEditMode = false;

            // 下書きをクリア
            localStorage.removeItem('reportDraft');

            // 成功メッセージを表示
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = '送信完了しました';
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);

            // ダイアログを閉じる
            document.getElementById('confirmModal').classList.remove('show');
            pendingSubmitData = null;

            // 履歴を更新
            loadHistory();
            saveFormState();
        }

        function goToDashboard() {
            window.location.href = './dashboard.html';
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = './login.html';
        }

        // フォーム変更時に状態を保存
        document.getElementById('reportDate').addEventListener('change', saveFormState);
        document.getElementById('department').addEventListener('change', saveFormState);
    </script>
</body>
</html>
