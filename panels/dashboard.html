<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .deadline-section {
      background-color: #e7f3ff;
      border-left: 4px solid #007bff;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #007bff;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-section p {
      color: #333;
      font-size: 18px;
      font-weight: bold;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-submitted {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <p id="deadline">本日 18:00</p>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table>
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryTable">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>80%</td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>5</td>
            <td>1</td>
            <td>83%</td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>10</td>
            <td>0</td>
            <td>100%</td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>3</td>
            <td>2</td>
            <td>60%</td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <a href="./daily-report.html" class="nav-button">日報入力・送信画面へ</a>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 提出期限を動的に設定
      const today = new Date();
      const deadline = new Date(today);
      deadline.setHours(18, 0, 0, 0);
      
      const deadlineText = deadline.toLocaleString('ja-JP', {
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      document.getElementById('deadline').textContent = deadlineText;
    });
  </script>
</body>
</html>
