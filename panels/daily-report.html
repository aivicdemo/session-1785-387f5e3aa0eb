<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    input[type="date"]:disabled,
    select:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: #545b62;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }
    .modal-body {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-summary {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .modal-summary-item {
      margin-bottom: 10px;
    }
    .modal-summary-label {
      font-weight: 600;
      color: #333;
    }
    .modal-summary-text {
      color: #666;
      word-break: break-word;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
    }
    .history-empty {
      color: #999;
      font-size: 14px;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-item {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-item-date {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .history-item-content-item {
      margin-bottom: 8px;
    }
    .history-item-content-label {
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
          <input type="date" id="reportDate" required>
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="department">部門 <span style="color: red;">*</span></label>
          <select id="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
          <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること <span style="color: red;">*</span></label>
          <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="todayError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
          <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
          <div class="error-message" id="issuesError">報告内容を入力してください</div>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-primary">報告内容編集</button>
        <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">送信確認</div>
      <div class="modal-body">
        <div class="modal-summary">
          <div class="modal-summary-item">
            <div class="modal-summary-label">昨日やったこと</div>
            <div class="modal-summary-text" id="summaryYesterday"></div>
          </div>
          <div class="modal-summary-item">
            <div class="modal-summary-label">今日やること</div>
            <div class="modal-summary-text" id="summaryToday"></div>
          </div>
          <div class="modal-summary-item">
            <div class="modal-summary-label">抱えている課題</div>
            <div class="modal-summary-text" id="summaryIssues"></div>
          </div>
        </div>
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
          <div style="margin-bottom: 10px;">
            <strong>送信者:</strong> <span id="senderEmail">testuser@example.com</span>
          </div>
          <div>
            <strong>部長:</strong> <span id="managerEmail">部長 &lt;bucho@example.com&gt;</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-primary">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('reportForm');
    const reportDate = document.getElementById('reportDate');
    const department = document.getElementById('department');
    const yesterday = document.getElementById('yesterday');
    const today = document.getElementById('today');
    const issues = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const draftBtn = document.getElementById('draftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyContainer = document.getElementById('historyContainer');
    
    let isEditing = false;
    let currentUser = null;
    
    // Initialize
    async function init() {
      // Get current user
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          currentUser = await response.json();
        }
      } catch (e) {
        console.log('User not authenticated');
      }
      
      // Load draft from session storage
      loadDraft();
      
      // Load history
      loadHistory();
      
      // Restore date and department from session storage
      const savedDate = sessionStorage.getItem('reportDate');
      if (savedDate) {
        reportDate.value = savedDate;
      }
      
      const savedDept = sessionStorage.getItem('reportDepartment');
      if (savedDept) {
        department.value = savedDept;
      }
    }
    
    function loadDraft() {
      const draft = localStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        yesterday.value = data.yesterday || '';
        today.value = data.today || '';
        issues.value = data.issues || '';
      }
    }
    
    function saveDraft() {
      const draft = {
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value
      };
      localStorage.setItem('reportDraft', JSON.stringify(draft));
    }
    
    async function loadHistory() {
      try {
        const response = await fetch('/api/reports/history');
        if (response.ok) {
          const history = await response.json();
          if (history.length === 0) {
            historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
          } else {
            historyContainer.innerHTML = history.map(item => `
              <div class="history-item">
                <div class="history-item-header">
                  <div class="history-item-date">${formatDateTime(item.sentAt)}</div>
                  <div class="history-item-status">送信済</div>
                </div>
                <div class="history-item-content">
                  <div class="history-item-content-item">
                    <span class="history-item-content-label">昨日やったこと:</span> ${escapeHtml(item.yesterday)}
                  </div>
                  <div class="history-item-content-item">
                    <span class="history-item-content-label">今日やること:</span> ${escapeHtml(item.today)}
                  </div>
                  <div class="history-item-content-item">
                    <span class="history-item-content-label">抱えている課題:</span> ${escapeHtml(item.issues)}
                  </div>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (e) {
        console.error('Failed to load history:', e);
      }
    }
    
    function formatDateTime(dateString) {
      const date = new Date(dateString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    editBtn.addEventListener('click', () => {
      isEditing = true;
      yesterday.disabled = false;
      today.disabled = false;
      issues.disabled = false;
      yesterday.focus();
    });
    
    draftBtn.addEventListener('click', (e) => {
      e.preventDefault();
      saveDraft();
      alert('下書きを保存しました');
    });
    
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      // Clear all error messages
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      
      // Validate
      let isValid = true;
      
      if (!reportDate.value) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department.value) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      if (!yesterday.value.trim()) {
        document.getElementById('yesterdayError').classList.add('show');
        isValid = false;
      }
      
      if (!today.value.trim()) {
        document.getElementById('todayError').classList.add('show');
        isValid = false;
      }
      
      if (!issues.value.trim()) {
        document.getElementById('issuesError').classList.add('show');
        isValid = false;
      }
      
      if (!isValid) {
        return;
      }
      
      // Save to session storage
      sessionStorage.setItem('reportDate', reportDate.value);
      sessionStorage.setItem('reportDepartment', department.value);
      
      // Show confirmation modal
      document.getElementById('summaryYesterday').textContent = yesterday.value.substring(0, 50);
      document.getElementById('summaryToday').textContent = today.value.substring(0, 50);
      document.getElementById('summaryIssues').textContent = issues.value.substring(0, 50);
      
      confirmModal.classList.add('show');
    });
    
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    confirmBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/reports/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            reportDate: reportDate.value,
            department: department.value,
            yesterday: yesterday.value,
            today: today.value,
            issues: issues.value
          })
        });
        
        if (response.ok) {
          confirmModal.classList.remove('show');
          successMessage.classList.add('show');
          
          // Clear form
          yesterday.value = '';
          today.value = '';
          issues.value = '';
          yesterday.disabled = true;
          today.disabled = true;
          issues.disabled = true;
          isEditing = false;
          
          // Clear draft
          localStorage.removeItem('reportDraft');
          
          // Reload history
          loadHistory();
          
          // Hide success message after 3 seconds
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 3000);
        } else {
          alert('送信に失敗しました');
        }
      } catch (e) {
        console.error('Submit failed:', e);
        alert('送信に失敗しました');
      }
    });
    
    // Close modal when clicking outside
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) {
        confirmModal.classList.remove('show');
      }
    });
    
    init();
  </script>
</body>
</html>
