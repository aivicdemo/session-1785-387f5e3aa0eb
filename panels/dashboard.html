<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            font-size: 16px;
            color: #856404;
            margin-bottom: 10px;
        }
        .deadline-badge {
            display: inline-block;
            background-color: #ffc107;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #f9f9f9;
        }
        .summary-table th {
            background-color: #007bff;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }
        .summary-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .summary-table tr:hover {
            background-color: #f0f0f0;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-nav {
            padding: 8px 16px;
            font-size: 13px;
            background-color: #e9ecef;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-nav:hover {
            background-color: #dee2e6;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button class="btn-nav" onclick="navigateToReport()">📝 日報入力・送信</button>
        </div>
        
        <div class="header">
            <h1>日報提出状況ダッシュボード</h1>
        </div>

        <div class="deadline-section">
            <h2>📅 提出期限</h2>
            <div class="deadline-badge" id="deadlineDisplay">本日 18:00 まで</div>
        </div>

        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td>営業部</td>
                        <td>8</td>
                        <td>2</td>
                        <td>80%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td>6</td>
                        <td>1</td>
                        <td>86%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 86%;">86%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td>12</td>
                        <td>3</td>
                        <td>80%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td>5</td>
                        <td>0</td>
                        <td>100%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 100%;">100%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeDashboard();
        });

        function initializeDashboard() {
            // 提出期限を設定
            const today = new Date();
            const deadline = new Date(today);
            deadline.setHours(18, 0, 0, 0);
            
            const deadlineStr = deadline.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            document.getElementById('deadlineDisplay').textContent = '本日 18:00 まで';
        }

        function navigateToReport() {
            window.location.href = './daily-report.html';
        }
    </script>
</body>
</html>
