<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 40px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: 600;
    }
    .summary-section {
      margin-bottom: 40px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fafafa;
    }
    .summary-table th {
      background-color: #4CAF50;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #ddd;
    }
    .summary-table td {
      padding: 15px;
      border: 1px solid #ddd;
      color: #333;
    }
    .summary-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .summary-table tr:hover {
      background-color: #f0f0f0;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #4CAF50;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #2196F3;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadlineText">本日 18:00 まで</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td colspan="4" style="text-align: center; color: #999;">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <a href="./daily-report.html" class="nav-link">日報入力・送信へ</a>
  </div>
  
  <script>
    async function init() {
      await loadDeadline();
      await loadSummary();
    }
    
    async function loadDeadline() {
      try {
        const response = await fetch('/api/deadline', {
          method: 'GET',
          credentials: 'include'
        });
        if (response.ok) {
          const data = await response.json();
          const deadlineText = document.getElementById('deadlineText');
          deadlineText.textContent = data.deadline || '本日 18:00 まで';
        }
      } catch (error) {
        console.error('Error loading deadline:', error);
      }
    }
    
    async function loadSummary() {
      try {
        const response = await fetch('/api/summary', {
          method: 'GET',
          credentials: 'include'
        });
        if (response.ok) {
          const data = await response.json();
          renderSummary(data);
        }
      } catch (error) {
        console.error('Error loading summary:', error);
      }
    }
    
    function renderSummary(data) {
      const tbody = document.getElementById('summaryTableBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">データがありません</td></tr>';
        return;
      }
      
      const html = data.map(item => {
        const percentage = item.total > 0 ? Math.round((item.submitted / item.total) * 100) : 0;
        return `
          <tr>
            <td>${escapeHtml(item.department)}</td>
            <td>${item.submitted} / ${item.total}</td>
            <td>${percentage}%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${percentage}%">${percentage}%</div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      
      tbody.innerHTML = html;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    init();
  </script>
</body>
</html>
