<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #333;
        }
        .user-info {
            text-align: right;
            font-size: 14px;
            color: #666;
        }
        .user-info p {
            margin: 5px 0;
        }
        .logout-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-content {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-item-content p {
            margin: 5px 0;
        }
        .history-empty {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 14px;
        }
        .dashboard-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #17a2b8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .dashboard-link:hover {
            background-color: #138496;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>日報入力・送信</h1>
            <div class="user-info">
                <p>ユーザー: <span id="username">-</span></p>
                <p>部門: <span id="department">-</span></p>
                <button class="logout-btn" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="form-section">
            <h2>報告内容</h2>
            
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" required>
            </div>

            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="departmentSelect" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
            </div>

            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
            </div>

            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
            </div>

            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" id="editBtn" onclick="enableEdit()">報告内容編集</button>
                <button class="btn-success" id="saveBtn" onclick="saveDraft()" style="display: none;">下書き保存</button>
                <button class="btn-warning" id="submitBtn" onclick="submitReport()" style="display: none;">送信</button>
            </div>
        </div>

        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>

        <a href="./dashboard.html" class="dashboard-link">ダッシュボードへ</a>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
                    <strong>送信者:</strong> <span id="confirmSender"></span>
                </p>
                <p style="margin-top: 10px;">
                    <strong>部長:</strong> <span id="confirmManager"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="cancelSubmit()">キャンセル</button>
                <button class="btn-success" onclick="confirmSubmit()">確認</button>
            </div>
        </div>
    </div>

    <script>
        // ページ読み込み時の初期化
        window.addEventListener('DOMContentLoaded', function() {
            initializePage();
        });

        function initializePage() {
            // ユーザー情報を取得
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
            if (!userInfo.userId) {
                window.location.href = './login.html';
                return;
            }

            document.getElementById('username').textContent = userInfo.userId;
            document.getElementById('department').textContent = userInfo.department || '-';

            // セッションストレージから前回の入力値を復元
            const savedData = JSON.parse(sessionStorage.getItem('reportFormData') || '{}');
            if (savedData.reportDate) {
                document.getElementById('reportDate').value = savedData.reportDate;
            }
            if (savedData.department) {
                document.getElementById('departmentSelect').value = savedData.department;
            }

            // 下書きデータを取得
            const draftData = JSON.parse(sessionStorage.getItem('reportDraft') || '{}');
            if (draftData.yesterday) {
                document.getElementById('yesterday').value = draftData.yesterday;
            }
            if (draftData.today) {
                document.getElementById('today').value = draftData.today;
            }
            if (draftData.issues) {
                document.getElementById('issues').value = draftData.issues;
            }

            // 送信履歴を表示
            loadHistory();
        }

        function enableEdit() {
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'inline-block';
            document.getElementById('submitBtn').style.display = 'inline-block';
        }

        function saveDraft() {
            const draftData = {
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            sessionStorage.setItem('reportDraft', JSON.stringify(draftData));
            showSuccessMessage('下書きを保存しました');
        }

        function submitReport() {
            // バリデーション
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('departmentSelect').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            if (!reportDate) {
                showErrorMessage('報告日付を選択してください');
                return;
            }

            if (!department) {
                showErrorMessage('部門を選択してください');
                return;
            }

            if (!yesterday && !today && !issues) {
                showErrorMessage('報告内容を入力してください');
                return;
            }

            // フォームデータを保存
            const formData = {
                reportDate: reportDate,
                department: department
            };
            sessionStorage.setItem('reportFormData', JSON.stringify(formData));

            // 確認ダイアログを表示
            showConfirmDialog(yesterday, today, issues);
        }

        function showConfirmDialog(yesterday, today, issues) {
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
            const manager = JSON.parse(sessionStorage.getItem('managerInfo') || '{}');

            document.getElementById('confirmYesterday').textContent = yesterday || '(未入力)';
            document.getElementById('confirmToday').textContent = today || '(未入力)';
            document.getElementById('confirmIssues').textContent = issues || '(未入力)';
            document.getElementById('confirmSender').textContent = userInfo.email || 'testuser@example.com';
            document.getElementById('confirmManager').textContent = manager.name ? `${manager.name} <${manager.email}>` : 'bucho@example.com';

            document.getElementById('confirmModal').classList.add('show');
        }

        function cancelSubmit() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        function confirmSubmit() {
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('departmentSelect').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();

            // 送信履歴に追加
            const history = JSON.parse(sessionStorage.getItem('reportHistory') || '[]');
            const newRecord = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                sender: userInfo.userId,
                status: '送信済',
                reportDate: reportDate,
                department: department,
                yesterday: yesterday,
                today: today,
                issues: issues
            };
            history.unshift(newRecord);
            sessionStorage.setItem('reportHistory', JSON.stringify(history));

            // フォームをクリア
            document.getElementById('yesterday').value = '';
            document.getElementById('today').value = '';
            document.getElementById('issues').value = '';
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            document.getElementById('editBtn').style.display = 'inline-block';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';

            // 下書きをクリア
            sessionStorage.removeItem('reportDraft');

            // ダイアログを閉じる
            document.getElementById('confirmModal').classList.remove('show');

            // 成功メッセージを表示
            showSuccessMessage('送信完了しました');

            // 履歴を更新
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(sessionStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }

            historyList.innerHTML = '';
            history.forEach(record => {
                const date = new Date(record.timestamp);
                const formattedDate = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const item = document.createElement('li');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-item-header">
                        <span class="history-item-date">${formattedDate}</span>
                        <span class="history-item-status">${record.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${record.yesterday || '(未入力)'}</p>
                        <p><strong>今日やること:</strong> ${record.today || '(未入力)'}</p>
                        <p><strong>抱えている課題:</strong> ${record.issues || '(未入力)'}</p>
                        <p><strong>送信者:</strong> ${record.sender}</p>
                    </div>
                `;
                historyList.appendChild(item);
            });
        }

        function showErrorMessage(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function showSuccessMessage(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 5000);
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
