<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 15px;
    }
    .header h1 {
      font-size: 28px;
      color: #333;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
    }
    .nav-buttons a {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .nav-buttons a:hover {
      background-color: #0056b3;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .deadline-section p {
      color: #856404;
      font-size: 16px;
      font-weight: 600;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th {
      background-color: #007bff;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #ddd;
    }
    .summary-table td {
      padding: 15px;
      border: 1px solid #ddd;
      color: #333;
    }
    .summary-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .summary-table tr:hover {
      background-color: #f0f0f0;
    }
    .progress-bar {
      width: 100%;
      height: 24px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-submitted {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .empty-message {
      text-align: center;
      color: #999;
      padding: 40px;
      font-size: 16px;
    }
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
      .summary-table {
        font-size: 12px;
      }
      .summary-table th,
      .summary-table td {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>日報提出状況ダッシュボード</h1>
      <div class="nav-buttons">
        <a href="./daily-report.html">日報入力</a>
        <a href="./login.html">ログアウト</a>
      </div>
    </div>

    <div class="deadline-section">
      <h2>提出期限</h2>
      <p id="deadlineText">毎日 18:00 までに提出してください</p>
    </div>

    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td colspan="5" class="empty-message">データを読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function initDashboard() {
      try {
        // ユーザー認証確認
        const userRes = await fetch('/api/user', { method: 'GET' });
        if (!userRes.ok) {
          window.location.href = './login.html';
          return;
        }

        // 部門別提出状況を取得
        const summaryRes = await fetch('/api/summary', { method: 'GET' });
        if (summaryRes.ok) {
          const summary = await summaryRes.json();
          renderSummary(summary);
        } else {
          renderEmptySummary();
        }
      } catch (error) {
        console.error('ダッシュボード初期化エラー:', error);
        renderEmptySummary();
      }
    }

    function renderSummary(summary) {
      const tbody = document.getElementById('summaryTableBody');
      if (!summary || summary.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-message">データがありません</td></tr>';
        return;
      }

      tbody.innerHTML = summary.map(dept => {
        const total = dept.submitted + dept.pending;
        const rate = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
        return `
          <tr>
            <td>${dept.name}</td>
            <td><span class="status-badge status-submitted">${dept.submitted}</span></td>
            <td><span class="status-badge status-pending">${dept.pending}</span></td>
            <td>${rate}%</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderEmptySummary() {
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="empty-message">提出状況データを取得できません</td></tr>';
    }

    initDashboard();
  </script>
</body>
</html>
