<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      min-height: 100px;
      resize: vertical;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .history-item-date {
      color: #666;
      font-weight: 500;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 8px;
    }
    .history-empty {
      color: #999;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
    .nav-link {
      display: inline-block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage"></div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
          <input type="date" id="reportDate" required>
          <div class="error-message" id="dateError"></div>
        </div>
        
        <div class="form-group">
          <label for="department">部門 <span style="color: red;">*</span></label>
          <select id="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError"></div>
        </div>
        
        <div class="form-group">
          <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
          <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="yesterdayError"></div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること <span style="color: red;">*</span></label>
          <textarea id="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="todayError"></div>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
          <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
          <div class="error-message" id="issuesError"></div>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="saveDraftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
        <a href="./dashboard.html" class="nav-link">ダッシュボードへ</a>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-success">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const reportForm = document.getElementById('reportForm');
    const reportDate = document.getElementById('reportDate');
    const department = document.getElementById('department');
    const yesterday = document.getElementById('yesterday');
    const today = document.getElementById('today');
    const issues = document.getElementById('issues');
    const editBtn = document.getElementById('editBtn');
    const saveDraftBtn = document.getElementById('saveDraftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyList = document.getElementById('historyList');
    
    let currentUser = null;
    let isEditMode = false;
    
    // Initialize
    async function init() {
      // Get current user from session/auth
      const userResponse = await fetch('/api/user');
      if (userResponse.ok) {
        currentUser = await userResponse.json();
      }
      
      // Load draft from session storage
      loadDraft();
      
      // Load history
      loadHistory();
      
      // Set today's date as default
      const today = new Date().toISOString().split('T')[0];
      reportDate.value = sessionStorage.getItem('reportDate') || today;
      
      // Restore department selection
      const savedDept = sessionStorage.getItem('selectedDepartment');
      if (savedDept) {
        department.value = savedDept;
      }
    }
    
    function loadDraft() {
      const draft = sessionStorage.getItem('reportDraft');
      if (draft) {
        const data = JSON.parse(draft);
        yesterday.value = data.yesterday || '';
        today.value = data.today || '';
        issues.value = data.issues || '';
      }
    }
    
    function saveDraft() {
      const draft = {
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value
      };
      sessionStorage.setItem('reportDraft', JSON.stringify(draft));
      alert('下書きを保存しました');
    }
    
    function enableEditMode() {
      yesterday.disabled = false;
      today.disabled = false;
      issues.disabled = false;
      isEditMode = true;
      editBtn.textContent = '編集完了';
      editBtn.classList.remove('btn-secondary');
      editBtn.classList.add('btn-success');
    }
    
    function disableEditMode() {
      isEditMode = false;
      editBtn.textContent = '報告内容編集';
      editBtn.classList.remove('btn-success');
      editBtn.classList.add('btn-secondary');
    }
    
    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }
    
    function validateForm() {
      clearErrors();
      let isValid = true;
      
      if (!reportDate.value) {
        document.getElementById('dateError').textContent = '報告日付を選択してください';
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department.value) {
        document.getElementById('departmentError').textContent = '部門を選択してください';
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      if (!yesterday.value.trim() || !today.value.trim() || !issues.value.trim()) {
        if (!yesterday.value.trim()) {
          document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
          document.getElementById('yesterdayError').classList.add('show');
        }
        if (!today.value.trim()) {
          document.getElementById('todayError').textContent = '報告内容を入力してください';
          document.getElementById('todayError').classList.add('show');
        }
        if (!issues.value.trim()) {
          document.getElementById('issuesError').textContent = '報告内容を入力してください';
          document.getElementById('issuesError').classList.add('show');
        }
        isValid = false;
      }
      
      return isValid;
    }
    
    function showConfirmDialog() {
      const modalContent = document.getElementById('modalContent');
      const userEmail = currentUser?.email || 'testuser@example.com';
      const managerEmail = currentUser?.manager?.email || 'bucho@example.com';
      const managerName = currentUser?.manager?.name || '部長';
      
      const yesterdayPreview = yesterday.value.substring(0, 50);
      const todayPreview = today.value.substring(0, 50);
      const issuesPreview = issues.value.substring(0, 50);
      
      modalContent.innerHTML = `
        <p><strong>昨日やったこと:</strong> ${yesterdayPreview}</p>
        <p><strong>今日やること:</strong> ${todayPreview}</p>
        <p><strong>抱えている課題:</strong> ${issuesPreview}</p>
        <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
        <p><strong>送信者:</strong> ${userEmail}</p>
        <p><strong>送信先:</strong> ${managerName} &lt;${managerEmail}&gt;</p>
      `;
      
      confirmModal.classList.add('show');
    }
    
    async function submitReport() {
      const reportData = {
        date: reportDate.value,
        department: department.value,
        yesterday: yesterday.value,
        today: today.value,
        issues: issues.value,
        userId: currentUser?.id || 'user123',
        userEmail: currentUser?.email || 'testuser@example.com',
        managerEmail: currentUser?.manager?.email || 'bucho@example.com',
        timestamp: new Date().toISOString()
      };
      
      try {
        const response = await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reportData)
        });
        
        if (response.ok) {
          // Clear form and session storage
          reportForm.reset();
          sessionStorage.removeItem('reportDraft');
          
          // Show success message
          successMessage.textContent = '送信完了しました';
          successMessage.classList.add('show');
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 5000);
          
          // Reload history
          loadHistory();
          
          // Reset edit mode
          disableEditMode();
          yesterday.disabled = true;
          today.disabled = true;
          issues.disabled = true;
        }
      } catch (error) {
        console.error('Error submitting report:', error);
        alert('送信に失敗しました');
      }
    }
    
    async function loadHistory() {
      try {
        const response = await fetch('/api/reports');
        if (response.ok) {
          const reports = await response.json();
          
          if (!reports || reports.length === 0) {
            historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            return;
          }
          
          historyList.innerHTML = reports.map(report => `
            <div class="history-item">
              <div class="history-item-header">
                <span class="history-item-date">${new Date(report.timestamp).toLocaleString('ja-JP')}</span>
                <span class="history-item-status">送信済</span>
              </div>
              <div class="history-item-content">
                <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                <p><strong>今日やること:</strong> ${report.today}</p>
                <p><strong>抱えている課題:</strong> ${report.issues}</p>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading history:', error);
      }
    }
    
    // Event listeners
    editBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (isEditMode) {
        disableEditMode();
      } else {
        enableEditMode();
      }
    });
    
    saveDraftBtn.addEventListener('click', (e) => {
      e.preventDefault();
      saveDraft();
    });
    
    reportDate.addEventListener('change', () => {
      sessionStorage.setItem('reportDate', reportDate.value);
    });
    
    department.addEventListener('change', () => {
      sessionStorage.setItem('selectedDepartment', department.value);
    });
    
    reportForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (validateForm()) {
        showConfirmDialog();
      }
    });
    
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    confirmBtn.addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      await submitReport();
    });
    
    // Initialize on page load
    init();
  </script>
</body>
</html>
