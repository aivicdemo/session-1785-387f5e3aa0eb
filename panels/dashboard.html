<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      margin-bottom: 30px;
      border-radius: 4px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 14px;
    }
    .summary-section {
      margin-bottom: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .summary-table th,
    .summary-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .summary-table th {
      background-color: #f8f9fa;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    .summary-table td {
      font-size: 14px;
      color: #666;
    }
    .summary-table tr:hover {
      background-color: #f9f9f9;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    .progress-fill {
      height: 100%;
      background-color: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadlineText">
        本日中に日報を提出してください。提出期限: <span id="deadlineTime">18:00</span>
      </div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み / 総人数</th>
            <th>提出率</th>
            <th>進捗</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td colspan="4" style="text-align: center; color: #999;">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <a href="./daily-report.html" class="btn">日報を入力・送信する</a>
  </div>
  
  <script>
    async function loadSummary() {
      try {
        const response = await fetch('/api/summary');
        const data = await response.json();
        const summary = data.summary || [];
        
        const tbody = document.getElementById('summaryTableBody');
        if (summary.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">データがありません</td></tr>';
        } else {
          tbody.innerHTML = summary.map(dept => {
            const submitted = dept.submitted || 0;
            const total = dept.total || 0;
            const rate = total > 0 ? Math.round((submitted / total) * 100) : 0;
            return `
              <tr>
                <td>${dept.name}</td>
                <td>${submitted} / ${total}</td>
                <td>${rate}%</td>
                <td>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (error) {
        console.error('Failed to load summary:', error);
        const tbody = document.getElementById('summaryTableBody');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">データの読み込みに失敗しました</td></tr>';
      }
    }
    
    loadSummary();
  </script>
</body>
</html>
