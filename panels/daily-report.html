<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        input[type="date"]:disabled,
        select:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background-color: #218838;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            background-color: #fafafa;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-empty {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="dailyReportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError"></div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError"></div>
                </div>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError"></div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #333;"></p>
                <p style="margin-top: 15px;"><strong>送信先（部長）:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #333;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        let currentUser = {
            id: 'user001',
            email: 'testuser@example.com',
            name: 'テストユーザー',
            manager: '部長太郎',
            managerEmail: 'bucho@example.com'
        };
        
        // ローカルストレージキー
        const DRAFT_KEY = 'dailyReportDraft';
        const HISTORY_KEY = 'dailyReportHistory';
        const SESSION_KEY = 'dailyReportSession';
        
        const form = document.getElementById('dailyReportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayInput = document.getElementById('yesterday');
        const todayInput = document.getElementById('today');
        const issuesInput = document.getElementById('issues');
        
        let isEditMode = false;
        let pendingSubmitData = null;
        
        // 初期化
        function init() {
            loadSessionData();
            loadDraftData();
            loadHistory();
            attachEventListeners();
            updateEditMode();
        }
        
        // セッションデータ読み込み（日付と部門のみ保持）
        function loadSessionData() {
            const sessionData = sessionStorage.getItem(SESSION_KEY);
            if (sessionData) {
                const data = JSON.parse(sessionData);
                if (data.reportDate) reportDateInput.value = data.reportDate;
                if (data.department) departmentSelect.value = data.department;
            }
        }
        
        // 下書きデータ読み込み
        function loadDraftData() {
            const draftData = localStorage.getItem(DRAFT_KEY);
            if (draftData) {
                const data = JSON.parse(draftData);
                yesterdayInput.value = data.yesterday || '';
                todayInput.value = data.today || '';
                issuesInput.value = data.issues || '';
            }
        }
        
        // 送信履歴読み込み
        function loadHistory() {
            const historyData = localStorage.getItem(HISTORY_KEY);
            const history = historyData ? JSON.parse(historyData) : [];
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            } else {
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <div class="history-item-date">${formatDateTime(item.timestamp)}</div>
                            <div class="history-item-status">送信済</div>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${escapeHtml(item.yesterday.substring(0, 50))}${item.yesterday.length > 50 ? '...' : ''}</p>
                            <p><strong>今日やること:</strong> ${escapeHtml(item.today.substring(0, 50))}${item.today.length > 50 ? '...' : ''}</p>
                            <p><strong>抱えている課題:</strong> ${escapeHtml(item.issues.substring(0, 50))}${item.issues.length > 50 ? '...' : ''}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        // イベントリスナー設定
        function attachEventListeners() {
            editBtn.addEventListener('click', handleEditClick);
            draftBtn.addEventListener('click', handleDraftClick);
            form.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', handleCancelClick);
            confirmBtn.addEventListener('click', handleConfirmClick);
            
            // セッションストレージに日付と部門を保存
            reportDateInput.addEventListener('change', saveSessionData);
            departmentSelect.addEventListener('change', saveSessionData);
        }
        
        // セッションデータ保存
        function saveSessionData() {
            const sessionData = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value
            };
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
        }
        
        // 編集ボタンクリック
        function handleEditClick(e) {
            e.preventDefault();
            isEditMode = true;
            updateEditMode();
        }
        
        // 編集モード更新
        function updateEditMode() {
            if (isEditMode) {
                yesterdayInput.disabled = false;
                todayInput.disabled = false;
                issuesInput.disabled = false;
                editBtn.style.display = 'none';
            } else {
                yesterdayInput.disabled = true;
                todayInput.disabled = true;
                issuesInput.disabled = true;
                editBtn.style.display = 'inline-block';
            }
        }
        
        // 下書き保存
        function handleDraftClick(e) {
            e.preventDefault();
            const draftData = {
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draftData));
            showSuccessMessage('下書きを保存しました');
        }
        
        // フォーム送信
        function handleSubmit(e) {
            e.preventDefault();
            clearErrors();
            
            // バリデーション
            let hasError = false;
            
            if (!reportDateInput.value) {
                showError('dateError', '報告日付を選択してください');
                hasError = true;
            }
            
            if (!departmentSelect.value) {
                showError('departmentError', '部門を選択してください');
                hasError = true;
            }
            
            if (!yesterdayInput.value.trim()) {
                showError('yesterdayError', '報告内容を入力してください');
                hasError = true;
            }
            
            if (!todayInput.value.trim()) {
                showError('todayError', '報告内容を入力してください');
                hasError = true;
            }
            
            if (!issuesInput.value.trim()) {
                showError('issuesError', '報告内容を入力してください');
                hasError = true;
            }
            
            if (hasError) return;
            
            // 確認ダイアログ表示
            pendingSubmitData = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayInput.value,
                today: todayInput.value,
                issues: issuesInput.value
            };
            
            showConfirmDialog();
        }
        
        // 確認ダイアログ表示
        function showConfirmDialog() {
            document.getElementById('confirmYesterday').textContent = pendingSubmitData.yesterday.substring(0, 100);
            document.getElementById('confirmToday').textContent = pendingSubmitData.today.substring(0, 100);
            document.getElementById('confirmIssues').textContent = pendingSubmitData.issues.substring(0, 100);
            document.getElementById('confirmSender').textContent = currentUser.email;
            document.getElementById('confirmManager').textContent = `${currentUser.manager} <${currentUser.managerEmail}>`;
            confirmModal.classList.add('show');
        }
        
        // キャンセルボタン
        function handleCancelClick(e) {
            e.preventDefault();
            confirmModal.classList.remove('show');
            pendingSubmitData = null;
        }
        
        // 確認ボタン
        function handleConfirmClick(e) {
            e.preventDefault();
            confirmModal.classList.remove('show');
            
            // 履歴に追加
            const historyItem = {
                timestamp: new Date().toISOString(),
                sender: currentUser.id,
                senderName: currentUser.name,
                reportDate: pendingSubmitData.reportDate,
                department: pendingSubmitData.department,
                yesterday: pendingSubmitData.yesterday,
                today: pendingSubmitData.today,
                issues: pendingSubmitData.issues,
                status: '送信済'
            };
            
            const historyData = localStorage.getItem(HISTORY_KEY);
            const history = historyData ? JSON.parse(historyData) : [];
            history.unshift(historyItem);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            
            // フォームクリア
            yesterdayInput.value = '';
            todayInput.value = '';
            issuesInput.value = '';
            isEditMode = false;
            updateEditMode();
            
            // 下書き削除
            localStorage.removeItem(DRAFT_KEY);
            
            // 成功メッセージ
            showSuccessMessage('送信完了しました');
            
            // 履歴更新
            loadHistory();
            
            pendingSubmitData = null;
        }
        
        // エラー表示
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }
        
        // エラークリア
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }
        
        // 成功メッセージ表示
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // 日時フォーマット
        function formatDateTime(isoString) {
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
        }
        
        // HTML エスケープ
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // 初期化実行
        init();
    </script>
</body>
</html>
