<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-section h2 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .deadline-text {
            color: #856404;
            font-size: 18px;
            font-weight: bold;
        }
        .summary-section {
            margin-bottom: 30px;
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .summary-table th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <h2>提出期限</h2>
            <div class="deadline-text" id="deadlineText">本日 18:00 まで</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み / 総人数</th>
                        <th>提出率</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="nav-link">日報入力・送信へ</a>
    </div>
    
    <script>
        async function init() {
            // Set deadline
            const today = new Date();
            const deadlineTime = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 18, 0, 0);
            const deadlineStr = deadlineTime.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('deadlineText').textContent = `本日 ${deadlineStr} まで`;
            
            // Load summary data
            loadSummary();
        }
        
        function loadSummary() {
            // Mock data for department summary
            const summaryData = [
                { department: '営業部', submitted: 8, total: 10, status: 'pending' },
                { department: '企画部', submitted: 5, total: 5, status: 'submitted' },
                { department: '技術部', submitted: 12, total: 15, status: 'pending' },
                { department: '管理部', submitted: 3, total: 4, status: 'pending' }
            ];
            
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = summaryData.map(item => {
                const rate = Math.round((item.submitted / item.total) * 100);
                const statusBadge = item.status === 'submitted' 
                    ? '<span class="status-badge status-submitted">完了</span>'
                    : '<span class="status-badge status-pending">進行中</span>';
                
                return `
                    <tr>
                        <td>${item.department}</td>
                        <td>${item.submitted} / ${item.total}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%;">${rate}%</div>
                            </div>
                        </td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            }).join('');
        }
        
        init();
    </script>
</body>
</html>
